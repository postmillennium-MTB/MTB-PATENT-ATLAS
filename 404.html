<title>Not found — MTB Patent Atlas</title>
<meta name="robots" content="noindex">
<!--
  GitHub Pages serves this for any address in this site that has no file.
  Its one job: a per-card share link (p/<ref>/, see tools/build_card_pages.js)
  whose page has not been generated yet -- a card added since the last
  "Update card link pages" pull request was merged -- still opens that card
  in the Atlas. Anything else goes to the Atlas home.
-->
<script>
(function(){
  var atlas="https://postmillenniumrenaissance.com/atlas/";
  var m=location.pathname.match(/\/p\/([A-Za-z0-9-]+)\/?(?:index\.html)?$/);
  var lang=null;
  try{ lang=new URLSearchParams(location.search).get("lang"); }catch(e){}
  if(m) location.replace(atlas+"#p="+m[1]+(lang&&/^[a-z]{2}$/.test(lang)&&lang!=="en"?"&lang="+lang:""));
})();
</script>
