r is independently cross-confirmed by multiple trade-press sources citing US 11,866,114 B2 for this invention; the filing date is not — some coverage places the filing in 2020, which if confirmed would move expiry from 2043 to 2040.","fr":"Un écran monté sur le cintre et un « modèle d'apprentissage » qui enregistre les réglages manuels de suspension, de tige télescopique et d'inclinaison de selle d'un pilote sur un parcours donné, puis les rejoue automatiquement tour après tour — le texte du brevet de Shimano affirme simplement qu'« une compétence adéquate est requise pour que le pilote contrôle correctement la tige de selle et la suspension pendant la conduite », et propose d'automatiser cela à la place. Le numéro de brevet est confirmé de façon indépendante par plusieurs sources de presse spécialisée citant US 11 866 114 B2 pour cette invention ; la date de dépôt reste toutefois non confirmée — une partie de la couverture situe le dépôt en 2020, ce qui, si cela se confirme, avancerait l'expiration de 2043 à 2040."}},{"num":"10053188","cat":"comp","title":{"en":"OneUp Components portfolio — guides, dropper, EDC tools, bar, chainring","fr":"Portefeuille OneUp Components — guide-chaînes, tige télescopique, outils EDC, cintre, plateau"},"assignee":"OneUp Components (Squamish, BC)","img":"../pictures/US10197049B2.png","alt":{"en":"Fig. 14 of US 10,197,049, one patent from the portfolio: a longitudinal cross-section through the dropper post, showing the inner tube (425), the cartridge and its actuating linkage (395/470), and the collar-mounted lever interface (480) at the head","fr":"Fig. 14 du brevet US 10 197 049, l'un des brevets du portefeuille : une coupe longitudinale de la tige de selle télescopique, montrant le tube intérieur (425), la cartouche et sa liaison d'actionnement (395/470), et l'interface de levier montée sur le collier (480) au sommet"},"teaser":{"en":"One shared chainguide patent (10,053,188, plus 10,787,227) covers OneUp's bash/chain/e-bike guides across ISCG05, Shimano STEPS and Bosch mounts. The EDC integrated tool-and-storage system runs on…","fr":"Un brevet de guide-chaîne partagé (10,053,188, plus 10,787,227) couvre les guides bash/chaîne/vélo électrique de OneUp sur les fixations ISCG05, Shimano STEPS et Bosch. Le système intégré d'outils et…"},"full":{"en":"One shared chainguide patent (10,053,188, plus 10,787,227) covers OneUp's bash/chain/e-bike guides across ISCG05, Shimano STEPS and Bosch mounts. The EDC integrated tool-and-storage system runs on 10,197,049 and 10,883,481. Separate families cover the carbon handlebar (design patent D896,132 plus 11,352,093), the chainring (11,300,192), and the V2 dropper post, which alone carries seven numbers (10,370,051; 10,583,882; 10,787,215; 10,974,781; 11,104,395; 11,364,963; 11,479,314) — per OneUp's own marking page, plus unlisted foreign filings and other pending US applications.","fr":"Un brevet de guide-chaîne partagé (10,053,188, plus 10,787,227) couvre les guides bash/chaîne/vélo électrique de OneUp sur les fixations ISCG05, Shimano STEPS et Bosch. Le système intégré d'outils et de rangement EDC repose sur les brevets 10,197,049 et 10,883,481. Des familles distinctes couvrent le cintre carbone (brevet de dessin D896,132 plus 11,352,093), le plateau (11,300,192), et la tige télescopique V2, qui porte à elle seule sept numéros (10,370,051 ; 10,583,882 ; 10,787,215 ; 10,974,781 ; 11,104,395 ; 11,364,963 ; 11,479,314) — selon la propre page de marquage de OneUp, plus des dépôts étrangers non listés et d'autres demandes américaines en instance."}},{"num":"20120214629","cat":"drive","title":{"en":"Sotto Group drivetrain patents for Praxis Works (bundle, 6 filings)","fr":"Brevets de transmission de Sotto Group pour Praxis Works (regroupement, 6 dépôts)"},"assignee":"Sotto Group LLC (David Earle) → Praxis Works","img":"../pictures/US20120214629A1.png","alt":{"en":"Fig. 1 of US 2012/0214629 (Levatime): a bicycle sprocket (12) on a crank (2, 3) with a drive chain (4) shown at two positions, its teeth's bottom-edge center points at two different radii (D1, D2) and a chain-pin guiding groove (14, 141, 142) called out where the chain engages","fr":"Fig. 1 du brevet US 2012/0214629 (Levatime) : un pignon de vélo (12) sur une manivelle (2, 3) avec une chaîne d'entraînement (4) représentée à deux positions, les points centraux des bords inférieurs de ses dents à deux rayons différents (D1, D2) et une rainure de guidage d'axe de chaîne (14, 141, 142) indiquée là où la chaîne s'engage"},"teaser":{"en":"Six more Sotto Group filings, this time contract-engineered for crankset and cassette maker Praxis Works rather than a suspension client: Levatime (US 2012/0214629), the Praxis BB System (US…","fr":"Six autres dépôts de Sotto Group, cette fois développés sous contrat pour le fabricant de boîtiers de pédalier et cassettes Praxis Works plutôt que pour un client de suspension : Levatime (US…"},"full":{"en":"Six more Sotto Group filings, this time contract-engineered for crankset and cassette maker Praxis Works rather than a suspension client: Levatime (US 2012/0214629), the Praxis BB System (US 2013/0230266), a bottom-bracket bearing-preload design (US 9,004,771), two cassette-and-wheel filings (US 9,168,976 and US 2017/0056955), and a magnetic chain-retention system (US 2015/0307156). Per Sotto's own patent notice, these were 'developed exclusively' for Praxis rather than filed under Sotto's own name — bundled here as one entry rather than individually re-verified against each application's own record this pass.","fr":"Six autres dépôts de Sotto Group, cette fois développés sous contrat pour le fabricant de boîtiers de pédalier et cassettes Praxis Works plutôt que pour un client de suspension : Levatime (US 2012/0214629), le Praxis BB System (US 2013/0230266), une conception de précharge de roulement de boîtier de pédalier (US 9 004 771), deux dépôts liés aux cassettes et roues (US 9 168 976 et US 2017/0056955), et un système de rétention de chaîne magnétique (US 2015/0307156). Selon l'avis de brevet propre à Sotto, ceux-ci ont été « développés exclusivement » pour Praxis plutôt que déposés sous le nom propre de Sotto — regroupés ici en une seule fiche plutôt que vérifiés individuellement au regard du dossier de chaque demande cette fois-ci."}},{"num":"4308762","cat":"comp","title":{"en":"Oakley handle grips (US 4,308,762 + US D267,147 + US 4,416,166)","fr":"Poignées Oakley (US 4 308 762 + US D267 147 + US 4 416 166)"},"assignee":"James H. Jannard & George J. Tackles / Oakley, Inc.","img":"../pictures/US4308762A.png","alt":{"en":"Fig. 1 of US 4,308,762: side view of the lightened grip (10) on its axis (13) beside the bar end (14), with a field of raised circular studs (15) on the grip body (11), four oval hand openings (21, 21a) through the body and a large flange (16) with its own opening","fr":"Fig. 1 du brevet US 4 308 762 : vue latérale de la poignée allégée (10) sur son axe (13) à côté de l'extrémité du guidon (14), avec un champ de plots circulaires en relief (15) sur le corps (11), quatre ouvertures ovales pour la main (21, 21a) à travers le corps et une grande collerette (16) percée d'une ouverture"},"teaser":{"en":"Three Oakley grip patents, all naming James H. Jannard. US 4,308,762, \"Lightened hand grip\": filed April 14, 1980, granted January 5, 1982, expired April 2000. Its abstract describes a grip with…","fr":"Trois brevets de poignées Oakley, tous au nom de James H. Jannard. US 4 308 762, « Lightened hand grip » : déposé le 14 avril 1980, délivré le 5 janvier 1982, expiré en avril 2000. Son résumé décrit…"},"full":{"en":"Three Oakley grip patents, all naming James H. Jannard. US 4,308,762, \"Lightened hand grip\": filed April 14, 1980, granted January 5, 1982, expired April 2000. Its abstract describes a grip with hand-engageable openings in a flange and/or the grip body, optionally with a tread pattern on the body. US D267,147, a grip design patent: filed December 8, 1980, granted December 7, 1982, expired December 1996 (14 years from grant); no drawing sheet is shown here. US 4,416,166, \"Handle grip\" (with George J. Tackles): filed March 30, 1982, granted November 22, 1983, expired March 2002, with an Australian counterpart filed in 1983. It is a two-part grip for a bicycle or motorcycle handlebar: an inner support sleeve that fits on and grips the bar, and an outer sleeve over it that the hand grasps. The sleeves may interlock by tongue-and-groove elements, the grooves being holes in the outer sleeve that also serve as tread, and they may have differential hardnesses for better grip support and more comfortable gripping. The entry's expiry year follows the newest member, 2002.","fr":"Trois brevets de poignées Oakley, tous au nom de James H. Jannard. US 4 308 762, « Lightened hand grip » : déposé le 14 avril 1980, délivré le 5 janvier 1982, expiré en avril 2000. Son résumé décrit une poignée dont la collerette et/ou le corps comportent des ouvertures où la main s'engage, avec éventuellement un motif de bande de roulement sur le corps. US D267 147, brevet de dessin d'une poignée : déposé le 8 décembre 1980, délivré le 7 décembre 1982, expiré en décembre 1996 (14 ans après la délivrance) ; aucune planche de dessin n'est présentée ici. US 4 416 166, « Handle grip » (avec George J. Tackles) : déposé le 30 mars 1982, délivré le 22 novembre 1983, expiré en mars 2002, avec un équivalent australien déposé en 1983. Il s'agit d'une poignée en deux parties pour guidon de vélo ou de moto : un manchon de support intérieur qui se monte sur le guidon et s'y accroche, et un manchon extérieur que la main saisit. Les manchons peuvent s'emboîter par des éléments à tenon et rainure, les rainures étant des trous du manchon extérieur qui servent aussi de bande de roulement, et ils peuvent avoir des duretés différentes pour un meilleur soutien et un maintien plus confortable. L'année d'expiration de la fiche suit le membre le plus récent, 2002."}},{"num":"11186336","cat":"comp","title":{"en":"Specialized Mirror lattice saddle (US 11,186,336)","fr":"Selle à structure en treillis Specialized Mirror (US 11 186 336)"},"assignee":"Philip Alan Primeaux, Garrett Yale Davis Getter, Christopher Yu / Specialized Bicycle Components, Inc.","img":"../pictures/US11186336B2.png","alt":{"en":"Fig. 1 of US 11,186,336: the top view of the cushion (102) with its concentric lattice-density stiffness regions (110, 112, 114, 116) mapped by shading, above the rigid base structure (104) it mounts to","fr":"Fig. 1 du brevet US 11 186 336 : vue de dessus du coussin (102) avec ses régions de raideur en treillis concentriques (110, 112, 114, 116) représentées par des hachures, au-dessus de la structure de base rigide (104) sur laquelle il se fixe"},"teaser":{"en":"US 11,186,336, \"Bicycle Saddle,\" filed July 13, 2020 and granted November 30, 2021 to Specialized Bicycle Components, Inc. Claims a cushion built from concentric regions of different stiffness — a…","fr":"US 11 186 336, « Bicycle Saddle », déposé le 13 juillet 2020 et délivré le 30 novembre 2021 à Specialized Bicycle Components, Inc. Revendique un coussin construit à partir de régions concentriques de…"},"full":{"en":"US 11,186,336, \"Bicycle Saddle,\" filed July 13, 2020 and granted November 30, 2021 to Specialized Bicycle Components, Inc. Claims a cushion built from concentric regions of different stiffness — a firmer outer region enclosing a softer middle region, which itself encloses an even softer inner region — rather than one uniform density of foam. Manufactured as a 3D-printed elastomer lattice via Carbon's Digital Light Synthesis process, marketed as Mirror Technology.","fr":"US 11 186 336, « Bicycle Saddle », déposé le 13 juillet 2020 et délivré le 30 novembre 2021 à Specialized Bicycle Components, Inc. Revendique un coussin construit à partir de régions concentriques de raideur différente — une région extérieure plus ferme entourant une région médiane plus souple, elle-même entourant une région intérieure encore plus souple — plutôt qu'une densité de mousse uniforme. Fabriqué comme un treillis élastomère imprimé en 3D via le procédé Digital Light Synthesis de Carbon, commercialisé sous le nom de Mirror Technology."}},{"num":"4982975","cat":"frame","title":{"en":"Trimble pressure-molded composite frame joint (US 4,982,975)","fr":"Jonction de cadre composite moulée sous pression de Trimble (US 4 982 975)"},"assignee":"Brent J. Trimble / Cycle Composites Inc. (Kestrel)","img":"../pictures/US4982975A.png","alt":{"en":"Figs. 3 and 4 of US 4,982,975, sheet 2: the fork's pressure-molded juncture from two angles, the tapered steerer (20/38) joining the two fork blades (19/19', 21/21') at the crown (25); the smaller figures below show the tubes' hollow cross-sections (5 through 8, 17, 18) before molding","fr":"Fig. 3 et 4 du brevet US 4 982 975, planche 2 : la jonction moulée sous pression de la fourche vue sous deux angles, le pivot conique (20/38) rejoignant les deux fourreaux (19/19', 21/21') à la couronne (25) ; les figures plus petites en dessous montrent les sections creuses des tubes (5 à 8, 17, 18) avant moulage"},"teaser":{"en":"US 4,982,975, 'Composite bicycle frame with pressure molded juncture,' filed April 14, 1989 (application 07/337,816) and granted January 8, 1991 to Brent J. Trimble of Watsonville, California,…","fr":"US 4 982 975, « Composite bicycle frame with pressure molded juncture », déposé le 14 avril 1989 (demande 07/337 816) et délivré le 8 janvier 1991 à Brent J. Trimble de Watsonville (Californie), cédé…"},"full":{"en":"US 4,982,975, 'Composite bicycle frame with pressure molded juncture,' filed April 14, 1989 (application 07/337,816) and granted January 8, 1991 to Brent J. Trimble of Watsonville, California, assigned to Kestrel's parent Cycle Composites Inc. — a technique for joining tubular composite sections (as at a fork crown) with a pressure-molded, resin-impregnated juncture rather than gluing tubes into separate lugs. Correction to how this entry originally described itself: the Kestrel 4000's own foundational frame patent belongs to Kestrel co-founders Delano Duplessis and Bevil Hogg (US 4,828,781, 'Method of molding composite bicycle frames'), not to Trimble personally — this patent is a related Cycle Composites manufacturing technique, not the company's core frame patent. Trimble's own separately-credited frame design is the crossed-tube 'X-Frame' (US 4,923,203, elsewhere in this atlas), a different bike from the Kestrel 4000. The patent's own face carries a terminal disclaimer waiving any term past July 25, 2006, which is what the term above reflects rather than the full 17-years-from-grant span the pre-1995 filing would otherwise carry (which would run to 2008). A different, earlier Trimble monocoque filing, US 4,513,986 (filed 1983, granted 1985, credited on its face to a 'James L. Trimble'), covers a related stressed-skin monocoque concept and is not this patent either — noted here since the two are easy to conflate.","fr":"US 4 982 975, « Composite bicycle frame with pressure molded juncture », déposé le 14 avril 1989 (demande 07/337 816) et délivré le 8 janvier 1991 à Brent J. Trimble de Watsonville (Californie), cédé à Cycle Composites Inc., société mère de Kestrel — une technique d'assemblage de sections tubulaires composites (par exemple à la couronne de fourche) par une jonction moulée sous pression en fibre imprégnée de résine, plutôt que des tubes collés dans des douilles séparées. Correction par rapport à la description initiale de cette fiche : le brevet fondateur du cadre du Kestrel 4000 appartient aux cofondateurs de Kestrel, Delano Duplessis et Bevil Hogg (US 4 828 781, « Method of molding composite bicycle frames »), pas à Trimble personnellement — ce brevet-ci est une technique de fabrication apparentée de Cycle Composites, pas le brevet de cadre central de l'entreprise. La conception de cadre propre à Trimble, créditée séparément, est le « X-Frame » à tubes croisés (US 4 923 203, ailleurs dans cet atlas), un vélo différent du Kestrel 4000. La première page du brevet porte une renonciation terminale abandonnant toute durée après le 25 juillet 2006, ce que reflète la durée ci-dessus plutôt que les 17 années pleines à compter de la délivrance qu'un dépôt antérieur à 1995 porterait autrement (ce qui courrait jusqu'en 2008). Un autre dépôt monocoque antérieur de Trimble, US 4 513 986 (déposé en 1983, délivré en 1985, crédité en façade à un « James L. Trimble »), couvre un concept monocoque à peau contrainte apparenté et n'est pas non plus ce brevet-ci — signalé ici car les deux sont faciles à confondre."}},{"num":"4750754","cat":"comp","title":{"en":"Boone Lennon aero handlebar / Scott DH bar (US 4,750,754)","fr":"Cintre aéro Boone Lennon / Scott DH bar (US 4 750 754)"},"assignee":"Dan C. Lennon (known professionally as Boone Lennon), licensed to Scott USA","img":"../pictures/US4750754A.png","alt":{"en":"Sheet 1 of US 4,750,754: Fig. 1, a full bicycle side view with the crosspiece (50) and forward handles (51) at the stem; Fig. 2, the same bars from above, resting on the existing drop bar (28); and Fig. 4, a rider's tucked forearm position (R/F) astride the crosspiece from behind","fr":"Planche 1 du brevet US 4 750 754 : Fig. 1, vue latérale complète du vélo avec la traverse (50) et les poignées avant (51) au niveau de la potence ; Fig. 2, les mêmes barres vues du dessus, reposant sur le cintre de course existant (28) ; et Fig. 4, la position repliée des avant-bras du cycliste (R/F) de part et d'autre de la traverse, vue de l'arrière"},"teaser":{"en":"US 4,750,754, 'Bicycle and handlebar system,' granted June 14, 1988 to the patent's named inventor, Dan C. Lennon of Hailey, Idaho — the same person credited in cycling and skiing coverage as 'Boone…","fr":"US 4 750 754, « Bicycle and handlebar system », délivré le 14 juin 1988 à l'inventeur nommément désigné sur le brevet, Dan C. Lennon de Hailey (Idaho) — la même personne créditée dans la presse…"},"full":{"en":"US 4,750,754, 'Bicycle and handlebar system,' granted June 14, 1988 to the patent's named inventor, Dan C. Lennon of Hailey, Idaho — the same person credited in cycling and skiing coverage as 'Boone Lennon.' A crosspiece extending forward from the steering post carries a second pair of handles positioned so a rider's forearms rest on padded supports above the crosspiece, forcing an aerodynamic tuck. Lennon, formerly head coach of the US Alpine Ski Team, licensed the design to Scott USA, which sold it as the DH (Down Hill) bar. Pre-1995 filing: the term ran 17 years from grant, to 2005.","fr":"US 4 750 754, « Bicycle and handlebar system », délivré le 14 juin 1988 à l'inventeur nommément désigné sur le brevet, Dan C. Lennon de Hailey (Idaho) — la même personne créditée dans la presse cycliste et skiiste sous le nom de « Boone Lennon ». Une traverse s'étendant vers l'avant depuis le tube de direction porte une seconde paire de poignées positionnées de sorte que les avant-bras du cycliste reposent sur des appuis rembourrés au-dessus de la traverse, imposant une position aérodynamique repliée. Lennon, ancien entraîneur en chef de l'équipe américaine de ski alpin, a licencié la conception à Scott USA, qui l'a commercialisée sous le nom de barre DH (Down Hill). Dépôt antérieur à 1995 : la durée courait 17 ans à compter de la délivrance, jusqu'en 2005."}},{"num":"5636716","cat":"comp","title":{"en":"Shimano V-Brake linear-pull brake (US 5,636,716)","fr":"Frein linéaire Shimano V-Brake (US 5 636 716)"},"assignee":"Masanori Sugimoto & Toshiyuki Tanaka / Shimano","img":"../pictures/US5636716A.png","alt":{"en":"Fig. 2 of US 5,636,716: the brake front-on, its two upright arms (12a/12b) pivoting on bolts (31a/31b) below, each carrying a brake shoe (5/5a) that closes on the rim, and joined at the top by a single horizontal cable (10) run through a coil spring (11) and cable-end fittings (10a/10b)","fr":"Fig. 2 du brevet US 5 636 716 : le frein vu de face, ses deux bras verticaux (12a/12b) pivotant sur des vis (31a/31b) en bas, chacun portant un patin (5/5a) qui se referme sur la jante, et reliés en haut par un unique câble horizontal (10) passant par un ressort hélicoïdal (11) et des embouts de câble (10a/10b)"},"teaser":{"en":"US 5,636,716, 'Bicycle brake device,' credited to Masanori Sugimoto and Toshiyuki Tanaka and granted June 10, 1997 — Shimano's linear-pull brake design: two tall, upright arms pulled directly together…","fr":"US 5 636 716, « Bicycle brake device », crédité à Masanori Sugimoto et Toshiyuki Tanaka et délivré le 10 juin 1997 — la conception de frein linéaire de Shimano : deux bras hauts et verticaux tirés…"},"full":{"en":"US 5,636,716, 'Bicycle brake device,' credited to Masanori Sugimoto and Toshiyuki Tanaka and granted June 10, 1997 — Shimano's linear-pull brake design: two tall, upright arms pulled directly together by a single horizontal cable, in place of a cantilever brake's cable yoke and straddle-wire geometry. Marketed as the V-Brake. The document's own front page corrects the 'Masanao Ose' name originally associated with this entry.","fr":"US 5 636 716, « Bicycle brake device », crédité à Masanori Sugimoto et Toshiyuki Tanaka et délivré le 10 juin 1997 — la conception de frein linéaire de Shimano : deux bras hauts et verticaux tirés directement l'un vers l'autre par un seul câble horizontal, à la place de la géométrie à étrier et câblage en Y d'un frein cantilever. Commercialisé sous le nom V-Brake. La première page du document corrige le nom « Masanao Ose » initialement associé à cette fiche."}},{"num":"4522610","cat":"drive","title":{"en":"Shimano Biopace non-circular chainring (US 4,522,610)","fr":"Plateau non circulaire Shimano Biopace (US 4 522 610)"},"assignee":"Masashi Nagano / Shimano","img":"../pictures/US4522610A.png","alt":{"en":"Fig. 2 of US 4,522,610: the crank and chainring face-on, its point-symmetric egg-shaped outline (2/3/21/22, teeth 4) offset from the crank axle so the two pitch centers (O1, O2) sit apart rather than concentric with the bottom bracket","fr":"Fig. 2 du brevet US 4 522 610 : la manivelle et le plateau vus de face, leur contour en forme d'œuf à symétrie ponctuelle (2/3/21/22, dents 4) décentré par rapport à l'axe de pédalier, si bien que les deux centres de pas (O1, O2) sont écartés plutôt que concentriques au boîtier de pédalier"},"teaser":{"en":"US 4,522,610, 'Gear crank apparatus for a bicycle,' filed May 23, 1983 and granted June 11, 1985 to Masashi Nagano of Shimano Industrial Company, claiming priority to 1982 Japanese filings. The…","fr":"US 4 522 610, « Gear crank apparatus for a bicycle », déposé le 23 mai 1983 et délivré le 11 juin 1985 à Masashi Nagano de Shimano Industrial Company, revendiquant la priorité de dépôts japonais de…"},"full":{"en":"US 4,522,610, 'Gear crank apparatus for a bicycle,' filed May 23, 1983 and granted June 11, 1985 to Masashi Nagano of Shimano Industrial Company, claiming priority to 1982 Japanese filings. The chainring's outline is not a simple ellipse but what Shimano described as a point-symmetric egg curve, intended to smooth out the uneven torque a rider actually produces through each pedal stroke rather than assuming constant effort at every crank angle. Marketed as Biopace starting in 1983. Pre-1995 filing: the term ran 17 years from grant, to 2002.","fr":"US 4 522 610, « Gear crank apparatus for a bicycle », déposé le 23 mai 1983 et délivré le 11 juin 1985 à Masashi Nagano de Shimano Industrial Company, revendiquant la priorité de dépôts japonais de 1982. Le contour du plateau n'est pas une simple ellipse mais ce que Shimano décrivait comme une courbe en œuf à symétrie ponctuelle, destinée à lisser le couple irrégulier qu'un cycliste produit réellement à chaque coup de pédale plutôt que de supposer un effort constant à chaque angle de manivelle. Commercialisé sous le nom Biopace à partir de 1983. Dépôt antérieur à 1995 : la durée courait 17 ans à compter de la délivrance, jusqu'en 2002."}},{"num":"5193833","cat":"comp","title":{"en":"Mountain Cycle Pro-Stop hydraulic disc brake (US 5,193,833)","fr":"Frein à disque hydraulique Mountain Cycle Pro-Stop (US 5 193 833)"},"assignee":"Robert Reisinger / Mountain Cycle","img":"../pictures/US5193833A.png","alt":{"en":"Fig. 1 of US 5,193,833: the inverted fork leg, its telescoping upper stanchion (1) sliding inside a wider lower leg (2) toward the axle, with the disc rotor (33) and a caliper mount (17) at the dropout","fr":"Fig. 1 du brevet US 5 193 833 : le fourreau de fourche inversé, son fourreau supérieur télescopique (1) coulissant dans une jambe inférieure plus large (2) vers l'axe, avec le disque de frein (33) et une fixation d'étrier (17) à la patte"},"teaser":{"en":"US 5,193,833, 'Bicycle front suspension, steering & braking system,' filed August 24, 1990 and granted March 16, 1993 to Robert Reisinger, founder of Mountain Cycle. The single filing covers both the…","fr":"US 5 193 833, « Bicycle front suspension, steering & braking system », déposé le 24 août 1990 et délivré le 16 mars 1993 à Robert Reisinger, fondateur de Mountain Cycle. Le dépôt unique couvre à la…"},"full":{"en":"US 5,193,833, 'Bicycle front suspension, steering & braking system,' filed August 24, 1990 and granted March 16, 1993 to Robert Reisinger, founder of Mountain Cycle. The single filing covers both the cable-actuated hydraulic disc caliper marketed as the Pro-Stop and the inverted 'Suspenders' fork it shipped alongside on the San Andreas — one of the first production mountain bikes with hydraulic disc braking, at a time when rim brakes were still the default even for aggressive descending. Per the abstract, the fork is a pair of telescoping tubes filled with elastic cells of different stiffnesses, a dropout offsets the tube from the axle to adjust steering geometry, and the disc floats on hub fingers nested in holes so the caliper centers it. The retrofit caliper is a closed hydraulic unit worked from a conventional brake cable. Pre-1995 filing: the term ran 17 years from grant, to 2010.","fr":"US 5 193 833, « Bicycle front suspension, steering & braking system », déposé le 24 août 1990 et délivré le 16 mars 1993 à Robert Reisinger, fondateur de Mountain Cycle. Le dépôt unique couvre à la fois l'étrier de frein à disque hydraulique à câble commercialisé sous le nom Pro-Stop et la fourche inversée « Suspenders » qui l'accompagnait sur la San Andreas — l'un des premiers VTT de série à frein à disque hydraulique, à une époque où le frein sur jante restait la norme même pour la descente engagée. D'après le résumé, la fourche est formée de deux tubes télescopiques remplis de cellules élastiques de raideurs différentes, une patte décale le tube par rapport à l'axe pour régler la géométrie de direction, et le disque flotte sur des doigts de moyeu logés dans des trous afin que l'étrier le centre. L'étrier de rattrapage est une unité hydraulique fermée actionnée par un câble de frein classique."}},{"num":"5803477","cat":"susp","title":{"en":"Reisinger flexing seatstay frame (US 5,803,477)","fr":"Cadre à hauban flexible de Reisinger (US 5 803 477)"},"assignee":"Robert Reisinger (individual)","img":"../pictures/US5803477A.1.png","alt":{"en":"Fig. 5 of US 5,803,477: an arch-shaped frame member (54) with its outer wall (68), inner wall (84) and elongated cut-outs (86, 96, 98) between them, and its dimensions labelled","fr":"Fig. 5 du brevet US 5 803 477 : un élément de cadre en arche (54) avec sa paroi extérieure (68), sa paroi intérieure (84) et des découpes allongées (86, 96, 98) entre elles, et ses cotes indiquées"},"teaser":{"en":"US 5,803,477, \"Bicycle frame construction,\" filed September 7, 1995 and granted September 8, 1998 to Robert Reisinger as an individual. The abstract describes a frame member that is rigid in normal…","fr":"US 5 803 477, « Bicycle frame construction », déposé le 7 septembre 1995 et délivré le 8 septembre 1998 à Robert Reisinger à titre individuel. Le résumé décrit un élément de cadre rigide en usage…"},"full":{"en":"US 5,803,477, \"Bicycle frame construction,\" filed September 7, 1995 and granted September 8, 1998 to Robert Reisinger as an individual. The abstract describes a frame member that is rigid in normal handling but deflects elastically in limited amounts along one direction as compressive force builds from rider weight and ground reaction on rough ground, cushioning the ride and keeping the wheel in contact without adding weight or complexity. In the disclosed embodiment it is part of the seatstay, between the seat tube and the rear dropout. Reisinger founded Mountain Cycle, whose Pro-Stop brake patent (US 5,193,833) is also in the atlas; whether this design shipped on a Mountain Cycle frame was not confirmed. Google Patents lists it as Expired – Fee Related, meaning it lapsed on unpaid maintenance fees; the lapse date was not seen. The claims were not read.","fr":"US 5 803 477, « Bicycle frame construction », déposé le 7 septembre 1995 et délivré le 8 septembre 1998 à Robert Reisinger à titre individuel. Le résumé décrit un élément de cadre rigide en usage normal mais qui fléchit élastiquement de façon limitée dans une direction à mesure que l'effort de compression croît sous l'effet du poids du cycliste et de la réaction du sol en terrain accidenté, ce qui amortit la conduite et maintient la roue en contact sans ajouter de poids ni de complexité. Dans le mode de réalisation décrit, il fait partie du hauban, entre le tube de selle et la patte arrière. Reisinger a fondé Mountain Cycle, dont le brevet de frein Pro-Stop (US 5 193 833) figure aussi dans l'atlas ; l'utilisation de cette conception sur un cadre Mountain Cycle n'a pas été confirmée. Google Patents indique Expired – Fee Related, c'est-à-dire déchu pour frais de maintien impayés ; la date de déchéance n'a pas été vue. Les revendications n'ont pas été lues."}}];

    clampNote:(actual,wanted)=>`Seulement ${actual} entrée${actual===1?"":"s"} correspond${actual===1?"":"ent"} au filtre de catégorie actuel, donc cette manche se joue avec ${actual} paire${actual===1?"":"s"} au lieu de ${wanted}.`,

    doneStats:(matched,total,time,mistakes)=>`${matched} sur ${total} associées en ${time} avec ${mistakes} erreur${mistakes===1?"":"s"}.`,
    playAgain:"Rejouer",
    matchedAnnounce:title=>`Association trouvée : ${title}`,
    wrongAnnounce:"Ce n'est pas la bonne association, réessayez.",
    footer:"Construit à partir des entrées vérifiées du MTB Patent Atlas. Les descriptions sont raccourcies automatiquement à partir du résumé de chaque entrée ; une révision manuelle est prévue."
  }
};

/* ---- State ---- */
let state = {
  lang: "en",
  pairs: DEFAULT_PAIRS,
  cats: new Set(CAT_ORDER),   // active category filter
  round: [],                  // the D-style entries in play this round
  imgOrder: [],                // shuffled indices into state.round, drives #imgGrid
  descOrder: [],                // shuffled indices into state.round, drives #descList
  selectedImg: null,          // index into state.round, or null
  selectedDesc: null,
  matched: new Set(),
  mistakes: 0,
  startedAt: null,
  timerRunning: false,        // true once the first tile of a round has been clicked
  timerHandle: null
};
try{ const saved=localStorage.getItem(LANG_STORAGE_KEY); if(saved==="en"||saved==="fr") state.lang=saved; }catch(e){}

const $ = sel => document.querySelector(sel);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* tx(field): read a {en,fr} data field in the current language, falling
   back to English -- mirrors the main Atlas's own tx() helper. */
function tx(field){ return field==null ? field : (field[state.lang] ?? field.en); }
/* t(key, ...args): read a chrome string, calling it if it's a function. */
function t(key, ...args){
  const v = (T[state.lang] && T[state.lang][key]) ?? T.en[key];
  return typeof v === "function" ? v(...args) : v;
}

/* ---- Static (non-data-driven) text -- re-applied on every language switch ---- */
function applyStaticText(){
  document.documentElement.lang = state.lang;
  $("#txProtoBadge").textContent = t("protoBadge");
  $("#langBtn").textContent = t("langBtn");
  $("#langBtn").setAttribute("aria-label", state.lang==="en" ? "Passer en français" : "Switch to English");
  $("#txH1").textContent = t("h1");
  $("#txLede1").textContent = t("lede1");
  $("#txLede2").textContent = t("lede2", MATCH_DATA.length);
  $("#controlsSummaryText").textContent = t("controlsSummary");
  $("#pairsLabel").textContent = t("pairsLabel");
  $("#catLabel").textContent = t("catLabel");
  $("#txTimerLabel").textContent = t("timerLabel");
  $("#newRoundBtn").textContent = t("newRound");
  $("#txDrawingsH").textContent = t("drawingsH");
  $("#txDescriptionsH").textContent = t("descriptionsH");
  $("#playAgainBtn").textContent = t("playAgain");
  $("#txFooter").textContent = t("footer");
}

/* ---- Controls: build the chip rows (language-dependent, so this re-runs on a language switch) ---- */
function buildControls(){
  const pairsWrap = $("#pairsChips");
  pairsWrap.innerHTML = PAIR_COUNT_OPTIONS.map(n =>
    `<button type="button" class="chip" data-pairs="${n}" aria-pressed="${n===state.pairs}">${n}</button>`).join("");
  pairsWrap.querySelectorAll("[data-pairs]").forEach(btn=>{
    btn.onclick=()=>{ state.pairs=Number(btn.dataset.pairs); buildControls(); startRound(); };
  });

  const catWrap = $("#catChips");
  catWrap.innerHTML = CAT_ORDER.map(k =>
    `<button type="button" class="chip" data-cat="${k}" aria-pressed="${state.cats.has(k)}">${escapeHtml(tx(CAT_LABELS[k]))}</button>`).join("");
  catWrap.querySelectorAll("[data-cat]").forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.cat;
      if(state.cats.has(k) && state.cats.size>1) state.cats.delete(k);
      else state.cats.add(k);
      buildControls();
      startRound();
    };
  });
}

/* ---- Round setup ---- */
function startRound(){
  clearInterval(state.timerHandle);
  const pool = MATCH_DATA.filter(d=>state.cats.has(d.cat));
  const wanted = state.pairs;
  const actual = Math.min(wanted, pool.length);
  const clampNote = $("#clampNote");
  if(actual < wanted){
    clampNote.hidden=false;
    clampNote.textContent = t("clampNote", actual, wanted);
  } else {
    clampNote.hidden=true;
  }
  state.round = shuffle(pool).slice(0, actual);
  state.imgOrder = shuffle(state.round.map((_,i)=>i));
  state.descOrder = shuffle(state.round.map((_,i)=>i));
  state.selectedImg=null; state.selectedDesc=null;
  state.matched=new Set();
  state.mistakes=0;
  state.startedAt=null;        // timer doesn't start until the first tile click -- see startTimerIfNeeded()
  state.timerRunning=false;
  $("#doneBanner").classList.remove("show");
  renderBoard();
  renderStatus();
  $("#statTimeWrap").style.display = $("#timerToggle").checked ? "" : "none";
}

// Arms the clock on the first tile click of a round rather than at round setup,
// so a player isn't penalized for time spent reading the board before playing.
function startTimerIfNeeded(){
  if(state.timerRunning) return;
  state.timerRunning=true;
  state.startedAt=Date.now();
  if($("#timerToggle").checked) state.timerHandle=setInterval(renderTime, 1000);
}

function elapsedLabel(){
  if(state.startedAt==null) return "0:00";
  const s=Math.floor((Date.now()-state.startedAt)/1000);
  const m=Math.floor(s/60), r=s%60;
  return `${m}:${String(r).padStart(2,"0")}`;
}
function renderTime(){ $("#statTimeWrap").innerHTML=t("timeLabel", `<b id="statTime">${elapsedLabel()}</b>`); }

function renderStatus(){
  $("#txMatchedLabel").innerHTML = t("matchedLabel", `<b id="statMatched">${state.matched.size}</b>`, `<b id="statTotal">${state.round.length}</b>`);
  $("#txMistakesLabel").innerHTML = t("mistakesLabel", `<b id="statMistakes">${state.mistakes}</b>`);
  renderTime();
}

/* ---- Board rendering ---- */
function renderBoard(){
  const imgGrid=$("#imgGrid"), descList=$("#descList");
  imgGrid.innerHTML = state.imgOrder.map((idx,pos)=>{
    const d=state.round[idx];
    const isMatched=state.matched.has(idx);
    const isSel=state.selectedImg===idx;
    return `<button type="button" class="tile img-tile${isMatched?" matched":""}${isSel?" selected":""}" data-idx="${idx}" ${isMatched?"disabled":""} aria-pressed="${isSel}">
      <span class="badge">${pos+1}</span>
      <img src="${d.img}" alt="${escapeHtml(tx(d.alt))}" loading="lazy">
      <span class="reveal">${isMatched?escapeHtml(tx(d.title))+" — "+escapeHtml(d.assignee):""}</span>
    </button>`;
  }).join("");

  descList.innerHTML = state.descOrder.map((idx,pos)=>{
    const d=state.round[idx];
    const isMatched=state.matched.has(idx);
    const isSel=state.selectedDesc===idx;
    return `<button type="button" class="tile desc-tile${isMatched?" matched":""}${isSel?" selected":""}" data-idx="${idx}" ${isMatched?"disabled":""} aria-pressed="${isSel}">
      <span class="badge">${String.fromCharCode(65+pos)}</span>
      <span class="txt">${escapeHtml(tx(d.teaser))}</span>
    </button>`;
  }).join("");

  imgGrid.querySelectorAll("[data-idx]").forEach(b=>{ b.onclick=()=>pickImg(Number(b.dataset.idx)); });
  descList.querySelectorAll("[data-idx]").forEach(b=>{ b.onclick=()=>pickDesc(Number(b.dataset.idx)); });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---- Selection / matching ---- */
function pickImg(idx){
  if(state.matched.has(idx)) return;
  startTimerIfNeeded();
  state.selectedImg=idx;
  if(state.selectedDesc!=null) attemptMatch();
  else renderBoard();
}
function pickDesc(idx){
  if(state.matched.has(idx)) return;
  startTimerIfNeeded();
  state.selectedDesc=idx;
  if(state.selectedImg!=null) attemptMatch();
  else renderBoard();
}
function attemptMatch(){
  const i=state.selectedImg, j=state.selectedDesc;
  if(i===j){
    state.matched.add(i);
    state.selectedImg=null; state.selectedDesc=null;
    renderBoard(); renderStatus();
    announce(t("matchedAnnounce", tx(state.round[i].title)));
    if(state.matched.size===state.round.length) finishRound();
  } else {
    renderBoard(); // show both as selected first
    const imgEl=document.querySelector(`.img-tile[data-idx="${i}"]`);
    const descEl=document.querySelector(`.desc-tile[data-idx="${j}"]`);
    imgEl&&imgEl.classList.add("wrong");
    descEl&&descEl.classList.add("wrong");
    state.mistakes++;
    renderStatus();
    announce(t("wrongAnnounce"));
    setTimeout(()=>{
      state.selectedImg=null; state.selectedDesc=null;
      renderBoard();
    }, MISMATCH_FLASH_MS);
  }
}
function announce(msg){ $("#liveRegion").textContent=msg; }

function finishRound(){
  clearInterval(state.timerHandle);
  const time=elapsedLabel();
  $("#doneHeadline").textContent=t("doneHeadline");
  $("#doneStats").textContent=t("doneStats", state.round.length, state.round.length, time, state.mistakes);
  $("#doneBanner").classList.add("show");
}

$("#newRoundBtn").onclick=startRound;
$("#playAgainBtn").onclick=startRound;
$("#timerToggle").onchange=()=>{
  clearInterval(state.timerHandle);
  if($("#timerToggle").checked){
    $("#statTimeWrap").style.display="";
    renderTime();
    if(state.timerRunning) state.timerHandle=setInterval(renderTime,1000); // else: still waiting on the first click, nothing to tick yet
  } else {
    $("#statTimeWrap").style.display="none";
  }
};
$("#langBtn").onclick=()=>{
  state.lang = state.lang==="en" ? "fr" : "en";
  try{ localStorage.setItem(LANG_STORAGE_KEY, state.lang); }catch(e){}
  applyStaticText();
  buildControls();
  renderBoard();
  renderStatus();
  if(!$("#clampNote").hidden){ /* re-run the clamp-note sentence in the new language */
    const pool=MATCH_DATA.filter(d=>state.cats.has(d.cat));
    $("#clampNote").textContent = t("clampNote", state.round.length, state.pairs);
  }
  if($("#doneBanner").classList.contains("show")) finishRound();
};

applyStaticText();
buildControls();
startRound();
// Mobile-first markup ships the Filters & options panel closed (no [open]
// attribute on the <details> -- see the CSS comment above .controls). On a
// wide enough viewport to show the board side-by-side, open it by default
// instead, matching the panel's one-time pre-this-change behavior there.
if(window.matchMedia("(min-width: 760px)").matches) $("#controlsPanel").open = true;

/* ======================================================================
   Regenerating MATCH_DATA from index.html's D array
   ======================================================================
   MATCH_DATA above is a static snapshot, not a live link -- after a data
   session adds or edits D entries with images, re-run this from the repo
   root (not inside this <script> tag -- it's Node, kept here only as a
   record of exactly how the block above was produced) to rebuild it:

   node -e "
   const fs=require('fs'), path=require('path');
   const html=fs.readFileSync('index.html','utf8');
   const extract=re=>{const m=html.match(re); if(!m) throw new Error('not found'); return m[1];};
   const D = eval('let D=[' + extract(/const D = \[([\s\S]*?)\n\];/) + '\n];D');
   const withImg = D.filter(d=>d.img || (d.imgs&&d.imgs.length));
   const MAX=200;
   const strip = x => (x||'').replace(/\[\[(?:card|link):[^|\]]+\|([^\]]+)\]\]/g, '$1');
   function teaser(text){
     if(!text) return '';
     if(text.length<=MAX) return text;
     const cut = text.lastIndexOf(' ', MAX);
     return text.slice(0, cut>40?cut:MAX) + '…';
   }
   const out = withImg.map(d=>{
     const imgSrc = d.img || d.imgs[0].src;
     const imgAltObj = d.img ? d.imgAlt : d.imgs[0].alt;
     const descSrc = d.s || d.w; // entries with no s fall back to w (one case: Cool Tool, US 4,967,435)
     const plain = o => ({en: strip(o.en), fr: strip(o.fr)}); // drop [[card:ref|text]] cross-link markup, keep the text
     return {
       num: d.num, cat: d.cat,
       title: {en: d.t.en, fr: d.t.fr},
       assignee: d.a,
       img: '../pictures/'+path.basename(decodeURIComponent(imgSrc)),
       alt: {en: (imgAltObj&&imgAltObj.en)||d.t.en, fr: (imgAltObj&&imgAltObj.fr)||d.t.fr},
       teaser: {en: teaser(plain(descSrc).en), fr: teaser(plain(descSrc).fr)},
       full: plain(descSrc)
     };
   });
   fs.writeFileSync('/tmp/match_data_regen.js', 'const MATCH_DATA = '+JSON.stringify(out)+';');
   console.log(out.length, 'entries written to /tmp/match_data_regen.js');
   "

   Then paste the contents of /tmp/match_data_regen.js over the MATCH_DATA
   declaration above (between "const MATCH_DATA = [" and its closing "];").
   This produces the REPO version's image paths (../pictures/...); an
   Artifact preview needs the leading "../" stripped to "pictures/" and
   every referenced image published alongside the page via the Artifact
   tool's `files` parameter instead (see the session that first built this
   file for the exact call shape).
   ====================================================================== */
</script>
</body>
</html>
