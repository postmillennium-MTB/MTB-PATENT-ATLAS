issued July 14, 1891, for the flat-sided, compound-curved, rounded-end handle shape sold as the T&L Safety pocket wrench. One of the atlas's oldest entries, from an era when a bicycle wrench's handle profile itself was considered worth a design patent.","fr":"« Design for a wrench-handle » — délivré le 14 juillet 1891, pour la forme de manche à faces plates, à courbes composées et à extrémité arrondie vendue sous le nom de clé de poche T&L Safety. L'une des plus anciennes fiches de l'atlas, d'une époque où le profil du manche d'une clé de vélo était lui-même considéré comme méritant un brevet de dessin."}},{"num":"D1036319","cat":"comp","title":{"en":"PCS-9.3 stand — four-jurisdiction design registrations","fr":"Pied PCS-9.3 — dépôts de dessin dans quatre juridictions"},"assignee":"Park Tool Co.","img":"../pictures/USD1036319S1.png","alt":{"en":"Sheet 1 of 8 of US D1,036,319, Fig. 1: the folding repair stand in perspective, a telescoping upright with the clamp head at the top and three splayed legs, one braced by a hinged strut","fr":"Planche 1 sur 8 du brevet US D1 036 319, Fig. 1 : le pied d'atelier pliant en perspective, un montant télescopique avec la tête de serrage en haut et trois pieds écartés, dont un renforcé par une jambe de force articulée"},"teaser":{"en":"The Home Mechanic stand, protected as an industrial design rather than a utility invention, in four jurisdictions at once: US design patent D1,036,319; UK 6185856; EU (RCD) 8827018-0007; and China ZL…","fr":"Le pied Home Mechanic, protégé comme un dessin industriel plutôt qu'une invention d'utilité, dans quatre juridictions à la fois : brevet de dessin américain D1,036,319 ; Royaume-Uni 6185856 ; UE…"},"full":{"en":"The Home Mechanic stand, protected as an industrial design rather than a utility invention, in four jurisdictions at once: US design patent D1,036,319; UK 6185856; EU (RCD) 8827018-0007; and China ZL 2022 3 0067816.1. Design rights cover how the stand looks — proportions, the shape of the clamp head and leg geometry — not how the clamp works, which is long out of patent.","fr":"Le pied Home Mechanic, protégé comme un dessin industriel plutôt qu'une invention d'utilité, dans quatre juridictions à la fois : brevet de dessin américain D1,036,319 ; Royaume-Uni 6185856 ; UE (dessin communautaire) 8827018-0007 ; et Chine ZL 2022 3 0067816.1. Les droits de dessin couvrent l'apparence du pied — proportions, forme de la tête de pince et géométrie des pieds — pas le fonctionnement de la pince, qui n'est plus sous brevet depuis longtemps."}},{"num":null,"cat":"comp","title":{"en":"absoluteBLACK Piston Press brake tool (EU registered design)","fr":"Outil Piston Press absoluteBLACK (dessin communautaire enregistré)"},"assignee":"absoluteBLACK","img":"../pictures/015091656-0001.png","alt":{"en":"Line drawing from EU registered design 015091656-0001: the Piston Press in perspective, an elongated body with an oval window and a knurled screw knob at the top, over a grooved press head at the base","fr":"Dessin au trait du dessin communautaire enregistré 015091656-0001 : le Piston Press en perspective, un corps allongé percé d'une fenêtre ovale avec une molette de vis crantée en haut, au-dessus d'une tête de presse rainurée à la base"},"teaser":{"en":"Launched September 2025: a carbon-fiber-reinforced-polymer press with titanium hardware (12.5g) that resets both pistons of a two-piston hydraulic disc-brake caliper evenly and squarely for a pad…","fr":"Lancé en septembre 2025 : une pince en polymère renforcé de fibre de carbone avec quincaillerie en titane (12,5 g) qui réinitialise les deux pistons d'un étrier de frein à disque hydraulique à deux…"},"full":{"en":"Launched September 2025: a carbon-fiber-reinforced-polymer press with titanium hardware (12.5g) that resets both pistons of a two-piston hydraulic disc-brake caliper evenly and squarely for a pad change, doubling as a bleed block — replacing the screwdriver-and-lever method that risks cracking a ceramic piston or tilting it crooked in its bore. A four-piston MTB version followed in March 2026. Protected as two EU Registered Community Designs, 015091656-0001 and -0002, covering the tool's shape.","fr":"Lancé en septembre 2025 : une pince en polymère renforcé de fibre de carbone avec quincaillerie en titane (12,5 g) qui réinitialise les deux pistons d'un étrier de frein à disque hydraulique à deux pistons de façon uniforme et perpendiculaire pour un changement de plaquettes, servant aussi de bloc de purge — remplaçant la méthode au tournevis et au levier qui risque de fissurer un piston céramique ou de l'incliner de travers dans son alésage. Une version quatre pistons pour VTT a suivi en mars 2026. Protégé par deux dessins communautaires enregistrés, 015091656-0001 et -0002, couvrant la forme de l'outil."}},{"num":"8578520","cat":"comp","title":{"en":"MIPS — Multi-directional Impact Protection System (US 8,578,520)","fr":"MIPS — Multi-directional Impact Protection System (US 8 578 520)"},"assignee":"Peter Halldin / MIPS AB (Sweden)","img":"../pictures/US20130042397A1.png","alt":{"en":"Fig. 1 of US 2013/0042397: a helmet in cross-section, with the energy-absorbing layer (2) and the sliding facilitator (5) lining its inner surface, joined through connection points (4a–4d) to the part that rests on the head (3)","fr":"Fig. 1 du brevet US 2013/0042397 : un casque en coupe, avec la couche absorbant les chocs (2) et l'élément facilitant le glissement (5) qui en tapisse l'intérieur, relié par des points de connexion (4a–4d) à la pièce qui repose sur la tête (3)"},"teaser":{"en":"A low-friction sliding layer inside the helmet's energy-absorbing liner lets the helmet rotate 10–15mm relative to the head during angled impacts, reducing the rotational forces transmitted to the…","fr":"Une couche de glissement à faible friction, placée à l'intérieur de la doublure absorbant les chocs, permet au casque de pivoter de 10 à 15 mm par rapport à la tête lors d'impacts obliques, réduisant…"},"full":{"en":"A low-friction sliding layer inside the helmet's energy-absorbing liner lets the helmet rotate 10–15mm relative to the head during angled impacts, reducing the rotational forces transmitted to the brain. US 8,578,520 (inventor Peter Halldin; filed in the US May 2011 with a 2010 Swedish priority, granted November 2013) covers a helmet with an energy-absorbing layer and a sliding facilitator inside it, plus the manufacturing method. The idea came out of research at KTH Royal Institute of Technology and the Karolinska Institute in Stockholm; MIPS dates its research phase to 1996.","fr":"Une couche de glissement à faible friction, placée à l'intérieur de la doublure absorbant les chocs, permet au casque de pivoter de 10 à 15 mm par rapport à la tête lors d'impacts obliques, réduisant les forces rotationnelles transmises au cerveau. Le brevet US 8 578 520 (inventeur : Peter Halldin ; déposé aux États-Unis en mai 2011 avec une priorité suédoise de 2010, délivré en novembre 2013) couvre un casque doté d'une couche absorbant les chocs et d'un élément facilitant le glissement placé à l'intérieur, ainsi que son procédé de fabrication. L'idée est née de recherches au KTH Royal Institute of Technology et à l'Institut Karolinska de Stockholm ; MIPS situe sa phase de recherche en 1996."}},{"num":"10834987","cat":"comp","title":{"en":"WaveCel collapsible-cell helmet liner (US 10,834,987)","fr":"Doublure de casque WaveCel à cellules déformables (US 10 834 987)"},"assignee":"Michael Bottlang, Steven Madey et al. / Apex Biomedical Co. (Portland, OR) → WaveCel LLC","img":"../pictures/US10834987B1.png","alt":{"en":"Figure 2B of US 10,834,987 B1: a helmet cut away over a head (205, dashed outline), the cellular liner (201) seated inside the hatched outer layer (202); an oblique impact (209) is drawn split into its radial and tangential components, the tangential part being the one that rotates the head","fr":"Figure 2B du brevet US 10 834 987 B1 : un casque en écorché sur une tête (205, contour en pointillés), la doublure cellulaire (201) logée dans la couche extérieure hachurée (202) ; un impact oblique (209) est décomposé en ses composantes radiale et tangentielle, la composante tangentielle étant celle qui fait tourner la tête"},"teaser":{"en":"US 10,834,987 B1, \"Protective liner for helmets and other articles,\" granted November 17, 2020 to Apex Biomedical Company of Portland, Oregon; inventors Michael Bottlang, Steven Madey, Stanley Tsai,…","fr":"US 10 834 987 B1, « Protective liner for helmets and other articles », délivré le 17 novembre 2020 à Apex Biomedical Company de Portland (Oregon) ; inventeurs Michael Bottlang, Steven Madey, Stanley…"},"full":{"en":"US 10,834,987 B1, \"Protective liner for helmets and other articles,\" granted November 17, 2020 to Apex Biomedical Company of Portland, Oregon; inventors Michael Bottlang, Steven Madey, Stanley Tsai, Jeffrey Bennett and Devin Knowles. It describes a liner of collapsible cells set inside a stiffer outer layer, meant to crumple under the direct part of an impact and shear under the tangential part that rotates the head. The application, filed March 3, 2017, is a continuation-in-part of a March 14, 2013 application, so its 20-year term runs from 2013: to 2033, plus a 391-day adjustment. Trek launched the technology in Bontrager helmets in 2019 under the WaveCel name.","fr":"US 10 834 987 B1, « Protective liner for helmets and other articles », délivré le 17 novembre 2020 à Apex Biomedical Company de Portland (Oregon) ; inventeurs Michael Bottlang, Steven Madey, Stanley Tsai, Jeffrey Bennett et Devin Knowles. Il décrit une doublure de cellules déformables logée dans une couche extérieure plus rigide, conçue pour s'écraser sous la composante directe d'un impact et se cisailler sous la composante tangentielle qui fait tourner la tête. La demande, déposée le 3 mars 2017, est une continuation partielle d'une demande du 14 mars 2013, si bien que sa durée de 20 ans court à partir de 2013 : jusqu'en 2033, plus un ajustement de 391 jours. Trek a lancé la technologie sur les casques Bontrager en 2019 sous le nom WaveCel."}},{"num":"5060833","cat":"comp","title":{"en":"CamelBak hydration pack (US 5,060,833)","fr":"Sac d'hydratation CamelBak (US 5 060 833)"},"assignee":"James M. Edison & Arthur D. Henderson / Fastrak Systems, Inc. (Odessa, TX) → CamelBak","img":"../pictures/US5060833A-page-2.png","alt":{"en":"Fig. 1 of US 5,060,833: a road cyclist on a drop-bar bicycle (12) wearing the pack (16) between the shoulders, with the drinking tube (20) running to a valve (34) held in the mouth","fr":"Fig. 1 du brevet US 5 060 833 : un cycliste sur route, sur un vélo à cintre de course (12), portant le sac (16) entre les omoplates, le tube (20) menant à une valve (34) tenue en bouche"},"teaser":{"en":"US 5,060,833, titled simply \"Camel back\": filed August 24, 1990 as a continuation of an August 14, 1989 application, granted October 29, 1991, and assigned to Fastrak Systems, Inc. of Odessa, Texas —…","fr":"US 5 060 833, intitulé simplement « Camel back » : déposé le 24 août 1990 en continuation d'une demande du 14 août 1989, délivré le 29 octobre 1991 et cédé à Fastrak Systems, Inc. d'Odessa (Texas) —…"},"full":{"en":"US 5,060,833, titled simply \"Camel back\": filed August 24, 1990 as a continuation of an August 14, 1989 application, granted October 29, 1991, and assigned to Fastrak Systems, Inc. of Odessa, Texas — the company later renamed CamelBak Products. A collapsible water bag rides in a pack between a cyclist's shoulders, with a tube to a resilient valve held in the mouth; biting down meters the flow. The patent names James M. Edison and Arthur D. Henderson as inventors. CamelBak credits its founding to paramedic Michael Eidson, who built the first one from an IV bag and a tube sock for the 1988 Hotter'N Hell Hundred ride in Wichita Falls, Texas; whether the patent's \"James M. Edison\" is Eidson under a misspelled name is unconfirmed. Pre-1995 filing: the term ran 17 years from grant, to 2008.","fr":"US 5 060 833, intitulé simplement « Camel back » : déposé le 24 août 1990 en continuation d'une demande du 14 août 1989, délivré le 29 octobre 1991 et cédé à Fastrak Systems, Inc. d'Odessa (Texas) — la société renommée plus tard CamelBak Products. Une poche d'eau souple est portée dans un sac entre les omoplates du cycliste, avec un tube menant à une valve souple tenue en bouche ; mordre dessus dose le débit. Le brevet désigne James M. Edison et Arthur D. Henderson comme inventeurs. CamelBak attribue sa fondation à l'ambulancier Michael Eidson, qui a fabriqué le premier exemplaire avec une poche de perfusion et une chaussette tube pour la randonnée Hotter'N Hell Hundred de 1988 à Wichita Falls (Texas) ; que le « James M. Edison » du brevet soit Eidson sous un nom mal orthographié n'est pas confirmé. Dépôt antérieur à 1995 : la durée courait 17 ans à compter de la délivrance, jusqu'en 2008."}},{"num":"10703429","cat":"comp","title":{"en":"Fidlock magnetic closure device (US 10,703,429)","fr":"Dispositif de fermeture magnétique Fidlock (US 10 703 429)"},"assignee":"Joachim Fiedler, Breido Botkus, Friedemann Richter, Jürgen Spindler / Fidlock GmbH","img":"../pictures/US10703429B2.png","alt":{"en":"Fig. 2 of US 10,703,429, an exploded view of the closure's three main parts: the toothed magnet cylinder (3) that mounts on the container, the latching bracket assembly (5) with its magnet-and-lock-ring components (50-54), and the two-piece frame-clamp bracket (4) that secures the whole unit to a bike tube","fr":"Fig. 2 du brevet US 10 703 429, vue éclatée des trois parties principales de la fermeture : le cylindre aimanté denté (3) qui se fixe sur le contenant, l'ensemble à loquet (5) avec ses composants d'aimant et de bague de verrouillage (50-54), et le collier de fixation en deux pièces (4) qui assure la fixation de l'ensemble sur un tube de cadre"},"teaser":{"en":"US 10,703,429 B2, \"Closure Device for Connecting a Container e.g. to a Bicycle,\" entered the U.S. as a national-phase filing from PCT/EP2017/071349 (filed August 24, 2017, claiming an August 31, 2016…","fr":"US 10 703 429 B2, « Closure Device for Connecting a Container e.g. to a Bicycle », est entré aux États-Unis comme dépôt en phase nationale issu du PCT/EP2017/071349 (déposé le 24 août 2017,…"},"full":{"en":"US 10,703,429 B2, \"Closure Device for Connecting a Container e.g. to a Bicycle,\" entered the U.S. as a national-phase filing from PCT/EP2017/071349 (filed August 24, 2017, claiming an August 31, 2016 German priority) and granted July 7, 2020 to Fidlock GmbH of Hannover, Germany. It claims a two-part magnetic closure — a frame-mounted first part and a container-mounted second part, each carrying its own magnet — that positions itself on approach and mechanically latches in the closed position rather than relying on magnetism alone to hold.","fr":"US 10 703 429 B2, « Closure Device for Connecting a Container e.g. to a Bicycle », est entré aux États-Unis comme dépôt en phase nationale issu du PCT/EP2017/071349 (déposé le 24 août 2017, revendiquant une priorité allemande du 31 août 2016) et délivré le 7 juillet 2020 à Fidlock GmbH de Hanovre, Allemagne. Il revendique une fermeture magnétique en deux parties — une première partie fixée au cadre et une seconde partie assignée au contenant, chacune portant son propre aimant — qui se positionne d'elle-même à l'approche et se verrouille mécaniquement en position fermée plutôt que de compter uniquement sur le magnétisme pour tenir."}},{"num":"3925821","cat":"comp","title":{"en":"Bell Biker air-cooled hard-shell helmet (US 3,925,821)","fr":"Casque rigide ventilé Bell Biker (US 3 925 821)"},"assignee":"Lester R. Lewicki / Bell Helmets Inc.","img":"../pictures/US3925821A.png","alt":{"en":"Figs. 1 and 2 of US 3,925,821: Fig. 1, a bottom view of the shell showing the distributed air-intake openings (13) and internal deflector baffles (36-42) around the liner (10/11); Fig. 2, the assembled helmet worn on a rider's head with the liner (12) and chin-strap hardware (15/17/18)","fr":"Fig. 1 et 2 du brevet US 3 925 821 : Fig. 1, une vue de dessous de la coque montrant les ouvertures de prise d'air réparties (13) et les chicanes déflectrices internes (36-42) autour de la doublure (10/11) ; Fig. 2, le casque assemblé porté sur la tête d'un cycliste avec la doublure (12) et la jugulaire (15/17/18)"},"teaser":{"en":"US 3,925,821, \"Air Cooled Helmet,\" filed July 5, 1974 by Lester R. Lewicki and granted December 16, 1975 to Bell Helmets Inc. of Long Beach, California — the patent behind the Bell Biker, one of the…","fr":"US 3 925 821, « Air Cooled Helmet », déposé le 5 juillet 1974 par Lester R. Lewicki et délivré le 16 décembre 1975 à Bell Helmets Inc. de Long Beach, Californie — le brevet derrière le Bell Biker,…"},"full":{"en":"US 3,925,821, \"Air Cooled Helmet,\" filed July 5, 1974 by Lester R. Lewicki and granted December 16, 1975 to Bell Helmets Inc. of Long Beach, California — the patent behind the Bell Biker, one of the first hard-shell bicycle helmets built specifically for cycling rather than adapted from a motorcycle or industrial shell. A rigid outer shell bonds to a shock-absorbing liner spaced off the wearer's head, with distributed air-intake openings and internal baffles that direct incoming air rearward across the scalp. Filed and granted before June 8, 1995, so its term runs grant + 17 years under this atlas's pre-GATT rule, not the modern filing + 20.","fr":"US 3 925 821, « Air Cooled Helmet », déposé le 5 juillet 1974 par Lester R. Lewicki et délivré le 16 décembre 1975 à Bell Helmets Inc. de Long Beach, Californie — le brevet derrière le Bell Biker, l'un des premiers casques de vélo à coque rigide conçus spécifiquement pour le cyclisme plutôt qu'adaptés d'une coque de moto ou industrielle. Une coque extérieure rigide est collée à une doublure absorbant les chocs, espacée de la tête du porteur, avec des ouvertures de prise d'air réparties et des chicanes internes qui dirigent l'air entrant vers l'arrière du crâne. Déposé et délivré avant le 8 juin 1995, sa durée court donc sur délivrance + 17 ans selon la règle pré-GATT de cet atlas, et non le calcul moderne de dépôt + 20 ans."}},{"num":"7739783","cat":"comp","title":{"en":"Bell Sports helmet roll cage (US 7,739,783)","fr":"Cage de renfort de casque Bell Sports (US 7 739 783)"},"assignee":"Gregg T. Jacobsen / Bell Sports, Inc. (Santa Cruz, CA)","img":"../pictures/US7739783B1.png","alt":{"en":"Fig. 2A of US 7,739,783: a top view into the helmet shell (20), showing the array of vent openings (24) each spanned internally by molded ribs (28) and cross-ribs (30) — the patent's 'roll cage' reinforcement running through the vent channels — with the retention strap (18) exiting at the bottom","fr":"Fig. 2A du brevet US 7 739 783 : une vue de dessus à l'intérieur de la coque du casque (20), montrant la rangée d'ouvertures d'aération (24) chacune traversée intérieurement par des nervures moulées (28) et des nervures transversales (30) — le renfort « roll cage » du brevet traversant les canaux d'aération — avec la sangle de rétention (18) sortant par le bas"},"teaser":{"en":"US 7,739,783, \"Head protection system and method,\" filed June 29, 2006 by inventor Gregg T. Jacobsen and granted June 22, 2010 to Bell Sports, Inc. of Santa Cruz, California. The claims cover a molded…","fr":"US 7 739 783, « Head protection system and method », déposé le 29 juin 2006 par l'inventeur Gregg T. Jacobsen et délivré le 22 juin 2010 à Bell Sports, Inc. de Santa Cruz (Californie). Les…"},"full":{"en":"US 7,739,783, \"Head protection system and method,\" filed June 29, 2006 by inventor Gregg T. Jacobsen and granted June 22, 2010 to Bell Sports, Inc. of Santa Cruz, California. The claims cover a molded internal rib structure — described in the patent as a roll cage — that runs through and around a vented helmet shell's individual openings, tying the shell segments together and anchoring to the retention-strap hardware, so the vents can be cut larger for airflow without giving up the shell's structural integrity in an impact.","fr":"US 7 739 783, « Head protection system and method », déposé le 29 juin 2006 par l'inventeur Gregg T. Jacobsen et délivré le 22 juin 2010 à Bell Sports, Inc. de Santa Cruz (Californie). Les revendications couvrent une structure de nervures internes moulées — décrite dans le brevet comme une « roll cage » — qui traverse et entoure les ouvertures individuelles d'une coque de casque ventilée, reliant les segments de coque entre eux et s'ancrant à la quincaillerie de la sangle de rétention, afin que les aérations puissent être agrandies pour la circulation d'air sans sacrifier l'intégrité structurelle de la coque lors d'un impact."}},{"num":"20230136136","cat":"comp","title":{"en":"Scott parking-visor helmet (US 2023/0136136)","fr":"Casque à visière escamotable Scott (US 2023/0136136)"},"assignee":"Anatole Dehéselle & Mathilde Lamaud / Scott Sports SA","img":"../pictures/US20230136136A1.png","alt":{"en":"The helmet (1) with its shell (2) and the visor (3) in the parked second position, lying on the shell above the brow and clear of the face opening — the visor-edge fastening elements (10.1, 10.3), their mating elements on the shell (12.1, 12.3) and a flexible side element (13.1) all called out","fr":"Le casque (1) avec sa coque (2) et la visière (3) en seconde position escamotée, posée sur la coque au-dessus du front et dégagée de l'ouverture faciale — les éléments de fixation du bord de visière (10.1, 10.3), leurs éléments complémentaires sur la coque (12.1, 12.3) et un élément souple latéral (13.1) sont tous repérés"},"teaser":{"en":"US 2023/0136136 A1, \"Protective helmet with a shell and a movable visor,\" inventors Anatole Dehéselle and Mathilde Lamaud, assigned to Scott Sports SA. Filed January 19, 2021 and published May 4,…","fr":"US 2023/0136136 A1, « Protective helmet with a shell and a movable visor », inventeurs Anatole Dehéselle et Mathilde Lamaud, cédé à Scott Sports SA. Déposé le 19 janvier 2021 et publié le 4 mai 2023 ;…"},"full":{"en":"US 2023/0136136 A1, \"Protective helmet with a shell and a movable visor,\" inventors Anatole Dehéselle and Mathilde Lamaud, assigned to Scott Sports SA. Filed January 19, 2021 and published May 4, 2023; still pending, so no grant date or term yet. The European member of the same family, EP 4 125 480 A1, published February 8, 2023 and is also pending. The visor carries fastening elements along its edge and the shell carries at least two mating sets, so the same releasable connection holds the visor either across the open facial region or parked on the shell outside it; flexible elements on both sides keep it attached to the helmet while it moves between the two. The patent's own Background names bicycle and ski helmets as the field, and gives the reason visors caught on: the eye protection cannot be forgotten, and helmet and lens are matched mechanically and optically because they are designed together.","fr":"US 2023/0136136 A1, « Protective helmet with a shell and a movable visor », inventeurs Anatole Dehéselle et Mathilde Lamaud, cédé à Scott Sports SA. Déposé le 19 janvier 2021 et publié le 4 mai 2023 ; toujours en instance, donc sans date de délivrance ni durée. Le membre européen de la même famille, EP 4 125 480 A1, a été publié le 8 février 2023 et est également en instance. La visière porte des éléments de fixation le long de son bord et la coque en porte au moins deux jeux complémentaires, de sorte que la même liaison amovible maintient la visière soit devant la zone faciale ouverte, soit escamotée sur la coque en dehors de celle-ci ; des éléments souples de chaque côté la gardent solidaire du casque pendant le mouvement. L'arrière-plan du brevet cite les casques de vélo et de ski comme domaine, et donne la raison du succès des visières : la protection oculaire ne peut pas être oubliée, et casque et écran s'accordent mécaniquement et optiquement parce qu'ils sont conçus ensemble."}},{"num":"5550599","cat":"comp","title":{"en":"Oakley surface-modified lens (US 5,550,599)","fr":"Verre à surface modifiée Oakley (US 5 550 599)"},"assignee":"James H. Jannard / Oakley, Inc.","img":"../pictures/US5550599A.png","alt":{"en":"Fig. 1 of US 5,550,599: the lens (10) seen from the front, its left and right halves (13, 14) joined across the nose bridge (24), with a band of fine parallel grooves (12) running along the top edge, around the nose cut-out (45) and at the temple ends; the section lines 7-7 and 18-18 are marked","fr":"Fig. 1 du brevet US 5 550 599 : le verre (10) vu de face, ses moitiés gauche et droite (13, 14) réunies par le pont nasal (24), avec une bande de fines rainures parallèles (12) le long du bord supérieur, autour de l'échancrure nasale (45) et aux extrémités côté tempes ; les plans de coupe 7-7 et 18-18 sont indiqués"},"teaser":{"en":"US 5,550,599, \"Surface modified lens,\" inventor James H. Jannard, assigned to Oakley, Inc. Application 08/179,092 filed January 10, 1994; granted August 27, 1996; expired January 2014 (20 years from…","fr":"US 5 550 599, « Surface modified lens », inventeur James H. Jannard, cédé à Oakley, Inc. Demande 08/179,092 déposée le 10 janvier 1994 ; délivré le 27 août 1996 ; expiré en janvier 2014 (20 ans après…"},"full":{"en":"US 5,550,599, \"Surface modified lens,\" inventor James H. Jannard, assigned to Oakley, Inc. Application 08/179,092 filed January 10, 1994; granted August 27, 1996; expired January 2014 (20 years from filing, which outran 17 years from grant for a pre-June 1995 filing). The abstract describes an eyeglass lens with at least one optical zone and at least one peripheral zone, where part of the surface in the peripheral zone is modified by removing lens material or adding material to the surface. The lens may extend across the wearer's entire angular range of vision, or the modified lenses may be independent left and right lenses placed in each field of vision. A Chinese counterpart was filed in 1995.","fr":"US 5 550 599, « Surface modified lens », inventeur James H. Jannard, cédé à Oakley, Inc. Demande 08/179,092 déposée le 10 janvier 1994 ; délivré le 27 août 1996 ; expiré en janvier 2014 (20 ans après le dépôt, ce qui dépasse 17 ans après la délivrance pour un dépôt antérieur à juin 1995). Le résumé décrit un verre de lunettes comportant au moins une zone optique et au moins une zone périphérique, dont une partie de la surface est modifiée par enlèvement de matière ou ajout de matière à la surface du verre. Le verre peut s'étendre sur toute l'amplitude angulaire du champ de vision du porteur, ou les verres modifiés peuvent être des verres gauche et droit indépendants placés dans chaque champ de vision. Un équivalent chinois a été déposé en 1995."}},{"num":"6199021","cat":"comp","title":{"en":"Alan Coté chain-tension power measurement (6 filings)","fr":"Mesure de puissance par tension de chaîne d'Alan Coté (6 dépôts)"},"assignee":"Alan Coté (Vermont)","img":"../pictures/US6199021B1.png","alt":{"en":"Fig. 2 of US 6,199,021: close-up of the chain wrapping a pulley inside a housing (19), with a cable (52) attached at 22","fr":"Fig. 2 du brevet US 6 199 021 : gros plan de la chaîne enroulée sur un galet à l'intérieur d'un boîtier (19), avec un câble (52) fixé en 22"},"teaser":{"en":"A long-running independent portfolio built on one idea: you can derive a rider’s power output by measuring the drive chain itself rather than instrumenting the crank or hub. US 6,199,021 (filed 1998,…","fr":"Un portefeuille indépendant de longue date construit sur une seule idée : on peut déduire la puissance délivrée par un cycliste en mesurant la chaîne de transmission elle-même plutôt qu'en…"},"full":{"en":"A long-running independent portfolio built on one idea: you can derive a rider’s power output by measuring the drive chain itself rather than instrumenting the crank or hub. US 6,199,021 (filed 1998, granted 2001) and its continuation US 6,356,848 claim measuring the tension and vibrational frequency of an elongate flexible member — pluck the chain, read the pitch, infer the load. US 8,646,796 (2014) extends this to extracting vibration data from a chain that is actually moving, the hard version of the problem. Two published applications round out the set, neither of which became a patent: US 2010/0000369 on mounting aerodynamic handlebars (three-point aerobar mounting braced against the stem, filed under the inventor name Alan Francis Coté) went abandoned in November 2012 after no response to an office action, and US 2012/0042725 on measuring pedaling dynamics is published but not verified here as granted. A fourth grant, US 8,757,561, is unrelated to power — it covers a bicycle brake cable hanger. Status here follows the longest-lived member of the group: the two 2014 grants run to roughly 2034, while the 1998 and 2000 filings lapsed years ago, and the two publications are applications rather than granted patents.","fr":"Un portefeuille indépendant de longue date construit sur une seule idée : on peut déduire la puissance délivrée par un cycliste en mesurant la chaîne de transmission elle-même plutôt qu'en instrumentant la manivelle ou le moyeu. L'US 6,199,021 (déposé en 1998, délivré en 2001) et sa continuation US 6,356,848 revendiquent la mesure de la tension et de la fréquence vibratoire d'un élément flexible allongé — pincer la chaîne, lire la hauteur du son, en déduire la charge. L'US 8,646,796 (2014) étend cela à l'extraction de données vibratoires d'une chaîne réellement en mouvement, la version difficile du problème. Deux demandes publiées complètent l'ensemble, aucune n'étant devenue un brevet : l'US 2010/0000369 sur le montage de cintres aérodynamiques (fixation d'aérobarres à trois points calée contre la potence, déposée sous le nom d'inventeur Alan Francis Coté) a été abandonnée en novembre 2012 faute de réponse à une notification de l'office, et l'US 2012/0042725 sur la mesure de la dynamique de pédalage est publiée mais non vérifiée ici comme délivrée. Une quatrième délivrance, l'US 8,757,561, n'a aucun rapport avec la puissance — elle couvre une patte de câble de frein de vélo. Le statut ici suit le membre du groupe ayant la plus longue durée de vie : les deux délivrances de 2014 courent jusque vers 2034, tandis que les dépôts de 1998 et 2000 se sont éteints il y a des années, et les deux publications sont des demandes plutôt que des brevets délivrés."}},{"num":"4271996","cat":"comp","title":{"en":"Cannondale bicycle pannier (US 4,271,996)","fr":"Sacoche de vélo Cannondale (US 4 271 996)"},"assignee":"Joseph S. Montgomery / Cannondale Corporation","img":"../pictures/US4271996A.png","alt":{"en":"Fig. 1 and Fig. 2 of US 4,271,996: a single pannier bag (10) showing the internal rib frame (16) beneath the flexible outer material, and a rear view of a pair of panniers (10) mounted opposite each other on the carrier rack's cross-bar (78)","fr":"Fig. 1 et Fig. 2 du brevet US 4 271 996 : une sacoche individuelle (10) montrant l'armature interne à nervures (16) sous le matériau souple extérieur, et une vue arrière d'une paire de sacoches (10) montées de part et d'autre de la traverse du porte-bagages (78)"},"teaser":{"en":"Filed March 30, 1979 and granted June 9, 1981 to Cannondale's Joseph S. Montgomery, this patent covers a pannier — a bag mounted on a bicycle's rear carrier rack — built from flexible, lightweight bag…","fr":"Déposé le 30 mars 1979 et délivré le 9 juin 1981 à Joseph S. Montgomery de Cannondale, ce brevet couvre une sacoche — un sac se fixant sur le porte-bagages arrière d'un vélo — fabriquée dans un…"},"full":{"en":"Filed March 30, 1979 and granted June 9, 1981 to Cannondale's Joseph S. Montgomery, this patent covers a pannier — a bag mounted on a bicycle's rear carrier rack — built from flexible, lightweight bag material stiffened by an internal frame of interconnected ribs across its back, top and upper sides. The top part of that internal frame is load-bearing, so the pannier's own top surface doubles as a lateral extension of the carrier rack underneath it. Note: the source description this entry was queued from said 'early 1981,' which matches the grant date; the actual filing was March 1979.","fr":"Déposé le 30 mars 1979 et délivré le 9 juin 1981 à Joseph S. Montgomery de Cannondale, ce brevet couvre une sacoche — un sac se fixant sur le porte-bagages arrière d'un vélo — fabriquée dans un matériau de sac souple et léger, rigidifié par une armature interne de nervures interconnectées couvrant le dos, le dessus et les côtés supérieurs. La partie supérieure de cette armature interne est porteuse, si bien que le dessus de la sacoche sert lui-même de prolongement latéral du porte-bagages sur lequel elle repose. Remarque : la description source à partir de laquelle cette fiche a été mise en attente indiquait « début 1981 », ce qui correspond à la date de délivrance ; le dépôt réel date de mars 1979."}},{"num":"5375676","cat":"emtb","title":{"en":"Yamaha pedal-force motor assist (US 5,375,676)","fr":"Assistance motorisée Yamaha asservie à l'effort de pédalage (US 5 375 676)"},"assignee":"Nozomu Takata & Tatsuji Yokoyama / Yamaha Hatsudoki K.K. (Iwata, Japan)","img":"../pictures/US5375676A.png","alt":{"en":"Figure 2 of US 5,375,676: the power-assisted bicycle in side view, with the battery (31) and controller (32) drawn dashed inside the main frame tube, the motor (29) just above the crankshaft (28), the pedal-force sensor (33) at the crank, and a shaft drive to the rear wheel (17) in place of a chain","fr":"Figure 2 du brevet US 5 375 676 : la bicyclette à assistance vue de côté, la batterie (31) et le contrôleur (32) dessinés en pointillés dans le tube principal du cadre, le moteur (29) juste au-dessus de l'axe de pédalier (28), le capteur d'effort de pédalage (33) au pédalier, et une transmission par arbre vers la roue arrière (17) à la place d'une chaîne"},"teaser":{"en":"US 5,375,676, \"Bicycle with electric motor,\" inventors Nozomu Takata and Tatsuji Yokoyama of Iwata, assigned to Yamaha Motor (Yamaha Hatsudoki K.K.): filed March 5, 1993 on Japanese priority from…","fr":"US 5 375 676, « Bicycle with electric motor », inventeurs Nozomu Takata et Tatsuji Yokoyama d'Iwata, cédé à Yamaha Motor (Yamaha Hatsudoki K.K.) : déposé le 5 mars 1993 sur priorité japonaise du 6…"},"full":{"en":"US 5,375,676, \"Bicycle with electric motor,\" inventors Nozomu Takata and Tatsuji Yokoyama of Iwata, assigned to Yamaha Motor (Yamaha Hatsudoki K.K.): filed March 5, 1993 on Japanese priority from March 6, 1992, granted December 27, 1994. A sensor at the crank measures pedal force, and a controller runs a battery-powered motor in proportion to it, adding assist on top of the rider's effort; the motor is also kept turning at road speed when the rider stops pedaling, so assist returns without a lag. Filed the year Yamaha put its PAS power-assist bicycle on sale in Japan. Google Patents lists it as lapsed for unpaid maintenance fees, before the 2011 end of its 17-year term.","fr":"US 5 375 676, « Bicycle with electric motor », inventeurs Nozomu Takata et Tatsuji Yokoyama d'Iwata, cédé à Yamaha Motor (Yamaha Hatsudoki K.K.) : déposé le 5 mars 1993 sur priorité japonaise du 6 mars 1992, délivré le 27 décembre 1994. Un capteur au pédalier mesure l'effort de pédalage, et un contrôleur pilote un moteur alimenté par batterie en proportion de cet effort, ajoutant l'assistance à celle du cycliste ; le moteur continue aussi de tourner à la vitesse du vélo quand le cycliste cesse de pédaler, pour que l'assistance reprenne sans délai. Déposé l'année où Yamaha a mis en vente au Japon sa bicyclette à assistance PAS. Google Patents l'indique comme éteint faute de paiement des annuités, avant la fin de sa durée de 17 ans en 2011."}},{"num":"9643683","cat":"emtb","title":{"en":"Dyname electric propulsion system (US 9,643,683)","fr":"Système de propulsion électrique Dyname (US 9,643,683)"},"assignee":"Propulsion PowerCycle Inc. (now Dyname) — exclusive to Rocky Mountain","img":"../pictures/US9643683B2.1.png","alt":{"en":"Figs. 1A-1C of US 9,643,683: Fig. 1A shows the complete bicycle with the drive unit (60) mounted at the bottom bracket between the chainstays; Fig. 1B is a detail of the same unit from the drive side; Fig. 1C is a schematic of the internal transmission, showing the motor output shaft (12) driving the sprocket (40) through an intermediate shaft (13/14)","fr":"Fig. 1A à 1C du brevet US 9 643 683 : la Fig. 1A montre le vélo complet avec l'unité motrice (60) montée au boîtier de pédalier entre les haubans ; la Fig. 1B est un détail de la même unité vue du côté transmission ; la Fig. 1C est un schéma de la transmission interne, montrant l'arbre de sortie du moteur (12) entraînant le pignon (40) par un arbre intermédiaire (13/14)"},"teaser":{"en":"An e-bike motor and propulsion system, and a method for converting a non-electric bicycle into one — the drive unit branded Dyname, exclusive to Rocky Mountain's Powerplay line since 2017. Filed 2015,…","fr":"Un moteur et système de propulsion pour vélo électrique, ainsi qu'une méthode pour convertir un vélo non électrique en vélo électrique — l'unité motrice, de marque Dyname, exclusive à la gamme…"},"full":{"en":"An e-bike motor and propulsion system, and a method for converting a non-electric bicycle into one — the drive unit branded Dyname, exclusive to Rocky Mountain's Powerplay line since 2017. Filed 2015, granted 2017, with a companion torque-sensor patent (US 10,583,893) filed later. The exclusivity ended in 2024–25 after a change in Rocky Mountain's ownership; Propulsion PowerCycle now supplies other bike brands under the Dyname name.","fr":"Un moteur et système de propulsion pour vélo électrique, ainsi qu'une méthode pour convertir un vélo non électrique en vélo électrique — l'unité motrice, de marque Dyname, exclusive à la gamme Powerplay de Rocky Mountain depuis 2017. Déposé en 2015, délivré en 2017, avec un brevet compagnon de capteur de couple (US 10,583,893) déposé plus tard. L'exclusivité a pris fin en 2024-25 après un changement d'actionnariat chez Rocky Mountain ; Propulsion PowerCycle fournit désormais d'autres marques de vélos sous le nom Dyname."}},{"num":"11807338","cat":"emtb","title":{"en":"Drive unit and battery holding device for a human-powered vehicle (US 11,807,338)","fr":"Unité motrice et dispositif de maintien de batterie pour véhicule à propulsion humaine (US 11 807 338)"},"assignee":"Tsuyoshi Kameda, Shinichiro Noda, Kento Mitsuyasu & Toshio Tetsuka / Shimano Inc.","img":"../pictures/US11807338B2.png","alt":{"en":"Fig. 1 of US 11,807,338 B2: a complete road-bike side view, with the drive unit (12/12B) at the bottom bracket driving the crank and chain, and the battery pack (30) mounted along the top tube (16B) in its removable holder (32)","fr":"Fig. 1 du brevet US 11 807 338 B2 : une vue latérale complète d'un vélo de route, avec l'unité motrice (12/12B) au niveau du boîtier de pédalier entraînant la manivelle et la chaîne, et la batterie (30) montée le long du tube supérieur (16B) dans son support amovible (32)"},"teaser":{"en":"A drive-unit-and-battery-holder system smaller than Shimano's EP8/EP801/EP600 mid-motors: a holder mount on the drive unit's own base lets the battery holder attach at multiple positions along a…","fr":"Un système d'unité motrice et de support de batterie plus compact que les moteurs pédalier EP8/EP801/EP600 de Shimano : une fixation de support sur la base même de l'unité motrice permet au support de…"},"full":{"en":"A drive-unit-and-battery-holder system smaller than Shimano's EP8/EP801/EP600 mid-motors: a holder mount on the drive unit's own base lets the battery holder attach at multiple positions along a linear track, so one drive unit accommodates different frame and battery layouts. Filed January 23, 2020 and granted November 7, 2023 as US 11,807,338, credited to Tsuyoshi Kameda, Shinichiro Noda, Kento Mitsuyasu and Toshio Tetsuka — cross-confirmed across Google Patents and its own pre-grant publication (US 2020/0247502 A1). The granted PDF itself is an unindexed image scan with no extractable text layer, so this pass could not do the direct primary-source front-page read most entries in this update got; press coverage frames the motor as aimed at lightweight road/gravel e-bikes rather than MTB specifically.","fr":"Un système d'unité motrice et de support de batterie plus compact que les moteurs pédalier EP8/EP801/EP600 de Shimano : une fixation de support sur la base même de l'unité motrice permet au support de batterie de s'attacher à plusieurs positions le long d'un rail linéaire, si bien qu'une même unité motrice s'adapte à différentes configurations de cadre et de batterie. Déposé le 23 janvier 2020 et délivré le 7 novembre 2023 sous le numéro US 11 807 338, crédité à Tsuyoshi Kameda, Shinichiro Noda, Kento Mitsuyasu et Toshio Tetsuka — recoupé entre Google Patents et sa propre publication avant délivrance (US 2020/0247502 A1). Le PDF délivré lui-même est une numérisation image sans couche de texte extractible, si bien que cette session n'a pas pu effectuer la lecture directe en source primaire de la première page appliquée à la plupart des fiches de cette mise à jour ; la presse spécialisée présente ce moteur comme destiné aux vélos électriques de route/gravel légers plutôt qu'au VTT en particulier."}},{"num":"9302734","cat":"emtb","title":{"en":"Drive device for an electric bicycle (US 9,302,734)","fr":"Dispositif d'entraînement pour bicyclette électrique (US 9 302 734)"},"assignee":"Udo Getta, Ullrich Noack & Karl-Heinz Fleischmann / Brose Fahrzeugteile GmbH & Co. KG","img":"../pictures/US9302734B2.png","alt":{"en":"FIG 1/FIG 2 of US 9,302,734: exploded and cutaway isometric views of the drive housing (70), showing the hollow shaft and chainring mount (21/30/62), the coaxial pedal-crank gearing, and the motor's traction-drive gears (10/82) coupling into the same housing","fr":"FIG 1/FIG 2 du brevet US 9 302 734 : vues isométriques éclatée et en coupe du boîtier d'entraînement (70), montrant l'arbre creux et le support de plateau (21/30/62), l'engrenage coaxial du pédalier, et les pignons d'entraînement du moteur (10/82) se couplant dans le même boîtier"},"teaser":{"en":"Filed under the PCT on April 15, 2013 (claiming a German priority from April 17, 2012) and granted April 5, 2016, this Brose Fahrzeugteile patent covers a mid-drive housing where a hollow shaft…","fr":"Déposé sous le régime du PCT le 15 avril 2013 (revendiquant une priorité allemande du 17 avril 2012) et délivré le 5 avril 2016, ce brevet de Brose Fahrzeugteile couvre un boîtier de moteur central où…"},"full":{"en":"Filed under the PCT on April 15, 2013 (claiming a German priority from April 17, 2012) and granted April 5, 2016, this Brose Fahrzeugteile patent covers a mid-drive housing where a hollow shaft carrying the chainring surrounds a coaxial pedal-crank shaft, with the electric motor's output coupled to that hollow shaft through a belt or chain traction drive rather than a fixed gear train. Brose supplies the mid-drive units used across Specialized's Turbo Levo line and other e-MTBs under licensing and supply agreements rather than building its own bike brand.","fr":"Déposé sous le régime du PCT le 15 avril 2013 (revendiquant une priorité allemande du 17 avril 2012) et délivré le 5 avril 2016, ce brevet de Brose Fahrzeugteile couvre un boîtier de moteur central où un arbre creux portant le plateau entoure un axe de pédalier coaxial, la sortie du moteur électrique étant couplée à cet arbre creux par une courroie ou une chaîne plutôt que par un train d'engrenages fixe. Brose fournit les moteurs centraux utilisés sur la gamme Turbo Levo de Specialized et d'autres VTTAE dans le cadre d'accords de licence et de fourniture, plutôt qu'en construisant sa propre marque de vélos."}},{"num":"11345437","cat":"emtb","title":{"en":"Battery mount with resilient isolation pad (US 11,345,437)","fr":"Support de batterie à coussinet d'isolation résilient (US 11 345 437)"},"assignee":"Jan Talavasek, Marco Werner Sonderegger, Jonas Reiter / Specialized Bicycle Components","img":"../pictures/US11345437B2.png","alt":{"en":"Fig. 2 of US 11,345,437: an exploded isometric of the down tube and battery, calling out the resilient pad (50) sandwiched between the battery housing (46) and the frame's inner mounting rail (62)","fr":"Fig. 2 du brevet US 11 345 437 : une vue isométrique éclatée du tube diagonal et de la batterie, repérant le coussinet résilient (50) intercalé entre le boîtier de batterie (46) et le rail de fixation interne du cadre (62)"},"teaser":{"en":"A down-tube-integrated e-bike battery held to the frame by a fastener through the battery mount, with a resilient pad compressed between the frame and the battery housing at the mount point. Filed…","fr":"Une batterie de vélo électrique intégrée au tube diagonal, fixée au cadre par une fixation traversant le support de batterie, avec un coussinet résilient comprimé entre le cadre et le boîtier de…"},"full":{"en":"A down-tube-integrated e-bike battery held to the frame by a fastener through the battery mount, with a resilient pad compressed between the frame and the battery housing at the mount point. Filed June 21, 2019; granted May 31, 2022.","fr":"Une batterie de vélo électrique intégrée au tube diagonal, fixée au cadre par une fixation traversant le support de batterie, avec un coussinet résilient comprimé entre le cadre et le boîtier de batterie au point de fixation. Déposé le 21 juin 2019 ; délivré le 31 mai 2022."}},{"num":"EP3163122","cat":"emtb","title":{"en":"TQ HPR harmonic pin-ring motor (EP 3,163,122)","fr":"Moteur à couronne à broches harmonique TQ HPR (EP 3 163 122)"},"assignee":"Antonius Georg Rossberger / TQ Systems GmbH","img":"../pictures/EP3163122A1.png","alt":{"en":"Fig. 1 of EP 3,163,122: an exploded isometric view of the harmonic pin-ring drive (10) — the outer ring's internal teeth (5/9/6/3/6'), the pin ring itself (1) with its dense circumferential teeth, an inner output ring (2/4), and bearing/seal components (7/7', 8/8') — each concentric layer pulled apart to show how the stack nests together","fr":"Fig. 1 du brevet EP 3 163 122 : une vue éclatée en perspective de l'entraînement à couronne à broches harmonique (10) — la denture intérieure de la couronne extérieure (5/9/6/3/6'), la couronne à broches elle-même (1) avec sa denture circonférentielle dense, une couronne de sortie intérieure (2/4), et des composants d'étanchéité et de roulement (7/7', 8/8') — chaque couche concentrique séparée pour montrer l'imbrication de l'ensemble"},"teaser":{"en":"EP 3,163,122, \"Pin ring for a harmonic pin-ring drive,\" filed October 17, 2013 and published May 3, 2017, still pending before the EPO. It claims a deformable pin-ring squeezed between concentric…","fr":"EP 3 163 122, « Pin ring for a harmonic pin ring drive » (couronne à broches pour un entraînement à couronne à broches harmonique), déposé le 17 octobre 2013 et publié le 3 mai 2017, toujours en…"},"full":{"en":"EP 3,163,122, \"Pin ring for a harmonic pin-ring drive,\" filed October 17, 2013 and published May 3, 2017, still pending before the EPO. It claims a deformable pin-ring squeezed between concentric inner and outer gears so many teeth carry load at once, replacing the multi-stage gear train conventional e-bike motors use for reduction; the drawings show two embodiments, a full assembly (Fig. 1) and a variant with a bolted output flange (Fig. 14). The mechanism sits in a wider TQ filing family that includes a granted U.S. patent, 10,371,240 (2019), for the same gearing.","fr":"EP 3 163 122, « Pin ring for a harmonic pin ring drive » (couronne à broches pour un entraînement à couronne à broches harmonique), déposé le 17 octobre 2013 et publié le 3 mai 2017, toujours en instance devant l'OEB. Il revendique une couronne à broches déformable comprimée entre des engrenages intérieur et extérieur concentriques, de sorte que de nombreuses dents transmettent la charge simultanément, remplaçant le train d'engrenages à plusieurs étages des moteurs de vélo électrique classiques ; les dessins montrent deux modes de réalisation, un ensemble complet (Fig. 1) et une variante à bride de sortie boulonnée (Fig. 14). Ce mécanisme s'inscrit dans une famille de dépôts TQ plus large, qui comprend un brevet américain délivré, le 10 371 240 (2019), pour le même engrenage."}},{"num":"9777774","cat":"emtb","title":{"en":"Fazua Ride removable drive (US 9,777,774)","fr":"Moteur amovible Fazua Ride (US 9 777 774)"},"assignee":"Johannes Biechele / Fazua GmbH → Porsche eBike Performance GmbH","img":"../pictures/US9777774B2.png","alt":{"en":"Fig. 2 of US 9,777,774: the auxiliary motor (5) mounted parallel to the down tube (1), showing the motor's stator/rotor (11), its housing collars (9), and the down-tube battery/control section (3/7/13/15/17) it connects to","fr":"Fig. 2 du brevet US 9 777 774 : le moteur auxiliaire (5) monté parallèlement au tube diagonal (1), montrant le stator/rotor du moteur (11), ses colliers de logement (9), et la section batterie/commande du tube diagonal (3/7/13/15/17) à laquelle il se connecte"},"teaser":{"en":"US 9,777,774, \"Bicycle frame, battery pack, and bicycle\" (Johannes Biechele, filed July 13, 2012, granted October 3, 2017, adjusted expiration 2033), covers mounting an auxiliary motor parallel to the…","fr":"US 9 777 774, « Bicycle frame, battery pack, and bicycle » (cadre de vélo, bloc-batterie et vélo), déposé par Johannes Biechele le 13 juillet 2012, délivré le 3 octobre 2017, expiration ajustée en…"},"full":{"en":"US 9,777,774, \"Bicycle frame, battery pack, and bicycle\" (Johannes Biechele, filed July 13, 2012, granted October 3, 2017, adjusted expiration 2033), covers mounting an auxiliary motor parallel to the down tube to drive the pedal crank — the mechanical basis of the Ride system's frame-integrated, removable drive unit. A second, later application, US 2023/0415847, \"Drive Device for an Electric Bicycle and Electric Bicycle\" (same inventor, filed October 4, 2021), covers a strain-wave (harmonic) gear stage coaxial with the crank axis — still pending as of this record, though a closely related continuation in the same family (US 12,649,541) has since granted.","fr":"US 9 777 774, « Bicycle frame, battery pack, and bicycle » (cadre de vélo, bloc-batterie et vélo), déposé par Johannes Biechele le 13 juillet 2012, délivré le 3 octobre 2017, expiration ajustée en 2033, couvre le montage d'un moteur auxiliaire parallèle au tube diagonal pour entraîner le pédalier — la base mécanique de l'unité motrice amovible et intégrée au cadre du système Ride. Une demande ultérieure, US 2023/0415847, « Drive Device for an Electric Bicycle and Electric Bicycle » (dispositif d'entraînement pour vélo électrique et vélo électrique), du même inventeur, déposée le 4 octobre 2021, couvre un étage d'engrenage à onde de déformation (harmonique) coaxial à l'axe du pédalier — toujours en instance à la date de cette fiche, bien qu'une continuation étroitement liée de la même famille (US 12 649 541) ait depuis été délivrée."}},{"num":"EP2546134","cat":"emtb","title":{"en":"myStromer / Fairly Bike frame-integrated motor hub (EP 2,546,134)","fr":"Moteur-moyeu intégré au cadre de myStromer / Fairly Bike (EP 2 546 134)"},"assignee":"myStromer AG (Switzerland) & Fairly Bike Manufacturing Co. (Taiwan)","img":"../pictures/EP2546134B1.png","alt":{"en":"Fig. 2 of EP 2,546,134: an exploded view of the hub motor's stack along the axle (21) — dropout mounts (1,11 / 1,12), stator (22/220), rotor housing (23/24), end cap (25), cassette body (4) and crank/pedal assembly (3) — showing the motor built into the hub rather than bolted on separately","fr":"Fig. 2 du brevet EP 2 546 134 : une vue éclatée de l'empilement du moteur-moyeu le long de l'axe (21) — fixations de patte (1,11 / 1,12), stator (22/220), boîtier de rotor (23/24), capuchon d'extrémité (25), corps de cassette (4) et ensemble pédalier (3) — montrant le moteur intégré au moyeu plutôt que boulonné séparément"},"teaser":{"en":"A jointly held European patent — EP 2,546,134 B1, \"Combination structure of a bicycle frame and a motor hub\" — filed October 11, 2011 and granted March 25, 2015 by myStromer (the Swiss speed-pedelec…","fr":"Un brevet européen détenu conjointement — EP 2 546 134 B1, « Structure combinée d'un cadre de bicyclette et d'un moteur-moyeu » — déposé le 11 octobre 2011 et délivré le 25 mars 2015 par myStromer (le…"},"full":{"en":"A jointly held European patent — EP 2,546,134 B1, \"Combination structure of a bicycle frame and a motor hub\" — filed October 11, 2011 and granted March 25, 2015 by myStromer (the Swiss speed-pedelec maker) together with Taiwan's Fairly Bike Manufacturing. It covers building the drive motor directly into the frame/hub junction rather than as a bolt-on mid-drive unit, the structural approach behind myStromer's own ST-series e-bikes.","fr":"Un brevet européen détenu conjointement — EP 2 546 134 B1, « Structure combinée d'un cadre de bicyclette et d'un moteur-moyeu » — déposé le 11 octobre 2011 et délivré le 25 mars 2015 par myStromer (le fabricant suisse de vélos à assistance électrique rapide) avec la société taïwanaise Fairly Bike Manufacturing. Il couvre l'intégration du moteur d'entraînement directement à la jonction cadre/moyeu plutôt que sous forme d'unité pédalier boulonnée — l'approche structurelle derrière les propres vélos électriques de la série ST de myStromer."}},{"num":"CN115697829","cat":"emtb","title":{"en":"Rear suspension sag/travel sensor (CN 115697829)","fr":"Capteur de débattement/affaissement de suspension arrière (CN 115697829)"},"assignee":"Manuel Martínez Guillén et al. (Alicante, Spain)","img":"../pictures/CN115697829A.png","alt":{"en":"CN115697829A patent drawing showing the magnetic rotary position sensor mounted on a suspension linkage pivot","fr":"Dessin du brevet CN115697829A montrant le capteur de position rotatif magnétique monté sur un pivot de biellette de suspension"},"teaser":{"en":"A magnetic rotary position sensor built to solve a specific measurement problem: a rear axle doesn't travel in a straight line or simple arc on most modern suspension designs, so measuring shock-shaft…","fr":"Un capteur de position rotatif magnétique conçu pour résoudre un problème de mesure spécifique : un axe arrière ne se déplace pas en ligne droite ni selon un arc simple sur la plupart des suspensions…"},"full":{"en":"A magnetic rotary position sensor built to solve a specific measurement problem: a rear axle doesn't travel in a straight line or simple arc on most modern suspension designs, so measuring shock-shaft travel alone gives an unreliable read on actual wheel travel and sag. This device mounts a radially-magnetized magnet on a suspension pivot and reads its rotation with an array of Hall-effect sensors on the linkage itself, converting angular displacement directly into wheel-path distance — accurate to under 0.3mm in the patent's own bench testing, against much coarser estimates from shock-stroke alone. Explicitly designed to retrofit across single-pivot, multi-pivot and short-link four-bar platforms, with the patent's background section naming the specific systems it targets: Horst Link, FSR, Mondraker's Zero, Santa Cruz VPP, Spot's Living Link, DW-link, Giant's Maestro, Yeti's switch-link, and Trek's full floater. Filed from Spain (EP priority, July 2020) with a since-granted family spanning the US, China, and pending in Canada and Australia.","fr":"Un capteur de position rotatif magnétique conçu pour résoudre un problème de mesure spécifique : un axe arrière ne se déplace pas en ligne droite ni selon un arc simple sur la plupart des suspensions modernes, si bien que mesurer uniquement le débattement de la tige d'amortisseur donne une lecture peu fiable du débattement réel de la roue et de l'affaissement. Ce dispositif monte un aimant à aimantation radiale sur un pivot de suspension et lit sa rotation avec un ensemble de capteurs à effet Hall sur la biellette elle-même, convertissant le déplacement angulaire directement en distance de trajectoire de roue — précis à moins de 0,3 mm dans les essais sur banc du brevet lui-même, contre des estimations bien plus grossières à partir de la seule course de l'amortisseur. Explicitement conçu pour s'adapter aux plateformes à pivot simple, multi-pivot et quatre-barres à biellette courte, la section de contexte du brevet nommant les systèmes spécifiques qu'il vise : Horst Link, FSR, Zero de Mondraker, VPP de Santa Cruz, Living Link de Spot, DW-link, Maestro de Giant, switch-link de Yeti, et full floater de Trek. Déposé depuis l'Espagne (priorité EP, juillet 2020) avec une famille depuis délivrée couvrant les États-Unis, la Chine, et en instance au Canada et en Australie."}},{"num":"DE102022204483A1","cat":"emtb","title":{"en":"Assist-mode selection control system (DE 10 2022 204 483 A1)","fr":"Système de contrôle de sélection du mode d'assistance (DE 10 2022 204 483 A1)"},"assignee":"Bosch","img":"../pictures/DE102022204483A1.png","alt":{"en":"Fig. 1 of DE 10 2022 204 483 A1: the bicycle (1, wheel 2) carrying a handlebar-mounted operating unit (4) with a wireless module (7a) and a frame-mounted drive/control unit (3, 11), communicating wirelessly with both a smartphone (5, app display 7b) and a remote server (10) inside a cloud (9)","fr":"Fig. 1 du brevet DE 10 2022 204 483 A1 : le vélo (1, roue 2) portant une unité de commande montée au guidon (4) avec un module sans fil (7a) et une unité motrice/de commande montée sur le cadre (3, 11), communiquant sans fil à la fois avec un smartphone (5, affichage d'application 7b) et un serveur distant (10) dans un nuage (9)"},"teaser":{"en":"DE 10 2022 204 483 A1, \"Control system for an electric bicycle,\" filed by Robert Bosch GmbH on May 6, 2022 and published March 2, 2023 — still pending, not yet granted. Covers an operating unit with a…","fr":"DE 10 2022 204 483 A1, « Système de commande pour un vélo électrique », déposé par Robert Bosch GmbH le 6 mai 2022 et publié le 2 mars 2023 — toujours en instance, pas encore délivré. Couvre une unité…"},"full":{"en":"DE 10 2022 204 483 A1, \"Control system for an electric bicycle,\" filed by Robert Bosch GmbH on May 6, 2022 and published March 2, 2023 — still pending, not yet granted. Covers an operating unit with a user interface that lets a rider choose among several support modes, then drives the bicycle's motor controller according to whichever mode is selected. Credited to a team of Bosch engineers in Germany. Carries an international family: a PCT filing (PCT/EP2022/071942) with national/regional-phase entries in Europe, Japan and the US.","fr":"DE 10 2022 204 483 A1, « Système de commande pour un vélo électrique », déposé par Robert Bosch GmbH le 6 mai 2022 et publié le 2 mars 2023 — toujours en instance, pas encore délivré. Couvre une unité de commande dotée d'une interface utilisateur permettant au cycliste de choisir parmi plusieurs modes d'assistance, l'unité pilotant ensuite le contrôleur du moteur du vélo selon le mode sélectionné. Crédité à une équipe d'ingénieurs Bosch en Allemagne. Comporte une famille internationale : un dépôt PCT (PCT/EP2022/071942) avec des entrées en phase nationale/régionale en Europe, au Japon et aux États-Unis."}},{"num":"2151533","cat":"frame","title":{"en":"Schwinn cantilever frame (US 2,151,533)","fr":"Cadre cantilever Schwinn (US 2,151,533)"},"assignee":"Frank W. Schwinn / Arnold, Schwinn & Co.","img":"../pictures/US2151533A.png","alt":{"en":"Sheet 1 of US 2,151,533, showing Fig. 1 (the complete cantilever frame with the curved strut 15 running from the seat cluster to the rear axle area) and Fig. 2 (a detail of the seat-cluster/strut junction), signed by inventor Frank W. Schwinn","fr":"Planche 1 du brevet US 2 151 533, montrant la Fig. 1 (le cadre cantilever complet avec l'étrésillon courbe 15 allant du groupe de selle jusqu'à la zone de l'axe arrière) et la Fig. 2 (un détail de la jonction groupe de selle/étrésillon), signée par l'inventeur Frank W. Schwinn"},"teaser":{"en":"A frame construction adding a curved strut from the seat cluster down to the rear axle area, first used on the 1938 Autocycle line and later the Black Phantom and Sting-Ray. Filed the same day as the…","fr":"Une construction de cadre ajoutant un étrésillon courbe du groupe de selle jusqu'à la zone de l'axe arrière, utilisée d'abord sur la gamme Autocycle de 1938 puis sur le Black Phantom et le Sting-Ray.…"},"full":{"en":"A frame construction adding a curved strut from the seat cluster down to the rear axle area, first used on the 1938 Autocycle line and later the Black Phantom and Sting-Ray. Filed the same day as the Spring Fork patent below (March 3, 1938). Pre-1995 US utility patents ran 17 years from grant rather than 20 years from filing, so this one lapsed in 1956.","fr":"Une construction de cadre ajoutant un étrésillon courbe du groupe de selle jusqu'à la zone de l'axe arrière, utilisée d'abord sur la gamme Autocycle de 1938 puis sur le Black Phantom et le Sting-Ray. Déposé le même jour que le brevet de fourche à ressort ci-dessous (3 mars 1938). Les brevets d'utilité américains d'avant 1995 duraient 17 ans à compter de la délivrance plutôt que 20 ans à compter du dépôt, celui-ci s'est donc éteint en 1956."}},{"num":null,"cat":"frame","title":{"en":"JBX1 \"Breezer 1\" — the frame, not a patent","fr":"JBX1 « Breezer 1 » — le cadre, pas un brevet"},"assignee":"Joe Breeze (Fairfax, CA)","img":"../pictures/jpx1.jpg","alt":{"en":"Labelled line illustration of Joe Breeze's 1977 JBX1 mountain bike, side view, with callouts for the Brooks B-72 saddle, motorcycle-derived riser bars, Dia-Compe 960 brakes, SunTour derailleurs, Araya 26in steel rims and Phil Wood low-flange hubs","fr":"Illustration au trait légendée du VTT JBX1 de Joe Breeze de 1977, vue de côté, avec des légendes pour la selle Brooks B-72, le guidon relevé d'origine moto, les freins Dia-Compe 960, les dérailleurs SunTour, les jantes acier Araya 26 po et les moyeux Phil Wood à flasque bas"},"teaser":{"en":"Hand-built by Joe Breeze in 1977, the JBX1 — later called the \"Breezer 1\" — was the first bicycle frame purpose-designed for off-road riding rather than a converted cruiser or road frame. Built for…","fr":"Fabriqué à la main par Joe Breeze en 1977, le JBX1 — appelé plus tard « Breezer 1 » — fut le premier cadre de vélo conçu spécifiquement pour la pratique hors route plutôt qu'un cadre de cruiser ou de…"},"full":{"en":"Hand-built by Joe Breeze in 1977, the JBX1 — later called the \"Breezer 1\" — was the first bicycle frame purpose-designed for off-road riding rather than a converted cruiser or road frame. Built for the Repack downhill races on Mount Tamalpais, it replaced the balloon-tire \"klunkers\" mountain bike racers had been adapting from 1930s-40s cruisers, using period components (Araya 26in steel rims, Phil Wood hubs, SunTour derailleurs, Dia-Compe brakes, motorcycle-derived riser bars and Magura levers). Breeze completed nine more Series I frames by early 1978. No patent was ever filed on the frame itself; Breezer #1 is held in the Smithsonian Institution's National Museum of American History.","fr":"Fabriqué à la main par Joe Breeze en 1977, le JBX1 — appelé plus tard « Breezer 1 » — fut le premier cadre de vélo conçu spécifiquement pour la pratique hors route plutôt qu'un cadre de cruiser ou de route converti. Construit pour les courses de descente Repack sur le mont Tamalpais, il a remplacé les « klunkers » à pneus ballon que les coureurs de vélo tout-terrain adaptaient jusque-là à partir de cruisers des années 1930-40, avec des composants d'époque (jantes acier Araya 26 po, moyeux Phil Wood, dérailleurs SunTour, freins Dia-Compe, guidon relevé et leviers Magura d'origine moto). Breeze a réalisé neuf autres cadres de la Série I au début de 1978. Aucun brevet n'a jamais été déposé sur le cadre lui-même ; le Breezer n°1 est conservé au National Museum of American History de la Smithsonian Institution."}},{"num":"4669747","cat":"frame","title":{"en":"Slingshot cable-and-hinge frame (US 4,669,747)","fr":"Cadre à câble et charnière Slingshot (US 4 669 747)"},"assignee":"Mark L. Groendal, later commercialized as Slingshot","img":"../pictures/US4669747A.png","alt":{"en":"Figs. 1 and 2 of US 4,669,747: full side views of the bicycle with the front frame portion (12/14/16/18) hinged near the head tube and joined to the rear frame portion by the fiberglass spring plate (15/42) and a steel cable (90) running to the crank housing, tensioned by compression springs","fr":"Fig. 1 et 2 du brevet US 4 669 747 : vues de côté complètes du vélo montrant la partie avant du cadre (12/14/16/18) articulée près du tube de direction et reliée à la partie arrière par la plaque-ressort en fibre de verre (15/42) et un câble d'acier (90) allant jusqu'au boîtier de pédalier, tendu par des ressorts de compression"},"teaser":{"en":"US 4,669,747, \"Flexible bicycle,\" filed May 22, 1981 and granted June 2, 1987 to Mark L. Groendal of Wyoming, Michigan — the patent's own front page lists no separate corporate assignee, so Groendal…","fr":"US 4 669 747, « Flexible bicycle », déposé le 22 mai 1981 et délivré le 2 juin 1987 à Mark L. Groendal, de Wyoming (Michigan) — la première page du brevet ne mentionne aucune société cessionnaire…"},"full":{"en":"US 4,669,747, \"Flexible bicycle,\" filed May 22, 1981 and granted June 2, 1987 to Mark L. Groendal of Wyoming, Michigan — the patent's own front page lists no separate corporate assignee, so Groendal held it personally; the design was later sold as the Slingshot. A removable fiberglass spring plate joins the front and rear frame sections at their upper end, and a steel cable — run from the front frame down to the crank housing and held in tension by compression springs — takes the place of a solid down tube. Flexing the plate and tensioning the cable let the whole front triangle hinge under impact instead of transmitting it rigidly; swapping in a stiffer or softer plate retunes the flex for rider weight. Pre-GATT filing: the term ran 17 years from grant, to 2004.","fr":"US 4 669 747, « Flexible bicycle », déposé le 22 mai 1981 et délivré le 2 juin 1987 à Mark L. Groendal, de Wyoming (Michigan) — la première page du brevet ne mentionne aucune société cessionnaire distincte, Groendal le détenait donc personnellement ; la conception a ensuite été commercialisée sous le nom Slingshot. Une plaque-ressort amovible en fibre de verre relie les parties avant et arrière du cadre à leur extrémité supérieure, et un câble d'acier — courant de la partie avant jusqu'au boîtier de pédalier et maintenu en tension par des ressorts de compression — remplace un tube diagonal rigide. La flexion de la plaque et la tension du câble permettent à tout le triangle avant de s'articuler sous l'impact plutôt que de le transmettre rigidement ; changer de plaque, plus ferme ou plus souple, permet d'ajuster la flexibilité au poids du cycliste. Dépôt antérieur au GATT : la durée courait 17 ans à compter de la délivrance, jusqu'en 2004."}},{"num":"4513985","cat":"frame","title":{"en":"Cannondale Optimum Oval Seatstays (US 4,513,985)","fr":"Haubans ovales optimisés Cannondale (US 4 513 985)"},"assignee":"David R. Graham / Cannondale Corporation","img":"../pictures/US4513985A.png","alt":{"en":"Fig. 1 and Fig. 2 of US 4,513,985: the oval-cross-section seat stays (14) shown at the seat cluster junction and again near the dropout, with the horizontal diameter (Dh) and vertical diameter (Dv) of the oval called out","fr":"Fig. 1 et Fig. 2 du brevet US 4 513 985 : les haubans à section ovale (14) représentés à la jonction du point d'ancrage de la selle puis près de la patte de cadre, avec le diamètre horizontal (Dh) et le diamètre vertical (Dv) de l'ovale indiqués"},"teaser":{"en":"Filed January 6, 1983 and granted April 30, 1985 to Cannondale engineer David R. Graham, this patent claims bicycle seat stays that are oval in cross-section and oriented with the major axis…","fr":"Déposé le 6 janvier 1983 et délivré le 30 avril 1985 à David R. Graham, ingénieur chez Cannondale, ce brevet revendique des haubans de vélo de section ovale, orientés avec le grand axe à l'horizontale…"},"full":{"en":"Filed January 6, 1983 and granted April 30, 1985 to Cannondale engineer David R. Graham, this patent claims bicycle seat stays that are oval in cross-section and oriented with the major axis horizontal — a shape that gives relatively greater lateral (side-to-side) stiffness and relatively less vertical (up-down) stiffness than a round tube of the same weight. Figures 1 and 2 show the oval profile carried from the seat cluster down to the dropouts, with horizontal (Dh) and vertical (Dv) diameters called out as separate claim dimensions. Pre-GATT filing, so the 17-year-from-grant term (not filing+20) applies; it lapsed in 2002.","fr":"Déposé le 6 janvier 1983 et délivré le 30 avril 1985 à David R. Graham, ingénieur chez Cannondale, ce brevet revendique des haubans de vélo de section ovale, orientés avec le grand axe à l'horizontale — une forme qui procure une rigidité latérale (côté à côté) relativement plus grande et une rigidité verticale (haut-bas) relativement moindre qu'un tube rond de même poids. Les figures 1 et 2 montrent le profil ovale conservé du point d'ancrage de la selle jusqu'aux pattes de cadre, avec des diamètres horizontal (Dh) et vertical (Dv) définis comme dimensions distinctes de la revendication. Dépôt antérieur au GATT, donc la durée de 17 ans à compter de la délivrance (et non dépôt+20) s'applique ; il s'est éteint en 2002."}},{"num":"6076845","cat":"susp","title":{"en":"Flexible chain-stay rear suspension (US 6,076,845)","fr":"Suspension arrière à hauban flexible (US 6 076 845)"},"assignee":"Merton R. \"Mert\" Lawwill & Mark L. Schroeder / Schwinn Cycling & Fitness Inc.","img":"../pictures/US6076845A.png","alt":{"en":"Fig. 1 of US 6,076,845: a complete bicycle side view showing the vertically flexible chain-stay assembly (40) running from the seat-tube area back to the rear dropout, with a separate damping member (54/56) mounted above it — no pivot is visible at the chain stay itself","fr":"Fig. 1 du brevet US 6 076 845 : une vue latérale complète d'un vélo montrant l'ensemble hauban à flexion verticale (40) courant de la zone du tube de selle jusqu'à la patte arrière, avec un organe d'amortissement séparé (54/56) monté au-dessus — aucun pivot n'est visible au niveau du hauban lui-même"},"teaser":{"en":"A rear suspension with no pivot or linkage at all: the chain stay itself is engineered to flex vertically under load and spring back, doing the job a shock and pivot normally share. Filed September…","fr":"Une suspension arrière sans aucun pivot ni biellette : le hauban lui-même est conçu pour fléchir verticalement sous charge et revenir, assurant le rôle normalement partagé par un amortisseur et un…"},"full":{"en":"A rear suspension with no pivot or linkage at all: the chain stay itself is engineered to flex vertically under load and spring back, doing the job a shock and pivot normally share. Filed September 24, 1998 by Mert Lawwill and Mark L. Schroeder and granted June 20, 2000 as US 6,076,845, assigned to Schwinn Cycling & Fitness Inc. — cross-confirmed via Google Patents.","fr":"Une suspension arrière sans aucun pivot ni biellette : le hauban lui-même est conçu pour fléchir verticalement sous charge et revenir, assurant le rôle normalement partagé par un amortisseur et un pivot. Déposé le 24 septembre 1998 par Mert Lawwill et Mark L. Schroeder, et délivré le 20 juin 2000 sous le numéro US 6 076 845, cédé à Schwinn Cycling & Fitness Inc. — recoupé via Google Patents."}},{"num":"4500103","cat":"frame","title":{"en":"Klein oversized-aluminum frame + Klein v. Cannondale (US 4,500,103)","fr":"Cadre Klein en aluminium surdimensionné + Klein c. Cannondale (US 4 500 103)"},"assignee":"Gary G. Klein (Chehalis, WA)","img":"../pictures/US4500103A.png","alt":{"en":"Fig. 3 of US 4,500,103: the torsional-stiffness test the claims are written around — the frame lies on a table (16) with its head tube (1) clamped between blocks, a bar (13) fixed in the bottom bracket (5) carries a weight (15), and a dial gauge (14) reads how far the frame twists","fr":"Fig. 3 du brevet US 4 500 103 : l'essai de rigidité en torsion sur lequel reposent les revendications — le cadre est posé sur une table (16), la douille de direction (1) serrée entre des blocs, une barre (13) fixée dans le boîtier de pédalier (5) porte un poids (15) et un comparateur (14) mesure la torsion du cadre"},"teaser":{"en":"US 4,500,103, \"High efficiency bicycle frame,\" Gary G. Klein of Chehalis, Washington: filed November 7, 1977 as a continuation of a February 17, 1976 application, granted February 19, 1985. It…","fr":"US 4 500 103, « High efficiency bicycle frame », Gary G. Klein de Chehalis (Washington) : déposé le 7 novembre 1977 en continuation d'une demande du 17 février 1976, délivré le 19 février 1985. Il…"},"full":{"en":"US 4,500,103, \"High efficiency bicycle frame,\" Gary G. Klein of Chehalis, Washington: filed November 7, 1977 as a continuation of a February 17, 1976 application, granted February 19, 1985. It discloses a racing frame of large-diameter, thin-wall aluminum tubing, with claims written around measured stiffness — a torsional rigidity of at least 67 lbf·ft per degree and a lateral bending rigidity of at least 120 lbf per inch, measured on the test rigs drawn in Figs. 3 and 4. Klein sued Cannondale for infringement in 1985. In 1989 the Federal Circuit upheld the invalidation of claims 1 and 7, because William B. Shook had built and openly raced a very similar aluminum frame in the early 1970s, and vacated the ruling on claim 2. Pre-1995 filing: the term ran 17 years from grant, to 2002.","fr":"US 4 500 103, « High efficiency bicycle frame », Gary G. Klein de Chehalis (Washington) : déposé le 7 novembre 1977 en continuation d'une demande du 17 février 1976, délivré le 19 février 1985. Il décrit un cadre de course en tubes d'aluminium de grand diamètre à paroi mince, avec des revendications fondées sur une rigidité mesurée — une rigidité en torsion d'au moins 67 lbf·ft par degré et une rigidité en flexion latérale d'au moins 120 lbf par pouce, mesurées sur les bancs d'essai dessinés aux Fig. 3 et 4. Klein a poursuivi Cannondale pour contrefaçon en 1985. En 1989, la Cour d'appel du circuit fédéral a confirmé l'invalidation des revendications 1 et 7, William B. Shook ayant construit et utilisé ouvertement en course un cadre en aluminium très semblable au début des années 1970, et a annulé la décision concernant la revendication 2. Dépôt antérieur à 1995 : la durée courait 17 ans à compter de la délivrance, jusqu'en 2002."}},{"num":"4934724","cat":"frame","title":{"en":"Softride beam seat support (US 4,934,724)","fr":"Support de selle à poutre Softride (US 4 934 724)"},"assignee":"James D. Allsop & David E. Calapp / Allsop, Inc., later sold as Softride","img":"../pictures/US4934724A.png","alt":{"en":"Figs. 1 and 2 of US 4,934,724: a bicycle with the cantilevered beam (10/18/20) replacing the seat tube and seat stays, and a cutaway of the beam itself showing the load-bearing members (30/40/54) spaced apart with the elastomeric shock-absorbing material (38/52) filling the gap between them","fr":"Fig. 1 et 2 du brevet US 4 934 724 : un vélo avec la poutre cantilever (10/18/20) remplaçant le tube de selle et les haubans, et une coupe de la poutre montrant les éléments porteurs (30/40/54) espacés entre eux, l'écart étant comblé par le matériau élastomère amortisseur (38/52)"},"teaser":{"en":"US 4,934,724, \"Combination beam seat support,\" filed April 7, 1989 by James D. Allsop and David E. Calapp, granted June 19, 1990 to Allsop, Inc. of Bellingham, Washington, and sold through the…","fr":"US 4 934 724, « Combination beam seat support », déposé le 7 avril 1989 par James D. Allsop et David E. Calapp, délivré le 19 juin 1990 à Allsop, Inc. de Bellingham (Washington), et commercialisé sous…"},"full":{"en":"US 4,934,724, \"Combination beam seat support,\" filed April 7, 1989 by James D. Allsop and David E. Calapp, granted June 19, 1990 to Allsop, Inc. of Bellingham, Washington, and sold through the Softride line. Deletes the seat tube and both seat stays; a cantilevered composite beam bolts to the top of the front triangle and carries the saddle at its free end, with load-bearing members spaced apart along the beam's length and an elastomeric material filling the gap between them to absorb flex. Pre-GATT filing: the term ran 17 years from grant, to 2007.","fr":"US 4 934 724, « Combination beam seat support », déposé le 7 avril 1989 par James D. Allsop et David E. Calapp, délivré le 19 juin 1990 à Allsop, Inc. de Bellingham (Washington), et commercialisé sous la ligne Softride. Supprime le tube de selle et les deux haubans ; une poutre composite cantilever se boulonne au sommet du triangle avant et porte la selle à son extrémité libre, avec des éléments porteurs espacés sur la longueur de la poutre et un matériau élastomère comblant l'écart entre eux pour absorber la flexion. Dépôt antérieur au GATT : la durée courait 17 ans à compter de la délivrance, jusqu'en 2007."}},{"num":"629049","cat":"frame","title":{"en":"Strider running bike design (USD 629,049)","fr":"Dessin du vélo Strider Running Bike (USD 629 049)"},"assignee":"Ryan McFarland / Strider Sports International, Inc. (Rapid City, SD)","img":"../pictures/USD629049S1.png","alt":{"en":"Figs. 1 and 2 of USD 629,049: a top view of the steering head and handlebar, and a full side-view silhouette of the complete pedal-less running bike — low frame, two wheels, a padded seat, and a footrest step between them","fr":"Fig. 1 et 2 du brevet USD 629 049 : une vue de dessus de la tête de direction et du guidon, et une silhouette latérale complète du vélo d'équilibre sans pédale — cadre bas, deux roues, une selle rembourrée et un repose-pied entre elles"},"teaser":{"en":"USD 629,049, \"Running bike,\" filed April 20, 2009 by inventor Ryan McFarland and granted December 14, 2010, assigned to Strider Sports International, Inc. of Rapid City, South Dakota. A design patent…","fr":"USD 629 049, « Running bike », déposé le 20 avril 2009 par l'inventeur Ryan McFarland et délivré le 14 décembre 2010, cédé à Strider Sports International, Inc. de Rapid City (Dakota du Sud). Un brevet…"},"full":{"en":"USD 629,049, \"Running bike,\" filed April 20, 2009 by inventor Ryan McFarland and granted December 14, 2010, assigned to Strider Sports International, Inc. of Rapid City, South Dakota. A design patent covering the ornamental shape of the no-pedal balance bike itself — the low, stepped-through frame, the proportions of the two wheels relative to the seat and head tube, and the handlebar and fork profile — rather than any underlying mechanism. Filed before the current 15-year design-patent term took effect for filings after May 2015; under the earlier rule the term ran 14 years from grant, to 2024. McFarland is also the inventor credited earlier in this atlas for the Thudbuster suspension seatpost (US 5,489,139), filed roughly 15 years before this one under his own name rather than a company he later founded.","fr":"USD 629 049, « Running bike », déposé le 20 avril 2009 par l'inventeur Ryan McFarland et délivré le 14 décembre 2010, cédé à Strider Sports International, Inc. de Rapid City (Dakota du Sud). Un brevet de dessin couvrant la forme ornementale du vélo d'équilibre sans pédale lui-même — le cadre bas et enjambable, les proportions des deux roues par rapport à la selle et au tube de direction, et le profil du guidon et de la fourche — plutôt qu'un mécanisme sous-jacent. Déposé avant l'e
