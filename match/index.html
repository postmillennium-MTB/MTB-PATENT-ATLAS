ntrée en vigueur de la durée actuelle de 15 ans pour les brevets de dessin déposés après mai 2015 ; sous la règle antérieure, la durée courait 14 ans à compter de la délivrance, jusqu'en 2024. McFarland est aussi l'inventeur crédité plus tôt dans cet atlas pour la tige de selle à suspension Thudbuster (US 5 489 139), déposée environ 15 ans avant celle-ci sous son propre nom plutôt que sous une société qu'il fonderait plus tard."}},{"num":"6497427","cat":"frame","title":{"en":"Cannondale seat stay tire-clearance frame (US 6,497,427)","fr":"Cadre Cannondale à dégagement de pneu aux haubans (US 6 497 427)"},"assignee":"Christopher P. D'Alusio & Christopher A. Peck / Cannondale Corporation","img":"../pictures/US6497427B1.png","alt":{"en":"Fig. 2 of US 6,497,427: rear view of the frame's seat stay tubes (32a/32b) converging toward the dropout (26), with the upper gap zone (34a) and lower gap zone (34b) bracketed to show where the minimum tire-clearance distance is measured","fr":"Fig. 2 du brevet US 6 497 427 : vue arrière des tubes de haubans du cadre (32a/32b) convergeant vers la patte de cadre (26), avec la zone de dégagement supérieure (34a) et la zone de dégagement inférieure (34b) indiquées par des accolades montrant où la distance minimale de dégagement du pneu est mesurée"},"teaser":{"en":"Filed as PCT application PCT/US00/15915 on June 9, 2000 and entering the US national stage in May 2001 (application 09/831,822), this patent claims a mountain bike 'diamond-type' frame whose seat stay…","fr":"Déposé comme demande PCT PCT/US00/15915 le 9 juin 2000 et entré en phase nationale américaine en mai 2001 (demande 09/831 822), ce brevet revendique un cadre de VTT de type « diamant » dont les tubes…"},"full":{"en":"Filed as PCT application PCT/US00/15915 on June 9, 2000 and entering the US national stage in May 2001 (application 09/831,822), this patent claims a mountain bike 'diamond-type' frame whose seat stay tubes are spaced to keep a minimum gap distance of roughly 2 inches between their inner surfaces at the point where they pass the rear tire — specifically for frames built around a single rear disc brake rather than a rim brake, where tire and mud clearance at that pinch point is the practical constraint. The claims also bound the seat stay tubes' stiffness (modulus of elasticity times moment of inertia, roughly 1 to 10 lb×in²) rather than just their shape, tying the tire-clearance dimension to a specific stiffness range. Granted December 24, 2002, matching the grant year in the source description this entry was queued from. Term runs filing (PCT, 2000) + 20 = 2020.","fr":"Déposé comme demande PCT PCT/US00/15915 le 9 juin 2000 et entré en phase nationale américaine en mai 2001 (demande 09/831 822), ce brevet revendique un cadre de VTT de type « diamant » dont les tubes de haubans sont espacés pour maintenir une distance minimale d'environ 2 pouces entre leurs surfaces intérieures au point où ils longent le pneu arrière — spécifiquement pour des cadres conçus autour d'un frein à disque arrière unique plutôt qu'un frein sur jante, où le dégagement au pneu et à la boue à ce point d'étranglement est la contrainte pratique. Les revendications encadrent également la rigidité des tubes de haubans (module d'élasticité multiplié par le moment d'inertie, environ 1 à 10 lb×po²) plutôt que leur seule forme, liant la dimension de dégagement du pneu à une plage de rigidité précise. Délivré le 24 décembre 2002, ce qui correspond à l'année de délivrance de la description source à partir de laquelle cette fiche a été mise en attente. La durée court dépôt (PCT, 2000) + 20 = 2020."}},{"num":"10252768","cat":"frame","title":{"en":"Low-BB / short-crank geometry formula (US 10,252,768 + 11,479,322)","fr":"Formule de géométrie boîtier bas / manivelles courtes (US 10,252,768 + 11,479,322)"},"assignee":"Independent","img":"../pictures/US10252768B2.png","alt":{"en":"Fig. 1A of US 10,252,768: a full bicycle side elevation with the patent's claimed geometry dimensions labeled — bottom-bracket height (BH), the calculated 'practical bracket height' threshold (Bd), wheel radius (R), and crank length (L) measured from the bottom-bracket axle (19)","fr":"Fig. 1A du brevet US 10 252 768 : une élévation latérale complète du vélo avec les dimensions géométriques revendiquées par le brevet — hauteur du boîtier de pédalier (BH), le seuil calculé de « hauteur de boîtier pratique » (Bd), rayon de roue (R), et longueur de manivelle (L) mesurée depuis l'axe du boîtier de pédalier (19)"},"teaser":{"en":"A granted utility patent claiming mountain bikes by a *formula* — crank length ≤164mm combined with a calculated 'practical bracket height' threshold. A continuation, US 11,479,322 (granted 2022),…","fr":"Un brevet d'utilité délivré revendiquant les vélos de montagne par une *formule* — une longueur de manivelle ≤ 164 mm combinée à un seuil calculé de « hauteur de boîtier pratique ». Une continuation,…"},"full":{"en":"A granted utility patent claiming mountain bikes by a *formula* — crank length ≤164mm combined with a calculated 'practical bracket height' threshold. A continuation, US 11,479,322 (granted 2022), extends the same formula-based claims.","fr":"Un brevet d'utilité délivré revendiquant les vélos de montagne par une *formule* — une longueur de manivelle ≤ 164 mm combinée à un seuil calculé de « hauteur de boîtier pratique ». Une continuation, US 11,479,322 (délivrée en 2022), étend les mêmes revendications fondées sur la formule."}},{"num":"6953202","cat":"frame","title":{"en":"Specialized articulating-frame assembly (US 6,953,202)","fr":"Cadre articulé Specialized (US 6 953 202)"},"assignee":"Jason L. Chamberlain & Christopher P. D'Aluisio / Specialized Bicycle Components","img":"../pictures/US6953202B2.png","alt":{"en":"Fig. 1 of US 6,953,202: side view of the full-suspension bicycle (10), with the main frame (14), the articulating rear frame (16), the shock absorber (26) and the rear wheel (24), plus the bottom-bracket axis (CA) and hub axis (HA)","fr":"Fig. 1 du brevet US 6 953 202 : vue de côté du vélo à suspension intégrale (10), avec le cadre principal (14), le cadre arrière articulé (16), l'amortisseur (26) et la roue arrière (24), ainsi que l'axe du boîtier de pédalier (CA) et l'axe de moyeu (HA)"},"teaser":{"en":"US 6,953,202, \"Frame assembly for a bicycle,\" granted October 11, 2005 to Jason L. Chamberlain and Christopher P. D'Aluisio of Specialized Bicycle Components. The abstract describes a full-suspension…","fr":"US 6 953 202, « Frame assembly for a bicycle », délivré le 11 octobre 2005 à Jason L. Chamberlain et Christopher P. D'Aluisio de Specialized Bicycle Components. Le résumé décrit un cadre à suspension…"},"full":{"en":"US 6,953,202, \"Frame assembly for a bicycle,\" granted October 11, 2005 to Jason L. Chamberlain and Christopher P. D'Aluisio of Specialized Bicycle Components. The abstract describes a full-suspension frame: a main frame, an articulating rear frame pivoted to it and carrying the rear wheel, and a shock absorber between the two. In the preferred arrangement the top tube and down tube contact each other for a distance rearward of the head tube, and the down tube has a non-circular cross-section; the claims themselves were not read. The application was filed November 10, 2004 as a continuation of US 6,866,281 (filed March 29, 2004, granted March 15, 2005), itself a continuation of US 6,712,373 (filed April 29, 2002, granted March 30, 2004), which claimed a provisional of April 15, 2002. Term runs from the April 29, 2002 filing, to 2022. No production model is tied to the patent here.","fr":"US 6 953 202, « Frame assembly for a bicycle », délivré le 11 octobre 2005 à Jason L. Chamberlain et Christopher P. D'Aluisio de Specialized Bicycle Components. Le résumé décrit un cadre à suspension intégrale : un cadre principal, un cadre arrière articulé pivotant sur celui-ci et portant la roue arrière, et un amortisseur entre les deux. Dans l'agencement préféré, le tube supérieur et le tube diagonal se touchent sur une certaine distance en arrière du tube de direction, et le tube diagonal a une section non circulaire ; les revendications elles-mêmes n'ont pas été lues. La demande a été déposée le 10 novembre 2004 en continuation du US 6 866 281 (déposé le 29 mars 2004, délivré le 15 mars 2005), lui-même continuation du US 6 712 373 (déposé le 29 avril 2002, délivré le 30 mars 2004), qui revendiquait une provisoire du 15 avril 2002. La durée court depuis le dépôt du 29 avril 2002, jusqu'en 2022. Aucun modèle de série n'est rattaché ici à ce brevet."}},{"num":"8308179","cat":"frame","title":{"en":"SWAT in-frame storage (US 8,308,179)","fr":"Rangement intégré au cadre SWAT (US 8,308,179)"},"assignee":"Mark Cote, Jean-Luc Callahan & Christopher P. D'Aluisio / Specialized","img":"../pictures/US8308179B2.png","alt":{"en":"Fig. 7 of US 8,308,179 B2: a cutaway of the down tube (220/235) showing the flexible bladder (200/205) inside it and the collar (210/225) that seals the bladder's open end at the frame opening near the head tube","fr":"Fig. 7 du brevet US 8 308 179 B2 : une coupe du tube diagonal (220/235) montrant la vessie flexible (200/205) à l'intérieur et le collier (210/225) qui scelle l'extrémité ouverte de la vessie au niveau de l'ouverture du cadre près du tube de direction"},"teaser":{"en":"'Bicycle with internal storage system': a hollow frame member with a wall opening, a flexible bladder inserted through it, and a stiffening member to guide the bladder in — the bladder tube doubling…","fr":"« Bicycle with internal storage system » : un élément de cadre creux avec une ouverture dans la paroi, une vessie flexible insérée à travers, et un élément raidisseur pour guider la vessie — le tube…"},"full":{"en":"'Bicycle with internal storage system': a hollow frame member with a wall opening, a flexible bladder inserted through it, and a stiffening member to guide the bladder in — the bladder tube doubling as a drinking tube. Filed in 2011, five years before Specialized brought the down-tube SWAT door to market on the 2016 carbon Stumpjumper.","fr":"« Bicycle with internal storage system » : un élément de cadre creux avec une ouverture dans la paroi, une vessie flexible insérée à travers, et un élément raidisseur pour guider la vessie — le tube de la vessie servant aussi de tube de boisson. Déposé en 2011, cinq ans avant que Specialized ne commercialise la trappe SWAT du tube diagonal sur le Stumpjumper carbone 2016."}},{"num":"845838","cat":"frame","title":{"en":"Knock Block steerer stop (US D845,838)","fr":"Butée de direction Knock Block (US D845 838)"},"assignee":"Trek","img":"../pictures/USD845838S1.png","alt":{"en":"Figs. 3–4 of US D845,838 S: top and bottom plan views of the Bontrager stem, showing the distinctive elongated notch (150) cut into the steerer clamp barrel that keys it to the matching frame and headset hardware","fr":"Fig. 3-4 du brevet US D845 838 S : vues en plan du dessus et du dessous de la potence Bontrager, montrant l'encoche allongée distinctive (150) découpée dans le collier de serrage du pilote qui la clavette avec le cadre et le jeu de direction correspondants"},"teaser":{"en":"Bontrager's Knock Block-compatible stem — keyed to mate with a matching frame chip and headset top cap that together physically stop the handlebars from over-rotating and denting Trek's straight-shot…","fr":"La potence compatible Knock Block de Bontrager — dotée d'un profil claveté qui s'associe à une puce de cadre et à un capuchon de jeu de direction correspondants pour stopper physiquement la rotation…"},"full":{"en":"Bontrager's Knock Block-compatible stem — keyed to mate with a matching frame chip and headset top cap that together physically stop the handlebars from over-rotating and denting Trek's straight-shot down tubes — is protected by US D845,838, a design patent covering the stem's distinctive notched shape. Filed March 28, 2017 (Roy Heideveld, application Ser. No. 29/598,737) and granted April 16, 2019, per the patent's own front page — this run corrected an earlier version of this entry that had stated a July 18, 2016 filing and an April 9, 2019 grant date, both wrong by comparison with the primary source. Like most design patents, it protects the stem's ornamental appearance, not the underlying steering-limiter concept itself — this pass didn't find a separate Trek utility patent on that broader idea among the numbers Trek's own site lists. SRAM filed its own fork-crown steering-limiter application in December 2025 — distinct in that it anchors one side of the rotational stop to the fork crown rather than the headset, putting it in the same competitive space as Knock Block and Acros' Blocklock.","fr":"La potence compatible Knock Block de Bontrager — dotée d'un profil claveté qui s'associe à une puce de cadre et à un capuchon de jeu de direction correspondants pour stopper physiquement la rotation excessive du guidon et éviter d'endommager les tubes diagonaux rectilignes de Trek — est protégée par le brevet de dessin US D845 838, qui couvre la forme distinctive et crantée de la potence. Déposé le 28 mars 2017 (Roy Heideveld, demande n° de série 29/598 737) et délivré le 16 avril 2019, d'après la première page du brevet lui-même — cette recherche a corrigé une version antérieure de cette fiche qui indiquait un dépôt le 18 juillet 2016 et une délivrance le 9 avril 2019, deux dates erronées par comparaison avec la source primaire. Comme la plupart des brevets de dessin, il protège l'apparence ornementale de la potence, pas le concept sous-jacent de limitation de direction lui-même — cette recherche n'a pas trouvé de brevet d'utilité distinct de Trek sur cette idée plus large parmi les numéros listés sur son propre site. SRAM a déposé sa propre demande de limiteur de rotation au té de fourche en décembre 2025 — distincte en ce qu'elle ancre un côté de la butée rotative au té de fourche plutôt qu'au jeu de direction, la plaçant dans le même espace concurrentiel que le Knock Block et le Blocklock d'Acros."}},{"num":"10086899","cat":"frame","title":{"en":"IsoSpeed decoupler (US 10,086,899 + 10,351,192 + 10,676,145)","fr":"Découpleur IsoSpeed (US 10 086 899 + 10 351 192 + 10 676 145)"},"assignee":"Tim Hartung & Steven Moechnig / Trek Bicycle Corporation","img":"../pictures/US10351192B2.png","alt":{"en":"Fig. 3 of US 10,351,192: the seat tube (22) passing up through a passage (130) between the upper frame member's side walls (142, 144) at the top-tube (24) and seat-stay junction, with the pivot assembly (105) at the top","fr":"Fig. 3 du brevet US 10 351 192 : le tube de selle (22) traversant un passage (130) entre les parois latérales (142, 144) de l'élément de cadre supérieur, à la jonction du tube supérieur (24) et des haubans, avec l'ensemble pivot (105) en haut"},"teaser":{"en":"A pivot decoupling the seat tube from the top tube, so the seat tube flexes on its own for vertical compliance without rear suspension; it crossed from Trek's Domane road bikes to its hardtails. The…","fr":"Un pivot qui découple le tube de selle du tube supérieur, de sorte que le tube de selle fléchit seul pour apporter du confort vertical sans suspension arrière ; il est passé des vélos de route Domane…"},"full":{"en":"A pivot decoupling the seat tube from the top tube, so the seat tube flexes on its own for vertical compliance without rear suspension; it crossed from Trek's Domane road bikes to its hardtails. The patents found cover the adjustable version. US 10,086,899 (application 15/156,495, filed May 17, 2016, claiming 2015 provisionals; granted October 2, 2018), its divisional US 10,351,192 (granted July 16, 2019) and a later continuation, US 10,676,145 (filed June 26, 2019, granted June 9, 2020), are all titled \"Adjustable compliance bicycle\" and name Tim Hartung and Steven Moechnig. They claim an upper seat mast adjustably coupled to a lower seat mast and a pivot assembly that secures the seat tube in a passage through the upper frame member. Anticipated expiry is May 17, 2036. The patent behind the original 2012 Domane decoupler has not been located.","fr":"Un pivot qui découple le tube de selle du tube supérieur, de sorte que le tube de selle fléchit seul pour apporter du confort vertical sans suspension arrière ; il est passé des vélos de route Domane de Trek à ses rigides. Les brevets trouvés couvrent la version réglable. Le US 10 086 899 (demande 15/156 495, déposée le 17 mai 2016, revendiquant des provisoires de 2015 ; délivré le 2 octobre 2018), sa divisionnaire US 10 351 192 (délivrée le 16 juillet 2019) et une continuation ultérieure, le US 10 676 145 (déposée le 26 juin 2019, délivrée le 9 juin 2020), s'intitulent tous « Adjustable compliance bicycle » et désignent Tim Hartung et Steven Moechnig. Ils revendiquent un mât de selle supérieur couplé de façon réglable à un mât inférieur et un ensemble pivot qui fixe le tube de selle dans un passage de l'élément de cadre supérieur. L'expiration prévue est le 17 mai 2036. Le brevet à l'origine du découpleur Domane de 2012 n'a pas été localisé."}},{"num":"6924021","cat":"frame","title":{"en":"OCLV complex-shaped carbon-fiber structural member (US 6,924,021)","fr":"Élément structurel en fibre de carbone de forme complexe OCLV (US 6 924 021)"},"assignee":"James E. Colegrove, Chad Manuell & Doug A. Cusack / Trek Bicycle Corporation","img":"../pictures/US6924021B1.png","alt":{"en":"Fig. 1 and Fig. 2 of US 6,924,021 B1: Fig. 1 shows a complete mountain bike with the molded carbon rocker link (35) connecting the rear shock to the frame's chainstay pivot; Fig. 2 isolates the same frame and rocker link (35) without the wheels, showing its mounting points clearly","fr":"Fig. 1 et Fig. 2 du brevet US 6 924 021 B1 : la Fig. 1 montre un VTT complet avec la biellette en carbone moulé (35) reliant l'amortisseur arrière au pivot des haubans du cadre ; la Fig. 2 isole le même cadre et la même biellette (35) sans les roues, montrant clairement ses points de fixation"},"teaser":{"en":"Trek's foundational OCLV (Optimum Compaction, Low Void) carbon manufacturing patent: randomly-oriented unidirectional carbon-fiber strips, wrapped in a continuous carbon-fiber rope, molded into…","fr":"Le brevet fondateur de fabrication carbone OCLV (Optimum Compaction, Low Void) de Trek : des bandes de fibre de carbone unidirectionnelle orientées aléatoirement, enveloppées d'une corde continue de…"},"full":{"en":"Trek's foundational OCLV (Optimum Compaction, Low Void) carbon manufacturing patent: randomly-oriented unidirectional carbon-fiber strips, wrapped in a continuous carbon-fiber rope, molded into complex three-dimensional shapes — the patent's own worked example is a suspension rocker link — rather than the simple round or oval tube most contemporary carbon patents claimed. Filed July 3, 2002 and granted August 2, 2005 as US 6,924,021, read directly off the patent's own front page.","fr":"Le brevet fondateur de fabrication carbone OCLV (Optimum Compaction, Low Void) de Trek : des bandes de fibre de carbone unidirectionnelle orientées aléatoirement, enveloppées d'une corde continue de fibre de carbone, moulées en formes tridimensionnelles complexes — l'exemple même du brevet est une biellette de suspension — plutôt que le simple tube rond ou ovale que revendiquaient la plupart des brevets carbone contemporains. Déposé le 3 juillet 2002 et délivré le 2 août 2005 sous le numéro US 6 924 021, lu directement sur la première page du brevet."}},{"num":"20180264756","cat":"frame","title":{"en":"Revved Carbon composite manufacturing (US 2018/0264756 A1)","fr":"Fabrication composite Revved Carbon (US 2018/0264756 A1)"},"assignee":"Matt Giaraffa & William Montague / Guerrilla Industries LLC (Guerrilla Gravity)","img":"../pictures/US20180264756A1.png","alt":{"en":"Fig. 1 of US 2018/0264756 A1: a bicycle frame tube member (104) in profile, showing the composite wall's inner and outer surfaces (112, 124, 128) and the B-B cross-section cut line referenced by later figures","fr":"Fig. 1 du brevet US 2018/0264756 A1 : un élément de tube de cadre de vélo (104) en profil, montrant les surfaces intérieure et extérieure de la paroi composite (112, 124, 128) et la ligne de coupe en section B-B référencée par les figures suivantes"},"teaser":{"en":"Published application \"Composite structures and methods of forming composite structures,\" filed March 19, 2018 by Guerrilla Industries LLC (Denver) and naming inventors Matt Giaraffa and William…","fr":"Demande publiée « Composite structures and methods of forming composite structures », déposée le 19 mars 2018 par Guerrilla Industries LLC (Denver) et nommant les inventeurs Matt Giaraffa et William…"},"full":{"en":"Published application \"Composite structures and methods of forming composite structures,\" filed March 19, 2018 by Guerrilla Industries LLC (Denver) and naming inventors Matt Giaraffa and William Montague. It claims a heated-fluid forming process that presses fiber-reinforced laminate over a mold to produce hollow structural composite parts — the process underlying Guerrilla Gravity's branded \"Revved Carbon.\" The company hasn't disclosed the specific resin or fiber composition. Revved Industries (Guerrilla Gravity's manufacturing arm) announced its first secured patent for the process in March 2021; whether that grant carries this application's number or a later continuation's number is unconfirmed.","fr":"Demande publiée « Composite structures and methods of forming composite structures », déposée le 19 mars 2018 par Guerrilla Industries LLC (Denver) et nommant les inventeurs Matt Giaraffa et William Montague. Elle revendique un procédé de formage par fluide chauffé pressant un stratifié renforcé de fibres sur un moule pour produire des pièces composites structurelles creuses — le procédé à l'origine du « Revved Carbon » de marque Guerrilla Gravity. L'entreprise n'a pas divulgué la composition précise de la résine ou des fibres. Revved Industries (le bras de fabrication de Guerrilla Gravity) a annoncé en mars 2021 avoir obtenu son premier brevet pour ce procédé ; reste à confirmer si ce brevet délivré porte le numéro de cette demande ou celui d'une continuation ultérieure."}},{"num":null,"cat":"frame","title":{"en":"ISIS Drive — the open-source BB standard","fr":"ISIS Drive — le standard de boîtier de pédalier open source"},"assignee":"Industry consortium (Truvativ, Race Face, Bontrager, et al.)","img":"../pictures/ISIS Drive.png","alt":{"en":"ISIS Drive's own published spindle specification drawing (sheet 1 of 7, revision D), showing the ten-spline taper's two cross-sections and thread dimensions","fr":"Le plan de spécification de la broche publié par ISIS Drive elle-même (planche 1 sur 7, révision D), montrant les deux coupes du cône cannelé à dix cannelures et les cotes de filetage"},"teaser":{"en":"A ten-spline crank-interface standard published around 2000 with no patent — any manufacturer could implement it freely. Popular from roughly 2001 to 2008 before Shimano's external-bearing Hollowtech…","fr":"Un standard d'interface de manivelle à dix cannelures publié vers 2000 sans brevet — tout fabricant pouvait l'implémenter librement. Populaire d'environ 2001 à 2008 avant que le Hollowtech II à…"},"full":{"en":"A ten-spline crank-interface standard published around 2000 with no patent — any manufacturer could implement it freely. Popular from roughly 2001 to 2008 before Shimano's external-bearing Hollowtech II and press-fit BB shells made the design obsolete.","fr":"Un standard d'interface de manivelle à dix cannelures publié vers 2000 sans brevet — tout fabricant pouvait l'implémenter librement. Populaire d'environ 2001 à 2008 avant que le Hollowtech II à roulements externes de Shimano et les coquilles de boîtier press-fit ne rendent le design obsolète."}},{"num":"10733795","cat":"frame","title":{"en":"Rim shape determination method (US 10,733,795)","fr":"Méthode de détermination de forme de jante (US 10,733,795)"},"assignee":"Trek Bicycle","img":"../pictures/US10733795B2.png","alt":{"en":"Fig. 2 of US 10,733,795: a geometric rim-profile construction — height (210) and two width dimensions (205/215) define an outer boundary curve (200), constrained by two radii (r1/r2) through a pair of control points (one unlabeled, 220), the kind of parametrized curve the patented software searches over to generate an optimized rim cross-section","fr":"Fig. 2 du brevet US 10 733 795 : une construction géométrique de profil de jante — une hauteur (210) et deux dimensions de largeur (205/215) définissent une courbe de limite extérieure (200), contrainte par deux rayons (r1/r2) passant par une paire de points de contrôle (l'un non étiqueté, 220), le type de courbe paramétrée que le logiciel breveté explore pour générer une section de jante optimisée"},"teaser":{"en":"A computer-based system using computational fluid dynamics and Pareto-front optimization to generate optimal rim cross-sections — minimizing drag and lateral stability forces simultaneously. Trek…","fr":"Un système informatique utilisant la dynamique des fluides numérique et l'optimisation par front de Pareto pour générer des sections transversales de jante optimales — minimisant simultanément la…"},"full":{"en":"A computer-based system using computational fluid dynamics and Pareto-front optimization to generate optimal rim cross-sections — minimizing drag and lateral stability forces simultaneously. Trek patented the design *process*, not a physical rim.","fr":"Un système informatique utilisant la dynamique des fluides numérique et l'optimisation par front de Pareto pour générer des sections transversales de jante optimales — minimisant simultanément la traînée et les forces de stabilité latérale. Trek a breveté le *procédé* de conception, pas une jante physique."}},{"num":null,"cat":"frame","title":{"en":"Forward Geometry — the philosophy, not the patent","fr":"Forward Geometry — la philosophie, pas le brevet"},"assignee":"Mondraker (Spain)","img":"../pictures/forwardgeometry.jpg","alt":{"en":"Mondraker's own \"Forward Geometry\" concept sketch: a full frame side view marking the front-center distance from the bottom bracket to the front axle, labeled \"Forward Geometry\"","fr":"Croquis conceptuel de Mondraker pour la « Forward Geometry » : une vue latérale complète du cadre indiquant la distance de centre avant entre le boîtier de pédalier et l'axe avant, étiquetée « Forward Geometry »"},"teaser":{"en":"Mondraker's long-reach, short-stem geometry — driven by racer Fabian Barel — reshaped how every mountain bike fits. Research shows no utility patent: it's protected as proprietary branding and was…","fr":"La géométrie à long reach et potence courte de Mondraker — portée par le pilote Fabian Barel — a redéfini l'ajustement de chaque vélo de montagne. Les recherches ne montrent aucun brevet d'utilité :…"},"full":{"en":"Mondraker's long-reach, short-stem geometry — driven by racer Fabian Barel — reshaped how every mountain bike fits. Research shows no utility patent: it's protected as proprietary branding and was freely adopted industry-wide within a decade. The two diagrams on this entry come directly from Mondraker's own site (mondraker.com/us/en/forward-geometry) — marketing illustrations, not patent drawings, the only kind of image that exists for a design with no utility patent behind it.","fr":"La géométrie à long reach et potence courte de Mondraker — portée par le pilote Fabian Barel — a redéfini l'ajustement de chaque vélo de montagne. Les recherches ne montrent aucun brevet d'utilité : elle est protégée comme image de marque propriétaire et a été librement adoptée dans toute l'industrie en une décennie. Les deux illustrations de cette fiche proviennent directement du site de Mondraker (mondraker.com/us/en/forward-geometry) — des illustrations marketing, non des dessins de brevet, le seul type d'image existant pour une conception sans brevet d'utilité."}},{"num":null,"cat":"frame","title":{"en":"Triple Triangle — the trademark, not the patent","fr":"Triple Triangle — la marque déposée, pas le brevet"},"assignee":"GT Bicycles","img":"../pictures/triple triangle.gif","alt":{"en":"GT's registered trademark drawing: the letters GT followed by the words \"triple triangle design\" in italic script, framed by two wavy speckled bands","fr":"Dessin de la marque déposée de GT : les lettres GT suivies des mots « triple triangle design » en italique, encadrés de deux bandes ondulées mouchetées"},"teaser":{"en":"GT's signature seatstay-past-the-seat-tube frame design is protected as a registered trademark (Triple Triangle®) and trade dress — research shows no utility patent on the mechanism. The layout itself…","fr":"Le design de cadre signature de GT, avec les haubans passant au-delà du tube de selle, est protégé comme marque déposée (Triple Triangle®) et habillage commercial (trade dress) — les recherches ne…"},"full":{"en":"GT's signature seatstay-past-the-seat-tube frame design is protected as a registered trademark (Triple Triangle®) and trade dress — research shows no utility patent on the mechanism. The layout itself is much older: British builders called seatstays that run past the seat tube to the top tube \"Hellenic stays,\" after frame builder Fred Hellens, whose design is traditionally dated to 1923, though no drawing or surviving bicycle from that year has been documented. GT's registered mark (U.S. serial no. 73752964) covers the words \"GT triple triangle design\" with a stylized logo, not the frame geometry.","fr":"Le design de cadre signature de GT, avec les haubans passant au-delà du tube de selle, est protégé comme marque déposée (Triple Triangle®) et habillage commercial (trade dress) — les recherches ne montrent aucun brevet d'utilité sur le mécanisme. La disposition elle-même est bien plus ancienne : les constructeurs britanniques appelaient « Hellenic stays » les haubans prolongés au-delà du tube de selle jusqu'au tube horizontal, d'après le cadreur Fred Hellens, dont le dessin est traditionnellement daté de 1923, bien qu'aucun dessin ni vélo de cette année-là n'ait été documenté. La marque déposée de GT (numéro de série américain 73752964) protège les mots « GT triple triangle design » avec un logo stylisé, pas la géométrie du cadre."}},{"num":"4923203","cat":"frame","title":{"en":"Trimble X-Frame composite bicycle frame (US 4,923,203)","fr":"Cadre de vélo composite X-Frame de Trimble (US 4 923 203)"},"assignee":"Brent J. Trimble & Richard H. Trimble","img":"../pictures/US4923203A.png","alt":{"en":"Fig. 1 of US 4,923,203: a side view of the frame showing the main tubular portion (24) and cross tubular portion (26) crossing in an X-shape between the head tube, bottom bracket, seat and rear wheel supports","fr":"Fig. 1 du brevet US 4 923 203 : une vue latérale du cadre montrant la section tubulaire principale (24) et la section tubulaire transversale (26) se croisant en X entre le tube de direction, le boîtier de pédalier, la selle et les supports de roue arrière"},"teaser":{"en":"US 4,923,203, filed December 23, 1987 and granted May 8, 1990 to Brent J. Trimble and Richard H. Trimble, covers a hollow composite bicycle frame built from two crossed tubular sections meeting in an…","fr":"Le brevet US 4 923 203, déposé le 23 décembre 1987 et délivré le 8 mai 1990 à Brent J. Trimble et Richard H. Trimble, couvre un cadre de vélo composite creux formé de deux sections tubulaires croisées…"},"full":{"en":"US 4,923,203, filed December 23, 1987 and granted May 8, 1990 to Brent J. Trimble and Richard H. Trimble, covers a hollow composite bicycle frame built from two crossed tubular sections meeting in an X, molded from resin-impregnated fiber rather than assembled from separate tubes and lugs. Trimble designed the Kestrel 4000, the first commercially available one-piece monocoque carbon frame, but that bike's own frame patent belongs to Kestrel co-founders Delano Duplessis and Bevil Hogg (US 4,828,781) — this patent is Trimble's own crossed-tube design, later built as the Trimble Inverse-4.","fr":"Le brevet US 4 923 203, déposé le 23 décembre 1987 et délivré le 8 mai 1990 à Brent J. Trimble et Richard H. Trimble, couvre un cadre de vélo composite creux formé de deux sections tubulaires croisées en X, moulées en fibre imprégnée de résine plutôt qu'assemblées à partir de tubes et de raccords séparés. Trimble a conçu le Kestrel 4000, premier cadre monocoque en carbone d'une seule pièce commercialisé, mais le brevet de ce cadre appartient aux cofondateurs de Kestrel Delano Duplessis et Bevil Hogg (US 4 828 781) — ce brevet-ci est la conception croisée propre à Trimble, construite plus tard sous le nom de Trimble Inverse-4."}},{"num":"5833074","cat":"transport","title":{"en":"QuikRack — Fast-loading protective bicycle rack (US 5,833,074)","fr":"QuikRack — porte-vélos protecteur à chargement rapide (US 5,833,074)"},"assignee":"Cal M. Phillips (licensed to 1UP USA)","img":"../pictures/US5833074A.png","alt":{"en":"Fig. 1 of US 5,833,074: the U-channel track (1) that cradles each wheel, with the pivoting U-shaped clamp arm (2/5/6) that swings down to hold the tire against the track","fr":"Fig. 1 du brevet US 5 833 074 : le rail en U (1) qui accueille chaque roue, avec le bras de serrage pivotant en U (2/5/6) qui s'abaisse pour maintenir le pneu contre le rail"},"teaser":{"en":"The original no-frame-contact tray rack — bikes held by tires, a swinging arm over each wheel, mounted to a standard hitch receiver. Invented and patented by Cal Phillips; 1UP USA licensed the design…","fr":"Le porte-vélos à plateau sans contact avec le cadre original — vélos maintenus par les pneus, un bras pivotant au-dessus de chaque roue, monté sur un récepteur d'attelage standard. Inventé et breveté…"},"full":{"en":"The original no-frame-contact tray rack — bikes held by tires, a swinging arm over each wheel, mounted to a standard hitch receiver. Invented and patented by Cal Phillips; 1UP USA licensed the design rather than buying it outright. Filed April 6, 1995 — before the June 8, 1995 GATT cutoff — so its 17-year term runs from the November 1998 grant rather than 20 years from filing, expiring in 2015 (corrected from a previously-stated 2016) and triggering an immediate wave of tray-style competitors including RockyMounts GuideRail and Quik'R'Stuff.","fr":"Le porte-vélos à plateau sans contact avec le cadre original — vélos maintenus par les pneus, un bras pivotant au-dessus de chaque roue, monté sur un récepteur d'attelage standard. Inventé et breveté par Cal Phillips ; 1UP USA a licencié le design plutôt que de l'acheter directement. Déposé le 6 avril 1995 — avant le seuil GATT du 8 juin 1995 — sa durée de 17 ans court donc à partir de la délivrance de novembre 1998 plutôt que 20 ans à compter du dépôt, expirant en 2015 (corrigé par rapport à une valeur précédemment indiquée de 2016) et déclenchant une vague immédiate de concurrents à plateau, dont RockyMounts GuideRail et Quik'R'Stuff."}},{"num":"9956922","cat":"transport","title":{"en":"Mach2 rack portfolio — Cal Phillips / QuikrStuff","fr":"Portefeuille de porte-vélos Mach2 — Cal Phillips / QuikrStuff"},"assignee":"Cal M. Phillips / QuikrStuff","img":"../pictures/US9956922B2.png","alt":{"en":"Figure 1 of US 9,956,922: a side view of the rack, showing the pivoting wheel-cradle tray (9/11) mounted to the frame (2), with the hitch-clamp receiver hardware (20/21/101) securing each end","fr":"Figure 1 du brevet US 9 956 922 : une vue de côté du porte-vélos, montrant le plateau pivotant de berceau de roue (9/11) monté sur le châssis (2), avec le matériel de fixation à l'attelage (20/21/101) sécurisant chaque extrémité"},"teaser":{"en":"Fourteen patents covering the Mach2 design — 13 US grants plus Canada Patent 2,956,005 (Carrier for a two-wheeled vehicle). Titles span the full mechanical stack: captive pin hitch retention, tray…","fr":"Quatorze brevets couvrant le design Mach2 — 13 délivrances américaines plus le brevet canadien 2 956 005 (Carrier for a two-wheeled vehicle). Les titres couvrent toute la pile mécanique : rétention…"},"full":{"en":"Fourteen patents covering the Mach2 design — 13 US grants plus Canada Patent 2,956,005 (Carrier for a two-wheeled vehicle). Titles span the full mechanical stack: captive pin hitch retention, tray assemblies with automatic position locks, sliding pawl ratchet bars, adjustable retention arms, and beam-joining apparatus. US 6,620,081 (exercise stand, notice of infringement filed) is a 16th Phillips patent adjacent to this family. Cal Phillips holds 19 additional bicycle-related patents beyond these 15 listed.","fr":"Quatorze brevets couvrant le design Mach2 — 13 délivrances américaines plus le brevet canadien 2 956 005 (Carrier for a two-wheeled vehicle). Les titres couvrent toute la pile mécanique : rétention d'attelage à broche captive, ensembles de plateau à verrous de position automatiques, barres à cliquet à loquet coulissant, bras de rétention réglables, et dispositif de jonction de poutres. L'US 6,620,081 (support d'exercice, avis de contrefaçon déposé) est un 16e brevet de Phillips adjacent à cette famille. Cal Phillips détient 19 brevets supplémentaires liés au vélo au-delà de ces 15 listés."}},{"num":"10603968","cat":"transport","title":{"en":"1UP USA independent rack patent (US 10,603,968)","fr":"Brevet de porte-vélos indépendant 1UP USA (US 10 603 968)"},"assignee":"1UP USA (Binghamton, NY)","img":"../pictures/US10603968B2.png","alt":{"en":"Figs. 3 and 4 of US 10,603,968 B2: an exploded view of the hitch bar (10) and receiver tube (34), showing the locking cylinder (30/32) and the anti-wobble tensioning slot (50/50a/50b/52) that draws the two together","fr":"Fig. 3 et 4 du brevet US 10 603 968 B2 : une vue éclatée de la barre d'attelage (10) et du tube récepteur (34), montrant le cylindre de verrouillage (30/32) et la fente de tension anti-vibration (50/50a/50b/52) qui rapproche les deux pièces"},"teaser":{"en":"1UP USA's own patent, independent of the Cal Phillips Mach2 family: a locking adjustable hitch receiver, with an anti-wobble device that secures and stabilizes the hitch bar inside the vehicle's…","fr":"Le brevet propre de 1UP USA, indépendant de la famille Mach2 de Cal Phillips : un récepteur d'attelage ajustable verrouillable, avec un dispositif anti-vibration qui sécurise et stabilise la barre…"},"full":{"en":"1UP USA's own patent, independent of the Cal Phillips Mach2 family: a locking adjustable hitch receiver, with an anti-wobble device that secures and stabilizes the hitch bar inside the vehicle's receiver, filed Nov. 30, 2017 and granted 2020. Filed after the original QuikRack patent expired. A second patent previously listed on this entry, US 11,142,133 (adjustable arm hooks for clamping bicycle tires), was reassigned to Lolo's entry after verification showed it belongs to Lolo founder Joseph Oshman, not 1UP — see the Lolo bike rack portfolio entry.","fr":"Le brevet propre de 1UP USA, indépendant de la famille Mach2 de Cal Phillips : un récepteur d'attelage ajustable verrouillable, avec un dispositif anti-vibration qui sécurise et stabilise la barre d'attelage à l'intérieur du récepteur du véhicule, déposé le 30 novembre 2017 et délivré en 2020. Déposé après l'expiration du brevet QuikRack original. Un second brevet auparavant listé sur cette fiche, US 11 142 133 (crochets de bras réglables pour serrer les pneus de vélo), a été réattribué à la fiche Lolo après qu'une vérification a montré qu'il appartient à Joseph Oshman, fondateur de Lolo, et non à 1UP — voir la fiche du portefeuille de porte-vélos Lolo."}},{"num":"11554724","cat":"transport","title":{"en":"VelociRAX C-hoop vertical hitch rack (US 11,554,724 + family)","fr":"Porte-vélos vertical à anneau en C VelociRAX (US 11,554,724 + famille)"},"assignee":"Charles Blake Owen & Bryce Allen Owen / East Mountain Outfitters LLC (Lehi, UT)","img":"../pictures/US11554724B2.png","alt":{"en":"Fig. 1 of US 11,554,724: an isometric view of the vertical hitch rack, showing the central mast (102) carrying two stacked sets of pivoting C-hoop wheel cradles — an upper set (103/106/108) and a lower set (103/110/122) — that fold down over each bike's tire","fr":"Fig. 1 du brevet US 11 554 724 : une vue isométrique du porte-vélos vertical sur attelage, montrant le mât central (102) portant deux ensembles superposés de berceaux pivotants en anneau en C pour les roues — un ensemble supérieur (103/106/108) et un ensemble inférieur (103/110/122) — qui se rabattent sur le pneu de chaque vélo"},"teaser":{"en":"A hitch-mounted rack that hangs bikes vertically by the front tire in a C-hoop, rather than laying them tray-style — letting four to seven bikes fit on a single hitch receiver in the footprint that a…","fr":"Un porte-vélos monté sur attelage qui suspend les vélos verticalement par le pneu avant dans un anneau en C, plutôt que de les coucher façon plateau — permettant à quatre à sept vélos de tenir sur un…"},"full":{"en":"A hitch-mounted rack that hangs bikes vertically by the front tire in a C-hoop, rather than laying them tray-style — letting four to seven bikes fit on a single hitch receiver in the footprint that a tray rack needs for two. Filed by Utah brothers Blake and Bryce Owen, who started prototyping in a 2018 self-reliance class before founding East Mountain Outfitters (the VelociRAX brand). US 11,554,724 (filed 2021, granted 2023) is the core C-hoop claim; the surrounding family adds the storage/access rack (11,572,022), a wall-mount version (11,858,575), an anti-rattle hitch clamp (12,005,866), and a 2025 damper continuation (12,384,302).","fr":"Un porte-vélos monté sur attelage qui suspend les vélos verticalement par le pneu avant dans un anneau en C, plutôt que de les coucher façon plateau — permettant à quatre à sept vélos de tenir sur un seul récepteur d'attelage dans l'encombrement qu'un porte-vélos à plateau nécessite pour deux. Déposé par les frères Blake et Bryce Owen, de l'Utah, qui ont commencé à prototyper lors d'un cours d'autosuffisance en 2018 avant de fonder East Mountain Outfitters (la marque VelociRAX). L'US 11,554,724 (déposé en 2021, délivré en 2023) est la revendication centrale de l'anneau en C ; la famille environnante ajoute le porte-vélos de rangement/accès (11,572,022), une version murale (11,858,575), une bride d'attelage anti-vibration (12,005,866), et une continuation d'amortisseur de 2025 (12,384,302)."}},{"num":"11518317","cat":"transport","title":{"en":"Lolo bike rack portfolio","fr":"Portefeuille de porte-vélos Lolo"},"assignee":"Joseph Oshman / Lolo (Portland, OR)","img":"../pictures/US11518317B2.png","alt":{"en":"Fig. 1 of US 11,518,317: an isometric view of the truck-bed rack (150) mounted along a rail (190), with a row of pivoting wheel cradles (100) clamping a bike wheel, and the rail-mounting hardware (101/102/103) at the near end","fr":"Fig. 1 du brevet US 11 518 317 : une vue isométrique du porte-vélos de plateau de camionnette (150) monté le long d'un rail (190), avec une rangée de berceaux de roue pivotants (100) serrant une roue de vélo, et la quincaillerie de fixation au rail (101/102/103) à l'extrémité proche"},"teaser":{"en":"Six US patent numbers associated with Lolo founder Joseph Oshman. Three are confirmed: 11,518,317 and 11,590,555, plus 11,142,133 (adjustable arm hooks for clamping bicycle tires) — verified against…","fr":"Six numéros de brevets américains associés à Joseph Oshman, fondateur de Lolo. Trois sont confirmés : 11 518 317 et 11 590 555, ainsi que 11 142 133 (crochets de bras réglables pour serrer les pneus…"},"full":{"en":"Six US patent numbers associated with Lolo founder Joseph Oshman. Three are confirmed: 11,518,317 and 11,590,555, plus 11,142,133 (adjustable arm hooks for clamping bicycle tires) — verified against Lolo's official patent-info page after a 2026-09-20 correction; previously misattributed in this atlas to 1UP USA. A fourth number on that page, 17,214,670, matches the format of a patent application serial number rather than a granted patent, pending verification of whether it resolved to a grant and under what number. Three further numbers — published applications 2022/0048345 and 2022/0281390, and granted patent 12,024,132 — remain unconfirmed: no independent source returned their titles, dates, or content, and they don't appear on Lolo's patent-info page. Included on Google Patents links carrying inventor-filter tracking parameters, and on Oshman's own confirmation that all six numbers are assigned to him personally rather than split between him and a corporate entity. `conf` stays \"m\" pending a primary-source read of the three unconfirmed numbers.","fr":"Six numéros de brevets américains associés à Joseph Oshman, fondateur de Lolo. Trois sont confirmés : 11 518 317 et 11 590 555, ainsi que 11 142 133 (crochets de bras réglables pour serrer les pneus de vélo) — vérifiés sur la page officielle des brevets de Lolo après une correction du 20 septembre 2026 ; auparavant attribués à tort à 1UP USA dans cet atlas. Un quatrième numéro sur cette page, 17 214 670, correspond au format d'un numéro de série de demande de brevet plutôt qu'à un brevet délivré, en attente de vérification quant à une éventuelle délivrance et sous quel numéro. Trois numéros supplémentaires — les demandes publiées 2022/0048345 et 2022/0281390, et le brevet délivré 12 024 132 — restent non confirmés : aucune source indépendante n'a renvoyé leur titre, leur date ou leur contenu, et ils n'apparaissent pas sur la page des brevets de Lolo. Inclus sur la foi de liens Google Patents portant des paramètres de suivi du filtre par inventeur, et de la confirmation d'Oshman lui-même que les six numéros lui sont cédés personnellement plutôt que répartis entre lui et une entité corporative. `conf` reste « m » en attendant une lecture en source primaire des trois numéros non confirmés."}},{"num":"7900802","cat":"transport","title":{"en":"Fork crown supported bicycle carrier (US 7,900,802)","fr":"Porte-vélo supporté par le té de fourche (US 7 900 802)"},"assignee":"Malcolm T. Hammond, later assigned to North Shore Racks Inc. (North Vancouver, BC)","img":"../pictures/US7900802B2.png","alt":{"en":"Fig. 4 of US 7,900,802 B2: a close-up front view of two adjacent bicycles' fork crowns (28) cradled side by side in the rack's rotating cradles (30), mounted on the horizontal support bar (14), showing how the cradle's rotation keeps the bikes' handlebars and forks from interfering with each other","fr":"Fig. 4 du brevet US 7 900 802 B2 : une vue de face rapprochée de deux tés de fourche de vélos adjacents (28) accueillis côte à côte dans les berceaux pivotants du porte-vélo (30), montés sur la barre de support horizontale (14), montrant comment la rotation du berceau évite que les guidons et fourches des vélos ne se gênent mutuellement"},"teaser":{"en":"North Shore Racks' foundational hitch-mount carrier hangs bikes vertically by the fork crown, front wheel up, with a rotating cradle that lets adjacent bikes' handlebars nest closer together than a…","fr":"Le porte-vélo d'attelage fondateur de North Shore Racks suspend les vélos verticalement par le té de fourche, roue avant vers le haut, avec un berceau pivotant qui permet aux guidons des vélos…"},"full":{"en":"North Shore Racks' foundational hitch-mount carrier hangs bikes vertically by the fork crown, front wheel up, with a rotating cradle that lets adjacent bikes' handlebars nest closer together than a horizontal tray rack allows. Filed February 20, 2004 and granted March 8, 2011 as US 7,900,802 — read directly off the patent's own front page, which lists it under inventor Malcolm T. Hammond alone, with no corporate assignee printed on the face; Google Patents' separately recorded 'current assignee' is North Shore Racks Inc., the company Hammond and his wife Alison founded in North Vancouver the year before this application was filed.","fr":"Le porte-vélo d'attelage fondateur de North Shore Racks suspend les vélos verticalement par le té de fourche, roue avant vers le haut, avec un berceau pivotant qui permet aux guidons des vélos adjacents de s'imbriquer plus près qu'un porte-vélo horizontal à plateau ne le permet. Déposé le 20 février 2004 et délivré le 8 mars 2011 sous le numéro US 7 900 802 — lu directement sur la première page du brevet, qui le répertorie sous le seul inventeur Malcolm T. Hammond, sans cessionnaire corporatif imprimé sur la page de garde ; le « cessionnaire actuel » enregistré séparément par Google Patents est North Shore Racks Inc., l'entreprise que Hammond et son épouse Alison ont fondée à North Vancouver l'année précédant le dépôt de cette demande."}},{"num":"10668866","cat":"transport","title":{"en":"Hitch-mounted bicycle carrier (US 10,668,866)","fr":"Porte-vélo d'attelage (US 10 668 866)"},"assignee":"Luke Kuschmeader, Michael Buis, Jordan K. Bowles, Joshua H. Schwartz & Aaron A. Houston / Kuat Innovations, LLC (Springfield, MO)","img":"../pictures/US10668866B2.png","alt":{"en":"A patent drawing of US 10,668,866 B2 showing the carrier's pivoting arm assembly (12–34) folded up into its tilted, trunk-access position beside a vehicle's rear door (8) and wheel, connected to the vehicle via the hitch-shank tube (4)","fr":"Un dessin du brevet US 10 668 866 B2 montrant l'ensemble à bras pivotant du porte-vélos (12-34) replié en position inclinée d'accès au coffre, à côté de la porte arrière (8) et de la roue d'un véhicule, relié à celui-ci par la tige d'attelage (4)"},"teaser":{"en":"Kuat's core hitch-carrier patent: a pivoting carrier with front and rear wheel-tray assemblies, a hook-arm assembly that extends, retracts and ratchets onto a wheel, and a hitch-shank ball-cam mount,…","fr":"Le brevet fondateur de porte-vélos d'attelage de Kuat : un porte-vélos pivotant avec des ensembles de plateaux de roue avant et arrière, un ensemble bras-crochet qui s'étend, se rétracte et…"},"full":{"en":"Kuat's core hitch-carrier patent: a pivoting carrier with front and rear wheel-tray assemblies, a hook-arm assembly that extends, retracts and ratchets onto a wheel, and a hitch-shank ball-cam mount, the whole assembly pivoting between storage, trunk-access, and use positions. Filed September 15, 2017 (on a September 2016 provisional) by Luke Kuschmeader, Michael Buis, Jordan K. Bowles, Joshua H. Schwartz and Aaron A. Houston, and granted June 2, 2020 as US 10,668,866 — read directly off the patent's own front page, which also cites Kuat's own 2013 'NV' rack demo video as prior art. Kuat's other marketed patents (FastFit wheel-size adjustment, EasyClip tray tabs) remain unlocated by number.","fr":"Le brevet fondateur de porte-vélos d'attelage de Kuat : un porte-vélos pivotant avec des ensembles de plateaux de roue avant et arrière, un ensemble bras-crochet qui s'étend, se rétracte et s'enclenche par cliquet sur une roue, et une fixation à came à bille sur la tige d'attelage, l'ensemble pivotant entre les positions de rangement, d'accès au coffre et d'utilisation. Déposé le 15 septembre 2017 (sur la base d'une demande provisoire de septembre 2016) par Luke Kuschmeader, Michael Buis, Jordan K. Bowles, Joshua H. Schwartz et Aaron A. Houston, et délivré le 2 juin 2020 sous le numéro US 10 668 866 — lu directement sur la première page du brevet, qui cite aussi la propre vidéo de démonstration du rack « NV » de Kuat datant de 2013 comme antériorité. Les autres brevets revendiqués par Kuat (ajustement de taille de roue FastFit, languettes de plateau EasyClip) restent non localisés par leur numéro."}},{"num":"20250018873","cat":"transport","title":{"en":"Saris MHS Modular Hitch System (US 2025/0018873 A1)","fr":"Saris MHS Modular Hitch System (US 2025/0018873 A1)"},"assignee":"James Weinert, Erik Eagleman, Kellen Pagel & Jeffery Iverson / Saris Equipment LLC (Madison, WI)","img":"../pictures/US20250018873A1.png","alt":{"en":"Fig. 3E of US 2025/0018873 A1: an exploded detail view of the hitch mounting section, showing the mounting bar (44/45) sliding into the vehicle's hitch receiver (40) and secured with a hitch pin, next to the pivoting beam (47)","fr":"Fig. 3E du brevet US 2025/0018873 A1 : une vue de détail éclatée de la section de fixation d'attelage, montrant la barre de fixation (44/45) s'insérant dans le récepteur d'attelage du véhicule (40) et fixée par une goupille d'attelage, à côté du bras pivotant (47)"},"teaser":{"en":"US 2025/0018873 A1, 'Modular hitch-mounted equipment carrier system,' filed November 17, 2022 (application 18/711,489) and published January 16, 2025, naming inventors James Weinert, Erik Eagleman,…","fr":"US 2025/0018873 A1, « Modular hitch-mounted equipment carrier system », déposé le 17 novembre 2022 (demande 18/711 489) et publié le 16 janvier 2025, au nom des inventeurs James Weinert, Erik…"},"full":{"en":"US 2025/0018873 A1, 'Modular hitch-mounted equipment carrier system,' filed November 17, 2022 (application 18/711,489) and published January 16, 2025, naming inventors James Weinert, Erik Eagleman, Kellen Pagel and Jeffery Iverson, assigned to Saris Equipment LLC. The claims cover a single support member — a mounting bar that slots into the vehicle's hitch receiver, a beam pivoting on that mounting section with at least one attachment area for a carrier component, a rear handle for repositioning the beam, and a bumper that holds the beam's rear end clear of the ground when it's tilted up — the base interface the MHS system's interchangeable bike, cargo and accessory carriers attach to. Still pending; no grant yet.","fr":"US 2025/0018873 A1, « Modular hitch-mounted equipment carrier system », déposé le 17 novembre 2022 (demande 18/711 489) et publié le 16 janvier 2025, au nom des inventeurs James Weinert, Erik Eagleman, Kellen Pagel et Jeffery Iverson, cédé à Saris Equipment LLC. Les revendications couvrent un support unique — une barre de fixation qui s'insère dans le récepteur d'attelage du véhicule, un bras pivotant sur cette section de fixation avec au moins une zone de montage pour un composant porteur, une poignée arrière pour repositionner le bras, et un pare-chocs qui maintient l'extrémité arrière du bras au-dessus du sol lorsqu'il est incliné — l'interface de base à laquelle se fixent les porte-vélos, porte-cargaisons et plateaux d'accessoires interchangeables du système MHS. Toujours en instance ; pas encore de délivrance."}},{"num":"7726529","cat":"transport","title":{"en":"Yakima fork-mount bicycle carrier (US 7,726,529)","fr":"Porte-vélo à fixation de fourche Yakima (US 7 726 529)"},"assignee":"Aaron J. Foley / Yakima Products, Inc. (Beaverton, OR)","img":"../pictures/US7726529B2.png","alt":{"en":"Fig. 1 of US 7,726,529: an isometric view of the fork-mount bicycle carrier, showing the mounting head (26/28/30/32) that clamps to a roof crossbar (16), the raised carrier arm (22) that cradles the bike's fork dropouts, and the strap-and-buckle assembly (96/98/100/110) that secures the front wheel to a second crossbar","fr":"Fig. 1 du brevet US 7 726 529 : une vue isométrique du porte-vélo à fixation de fourche, montrant la tête de fixation (26/28/30/32) qui se serre sur une barre de toit (16), le bras porteur surélevé (22) qui accueille les pattes de fourche du vélo, et l'ensemble sangle-boucle (96/98/100/110) qui sécurise la roue avant sur une seconde barre de toit"},"teaser":{"en":"US 7,726,529, \"Bicycle carrier,\" a division of application Ser. No. 11/502,604 (filed August 9, 2006) by inventor Aaron J. Foley, granted June 1, 2010 and assigned to Yakima Products, Inc. of…","fr":"US 7 726 529, « Bicycle carrier », une division de la demande n° de série 11/502 604 (déposée le 9 août 2006) par l'inventeur Aaron J. Foley, délivrée le 1er juin 2010 et cédée à Yakima Products, Inc.…"},"full":{"en":"US 7,726,529, \"Bicycle carrier,\" a division of application Ser. No. 11/502,604 (filed August 9, 2006) by inventor Aaron J. Foley, granted June 1, 2010 and assigned to Yakima Products, Inc. of Beaverton, Oregon. As a divisional application it inherits the parent's August 2006 filing date for term purposes rather than its own later filing date — the same rule this atlas applies to the WickWerks/RampWerks continuations elsewhere. The carrier clamps a bicycle by its fork, with a skewer assembly replacing the front wheel's own quick-release, while a separate strap secures the front wheel to a second crossbar.","fr":"US 7 726 529, « Bicycle carrier », une division de la demande n° de série 11/502 604 (déposée le 9 août 2006) par l'inventeur Aaron J. Foley, délivrée le 1er juin 2010 et cédée à Yakima Products, Inc. de Beaverton (Oregon). En tant que demande divisionnaire, elle hérite de la date de dépôt d'août 2006 de la demande parente aux fins du calcul de la durée, plutôt que de sa propre date de dépôt ultérieure — la même règle que cet atlas applique aux continuations WickWerks/RampWerks ailleurs. Le porte-vélo serre le vélo par sa fourche, un ensemble à tige rapide remplaçant le serrage rapide de la roue avant, tandis qu'une sangle distincte sécurise la roue avant sur une seconde barre de toit."}},{"num":"10780837","cat":"transport","title":{"en":"Yakima roof rack with pivoting loading arm (US 10,780,837)","fr":"Galerie de toit Yakima à bras de chargement pivotant (US 10 780 837)"},"assignee":"Chris Sautter, Scott A. McFadden, Ashley Hoch & Warren E. Stoneburner / Yakima Products, Inc.","img":"../pictures/US10780837B2.png","alt":{"en":"Fig. 1 of US 10,780,837: the complete rack system mounted on an SUV roof, showing the extendable rails (14/24/26) pivoted down along the vehicle's side with straps (22) securing two kayaks (12), and the stationary base (18/48) still mounted on the crossbars","fr":"Fig. 1 du brevet US 10 780 837 : le système complet monté sur le toit d'un VUS, montrant les rails extensibles (14/24/26) pivotés vers le bas le long du véhicule avec des sangles (22) fixant deux kayaks (12), et la base fixe (18/48) toujours montée sur les barres transversales"},"teaser":{"en":"US 10,780,837, \"Vehicle rack with loading apparatus\" (filed December 14, 2017, granted September 22, 2020, anticipated expiration 2037), covers a pair of crossbar-mounted longitudinal rails that…","fr":"US 10 780 837, « Vehicle rack with loading apparatus » (galerie avec dispositif de chargement), déposé le 14 décembre 2017, délivré le 22 septembre 2020, expiration prévue en 2037, couvre une paire de…"},"full":{"en":"US 10,780,837, \"Vehicle rack with loading apparatus\" (filed December 14, 2017, granted September 22, 2020, anticipated expiration 2037), covers a pair of crossbar-mounted longitudinal rails that extend well beyond the roofline and pivot downward along the vehicle's side, each tipped with a loading arm that swings out from a collapsed, rail-parallel position to an extended loading position.","fr":"US 10 780 837, « Vehicle rack with loading apparatus » (galerie avec dispositif de chargement), déposé le 14 décembre 2017, délivré le 22 septembre 2020, expiration prévue en 2037, couvre une paire de rails longitudinaux montés sur barres transversales qui s'étendent bien au-delà de la ligne de toit et pivotent vers le bas le long du véhicule, chacun équipé d'un bras de chargement qui se déploie depuis une position repliée parallèle au rail jusqu'à une position de chargement étendue."}},{"num":"11351929","cat":"transport","title":{"en":"Yakima hitch-mounted bike rack, fork-crown gripping (US 11,351,929)","fr":"Porte-vélos Yakima sur attelage, fixation par couronne de fourche (US 11 351 929)"},"assignee":"Scott A. McFadden, Gian-Marco D'Angelo, Jason Attfield Sagen, Warren E. Stoneburner & Brandon Michael Willems / Yakima Products, Inc.","img":"../pictures/US11351929B2.png","alt":{"en":"Two views from US 11,351,929: the full mast assembly (left) with fork-crown gripping arms (70) reaching up from the rail (50/56) toward the hitch mount (35/40), and a detail of the hitch mount's own locking mechanism (right), showing the clamp (272/276/277) and its locking knob (280) that secures the mast to the hitch receiver","fr":"Deux vues du brevet US 11 351 929 : l'ensemble complet du mât (à gauche) avec les bras de préhension de couronne de fourche (70) remontant depuis le rail (50/56) vers le montage sur attelage (35/40), et un détail du mécanisme de verrouillage du montage sur attelage (à droite), montrant la pince (272/276/277) et son bouton de verrouillage (280) qui fixe le mât au récepteur d'attelage"},"teaser":{"en":"US 11,351,929, \"Hitch-mounted bicycle rack system\" (filed November 30, 2020, granted June 7, 2022, anticipated expiration 2038), covers a hitch-mounted mast with an upper beam carrying a fork-crown…","fr":"US 11 351 929, « Hitch-mounted bicycle rack system » (système de porte-vélos monté sur attelage), déposé le 30 novembre 2020, délivré le 7 juin 2022, expiration prévue en 2038, couvre un mât monté sur…"},"full":{"en":"US 11,351,929, \"Hitch-mounted bicycle rack system\" (filed November 30, 2020, granted June 7, 2022, anticipated expiration 2038), covers a hitch-mounted mast with an upper beam carrying a fork-crown gripping station — a post-and-strap fixture that binds the bike by its front fork crown rather than by a wheel or frame tube, holding the bike upright without the frame contact that can scratch carbon.","fr":"US 11 351 929, « Hitch-mounted bicycle rack system » (système de porte-vélos monté sur attelage), déposé le 30 novembre 2020, délivré le 7 juin 2022, expiration prévue en 2038, couvre un mât monté sur attelage portant une poutre supérieure équipée d'une station de préhension par couronne de fourche — un dispositif à montant et sangle qui retient le vélo par la couronne de sa fourche avant plutôt que par une roue ou un tube de cadre, maintenant le vélo droit sans le contact sur cadre qui peut rayer le carbone."}},{"num":null,"cat":"transport","title":{"en":"Rut Rack no-touch hitch carrier (patent pending)","fr":"Porte-vélos d'attelage sans contact Rut Rack (brevet en instance)"},"assignee":"Wayne Lockwood / Rut Rack","img":"../pictures/simple-bike-rack-2048x1365.jpg","alt":{"en":"FIG. 17 of the Rut Rack application: a bike resting in the rack (100) behind a vehicle (199)","fr":"FIG. 17 de la demande Rut Rack : un vélo posé dans le porte-vélos (100) derrière un véhicule (199)"},"teaser":{"en":"A utility patent application filed by inventor Wayne Lockwood on June 4, 2025, still under USPTO examination. The design holds the bike with zero moving parts and no straps — friction and an unusually…","fr":"Une demande de brevet d'utilité déposée par l'inventeur Wayne Lockwood le 4 juin 2025, toujours en cours d'examen par l'USPTO. Le design maintient le vélo sans aucune pièce mobile ni sangle — c'est la…"},"full":{"en":"A utility patent application filed by inventor Wayne Lockwood on June 4, 2025, still under USPTO examination. The design holds the bike with zero moving parts and no straps — friction and an unusually low resting center of gravity do the work instead, sitting the bike lower than a standard hitch tray for better stability and rear visibility. Lockwood has loaded a 45 lb bike on the aluminum version and says a steel prototype could handle 200 lb. No application or publication number is public yet: USPTO applications typically publish around 18 months after filing, which would put a real number in reach roughly by early 2027.","fr":"Une demande de brevet d'utilité déposée par l'inventeur Wayne Lockwood le 4 juin 2025, toujours en cours d'examen par l'USPTO. Le design maintient le vélo sans aucune pièce mobile ni sangle — c'est la friction et un centre de gravité au repos anormalement bas qui font le travail, plaçant le vélo plus bas qu'un plateau d'attelage standard pour une meilleure stabilité et une meilleure visibilité arrière. Lockwood a chargé un vélo de 45 lb (20 kg) sur la version en aluminium et affirme qu'un prototype en acier pourrait supporter 200 lb (90 kg). Aucun numéro de demande ou de publication n'est encore public : les demandes de l'USPTO sont généralement publiées environ 18 mois après le dépôt, ce qui situerait un numéro réel vers début 2027."}},{"num":"6099008","cat":"transport","title":{"en":"Burley bicycle trailer hitch (US 6,099,008)","fr":"Attache de remorque de vélo Burley (US 6 099 008)"},"assignee":"Stephen Patrick Caffey / Burley Design Cooperative","img":"../pictures/US6099008A.png","alt":{"en":"Fig. 2 of US 6,099,008, an exploded view of the axle-mounted hitch: the frame-contacting clamp (30/36) secured by the wheel's own skewer (24), the rotating hitch-mount body (10) with its locking arm (40) and pull-pin retainer (44/48/52), and the dropout hardware (26/27/54) it clamps around","fr":"Fig. 2 du brevet US 6 099 008, vue éclatée de l'attache montée sur l'axe : le collier de contact avec le cadre (30/36) fixé par l'axe passe-rapide de la roue (24), le corps d'attache rotatif (10) avec son bras de verrouillage (40) et sa goupille de retenue (44/48/52), et la ferrure de patte (26/27/54) autour de laquelle il se fixe"},"teaser":{"en":"US 6,099,008, \"Hitch for Bicycle Trailer,\" filed September 1, 1998 by Stephen Patrick Caffey and granted August 8, 2000 to Burley Design Cooperative of Eugene, Oregon. A hitch mount clamps to the…","fr":"US 6 099 008, « Hitch for Bicycle Trailer », déposé le 1er septembre 1998 par Stephen Patrick Caffey et délivré le 8 août 2000 à Burley Design Cooperative d'Eugene, Oregon. Un support d'attache se…"},"full":{"en":"US 6,099,008, \"Hitch for Bicycle Trailer,\" filed September 1, 1998 by Stephen Patrick Caffey and granted August 8, 2000 to Burley Design Cooperative of Eugene, Oregon. A hitch mount clamps to the bicycle's rear axle rather than the seatpost or frame, carrying a rotating hitch-mount body that the trailer's own tongue-mounted connector clips onto and releases from.","fr":"US 6 099 008, « Hitch for Bicycle Trailer », déposé le 1er septembre 1998 par Stephen Patrick Caffey et délivré le 8 août 2000 à Burley Design Cooperative d'Eugene, Oregon. Un support d'attache se fixe sur l'axe de roue arrière du vélo plutôt que sur la tige de selle ou le cadre, portant un corps d'attache rotatif sur lequel le connecteur monté au timon de la remorque s'enclenche et se libère."}},{"num":"EP3927592","cat":"transport","title":{"en":"Doppelmayr Bike Cab gondola cabin (EP 3,927,592)","fr":"Cabine Bike Cab de Doppelmayr pour télécabine (EP 3 927 592)"},"assignee":"Daniel Mangold, Florian Trittler / Innova Patent GmbH (Doppelmayr, Austria)","img":"../pictures/WO2020169226A1.png","alt":{"en":"Fig. 2 of WO 2020/169226: two views of the cabin frame (2) with its central column (12) and wheel holders (13) in the roof area; in the right-hand view a mountain bike hangs by its front wheel from one holder","fr":"Fig. 2 du WO 2020/169226 : deux vues du cadre de la cabine (2) avec sa colonne centrale (12) et ses supports de roue (13) sous le toit ; dans la vue de droite, un VTT est suspendu par sa roue avant à l'un des supports"},"teaser":{"en":"A gondola cabin with no seats, built to carry bicycles: the same outside size as a standard passenger cabin, with a central column carrying eight wheel holders. Riders step onto a tread plate, lift…","fr":"Une cabine de télécabine sans sièges, conçue pour transporter des vélos : même taille extérieure qu'une cabine passagers standard, avec une colonne centrale portant huit supports de roue. Le cycliste…"},"full":{"en":"A gondola cabin with no seats, built to carry bicycles: the same outside size as a standard passenger cabin, with a central column carrying eight wheel holders. Riders step onto a tread plate, lift the front wheel into an empty holder and let go; the column then turns to present the next open slot. Priority date February 19, 2019; granted as Austrian patent AT 521785 B1 and European patent EP 3,927,592 B1 (September 2023), also published as WO 2020/169226. Doppelmayr sells it as the Bike Cab, first run in 2021 on the Rotkoglbahn at Sölden, Austria.","fr":"Une cabine de télécabine sans sièges, conçue pour transporter des vélos : même taille extérieure qu'une cabine passagers standard, avec une colonne centrale portant huit supports de roue. Le cycliste monte sur une marche, place la roue avant dans un support libre et lâche le vélo ; la colonne tourne ensuite pour présenter l'emplacement libre suivant. Date de priorité : 19 février 2019 ; délivré comme brevet autrichien AT 521785 B1 et brevet européen EP 3 927 592 B1 (septembre 2023), également publié sous WO 2020/169226. Doppelmayr la commercialise sous le nom Bike Cab, mise en service pour la première fois en 2021 sur la Rotkoglbahn à Sölden (Autriche)."}},{"num":"11090977","cat":"wheel","title":{"en":"SUNringlé & Reynolds wheel/hub patent (US 11,090,977)","fr":"Brevet de roue/moyeu SUNringlé et Reynolds (US 11 090 977)"},"assignee":"Hayes Bicycle Group (SUNringlé / Reynolds)","img":"../pictures/US11090977B2.png","alt":{"en":"Fig. 2B and Fig. 3 of US 11,090,977, showing the rear hub's exploded assembly — the drawing shared across both of Hayes' wheel brands, since one patent covers both","fr":"Fig. 2B et Fig. 3 du brevet US 11 090 977, montrant l'ensemble éclaté du moyeu arrière — le dessin partagé entre les deux marques de roues de Hayes, un seul brevet couvrant les deux"},"teaser":{"en":"US 11,090,977, filed 2018 and granted 2021, covers Hayes Bicycle Group's shared wheel/hub engineering across its two wheel brands: it's cited on Reynolds' DH-focused A307/A309 and Blacklabel rims as…","fr":"L'US 11 090 977, déposé en 2018 et délivré en 2021, couvre l'ingénierie de roue/moyeu partagée de Hayes Bicycle Group entre ses deux marques de roues : il est cité sur les jantes DH A307/A309 et…"},"full":{"en":"US 11,090,977, filed 2018 and granted 2021, covers Hayes Bicycle Group's shared wheel/hub engineering across its two wheel brands: it's cited on Reynolds' DH-focused A307/A309 and Blacklabel rims as well as on SUNringlé's own wheelsets, confirming the number is shared IP across Hayes-owned brands rather than a typo appearing twice.","fr":"L'US 11 090 977, déposé en 2018 et délivré en 2021, couvre l'ingénierie de roue/moyeu partagée de Hayes Bicycle Group entre ses deux marques de roues : il est cité sur les jantes DH A307/A309 et Blacklabel de Reynolds ainsi que sur les propres roues de SUNringlé, confirmant que ce numéro est une propriété intellectuelle partagée entre les marques détenues par Hayes plutôt qu'une coquille répétée."}},{"num":"8936136","cat":"comp","title":{"en":"Hayes modern brake portfolio (7 patents)","fr":"Portefeuille moderne de freins Hayes (7 brevets)"},"assignee":"Hayes Bicycle Group","img":"../pictures/US8936136B2.png","alt":{"en":"Figure I of US 8,936,136: the brake caliper (21) mounted to a fork lower leg (26), showing the pad-adjustment hardware (30/32) and mounting bolts (34/42) that keep the pads centered on the rotor (22) as they wear","fr":"Figure I du brevet US 8 936 136 : l'étrier de frein (21) monté sur un fourreau de fourche (26), montrant le matériel de réglage des plaquettes (30/32) et les boulons de fixation (34/42) qui maintiennent les plaquettes centrées sur le disque (22) à mesure qu'elles s'usent"},"teaser":{"en":"Seven patents cover the current Dominion, Prime and Radar lineups — filed roughly two decades after the original 1996 Hayes Mag entry already in this atlas.","fr":"Sept brevets couvrent les gammes actuelles Dominion, Prime et Radar — déposés environ deux décennies après la fiche originale du Hayes Mag de 1996 déjà présente dans cet atlas."},"full":{"en":"Seven patents cover the current Dominion, Prime and Radar lineups — filed roughly two decades after the original 1996 Hayes Mag entry already in this atlas.","fr":"Sept brevets couvrent les gammes actuelles Dominion, Prime et Radar — déposés environ deux décennies après la fiche originale du Hayes Mag de 1996 déjà présente dans cet atlas."}},{"num":"11091218","cat":"fork","title":{"en":"MRP suspension portfolio — Ribbon, Raven, Bartlett, Baxter (6 patents)","fr":"Portefeuille de suspension MRP — Ribbon, Raven, Bartlett, Baxter (6 brevets)"},"assignee":"Eko Sport, Inc. d/b/a Mountain Racing Products (Boulder, CO)","img":"../pictures/US11091218B2.png","alt":{"en":"Two damper cross-sections from US 11,091,218: left, a single-cartridge coil/shim-stack damper (springs 1204/1208/1234, valve/piston stack 1220–1250) inside its fork-leg tube (1206/1210/1214); right, a twin-bore damper with a mirrored pair of coil-spring stacks (1312–1370) either side of a central divider, inside a longer leg tube (1306/1308/1310) — the internal damper architecture MRP's marking page lists across the Ribbon, Raven, Bartlett and Baxter fork lines","fr":"Deux coupes d'amortisseur de l'US 11 091 218 : à gauche, un amortisseur à cartouche unique à ressort/pile de rondelles (ressorts 1204/1208/1234, ensemble valve/piston 1220-1250) à l'intérieur de son tube de fourreau (1206/1210/1214) ; à droite, un amortisseur à double alésage avec une paire symétrique de piles de ressorts hélicoïdaux (1312-1370) de part et d'autre d'un séparateur central, à l'intérieur d'un tube de fourreau plus long (1306/1308/1310) — l'architecture d'amortisseur interne que la page de marquage de MRP liste pour ses gammes de fourches Ribbon, Raven, Bartlett et Baxter"},"teaser":{"en":"MRP's virtual marking page covers the damper architecture across its Ribbon, Raven, Bartlett and Baxter fork lines with six core patents; the QR axle is separately listed as patent-pending.","fr":"La page de marquage virtuel de MRP couvre l'architecture d'amortisseur de ses gammes de fourches Ribbon, Raven, Bartlett et Baxter avec six brevets centraux ; l'axe QR est listé séparément comme en…"},"full":{"en":"MRP's virtual marking page covers the damper architecture across its Ribbon, Raven, Bartlett and Baxter fork lines with six core patents; the QR axle is separately listed as patent-pending.","fr":"La page de marquage virtuel de MRP couvre l'architecture d'amortisseur de ses gammes de fourches Ribbon, Raven, Bartlett et Baxter avec six brevets centraux ; l'axe QR est listé séparément comme en instance de brevet."}},{"num":"11613326","cat":"comp","title":{"en":"MRP chainguide portfolio — G5, AMg, 1X, GCX (4 patents)","fr":"Portefeuille de guide-chaînes MRP — G5, AMg, 1X, GCX (4 brevets)"},"assignee":"Eko Sport, Inc. d/b/a Mountain Racing Products","img":"../pictures/US11613326B2.png","alt":{"en":"Fig. 2 of US 11,613,326 B2: the chainguide (100) mounted at the bottom bracket, wrapping the chain (6) around the chainring (1) between the crank arms (3/4), with force-direction arrows (12/13/14) showing the guide's load paths","fr":"Fig. 2 du brevet US 11 613 326 B2 : le guide-chaîne (100) monté au niveau du boîtier de pédalier, enveloppant la chaîne (6) autour du plateau (1) entre les manivelles (3/4), avec des flèches de direction des forces (12/13/14) montrant les trajets de charge du guide"},"teaser":{"en":"The G5 chainguide is covered by three older patents (9,327,786, 8,491,429, 8,235,849), while the newer AMg/1X/GCX family carries 11,613,326, with additional filings pending.","fr":"Le guide-chaîne G5 est couvert par trois brevets plus anciens (9,327,786, 8,491,429, 8,235,849), tandis que la nouvelle famille AMg/1X/GCX porte le numéro 11,613,326, avec d'autres dépôts en instance."},"full":{"en":"The G5 chainguide is covered by three older patents (9,327,786, 8,491,429, 8,235,849), while the newer AMg/1X/GCX family carries 11,613,326, with additional filings pending.","fr":"Le guide-chaîne G5 est couvert par trois brevets plus anciens (9,327,786, 8,491,429, 8,235,849), tandis que la nouvelle famille AMg/1X/GCX porte le numéro 11,613,326, avec d'autres dépôts en instance."}},{"num":"11293537","cat":"drive","title":{"en":"MRP Wave Ring chainring (US + EP/UK + DE)","fr":"Plateau Wave Ring de MRP (US + EP/UK + DE)"},"assignee":"Eko Sport, Inc. d/b/a Mountain Racing Products","img":"../pictures/US11293537B2.png","alt":{"en":"Fig. 1 of US 11,293,537, sheet 1 of 15: a length of roller chain in side and top view, with alternating outer and inner links (100, 102), the pitch (104) and the inner and outer link widths (103, 106) marked","fr":"Fig. 1 du brevet US 11 293 537, planche 1 sur 15 : un tronçon de chaîne à rouleaux vu de profil et de dessus, avec maillons extérieurs et intérieurs alternés (100, 102), le pas (104) et les largeurs intérieure et extérieure des maillons (103, 106)"},"teaser":{"en":"Five US patents plus a combined EP/UK filing (3,111,109) and a German grant (DE 602015077) protect the Wave Ring's tooth-profile geometry — MRP's only chainring-specific filing, separate from its fork…","fr":"Cinq brevets américains plus un dépôt combiné EP/UK (3 111 109) et une délivrance allemande (DE 602015077) protègent la géométrie du profil de denture du Wave Ring — le seul dépôt spécifique à un…"},"full":{"en":"Five US patents plus a combined EP/UK filing (3,111,109) and a German grant (DE 602015077) protect the Wave Ring's tooth-profile geometry — MRP's only chainring-specific filing, separate from its fork and chainguide portfolios.","fr":"Cinq brevets américains plus un dépôt combiné EP/UK (3 111 109) et une délivrance allemande (DE 602015077) protègent la géométrie du profil de denture du Wave Ring — le seul dépôt spécifique à un plateau de MRP, distinct de ses portefeuilles de fourches et de guide-chaînes."}},{"num":"10677338","cat":"drive","title":{"en":"WickWerks ramped chainring, continuation (US 10,677,338)","fr":"Plateau à rampes WickWerks, continuation (US 10 677 338)"},"assignee":"Christopher A. Wickliffe / WickWerks, LLC → RampWerks, LLC","img":"../pictures/US10677338B2.png","alt":{"en":"Patent figure from US 10,677,338: a face-on view of the chainring showing the four distinct ramp profiles (150A-150D) machined into the tooth roots, the shaped lifting surfaces (112/114) and the rotation direction (R) they depend on — the geometry RampWerks asserted against absoluteBLACK","fr":"Figure du brevet US 10 677 338 : une vue de face du plateau montrant les quatre profils de rampe distincts (150A-150D) usinés dans les creux de dents, les surfaces de levée façonnées (112/114) et le sens de rotation (R) dont elles dépendent — la géométrie que RampWerks a invoquée contre absoluteBLACK"},"teaser":{"en":"'Bicycle chain rings' — filed June 12, 2017 as a continuation within a family running back to a Sept. 27, 2005 provisional and an April 3, 2006 non-provisional parent (Ser. No. 11/397,234), the same…","fr":"« Bicycle chain rings » — déposé le 12 juin 2017 en tant que continuation d'une famille remontant à une demande provisoire du 27 sept. 2005 et à une demande non provisoire mère du 3 avril 2006 (n° de…"},"full":{"en":"'Bicycle chain rings' — filed June 12, 2017 as a continuation within a family running back to a Sept. 27, 2005 provisional and an April 3, 2006 non-provisional parent (Ser. No. 11/397,234), the same lineage that produced WickWerks' earlier 8,092,329 / 8,506,436 / 8,821,329 / 9,791,033 grants (all titled 'Bicycle chain rings with ramps'). Covers WickWerks' ramped-tooth profile — teeth shaped with lifting surfaces that pick the chain up cleanly at specific points in the rotation for cleaner shifting under load. Reassigned from WickWerks, LLC to RampWerks, LLC on May 22, 2023, four days before RampWerks sued absoluteBLACK and Playtri over it. Grant year is estimated from USPTO numbering pace, not independently confirmed this pass.","fr":"« Bicycle chain rings » — déposé le 12 juin 2017 en tant que continuation d'une famille remontant à une demande provisoire du 27 sept. 2005 et à une demande non provisoire mère du 3 avril 2006 (n° de série 11/397,234), la même lignée qui a produit les brevets antérieurs 8 092 329 / 8 506 436 / 8 821 329 / 9 791 033 de WickWerks (tous intitulés « Bicycle chain rings with ramps »). Couvre le profil de dents à rampes de WickWerks — des dents façonnées avec des surfa
