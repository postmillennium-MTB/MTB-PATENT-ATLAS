ces de levée qui saisissent proprement la chaîne à des points précis de la rotation pour un passage de vitesses plus net sous charge. Cédé par WickWerks, LLC à RampWerks, LLC le 22 mai 2023, quatre jours avant que RampWerks ne poursuive absoluteBLACK et Playtri à son sujet. L'année de délivrance est estimée d'après le rythme de numérotation de l'USPTO, non confirmée de façon indépendante cette fois-ci."}},{"num":"10711875","cat":"drive","title":{"en":"WickWerks ramped chainring, continuation (US 10,711,875)","fr":"Plateau à rampes WickWerks, continuation (US 10 711 875)"},"assignee":"Christopher A. Wickliffe & Eldon Goates / WickWerks, LLC → RampWerks, LLC","img":"../pictures/US10711875B2.png","alt":{"en":"Fig. 1 of US 10,711,875: a face-on view of the chainring (100) with its four ramp profiles (150A-150D) machined into the tooth roots, bolt-hole bosses (104), lifting surfaces (108/112/114/128) and the rotation direction (R) they depend on","fr":"Fig. 1 du brevet US 10 711 875 : une vue de face du plateau (100) avec ses quatre profils de rampe (150A-150D) usinés dans les creux de dents, les bossages de trous de boulon (104), les surfaces de levée (108/112/114/128) et le sens de rotation (R) dont elles dépendent"},"teaser":{"en":"'Bicycle chain rings' — granted July 14, 2020, filed as a continuation of an application from Aug. 29, 2014 (Ser. No. 14/473,170). Reading this patent's own front page in full (its \"Related U.S.…","fr":"« Bicycle chain rings » — délivré le 14 juillet 2020, déposé comme continuation d'une demande du 29 août 2014 (n° de série 14/473,170). La lecture complète de la première page de ce brevet (sa section…"},"full":{"en":"'Bicycle chain rings' — granted July 14, 2020, filed as a continuation of an application from Aug. 29, 2014 (Ser. No. 14/473,170). Reading this patent's own front page in full (its \"Related U.S. Application Data\" section runs onto a second page) shows the continuation chain does not stop at a 2011 parent as this entry previously stated — it continues through the identical 2011/2008 links as the 10,677,338 entry above, back to the same April 3, 2006 non-provisional parent (Ser. No. 11/397,234) and Sept. 27, 2005 provisional. This is the same family, not a separate later-rooted one. Assigned to WickWerks, LLC on Nov. 8, 2017, then to RampWerks, LLC on May 22, 2023, four days before the absoluteBLACK/Playtri suit.","fr":"« Bicycle chain rings » — délivré le 14 juillet 2020, déposé comme continuation d'une demande du 29 août 2014 (n° de série 14/473,170). La lecture complète de la première page de ce brevet (sa section « Related U.S. Application Data » se poursuit sur une seconde page) montre que la chaîne de continuation ne s'arrête pas à une mère de 2011 comme cette fiche l'affirmait auparavant — elle continue par les mêmes maillons 2011/2008 que la fiche 10 677 338 ci-dessus, jusqu'à la même demande non provisoire mère du 3 avril 2006 (n° de série 11/397,234) et à la demande provisoire du 27 sept. 2005. C'est la même famille, pas une lignée distincte à racine plus récente. Cédé à WickWerks, LLC le 8 nov. 2017, puis à RampWerks, LLC le 22 mai 2023, quatre jours avant le procès absoluteBLACK/Playtri."}},{"num":"20040200314","cat":"drive","title":{"en":"Crank Brothers hollow stamped-cover crank arm (US 2004/0200314 A1)","fr":"Manivelle creuse à couvercle embouti de Crank Brothers (US 2004/0200314 A1)"},"assignee":"Frank Hermansen, Carl Winefordner (assigned to California Crank Brothers, 2006)","img":"../pictures/US20040200314A1.1.png","alt":{"en":"Exploded view of the crank set (8) from the application: two hollow crank arms, each a base with a cover, on the spindle assembly (180) with end caps and fasteners","fr":"Vue éclatée du pédalier (8) de la demande : deux manivelles creuses, chacune composée d'une base et d'un couvercle, sur l'ensemble d'axe (180) avec embouts et fixations"},"teaser":{"en":"Filed April 12, 2003 and published October 14, 2004, with PCT, EP, DE and TW counterparts filed in 2004. The application was abandoned and never granted. It describes a hollow crank arm with a central…","fr":"Déposée le 12 avril 2003 et publiée le 14 octobre 2004, avec des équivalents PCT, EP, DE et TW déposés en 2004. La demande a été abandonnée et n'a jamais été délivrée. Elle décrit une manivelle creuse…"},"full":{"en":"Filed April 12, 2003 and published October 14, 2004, with PCT, EP, DE and TW counterparts filed in 2004. The application was abandoned and never granted. It describes a hollow crank arm with a central tubular section between two mounting bosses: a forged or cast C-section base in aluminum or magnesium, closed by a stamped steel or titanium cover that needs no threading or welding.","fr":"Déposée le 12 avril 2003 et publiée le 14 octobre 2004, avec des équivalents PCT, EP, DE et TW déposés en 2004. La demande a été abandonnée et n'a jamais été délivrée. Elle décrit une manivelle creuse avec une section tubulaire centrale entre deux bossages de montage : une base de section en C forgée ou coulée en aluminium ou en magnésium, fermée par un couvercle embouti en acier ou en titane qui ne demande ni filetage ni soudure."}},{"num":"EP4017740","cat":"wheel","title":{"en":"KOM Xeno Hub — Infinity Drive (EP 4,017,740 + US 12,157,333)","fr":"KOM Xeno Hub — Infinity Drive (EP 4 017 740 + US 12 157 333)"},"assignee":"Stephen Michael Elkins / King of the Mountain (Peak District, England)","img":"../pictures/US12157333B2.png","alt":{"en":"A cross-section of US 12,157,333 B2's hub assembly: the drive-axle arrangement (14/110) running the full width of the main body (12), with the transmission components (34–44) and rotor-mounting hardware (156–159) at each end","fr":"Une coupe de l'ensemble du moyeu du brevet US 12 157 333 B2 : la disposition de l'axe d'entraînement (14/110) courant sur toute la largeur du corps principal (12), avec les composants de transmission (34-44) et la quincaillerie de fixation des disques (156-159) à chaque extrémité"},"teaser":{"en":"EP 4,017,740 B1 and its US counterpart, US 12,157,333 B2, both titled 'Wheel hub' and both granted to inventor Stephen Michael Elkins, founder of King of the Mountain, share a single 2019 UK priority…","fr":"Le brevet EP 4 017 740 B1 et son équivalent américain, US 12 157 333 B2, tous deux intitulés « Wheel hub » et délivrés à l'inventeur Stephen Michael Elkins, fondateur de King of the Mountain,…"},"full":{"en":"EP 4,017,740 B1 and its US counterpart, US 12,157,333 B2, both titled 'Wheel hub' and both granted to inventor Stephen Michael Elkins, founder of King of the Mountain, share a single 2019 UK priority filing (GB 201912177) and were each filed August 18, 2020 — ten years in development per Elkins' own account, and held personally rather than assigned to the company. The EP grant issued August 28, 2024; the US grant followed December 3, 2024, with a USPTO-adjusted expiration of September 14, 2041. The claims cover a drive-axle arrangement running the full width of the hub's main body, with a sprocket carrier on the axle meshing against a transmission arrangement on the body — the full-width, concentric freehub-inside-hub-shell layout behind the Xeno hub's disc-side drive ring, which forces the use of KOM's own proprietary rotors. An independent Sheffield Hallam University test found the Xeno rear hub deflected roughly a third to a half as much as four competing high-end hubs under a 4,000 N vertical load, and about a tenth as much angularly. <a class=\"gp gp-secondary\" href=\"https://www.pinkbike.com/news/review-kom-xeno-hubs-reinventing-the-wheel.html\" target=\"_blank\" rel=\"noopener\">Pinkbike review →</a>","fr":"Le brevet EP 4 017 740 B1 et son équivalent américain, US 12 157 333 B2, tous deux intitulés « Wheel hub » et délivrés à l'inventeur Stephen Michael Elkins, fondateur de King of the Mountain, partagent un même dépôt prioritaire britannique de 2019 (GB 201912177) et ont chacun été déposés le 18 août 2020 — dix ans de développement selon son propre récit, et détenu à titre personnel plutôt que cédé à l'entreprise. Le brevet européen a été délivré le 28 août 2024; le brevet américain a suivi le 3 décembre 2024, avec une expiration ajustée par l'USPTO au 14 septembre 2041. Les revendications couvrent une disposition d'axe d'entraînement courant sur toute la largeur du corps principal du moyeu, avec un porte-pignon sur l'axe engrenant avec un ensemble de transmission sur le corps — la disposition concentrique pleine largeur, roue libre à l'intérieur de la coque du moyeu, derrière la couronne d'entraînement côté disque du moyeu Xeno, qui impose l'usage des disques de frein exclusifs de KOM. Un essai indépendant de l'université Sheffield Hallam a montré que le moyeu arrière Xeno se déformait environ deux à trois fois moins que quatre moyeux hauts de gamme concurrents sous une charge verticale de 4 000 N, et environ dix fois moins en torsion. <a class=\"gp gp-secondary\" href=\"https://www.pinkbike.com/news/review-kom-xeno-hubs-reinventing-the-wheel.html\" target=\"_blank\" rel=\"noopener\">Revue Pinkbike →</a>"}},{"num":"8043185","cat":"drive","title":{"en":"Nicolai gear-transmission portfolio (5 patents, 2 assigned to Gates)","fr":"Portefeuille de transmission à engrenages Nicolai (5 brevets, 2 cédés à Gates)"},"assignee":"Karlheinz Nicolai (Nicolai Bicycles, Germany)","img":"../pictures/US8043185B2.png","alt":{"en":"Fig. 3 of US 8,043,185 B2: a full-suspension mountain bike with the magnetic-clutch multi-gear transmission (43) housed at the bottom bracket, between the crank (4) and rear wheel (12), rather than in a rear derailleur","fr":"Fig. 3 du brevet US 8 043 185 B2 : un vélo de montagne tout-suspendu avec la transmission multi-vitesses à embrayage magnétique (43) logée au niveau du boîtier de pédalier, entre la manivelle (4) et la roue arrière (12), plutôt que dans un dérailleur arrière"},"teaser":{"en":"Karlheinz Nicolai's own name sits on a frame-integration patent (7,338,058), a mechanical multi-gear transmission (7,644,944), and the magnetic-clutch transmission already cited in this atlas…","fr":"Le nom propre de Karlheinz Nicolai figure sur un brevet d'intégration au cadre (7,338,058), une transmission mécanique multi-vitesses (7,644,944), et la transmission à embrayage magnétique déjà citée…"},"full":{"en":"Karlheinz Nicolai's own name sits on a frame-integration patent (7,338,058), a mechanical multi-gear transmission (7,644,944), and the magnetic-clutch transmission already cited in this atlas (8,043,185) — plus two later belt/chain-drive and shaft/hub patents (8,308,589 and 9,435,382) assigned directly to The Gates Corporation.","fr":"Le nom propre de Karlheinz Nicolai figure sur un brevet d'intégration au cadre (7,338,058), une transmission mécanique multi-vitesses (7,644,944), et la transmission à embrayage magnétique déjà citée dans cet atlas (8,043,185) — plus deux brevets ultérieurs de transmission par courroie/chaîne et d'arbre/moyeu (8,308,589 et 9,435,382) cédés directement à The Gates Corporation."}},{"num":"DE102023207638B3","cat":"drive","title":{"en":"Nicolai bottom-bracket gearbox architecture (DE 10 2023 207 638 B3)","fr":"Architecture de boîte de vitesses au boîtier de pédalier de Nicolai (DE 10 2023 207 638 B3)"},"assignee":"Karlheinz Nicolai (Nicolai Bicycles, Germany)","img":"../pictures/DE102023207638B3.png","alt":{"en":"A schematic cross-section from DE 10 2023 207 638 B3: the complete drive device (10), showing the fixed-gear/loose-gear pairs (318A–H paired with 319A–H) arrayed along the shaft between the pedal-side input (7) and the drive output (8), with the individual clutches that engage each pair","fr":"Une coupe schématique du brevet DE 10 2023 207 638 B3 : le dispositif d'entraînement complet (10), montrant les paires de pignons fixes/libres (318A-H appariés à 319A-H) disposées le long de l'arbre entre l'entrée côté pédalier (7) et la sortie d'entraînement (8), avec les embrayages individuels qui engagent chaque paire"},"teaser":{"en":"Two individually-filed German patents naming Karlheinz Nicolai as inventor: DE 10 2022 001 740 A1 (filed May 17, 2022, still pending) and DE 10 2023 207 638 B3 (filed August 9, 2023, granted October…","fr":"Deux brevets allemands déposés séparément, tous deux au nom de Karlheinz Nicolai comme inventeur : DE 10 2022 001 740 A1 (déposé le 17 mai 2022, toujours en instance) et DE 10 2023 207 638 B3 (déposé…"},"full":{"en":"Two individually-filed German patents naming Karlheinz Nicolai as inventor: DE 10 2022 001 740 A1 (filed May 17, 2022, still pending) and DE 10 2023 207 638 B3 (filed August 9, 2023, granted October 2, 2024, anticipated expiration 2043). Both describe a bottom-bracket gearbox built from a fixed shaft carrying several fixed gears alongside a parallel shift shaft carrying loose gears, each engaged to the shift shaft by its own clutch — putting the fixed shaft ahead of the shift shaft in the torque path lets a step-up ratio reduce the torque the clutch itself has to carry.","fr":"Deux brevets allemands déposés séparément, tous deux au nom de Karlheinz Nicolai comme inventeur : DE 10 2022 001 740 A1 (déposé le 17 mai 2022, toujours en instance) et DE 10 2023 207 638 B3 (déposé le 9 août 2023, délivré le 2 octobre 2024, expiration prévue en 2043). Les deux décrivent une boîte de vitesses au boîtier de pédalier construite autour d'un arbre fixe portant plusieurs pignons fixes et d'un arbre de changement de vitesse parallèle portant des pignons libres, chacun relié à l'arbre de changement par son propre embrayage — placer l'arbre fixe avant l'arbre de changement dans le flux de couple permet à un rapport multiplicateur de réduire le couple que l'embrayage lui-même doit supporter."}},{"num":"20250237272","cat":"drive","title":{"en":"Nicolai shift-under-load clutch (applications)","fr":"Embrayage à changement en charge Nicolai (demandes)"},"assignee":"Karlheinz Nicolai (Nicolai Bicycles, Germany)","img":"../pictures/US20250050971A1.png","alt":{"en":"Fig. 1 of US 2025/0050971 A1: the complete e-MTB, calling out the gearbox unit (10/16/18) at the bottom bracket and the shock (22) — the Saturn 16 MGU platform this application covers","fr":"Fig. 1 du brevet US 2025/0050971 A1 : le VTTAE complet, repérant l'unité de boîte de vitesses (10/16/18) au boîtier de pédalier et l'amortisseur (22) — la plateforme Saturn 16 MGU couverte par cette demande"},"teaser":{"en":"Two 2024–25 applications describe a clutch device that lets a bicycle gearbox shift under load — a spatially-separated opening mechanism is the headline claim — alongside a data-processing method for…","fr":"Deux demandes de 2024-25 décrivent un dispositif d'embrayage qui permet à une boîte de vitesses de vélo de changer de rapport en charge — un mécanisme d'ouverture spatialement séparé est la…"},"full":{"en":"Two 2024–25 applications describe a clutch device that lets a bicycle gearbox shift under load — a spatially-separated opening mechanism is the headline claim — alongside a data-processing method for automating the gear change itself. This is the IP behind Nicolai's new Saturn 16 MGU, built around a Pinion 12-speed gearbox.","fr":"Deux demandes de 2024-25 décrivent un dispositif d'embrayage qui permet à une boîte de vitesses de vélo de changer de rapport en charge — un mécanisme d'ouverture spatialement séparé est la revendication phare — accompagné d'une méthode de traitement de données pour automatiser le changement de vitesse lui-même. C'est la propriété intellectuelle derrière le nouveau MGU Saturn 16 de Nicolai, construit autour d'une boîte de vitesses Pinion 12 vitesses."}},{"num":"DE102019006708B4","cat":"emtb","title":{"en":"Nicolai dual-motor planetary e-bike drive (DE 10 2019 006 708 B4)","fr":"Entraînement de VAE à deux moteurs et train planétaire Nicolai (DE 10 2019 006 708 B4)"},"assignee":"Karlheinz Nicolai (Nicolai Bicycles, Germany)","img":"../pictures/DE102019006708B4.png","alt":{"en":"Fig. 1 of DE 10 2019 006 708 B4 (sheet shown rotated 90°): a full-suspension mountain bike with the rear shock (3) and, at the bottom bracket, the drive housing area (4) around the crank (5) and chain wheel (9)","fr":"Fig. 1 du DE 10 2019 006 708 B4 (feuille pivotée de 90°) : un VTT tout-suspendu avec l'amortisseur arrière (3) et, au niveau du boîtier de pédalier, la zone du carter d'entraînement (4) autour de la manivelle (5) et du plateau (9)"},"teaser":{"en":"German patent DE 10 2019 006 708 B4, \"Fahrrad mit elektrischem Hilfsantrieb\" (bicycle with electric auxiliary drive): filed September 25, 2019, published March 25, 2021, granted April 13, 2023,…","fr":"Brevet allemand DE 10 2019 006 708 B4, « Fahrrad mit elektrischem Hilfsantrieb » (vélo à assistance électrique) : déposé le 25 septembre 2019, publié le 25 mars 2021, délivré le 13 avril 2023,…"},"full":{"en":"German patent DE 10 2019 006 708 B4, \"Fahrrad mit elektrischem Hilfsantrieb\" (bicycle with electric auxiliary drive): filed September 25, 2019, published March 25, 2021, granted April 13, 2023, anticipated expiry September 2039. It claims two or more electric motors, each with an intermediate shaft, feeding a planetary gear set in a housing around the bottom-bracket axis, where the rider's pedal torque and a motor's torque are summed in the carrier, ring gear or sun gear. The motors and shafts sit in front of and above the bottom bracket, with the motor axes offset from it, inside the cylinder swept by the pedal cranks, and at least one motor connects to the bottom-bracket shaft through a freewheel. The record lists the inventor and owner as the same individual without naming them; the attribution to Karlheinz Nicolai is Jon's.","fr":"Brevet allemand DE 10 2019 006 708 B4, « Fahrrad mit elektrischem Hilfsantrieb » (vélo à assistance électrique) : déposé le 25 septembre 2019, publié le 25 mars 2021, délivré le 13 avril 2023, expiration prévue en septembre 2039. Il revendique deux moteurs électriques ou plus, chacun avec un arbre intermédiaire, qui alimentent un train planétaire logé dans un carter autour de l'axe du pédalier, où le couple de pédalage du cycliste et celui d'un moteur s'additionnent dans le porte-satellites, la couronne ou le planétaire. Les moteurs et les arbres se trouvent devant et au-dessus du boîtier de pédalier, les axes des moteurs étant décalés par rapport à celui-ci, à l'intérieur du cylindre balayé par les manivelles, et au moins un moteur est relié à l'arbre de pédalier par une roue libre. Le registre indique que l'inventeur et le titulaire sont la même personne physique sans la nommer ; l'attribution à Karlheinz Nicolai est celle de Jon."}},{"num":"20150008059","cat":"drive","title":{"en":"Douglas/Gusterhuber modular drive device (US 2015/0008059, abandoned)","fr":"Dispositif d'entraînement modulaire Douglas/Gusterhuber (US 2015/0008059, abandonné)"},"assignee":"Philip Douglas & Horst Gusterhuber","img":"../pictures/US20150008059A1.png","alt":{"en":"Figs. 10–12 of US 2015/0008059 A1: the same central housing and swingarm module (1/30/39) applied to a cargo tricycle with a front box (Fig. 10), a wheelchair-style trike (Fig. 11), and an enclosed pedicab (Fig. 12)","fr":"Fig. 10 à 12 du brevet US 2015/0008059 A1 : le même module central et bras oscillant (1/30/39) appliqué à un tricycle cargo à caisse avant (Fig. 10), un tricycle de type fauteuil roulant (Fig. 11), et un cyclo-pousse fermé (Fig. 12)"},"teaser":{"en":"US 2015/0008059 A1, 'Drive device for bicycles,' filed February 7, 2013 by individual inventors Philip Douglas and Horst Gusterhuber, claiming priority to a 2012 Swiss filing, with parallel EP and CN…","fr":"US 2015/0008059 A1, « Drive device for bicycles », déposé le 7 février 2013 par les inventeurs individuels Philip Douglas et Horst Gusterhuber, revendiquant la priorité d'un dépôt suisse de 2012, avec…"},"full":{"en":"US 2015/0008059 A1, 'Drive device for bicycles,' filed February 7, 2013 by individual inventors Philip Douglas and Horst Gusterhuber, claiming priority to a 2012 Swiss filing, with parallel EP and CN filings in the same family (EP 2,812,233). The claims cover a central housing with a swingarm mounted to each side, each swingarm holding a wheel and carrying its own drive means — a modular layout the application's own drawings apply to a cargo tricycle, a wheelchair-style trike, and an enclosed pedicab, not just a standard two-wheeled bicycle. The US application was abandoned without proceeding to grant.","fr":"US 2015/0008059 A1, « Drive device for bicycles », déposé le 7 février 2013 par les inventeurs individuels Philip Douglas et Horst Gusterhuber, revendiquant la priorité d'un dépôt suisse de 2012, avec des dépôts parallèles EP et CN dans la même famille (EP 2 812 233). Les revendications couvrent un boîtier central auquel est fixé un bras oscillant de chaque côté, chaque bras portant une roue et son propre moyen d'entraînement — une disposition modulaire que les dessins de la demande appliquent à un tricycle cargo, un tricycle de type fauteuil roulant, et un cyclo-pousse fermé, pas seulement à une bicyclette classique à deux roues. La demande américaine a été abandonnée sans aboutir à une délivrance."}},{"num":"5190126","cat":"fork","title":{"en":"Curnutt air-cavity shock (US 5,190,126) — the Foes damper","fr":"Amortisseur à cavité d'air Curnutt (US 5,190,126) — l'amortisseur Foes"},"assignee":"Charles Curnutt","img":"../pictures/US5190126A.png","alt":{"en":"Fig-1 and Fig-5 of US 5,190,126: an end view of the orifice plate showing its staggered damping ports (56/58/59), alongside a full cross-section of the shock body showing the air-cavity-controlled orifice damper mechanism","fr":"Fig-1 et Fig-5 du brevet US 5 190 126 : une vue de bout de la plaque à orifices montrant ses orifices d'amortissement décalés (56/58/59), avec une coupe complète du corps de l'amortisseur montrant le mécanisme d'amortissement à orifice contrôlé par cavité d'air"},"teaser":{"en":"Charles Curnutt's air-cavity-controlled orifice damper (US 5,190,126), descended from his father's 1980 desert-racing shock patent (US 4,210,344), brought peewee-motocross shock technology to mountain…","fr":"L'amortisseur à orifice contrôlé par cavité d'air de Charles Curnutt (US 5,190,126), descendant du brevet d'amortisseur de course dans le désert de 1980 de son père (US 4,210,344), a apporté la…"},"full":{"en":"Charles Curnutt's air-cavity-controlled orifice damper (US 5,190,126), descended from his father's 1980 desert-racing shock patent (US 4,210,344), brought peewee-motocross shock technology to mountain bikes. Brent Foes paired it with his hand-welded aluminum long-travel frames and a 2:1 leverage layout starting in the mid-1990s.","fr":"L'amortisseur à orifice contrôlé par cavité d'air de Charles Curnutt (US 5,190,126), descendant du brevet d'amortisseur de course dans le désert de 1980 de son père (US 4,210,344), a apporté la technologie d'amortisseur de motocross peewee aux vélos de montagne. Brent Foes l'a associé à ses cadres à grand débattement en aluminium soudés à la main et une disposition de levier 2:1 à partir du milieu des années 1990."}},{"num":"5474318","cat":"susp","title":{"en":"Unified Rear Triangle / Sweet Spot (US 5,474,318)","fr":"Unified Rear Triangle / Sweet Spot (US 5,474,318)"},"assignee":"John Castellano","img":"../pictures/US5474318A.png","alt":{"en":"John Castellano Sweet Spot Unified Rear Triangle patent drawing, showing the bottom-bracket-on-swingarm frame layout","fr":"Dessin de brevet du Sweet Spot Unified Rear Triangle de John Castellano, montrant la disposition de cadre à boîtier de pédalier sur le bras oscillant"},"teaser":{"en":"John Castellano's 'Sweet Spot' Unified Rear Triangle mounted the bottom bracket on the swingarm so chain forces stayed neutral through travel — granted December 12, 1995 as 'long-travel rear…","fr":"Le « Sweet Spot » Unified Rear Triangle de John Castellano montait le boîtier de pédalier sur le bras oscillant afin que les forces de chaîne restent neutres tout au long du débattement — délivré le…"},"full":{"en":"John Castellano's 'Sweet Spot' Unified Rear Triangle mounted the bottom bracket on the swingarm so chain forces stayed neutral through travel — granted December 12, 1995 as 'long-travel rear suspension.' Licensed to Ibis (the Bow-Ti and Szazbo), Schwinn, Mountain Cycle, WTB, Rocky Mountain and Joe Breeze's own bikes through the 1990s.","fr":"Le « Sweet Spot » Unified Rear Triangle de John Castellano montait le boîtier de pédalier sur le bras oscillant afin que les forces de chaîne restent neutres tout au long du débattement — délivré le 12 décembre 1995 sous le nom « long-travel rear suspension ». Licencié à Ibis (le Bow-Ti et le Szazbo), Schwinn, Mountain Cycle, WTB, Rocky Mountain et les propres vélos de Joe Breeze tout au long des années 1990."}},{"num":"5685553","cat":"susp","title":{"en":"Trek Y-bike Y-frame suspension (US 5,685,553)","fr":"Suspension à cadre en Y Trek Y-bike (US 5,685,553)"},"assignee":"Trek Bicycle","img":"../pictures/US5685553A.png","alt":{"en":"Fig. 1 patent drawing of the Trek Y-bike, a full side-view of the bicycle showing its distinctive Y-shaped mainframe and unified rear triangle with numbered reference callouts","fr":"Fig. 1 du brevet du Trek Y-bike, une vue latérale complète du vélo montrant son cadre principal distinctif en forme de Y et son triangle arrière unifié, avec des repères numérotés"},"teaser":{"en":"Trek's patent on the iconic Y-shaped mainframe and its unified-rear-triangle suspension. The Y-bike became one of the best-known mass-market full-suspension shapes of the late 1990s.","fr":"Le brevet de Trek sur le cadre principal iconique en forme de Y et sa suspension à triangle arrière unifié. Le Y-bike est devenu l'une des formes tout-suspendues grand public les plus reconnues de la…"},"full":{"en":"Trek's patent on the iconic Y-shaped mainframe and its unified-rear-triangle suspension. The Y-bike became one of the best-known mass-market full-suspension shapes of the late 1990s.","fr":"Le brevet de Trek sur le cadre principal iconique en forme de Y et sa suspension à triangle arrière unifié. Le Y-bike est devenu l'une des formes tout-suspendues grand public les plus reconnues de la fin des années 1990."}},{"num":"6203042","cat":"susp","title":{"en":"Trek rearward-axle-path suspension (US 6,203,042)","fr":"Suspension à trajectoire d'axe rétrograde Trek (US 6,203,042)"},"assignee":"Weston M. Wilcox / Trek Bicycle Corporation","img":"../pictures/US6203042B1.png","alt":{"en":"Fig. 2 of US 6,203,042 B1: a rear-triangle close-up showing the chain stay link (43) and seat stay link (18) pivoting off the seat tube, the shock absorber (14/15) they drive, and the rearward-curving chain stay (34) their motion produces","fr":"Fig. 2 du brevet US 6 203 042 B1 : un gros plan du triangle arrière montrant la biellette de base (43) et la biellette de hauban (18) pivotant depuis le tube de selle, l'amortisseur (14/15) qu'elles entraînent, et la base incurvée vers l'arrière (34) que produit leur mouvement"},"teaser":{"en":"'Bicycle rear suspension system providing relative rearward motion of rear axle' — a chain stay, seat stay, chain stay link and seat stay link assembled to the main front frame so the rear axle moves…","fr":"« Bicycle rear suspension system providing relative rearward motion of rear axle » — une base, un hauban, une biellette de base et une biellette de hauban assemblées au cadre avant principal de sorte…"},"full":{"en":"'Bicycle rear suspension system providing relative rearward motion of rear axle' — a chain stay, seat stay, chain stay link and seat stay link assembled to the main front frame so the rear axle moves rearward as the suspension compresses, ahead of a shock absorber connecting the two links. Confirmed from the patent's own front page: application 09/246,439, filed February 8, 1999 by Weston M. Wilcox of Sun Prairie, WI, assigned to Trek Bicycle Corporation of Waterloo, WI, granted March 20, 2001. A related provisional application (60/075,427) was filed a year earlier, February 20, 1998, but a provisional doesn't start the 20-year term — the clock runs from the non-provisional filing, matching the exp already on file here.","fr":"« Bicycle rear suspension system providing relative rearward motion of rear axle » — une base, un hauban, une biellette de base et une biellette de hauban assemblées au cadre avant principal de sorte que l'axe arrière se déplace vers l'arrière à mesure que la suspension se comprime, en avant d'un amortisseur reliant les deux biellettes. Confirmé d'après la page de garde du brevet lui-même : demande 09/246,439, déposée le 8 février 1999 par Weston M. Wilcox de Sun Prairie (Wisconsin), cédée à Trek Bicycle Corporation de Waterloo (Wisconsin), délivrée le 20 mars 2001. Une demande provisoire apparentée (60/075,427) avait été déposée un an plus tôt, le 20 février 1998, mais une demande provisoire ne déclenche pas le délai de 20 ans — celui-ci court à partir du dépôt non provisoire, ce qui correspond à l'exp déjà enregistrée ici."}},{"num":"11242110","cat":"susp","title":{"en":"Trek Supercaliber IsoStrut (US 11,242,110)","fr":"Trek Supercaliber IsoStrut (US 11,242,110)"},"assignee":"Trek Bicycle","img":"../pictures/US11242110B2.png","alt":{"en":"Patent figure from US 11,242,110: a bare Supercaliber rear end in three-quarter view, with the IsoStrut shock body (1035) buried inside the top tube and the flexing seatstays (1005/1010) that replace a rear pivot entirely","fr":"Figure du brevet US 11 242 110 : un triangle arrière nu de Supercaliber en vue de trois-quarts, avec le corps de l'amortisseur IsoStrut (1035) enfoui dans le tube supérieur et les haubans flexibles (1005/1010) qui remplacent entièrement un pivot arrière"},"teaser":{"en":"An integrated shock-in-top-tube unit for Trek's short-travel XC race bike, packaging a stroke-limited shock into the frame's main beam for a stiffer, lighter rear end than a conventional linkage.","fr":"Une unité d'amortisseur intégrée dans le tube supérieur pour le vélo de cross-country à faible débattement de Trek, intégrant un amortisseur à course limitée dans la poutre principale du cadre pour un…"},"full":{"en":"An integrated shock-in-top-tube unit for Trek's short-travel XC race bike, packaging a stroke-limited shock into the frame's main beam for a stiffer, lighter rear end than a conventional linkage.","fr":"Une unité d'amortisseur intégrée dans le tube supérieur pour le vélo de cross-country à faible débattement de Trek, intégrant un amortisseur à course limitée dans la poutre principale du cadre pour un arrière plus rigide et plus léger qu'une biellette conventionnelle."}},{"num":"8894083","cat":"fork","title":{"en":"Trek DRCV dual-chamber air shock (US 8,894,083)","fr":"Amortisseur pneumatique à double chambre Trek DRCV (US 8,894,083)"},"assignee":"Jose L. Gonzales, Gregory Paul Buhl & James Colegrove / Trek Bicycle Corporation","img":"../pictures/US8894083B2.png","alt":{"en":"Figs. 4 and 5 of US 8,894,083: cross-sections of the shock body's telescoping piston-rod-in-compression-rod assembly (Fig. 4) and an enlarged detail of the valve area dividing the two air chambers (Fig. 5)","fr":"Fig. 4 et 5 du brevet US 8 894 083 : coupes de l'ensemble télescopique tige de piston dans tige de compression du corps de l'amortisseur (Fig. 4) et détail agrandi de la zone de valve séparant les deux chambres d'air (Fig. 5)"},"teaser":{"en":"'Bicycle air shock assemblies with tunable suspension performance' — a hollow piston rod telescoping inside a hollow compression rod, with a piston dividing the compression rod's volume into a…","fr":"« Bicycle air shock assemblies with tunable suspension performance » — une tige de piston creuse télescopique à l'intérieur d'une tige de compression creuse, avec un piston divisant le volume de la…"},"full":{"en":"'Bicycle air shock assemblies with tunable suspension performance' — a hollow piston rod telescoping inside a hollow compression rod, with a piston dividing the compression rod's volume into a negative and a positive air-spring chamber. Confirmed from the patent's own front page: filed August 20, 2013 (application 13/971,818) by Jose L. Gonzales, Gregory Paul Buhl and James Colegrove, assigned solely to Trek Bicycle Corporation, granted November 25, 2014. This is a continuation of application 12/704,292 (filed February 11, 2010, itself granted as US 8,511,448 — not separately catalogued in this atlas) — the real priority date the 20-year term runs from, correcting a previously estimated y:2011/exp:2031 to the actual y:2010/exp:2030.","fr":"« Bicycle air shock assemblies with tunable suspension performance » — une tige de piston creuse télescopique à l'intérieur d'une tige de compression creuse, avec un piston divisant le volume de la tige de compression en une chambre pneumatique négative et une chambre pneumatique positive. Confirmé d'après la page de garde du brevet lui-même : déposé le 20 août 2013 (demande 13/971,818) par Jose L. Gonzales, Gregory Paul Buhl et James Colegrove, cédé uniquement à Trek Bicycle Corporation, délivré le 25 novembre 2014. Il s'agit d'une continuation de la demande 12/704,292 (déposée le 11 février 2010, elle-même délivrée sous le numéro US 8 511 448 — non cataloguée séparément dans cet atlas) — la véritable date de priorité à partir de laquelle court le délai de 20 ans, corrigeant un y:2011/exp:2031 précédemment estimé vers le véritable y:2010/exp:2030."}},{"num":"6968927","cat":"comp","title":{"en":"BMX Gyro detangler (Taiwan-origin, US refinements)","fr":"Démêleur Gyro BMX (origine taïwanaise, améliorations américaines)"},"assignee":"Brian Scura / Odyssey BMX","img":"../pictures/US6968927B2.png","alt":{"en":"Fig. 1 of US 6,968,927: a full BMX bicycle side view with the Gyro detangler assembly (30/32/90) at the head tube, showing the front and rear brake cables (36/40/42) routed through it so the handlebars can spin without tangling them","fr":"Fig. 1 du brevet US 6 968 927 : une vue latérale complète d'un vélo BMX avec l'ensemble démêleur Gyro (30/32/90) au tube de direction, montrant les câbles de frein avant et arrière (36/40/42) qui y sont routés pour que le cintre puisse tourner sans les emmêler"},"teaser":{"en":"The Gyro lets BMX handlebars spin 360° without tangling the rear-brake cable, via a split dual-cable system around a rotating bearing. Brian Scura designed it; the original mechanism traces to a…","fr":"Le Gyro permet aux cintres BMX de tourner à 360° sans emmêler le câble de frein arrière, via un système de câble double scindé autour d'un roulement rotatif. Brian Scura l'a conçu ; le mécanisme…"},"full":{"en":"The Gyro lets BMX handlebars spin 360° without tangling the rear-brake cable, via a split dual-cable system around a rotating bearing. Brian Scura designed it; the original mechanism traces to a Taiwanese filing commercialized by Odyssey (Bear Corp), while Scura's well-documented US portfolio covers anti-flop and cable-balancing refinements over the following 15 years: US 5,829,314, US 6,164,153 (granted December 26, 2000 — 'Method for adjusting cable detangler systems,' mounted at the stem/headset), US 6,205,635, and US 6,968,927 ('Bicycle force balancing mechanism').","fr":"Le Gyro permet aux cintres BMX de tourner à 360° sans emmêler le câble de frein arrière, via un système de câble double scindé autour d'un roulement rotatif. Brian Scura l'a conçu ; le mécanisme original remonte à un dépôt taïwanais commercialisé par Odyssey (Bear Corp), tandis que le portefeuille américain bien documenté de Scura couvre des améliorations anti-jeu et d'équilibrage de câble sur les 15 années suivantes : US 5,829,314, US 6,164,153 (délivré le 26 décembre 2000 — « Method for adjusting cable detangler systems », monté à la potence/jeu de direction), US 6,205,635, et US 6,968,927 (« Bicycle force balancing mechanism »)."}},{"num":"D236609","cat":"wheel","title":{"en":"Mongoose Motomag cast wheel (US D236,609)","fr":"Roue moulée Mongoose Motomag (US D236,609)"},"assignee":"BMX Products, Inc. (Mongoose)","img":"../pictures/USD236609.png","alt":{"en":"Front page of US D236,609, \"Cycle Wheel,\" filed by Stanley C. Hess: Fig. 1, a perspective view of the five-spoke mag wheel, and Fig. 2, the matching side elevation showing the trapezoidal spoke panels around the center hub","fr":"Première page du brevet US D236,609, « Cycle Wheel », déposé par Stanley C. Hess : Fig. 1, une vue en perspective de la roue mag à cinq branches, et Fig. 2, l'élévation de côté correspondante montrant les panneaux de rayon trapézoïdaux autour du moyeu central"},"teaser":{"en":"The original cast-magnesium (later aluminum) Motomag wheel — a design patent on the five-spoke 'mag' shape that defined mid-1970s BMX and became one of the most recognizable wheels in the sport.","fr":"La roue Motomag originale en magnésium moulé (plus tard en aluminium) — un brevet de dessin sur la forme « mag » à cinq branches qui a défini le BMX du milieu des années 1970 et est devenue l'une des…"},"full":{"en":"The original cast-magnesium (later aluminum) Motomag wheel — a design patent on the five-spoke 'mag' shape that defined mid-1970s BMX and became one of the most recognizable wheels in the sport.","fr":"La roue Motomag originale en magnésium moulé (plus tard en aluminium) — un brevet de dessin sur la forme « mag » à cinq branches qui a défini le BMX du milieu des années 1970 et est devenue l'une des roues les plus reconnaissables du sport."}},{"num":"4733881","cat":"frame","title":{"en":"Schwinn freestyle frame step (US 4,733,881)","fr":"Marche de cadre freestyle Schwinn (US 4,733,881)"},"assignee":"Eugene J. Szymski / Schwinn Bicycle Company","img":"../pictures/US4733881A.png","alt":{"en":"Fig. 3 of US 4,733,881, captioned 'UNDERSIDE OF CHAINSTAY TUBES', showing the left chainstay (32) bowed farther outboard than the right to form the step (30) over the brake actuating arm","fr":"Fig. 3 du brevet US 4 733 881, légendée « UNDERSIDE OF CHAINSTAY TUBES », montrant la base gauche (32) cintrée davantage vers l'extérieur que la droite pour former la marche (30) au-dessus du bras d'actionnement du frein"},"teaser":{"en":"'Bicycle frame with supplemental step or platform for performing freestyle maneuvers' — Eugene J. Szymski's patent for Schwinn, which builds the step into the frame itself rather than bolting it to…","fr":"« Bicycle frame with supplemental step or platform for performing freestyle maneuvers » — le brevet d'Eugene J. Szymski pour Schwinn, qui intègre la marche au cadre lui-même plutôt que de la boulonner…"},"full":{"en":"'Bicycle frame with supplemental step or platform for performing freestyle maneuvers' — Eugene J. Szymski's patent for Schwinn, which builds the step into the frame itself rather than bolting it to the axle: the front portion of the left chainstay (the non-drive side) is bowed farther outboard from the frame centreline than its right-hand counterpart, and the resulting shelf both carries the rider's foot and completely covers the coaster-brake actuating arm, shielding it from foot pressure. Earlier revisions of this atlas entry described US 4,733,881 as a generic 'bicycle stunt footpeg' credited to 'Freestyle BMX (1980s)'; both were wrong, and the correction came from reading the patent's own drawing sheet. The printed sheet is dated March 29, 1988, while one search snippet reported a July 19, 1988 issue date — the year is certain, the exact day is not.","fr":"« Bicycle frame with supplemental step or platform for performing freestyle maneuvers » — le brevet d'Eugene J. Szymski pour Schwinn, qui intègre la marche au cadre lui-même plutôt que de la boulonner sur l'axe : la partie avant de la base gauche (côté opposé à la transmission) est cintrée davantage vers l'extérieur de l'axe du cadre que son homologue de droite, et la tablette ainsi formée porte à la fois le pied du pilote et recouvre entièrement le bras d'actionnement du frein à rétropédalage, le protégeant de la pression du pied. Des révisions antérieures de cette fiche décrivaient US 4 733 881 comme un simple « repose-pied acrobatique » attribué à « Freestyle BMX (1980s)» ; les deux étaient erronés, et la correction est venue de la lecture de la planche de dessin du brevet lui-même. La planche imprimée est datée du 29 mars 1988, tandis qu'un extrait de recherche indiquait une délivrance le 19 juillet 1988 — l'année est certaine, le jour exact ne l'est pas."}},{"num":"20250256807","cat":"susp","title":{"en":"Priority Stillpoint Suspension System (US 2025/0256807 A1 + 2025/0256808 A1)","fr":"Système de suspension Priority Stillpoint (US 2025/0256807 A1 + 2025/0256808 A1)"},"assignee":"Fabien Gaston Lemasson & Michael Schwartz (Morpheus Cycles) / Priority Outdoor Products LLC (Priority Bicycles, New York)","img":"../pictures/Priority Outdoor Products LLC.png","alt":{"en":"Priority's two-panel Stillpoint diagram. Left: the Vanth's rear suspension with anti-rise shaded from high to low around a Pinion gearbox and belt, with zones marked Fig. A, B and C. Right: the same frame with the tensioner and upper idler locations marked Fig. 1, 2 and 3.","fr":"Schéma Stillpoint en deux volets de Priority. À gauche : la suspension arrière du Vanth avec l'anti-rise ombré de élevé à faible autour d'une boîte Pinion et de la courroie, zones repérées Fig. A, B et C. À droite : le même cadre avec les emplacements du tendeur et du galet supérieur repérés Fig. 1, 2 et 3."},"teaser":{"en":"Priority's Stillpoint platform, on the Vanth enduro (Pinion gearbox, Gates belt drive), has two published applications, both naming Fabien Gaston Lemasson and Michael Schwartz and assigned to Priority…","fr":"La plateforme Stillpoint de Priority, sur l'enduro Vanth (boîte Pinion, transmission à courroie Gates), fait l'objet de deux demandes publiées, toutes deux au nom de Fabien Gaston Lemasson et Michael…"},"full":{"en":"Priority's Stillpoint platform, on the Vanth enduro (Pinion gearbox, Gates belt drive), has two published applications, both naming Fabien Gaston Lemasson and Michael Schwartz and assigned to Priority Outdoor Products LLC. US 2025/0256807 A1 (filed February 13, 2024) claims a spring-loaded tensioner between the idler pulley and the chainring that pivots away from the suspension pivot as the wheel compresses and returns as it extends, absorbing the chain growth a high-pivot layout creates, which a Gates belt cannot stretch to accommodate. US 2025/0256808 A1 (filed June 26, 2024, claiming priority from the first; EP 25184593.9 filed June 23, 2025) is the chain-drive companion: a routing pulley above the chainring, near the idler, that carries the slack run of the chain to the tensioned run, limiting chain growth so a derailleur can handle more travel on high- or low-pivot frames. Both published August 14, 2025 and remain pending. Priority also describes an intermediate 'third-member' link that keeps anti-rise low and a pivot/gearbox/idler layout that limits pedal kickback to about 3.2°; no published application for those has been found.","fr":"La plateforme Stillpoint de Priority, sur l'enduro Vanth (boîte Pinion, transmission à courroie Gates), fait l'objet de deux demandes publiées, toutes deux au nom de Fabien Gaston Lemasson et Michael Schwartz et cédées à Priority Outdoor Products LLC. La US 2025/0256807 A1 (déposée le 13 février 2024) revendique un tendeur à ressort entre le galet de renvoi et le plateau, qui s'écarte du pivot de suspension lorsque la roue se comprime et revient lorsqu'elle se détend, absorbant l'allongement de chaîne qu'engendre une disposition à pivot haut, qu'une courroie Gates ne peut pas encaisser en s'étirant. La US 2025/0256808 A1 (déposée le 26 juin 2024, revendiquant la priorité de la première ; EP 25184593.9 déposée le 23 juin 2025) est la version pour chaîne : un galet de renvoi au-dessus du plateau, près du galet de renvoi principal, qui amène le brin détendu de la chaîne vers le brin tendu pour limiter l'allongement de chaîne, de sorte qu'un dérailleur puisse gérer plus de débattement sur des cadres à pivot haut ou bas. Les deux ont été publiées le 14 août 2025 et restent en instance. Priority décrit aussi une biellette intermédiaire « third-member » qui garde l'anti-rise faible et une disposition pivot/boîte/galet qui limite le pedal kickback à environ 3,2° ; aucune demande publiée correspondante n'a été trouvée."}},{"num":"1140680","cat":"comp","title":{"en":"Garrett in-axle tubeless plug tool (US D1,140,680)","fr":"Outil de réparation tubeless intégré à l'axe de Garrett (US D1 140 680)"},"assignee":"Samuel Garrett (Rapid City, SD)","img":"../pictures/D1140680.png","alt":{"en":"The USPTO Official Gazette entry for US D1,140,680 S, 'Bike Tire Repair Tool', showing the perspective view of the stepped stainless tool with its forked plug-insertion tip","fr":"La notice de la Gazette officielle de l'USPTO pour US D1 140 680 S, « Bike Tire Repair Tool », montrant la vue en perspective de l'outil en inox étagé avec son embout fourchu d'insertion de mèche"},"teaser":{"en":"A teenage inventor's design patent for a tubeless tire-plug tool that stows inside a standard thru-axle, keeping a trail-repair tool on the bike at all times. Confirmed from the USPTO Official Gazette…","fr":"Le brevet de dessin d'un jeune inventeur adolescent pour un outil de réparation de pneu tubeless qui se range à l'intérieur d'un axe traversant standard, gardant un outil de réparation de sentier sur…"},"full":{"en":"A teenage inventor's design patent for a tubeless tire-plug tool that stows inside a standard thru-axle, keeping a trail-repair tool on the bike at all times. Confirmed from the USPTO Official Gazette entry of August 11, 2026: 'Bike Tire Repair Tool', Samuel Garrett of Rapid City, SD, filed December 26, 2024 as application 29/980,746, LOC (15) Cl. 08-05, with a stated term of 15 years. The product ships as the ERM ('Every Rider's Must') — a 69mm stainless tool sized for 15x100-110mm thru-axles with an 8-11mm bore. Links to the USPTO Official Gazette record directly, since Google Patents had not yet indexed the grant as of this entry.","fr":"Le brevet de dessin d'un jeune inventeur adolescent pour un outil de réparation de pneu tubeless qui se range à l'intérieur d'un axe traversant standard, gardant un outil de réparation de sentier sur le vélo en permanence. Confirmé d'après la notice de la Gazette officielle de l'USPTO du 11 août 2026 : « Bike Tire Repair Tool », Samuel Garrett de Rapid City (Dakota du Sud), déposé le 26 décembre 2024 sous le numéro de demande 29/980,746, classe LOC (15) 08-05, avec une durée déclarée de 15 ans. Le produit est commercialisé sous le nom ERM (« Every Rider's Must ») — un outil en inox de 69 mm dimensionné pour les axes traversants 15x100-110 mm avec un alésage de 8 à 11 mm. Le lien pointe directement vers la notice de la Gazette officielle de l'USPTO, car Google Patents n'avait pas encore indexé la délivrance au moment de la rédaction de cette fiche."}},{"num":"12570369","cat":"comp","title":{"en":"Fox Fiber Core grip (US 12,570,369)","fr":"Poignée Fox Fiber Core (US 12 570 369)"},"assignee":"Fox Factory","img":"../pictures/US12570369B1.png","alt":{"en":"Fig. 8 of US 12,570,369: a perspective view of the grip, showing the braided helical mesh sleeve (20a/22a) over the elastomeric body (12a) between the two end collars (31a, 31b)","fr":"Fig. 8 du brevet US 12 570 369 : une vue en perspective de la poignée, montrant la gaine en maille hélicoïdale tressée (20a/22a) par-dessus le corps élastomère (12a) entre les deux colliers d'extrémité (31a, 31b)"},"teaser":{"en":"A lock-on-free grip using a braided helical mesh over an elastomer that works like a finger trap — expanding to slide on, contracting to grip the bar — avoiding clamp hardware that can over-torque…","fr":"Une poignée sans collier de serrage utilisant une maille hélicoïdale tressée par-dessus un élastomère qui fonctionne comme un piège à doigts chinois — s'étirant pour s'enfiler, se contractant pour…"},"full":{"en":"A lock-on-free grip using a braided helical mesh over an elastomer that works like a finger trap — expanding to slide on, contracting to grip the bar — avoiding clamp hardware that can over-torque carbon bars. Granted to Fox in March 2026 as US 12,570,369 B1 — a B1 kind code, meaning it issued with no earlier pre-grant publication. The grant and the number are confirmed (Singletracks published the full eGrant document); the application's own filing date was not reachable this pass, so the 2026 filing year and the 2046 expiry derived from it are both provisional and should be re-checked.","fr":"Une poignée sans collier de serrage utilisant une maille hélicoïdale tressée par-dessus un élastomère qui fonctionne comme un piège à doigts chinois — s'étirant pour s'enfiler, se contractant pour serrer le cintre — évitant le matériel de serrage qui peut sur-serrer les cintres carbone. Délivrée à Fox en mars 2026 sous le numéro US 12 570 369 B1 — un code de type B1, signifiant une délivrance sans publication préalable de la demande. La délivrance et le numéro sont confirmés (Singletracks a publié le document de délivrance complet) ; la date de dépôt de la demande n'était pas accessible cette fois-ci, si bien que l'année de dépôt 2026 et l'expiration 2046 qui en découle sont toutes deux provisoires et devraient être revérifiées."}},{"num":"9061729","cat":"susp","title":{"en":"Canfield Balance Formula (US 9,061,729) — Revel's licensed suspension","fr":"Canfield Balance Formula (US 9,061,729) — la suspension licenciée de Revel"},"assignee":"Lance & Chris Canfield → Revel Bikes (Carbondale, CO)","img":"../pictures/US9061729B2_b.png","alt":{"en":"Fig. 1 of US 9,061,729: an isometric view of the rear frame triangle, showing the shock (22) mounted to the upper link (30) and the lower structural member (28) that carries the axle, with the main pivot (32) between them — a second figure from the same patent as the CBF entry above, chosen here to avoid reusing that entry's own image file","fr":"Fig. 1 du brevet US 9 061 729 : une vue isométrique du triangle arrière du cadre, montrant l'amortisseur (22) monté sur la biellette supérieure (30) et l'élément structurel inférieur (28) qui porte l'axe, avec le pivot principal (32) entre eux — une deuxième figure du même brevet que la fiche CBF ci-dessus, choisie ici pour éviter de réutiliser le fichier image de cette fiche"},"teaser":{"en":"CBF balances the center-of-curvature directly above the chainring to hold pedal force consistent and keep the suspension active independent of drivetrain and braking input. After the Canfield brothers…","fr":"Le CBF aligne le centre de courbure directement au-dessus du plateau pour maintenir une force de pédalage constante et garder la suspension active indépendamment des sollicitations de transmission et…"},"full":{"en":"CBF balances the center-of-curvature directly above the chainring to hold pedal force consistent and keep the suspension active independent of drivetrain and braking input. After the Canfield brothers split, Chris Canfield's Suspension Formulas licenses CBF to Colorado's Revel Bikes, whose Rascal topped the 2026 Pinkbike trail-bike field test.","fr":"Le CBF aligne le centre de courbure directement au-dessus du plateau pour maintenir une force de pédalage constante et garder la suspension active indépendamment des sollicitations de transmission et de freinage. Après la séparation des frères Canfield, Suspension Formulas de Chris Canfield licencie le CBF à Revel Bikes, du Colorado, dont le Rascal a dominé le comparatif de vélos de trail 2026 de Pinkbike."}},{"num":"4942778","cat":"comp","title":{"en":"Bryne clipless pedal & cleat portfolio — Speedplay's founding IP (6 patents)","fr":"Portefeuille de pédales et cales automatiques de Bryne — la propriété intellectuelle fondatrice de Speedplay (6 brevets)"},"assignee":"Richard M. Bryne","img":"../pictures/US4942778A.png","alt":{"en":"Figs. 1 & 3 of US 4,942,778: Fig. 1 shows the pedal (12) mounted on a bicycle's crank; Fig. 3 is an exploded view of the pedal body (4) and its symmetrical, double-sided cleat mechanism (12/16/18/19/22/24)","fr":"Fig. 1 et 3 du brevet US 4 942 778 : la Fig. 1 montre la pédale (12) montée sur une manivelle de vélo ; la Fig. 3 est une vue éclatée du corps de pédale (4) et de son mécanisme de cale symétrique à double face (12/16/18/19/22/24)"},"teaser":{"en":"Bryne patented the original symmetrical, double-sided clipless pedal-and-cleat system in 1990 (US 4,942,778), then a multilayered cleat (5,213,009) and locking mechanism (5,325,738), then a…","fr":"Bryne a breveté le système original de pédale et cale automatique symétrique à double face en 1990 (US 4,942,778), puis une cale multicouche (5,213,009) et un mécanisme de verrouillage (5,325,738),…"},"full":{"en":"Bryne patented the original symmetrical, double-sided clipless pedal-and-cleat system in 1990 (US 4,942,778), then a multilayered cleat (5,213,009) and locking mechanism (5,325,738), then a three-patent continuation family covering refinements through 1999 — all individually held before being licensed into the company he founded, Speedplay.","fr":"Bryne a breveté le système original de pédale et cale automatique symétrique à double face en 1990 (US 4,942,778), puis une cale multicouche (5,213,009) et un mécanisme de verrouillage (5,325,738), puis une famille de continuation à trois brevets couvrant des améliorations jusqu'en 1999 — tous détenus individuellement avant d'être licenciés à l'entreprise qu'il a fondée, Speedplay."}},{"num":"8272150","cat":"comp","title":{"en":"Bryne / Speedplay later pedal-interface patents (8 patents, now Wahoo-owned)","fr":"Brevets ultérieurs d'interface de pédale de Bryne / Speedplay (8 brevets, désormais propriété de Wahoo)"},"assignee":"Richard M. Bryne — Speedplay, Inc. → Wahoo Fitness LLC","img":"../pictures/US6494117B1.png","alt":{"en":"Fig. 1 of US 6,494,117 B1: an exploded view of the cleat assembly — the upper cleat body (24) with its spring-tongue engagement features (58/60/62/64/69) that lock onto the pedal, and the lower base plate (28) with its shoe-mounting screw holes (46a/46b/48a/48b), plus the pedal's own spindle boss (22/36)","fr":"Fig. 1 du brevet US 6 494 117 B1 : une vue éclatée de l'ensemble de cale — le corps de cale supérieur (24) avec ses languettes-ressorts d'engagement (58/60/62/64/69) qui se verrouillent sur la pédale, et la plaque de base inférieure (28) avec ses trous de vis de fixation à la chaussure (46a/46b/48a/48b), ainsi que le moyeu d'axe de la pédale elle-même (22/36)"},"teaser":{"en":"After Speedplay became the assignee, Bryne kept inventing as the company's chief engineer: a refined pedal/cleat assembly (6,425,304 and 6,494,117, then 7,017,445), a redesigned shoe-sole mounting…","fr":"Après que Speedplay est devenu le cessionnaire, Bryne a continué d'inventer comme ingénieur en chef de l'entreprise : un ensemble pédale/cale affiné (6,425,304 et 6,494,117, puis 7,017,445), un…"},"full":{"en":"After Speedplay became the assignee, Bryne kept inventing as the company's chief engineer: a refined pedal/cleat assembly (6,425,304 and 6,494,117, then 7,017,445), a redesigned shoe-sole mounting standard meant to fix poor cleat-to-pedal alignment (8,272,150, continued in 9,826,794 and 11,147,339), and an aerodynamic shoe-and-pedal cover system (8,745,900, continued in 9,901,134).","fr":"Après que Speedplay est devenu le cessionnaire, Bryne a continué d'inventer comme ingénieur en chef de l'entreprise : un ensemble pédale/cale affiné (6,425,304 et 6,494,117, puis 7,017,445), un standard de fixation de semelle repensé destiné à corriger le mauvais alignement cale-pédale (8,272,150, poursuivi par 9,826,794 et 11,147,339), et un système de housse aérodynamique pédale-chaussure (8,745,900, poursuivi par 9,901,134)."}},{"num":"6155394","cat":"wheel","title":{"en":"Bill Shook / American Classic hub & drivetrain portfolio (3 patents + rim)","fr":"Portefeuille de moyeux et transmission de Bill Shook / American Classic (3 brevets + jante)"},"assignee":"William B. Shook / American Classic","img":"../pictures/US6155394A.png","alt":{"en":"Fig. 9 of US 6,155,394: a face view of the ratchet ring (12), showing its evenly spaced internal teeth (56) around the full circumference (bore 52) — the tooth spacing that lets multiple pawls engage the ring simultaneously rather than one at a time","fr":"Fig. 9 du brevet US 6 155 394 : une vue de face de la couronne à cliquets (12), montrant ses dents internes également espacées (56) sur toute la circonférence (alésage 52) — l'espacement des dents qui permet à plusieurs cliquets d'engager la couronne simultanément plutôt qu'un à la fois"},"teaser":{"en":"Three core patents spanning 20 years of hub engineering: US 6,155,394 (1999) covers a coasting mechanism with simultaneous pawl engagement, making freehub engagement faster and more consistent; US…","fr":"Trois brevets centraux couvrant 20 ans d'ingénierie de moyeu : l'US 6,155,394 (1999) couvre un mécanisme de roue libre à engagement simultané des cliquets, rendant l'engagement du corps de roue libre…"},"full":{"en":"Three core patents spanning 20 years of hub engineering: US 6,155,394 (1999) covers a coasting mechanism with simultaneous pawl engagement, making freehub engagement faster and more consistent; US 8,371,660 (2010) protects a hardened steel insert pressed into a soft aluminum freehub spline body to resist cassette-tooth damage — a fix for one of the most common real-world aluminum hub failure modes; US 20190136918 (2018 application) extends the work to a ratchet-tooth ring with spline torque transfer designed to avoid thin spots at the tooth root. Shook's US 7,555,838 rim patent (see its own entry) is also wheel-manufacturing IP from the same era.","fr":"Trois brevets centraux couvrant 20 ans d'ingénierie de moyeu : l'US 6,155,394 (1999) couvre un mécanisme de roue libre à engagement simultané des cliquets, rendant l'engagement du corps de roue libre plus rapide et plus constant ; l'US 8,371,660 (2010) protège un insert en acier trempé pressé dans un corps de roue libre en aluminium tendre pour résister aux dommages des dents de cassette — une solution à l'un des modes de défaillance de moyeu en aluminium les plus courants en usage réel ; l'US 20190136918 (demande de 2018) étend le travail à une couronne à dents de cliquet avec transfert de couple par cannelures conçue pour éviter les zones minces à la base des dents. Le brevet de jante US 7,555,838 de Shook (voir sa propre fiche) relève aussi de la propriété intellectuelle de fabrication de roues de la même époque."}},{"num":"7318623","cat":"comp","title":{"en":"Bill Shook saddle & seatpost lineage (3 patents, 1974–2008)","fr":"Lignée de selles et tiges de selle de Bill Shook (3 brevets, 1974-2008)"},"assignee":"William B. Shook / Thurston, Inc. → American Classic","img":"../pictures/US4995753A.png","alt":{"en":"Fig. 1 of US 4,995,753: a saddle (S) shown partly cut away on a seatpost (P), with the clamp assembly (10) at the post head gripping the saddle rail (W) between clamp parts (15, 16, 17) tightened by a bolt (23)","fr":"Fig. 1 du brevet US 4 995 753 : une selle (S) en coupe partielle sur une tige de selle (P), avec l'ensemble de serrage (10) en tête de tige qui enserre le rail de selle (W) entre les pièces de serrage (15, 16, 17) serrées par une vis (23)"},"teaser":{"en":"Shook's saddle and seatpost work spans 34 years across two companies: US 3,933,391 (Thurston, Inc., 1974) is a saddle-mount with a pivoting clamp that allows fore-aft and tilt adjustment — one of his…","fr":"Le travail de Shook sur les selles et tiges de selle s'étend sur 34 ans à travers deux entreprises : l'US 3,933,391 (Thurston, Inc., 1974) est une fixation de selle à bride pivotante permettant un…"},"full":{"en":"Shook's saddle and seatpost work spans 34 years across two companies: US 3,933,391 (Thurston, Inc., 1974) is a saddle-mount with a pivoting clamp that allows fore-aft and tilt adjustment — one of his earliest bicycle patents, filed before American Classic existed. US 4,995,753 (1990) refined the cradle-and-clamp concept with extruded metal for lighter weight. US 7,318,623 (2005) brought the lineage into the modern era with a straight-insert seatpost and a toroidal clamp section, eliminating the usual two-bolt pinch arrangement.","fr":"Le travail de Shook sur les selles et tiges de selle s'étend sur 34 ans à travers deux entreprises : l'US 3,933,391 (Thurston, Inc., 1974) est une fixation de selle à bride pivotante permettant un réglage d'avant en arrière et d'inclinaison — l'un de ses premiers brevets de vélo, déposé avant même l'existence d'American Classic. L'US 4,995,753 (1990) a affiné le concept de berceau et bride avec du métal extrudé pour un poids réduit. L'US 7,318,623 (2005) a fait entrer la lignée dans l'ère moderne avec une tige de selle à insertion droite et une section de bride toroïdale, éliminant l'habituel arrangement de serrage à deux boulons."}},{"num":"7555838","cat":"wheel","title":{"en":"Bill Shook lightweight rim extrusion method (US 7,555,838)","fr":"Méthode d'extrusion de jante légère de Bill Shook (US 7,555,838)"},"assignee":"William B. Shook / American Classic","img":"../pictures/US7555838B2.png","alt":{"en":"Figs. 1–2 of US 7,555,838: cross-sections of the rim extrusion profile before final shaping (Fig. 1, with the stabilizing tab (24) still attached) and after (Fig. 2, tab removed), showing how the tab kept the thin sidewalls (16) from buckling during roll-forming","fr":"Figs. 1–2 du brevet US 7 555 838 : coupes du profil de jante extrudé avant la mise en forme finale (Fig. 1, avec la languette de stabilisation (24) encore attachée) et après (Fig. 2, languette retirée), montrant comment la languette empêchait les parois minces (16) de flamber pendant le formage par roulage"},"teaser":{"en":"A manufacturing method for thin-walled aluminum rims: extrude the profile with an intentional external tab that prevents the thin walls from buckling during the roll-forming step, then remove the tab…","fr":"Une méthode de fabrication pour jantes en aluminium à parois minces : extruder le profil avec une languette externe intentionnelle qui empêche les parois minces de flamber pendant l'étape de formage…"},"full":{"en":"A manufacturing method for thin-walled aluminum rims: extrude the profile with an intentional external tab that prevents the thin walls from buckling during the roll-forming step, then remove the tab after the rim is shaped and the ends are joined. The walls end up thinner than would be possible to roll without the tab acting as a stabilizer.","fr":"Une méthode de fabrication pour jantes en aluminium à parois minces : extruder le profil avec une languette externe intentionnelle qui empêche les parois minces de flamber pendant l'étape de formage par roulage, puis retirer la languette une fois la jante mise en forme et les extrémités jointes. Les parois finissent plus minces qu'il ne serait possible de les rouler sans la languette agissant comme stabilisateur."}},{"num":"12643343","cat":"wheel","title":{"en":"e*thirteen Sidekick anti-kickback hub (US 12,643,343)","fr":"Moyeu anti-kickback e*thirteen Sidekick (US 12 643 343)"},"assignee":"The Hive Global / e*thirteen","img":"../pictures/WO2024107631A1.png","alt":{"en":"Sheet 3 of 12 of WO 2024/107631: Fig. 5, an exploded view of the hub shell with bearing, freehub insert and toothed ratchet ring; Fig. 6, a cross-section of the assembled hub showing the ratchet ring seated in the drive-side end of the shell","fr":"Planche 3 sur 12 du WO 2024/107631 : Fig. 5, vue éclatée de la coque de moyeu avec roulement, insert de roue libre et couronne à rochet dentée ; Fig. 6, coupe du moyeu assemblé montrant la couronne à rochet logée dans l'extrémité côté transmission de la coque"},"teaser":{"en":"'Hub system, method and device with adjustable deadband,' filed by e*thirteen's parent company The Hive Global (published as WO 2024/107631 and US 2024/0157728; inventors include Joel Peters). The…","fr":"« Système, procédé et dispositif de moyeu à zone morte réglable », déposé par la société mère d'e*thirteen, The Hive Global (publié sous WO 2024/107631 et US 2024/0157728 ; inventeurs dont Joel…"},"full":{"en":"'Hub system, method and device with adjustable deadband,' filed by e*thirteen's parent company The Hive Global (published as WO 2024/107631 and US 2024/0157728; inventors include Joel Peters). The freehub has a deliberate, non-zero deadband: a set arc of free rotation before the pawls engage, which absorbs the chain growth that causes pedal kickback when the rear suspension compresses. The deadband is adjustable, and can be set wide enough that the pawls never touch the ratchet while coasting, making the hub silent. e*thirteen lists US 12,643,343 on its patent-marking page; the Sidekick 2.0 hub offers tool-free settings of 9°, 13° and 18°.","fr":"« Système, procédé et dispositif de moyeu à zone morte réglable », déposé par la société mère d'e*thirteen, The Hive Global (publié sous WO 2024/107631 et US 2024/0157728 ; inventeurs dont Joel Peters). La roue libre comporte une zone morte volontaire et non nulle : un arc de rotation libre avant l'engagement des cliquets, qui absorbe l'allongement de chaîne responsable du kickback aux pédales lorsque la suspension arrière se comprime. La zone morte est réglable et peut être assez large pour que les cliquets ne touchent jamais la roue à rochet en roue libre, ce qui rend le moyeu silencieux. e*thirteen indique le brevet US 12 643 343 sur sa page de marquage des brevets ; le moyeu Sidekick 2.0 propose des réglages sans outil de 9°, 13° et 18°."}},{"num":"5088535","cat":"wheel","title":{"en":"Potts/Cunningham off-road tire tread (US 5,088,535)","fr":"Bande de roulement tout-terrain de Potts/Cunningham (US 5 088 535)"},"assignee":"Stephen Potts, Mark Slate, Charles Cunningham, James Merz / Specialized Bicycle Components, Inc.","img":"../pictures/US5088535A.png","alt":{"en":"Fig. 1 of US 5,088,535: a flattened plan view of the tread pattern, showing the alternating raised knob blocks (12, 13) and diamond-shaped intermediate lugs (15–19, 31–42) arranged either side of the tire's centerline (20)","fr":"Fig. 1 du brevet US 5 088 535 : vue en plan de la bande de roulement mise à plat, montrant les blocs de crampons en alternance (12, 13) et les crampons intermédiaires en losange (15-19, 31-42) disposés de part et d'autre de la ligne centrale du pneu (20)"},"teaser":{"en":"US 5,088,535, \"Bicycle or motorcycle tire tread,\" credited to Stephen Potts, Mark Slate, Charles Cunningham and James Merz — WTB's co-founders among them — but assigned to Specialized Bicycle…","fr":"US 5 088 535, « Bicycle or motorcycle tire tread », crédité à Stephen Potts, Mark Slate, Charles Cunningham et James Merz — dont des cofondateurs de WTB — mais cédé à Specialized Bicycle Components,…"},"full":{"en":"US 5,088,535, \"Bicycle or motorcycle tire tread,\" credited to Stephen Potts, Mark Slate, Charles Cunningham and James Merz — WTB's co-founders among them — but assigned to Specialized Bicycle Components, Inc., per the patent's own front page, not to WTB. The granted application (Ser. No. 529,785) was filed May 25, 1990 as a continuation of an abandoned November 2, 1988 filing (Ser. No. 267,683), itself a continuation of an abandoned September 11, 1986 filing (Ser. No. 907,370) that traces to a September 10, 1986 continuation-in-part (Ser. No. 906,834); granted February 18, 1992. The claims describe a knob layout aimed at improved lateral (cornering) traction and controllable drifting on off-road bicycle tires, distinct from the motocross-derived tread patterns tire makers had been adapting up to that point.","fr":"US 5 088 535, « Bicycle or motorcycle tire tread », crédité à Stephen Potts, Mark Slate, Charles Cunningham et James Merz — dont des cofondateurs de WTB — mais cédé à Specialized Bicycle Components, Inc., selon la première page du brevet lui-même, et non à WTB. La demande délivrée (n° de série 529 785) a été déposée le 25 mai 1990 en continuation d'un dépôt abandonné du 2 novembre 1988 (n° de série 267 683), lui-même en continuation d'un dépôt abandonné du 11 septembre 1986 (n° de série 907 370) qui remonte à une continuation-in-part du 10 septembre 1986 (n° de série 906 834) ; délivré le 18 février 1992. Les revendications décrivent une disposition de crampons visant une meilleure traction latérale (en virage) et un dérapage contrôlable sur les pneus de vélo tout-terrain, distincte des motifs de bande de roulement dérivés du motocross que les fabricants de pneus adaptaient jusqu'alors."}},{"num":"10920045","cat":"wheel","title":{"en":"Vittoria Graphene Plus (G+) tire compound (US 10,920,045)","fr":"Gomme de pneu Graphene Plus (G+) de Vittoria (US 10 920 045)"},"assignee":"Giulio Cesareo, Massimiliano Bianchi & Antonino Di Pasquale / Directa Plus SpA (Italy) → licensed to Vittoria","img":"../pictures/US10920045B2.png","alt":{"en":"Fig. 6 of US 10,920,045 B2: a bar chart comparing wet-grip index across three base compounds (R, P1, P6) with and without graphene added (+G), each graphene version scoring lower on this particular metric than its plain counterpart","fr":"Fig. 6 du brevet US 10 920 045 B2 : un diagramme à barres comparant l'indice d'adhérence sur sol mouillé de trois gommes de base (R, P1, P6) avec et sans ajout de graphène (+G), chaque version au graphène obtenant un score plus faible sur cette mesure précise que son équivalent sans graphène"},"teaser":{"en":"US 10,920,045 B2, 'Elastomeric composition comprising graphene and tire components comprising said composition,' filed July 25, 2016 (claiming priority from a July 2015 Italian filing, ITUB20153129A1)…","fr":"US 10 920 045 B2, « Elastomeric composition comprising graphene and tire components comprising said composition », déposé le 25 juillet 2016 (revendiquant la priorité d'un dépôt italien de juillet…"},"full":{"en":"US 10,920,045 B2, 'Elastomeric composition comprising graphene and tire components comprising said composition,' filed July 25, 2016 (claiming priority from a July 2015 Italian filing, ITUB20153129A1) and granted February 16, 2021 to inventors Giulio Cesareo, Massimiliano Bianchi and Antonino Di Pasquale, assigned to Directa Plus SpA. The claims define a rubber compound loaded with 1–40 phr of graphene nanoplatelets of a specified lateral-size-to-thickness ratio and purity (C/O ratio ≥100:1), alongside optional silica and carbon black — the material Directa Plus markets as Graphene Plus (G+) and licenses to Vittoria for its Corsa PRO road tire line. Directa Plus, not Vittoria, holds the patent; Vittoria is the commercial partner bringing it to market.","fr":"US 10 920 045 B2, « Elastomeric composition comprising graphene and tire components comprising said composition », déposé le 25 juillet 2016 (revendiquant la priorité d'un dépôt italien de juillet 2015, ITUB20153129A1) et délivré le 16 février 2021 aux inventeurs Giulio Cesareo, Massimiliano Bianchi et Antonino Di Pasquale, cédé à Directa Plus SpA. Les revendications définissent une gomme chargée de 1 à 40 phr de nanoplaquettes de graphène d'un rapport taille latérale/épaisseur et d'une pureté spécifiés (rapport C/O ≥ 100:1), aux côtés de silice et de noir de carbone amorphe optionnels — le matériau que Directa Plus commercialise sous le nom Graphene Plus (G+) et licencie à Vittoria pour sa gamme de pneus route Corsa PRO. C'est Directa Plus, et non Vittoria, qui détient le brevet ; Vittoria est le partenaire commercial qui le porte sur le marché."}},{"num":"20220402572","cat":"fork","title":{"en":"Lauf pivotless leaf-spring fork & rear suspension (3 patents)","fr":"Fourche et suspension arrière à lame ressort sans pivot Lauf (3 brevets)"},"assignee":"Benedikt Skúlason / Lauf Forks ehf. (Iceland)","img":"../pictures/US9375989B2.png","alt":{"en":"A full bicycle side view from US 9,375,989, with a dashed box (2401) marking the front fork's leaf-spring suspension zone at the front axle","fr":"Une vue de côté complète d'un vélo tirée du brevet US 9 375 989, avec un cadre en pointillés (2401) délimitant la zone de suspension à lame ressort de la fourche avant, au niveau de l'axe"},"teaser":{"en":"Two granted patents plus one pending continuation, naming Benedikt Skúlason as inventor and Lauf Forks ehf. (Reykjavik) as assignee. The foundational filing, US 9,375,989 B2 / EP 2,760,683 B1…","fr":"Deux brevets délivrés et une continuation en instance, nommant Benedikt Skúlason comme inventeur et Lauf Forks ehf. (Reykjavik) comme cessionnaire. Le dépôt fondateur, US 9 375 989 B2 / EP 2 760 683…"},"full":{"en":"Two granted patents plus one pending continuation, naming Benedikt Skúlason as inventor and Lauf Forks ehf. (Reykjavik) as assignee. The foundational filing, US 9,375,989 B2 / EP 2,760,683 B1 ('Vehicle suspension system'), was filed September 19, 2012 and granted June 28, 2016 (US) and May 30, 2018 (EP), expiring September 19, 2032 on both records; its claims cover two or more flexible members mounted between a frame and a wheel structure in a non-planar arrangement, and its own drawings work through a front-fork embodiment as well as two separate rear-wheel embodiments — this patent was never fork-specific. A later, narrower continuation, US 2022/0402572 A1 ('A rear wheel suspension system for a bike'), was filed as a PCT application September 4, 2020 claiming priority to a November 18, 2019 EP filing, entered the US national phase May 17, 2022, and published December 22, 2022; still an unexamined application, not a grant, so this entry's headline number stays pending with no expiry estimate until it actually grants. A separate, newer filing reportedly covers a magnet-free freehub using 3D-printed titanium pawls and leaf springs instead of traditional pawl springs — real per outside reporting, but its application or publication number wasn't located, so that claim stays unconfirmed.","fr":"Deux brevets délivrés et une continuation en instance, nommant Benedikt Skúlason comme inventeur et Lauf Forks ehf. (Reykjavik) comme cessionnaire. Le dépôt fondateur, US 9 375 989 B2 / EP 2 760 683 B1 (« Vehicle suspension system »), a été déposé le 19 septembre 2012 et délivré le 28 juin 2016 (US) et le 30 mai 2018 (EP), avec une expiration au 19 septembre 2032 sur les deux fiches ; ses revendications couvrent deux lames flexibles ou plus montées entre un cadre et une structure de roue selon une disposition non plane, et ses propres dessins détaillent une version fourche aussi bien que deux versions de roue arrière distinctes — ce brevet n'a jamais été spécifique à la fourche. Une continuation plus tardive et plus restreinte, US 2022/0402572 A1 (« A rear wheel suspension system for a bike »), a été déposée sous forme de demande PCT le 4 septembre 2020, revendiquant la priorité d'un dépôt EP du 18 novembre 2019, est entrée en phase nationale américaine le 17 mai 2022 et a été publiée le 22 décembre 2022 ; il s'agit encore d'une demande non examinée, pas d'une délivrance, donc le numéro principal de cette fiche reste en instance sans estimation d'expiration tant qu'il n'est pas réellement délivré. Un dépôt plus récent et distinct couvrirait, d'après des comptes-rendus externes, un corps de roue libre sans aimant utilisant des cliquets en titane imprimés en 3D et des lames ressort au lieu des ressorts de cliquet traditionnels — réel d'après ces comptes-rendus, mais son numéro de demande ou de publication n'a pas été localisé, donc cette affirmation reste non confirmée."}},{"num":"12497127","cat":"comp","title":{"en":"Shimano co-axial disc brake mount (US 12,497,127)","fr":"Fixation de frein à disque coaxiale Shimano (US 12 497 127)"},"assignee":"Shimano","img":"../pictures/TW202423773A.png","alt":{"en":"Figure 1 of the Taiwanese companion filing TW 202423773 A, showing the caliper adaptor (10) coupling coaxially to the hub axle (16) rather than through an offset bracket","fr":"Figure 1 du dépôt jumeau taïwanais TW 202423773 A, montrant l'adaptateur d'étrier (10) se couplant de façon coaxiale à l'axe du moyeu (16) plutôt que via un support décalé"},"teaser":{"en":"US 12,497,127 B2, 'Caliper adaptor and disc brake caliper assembly for human-powered vehicle,' filed December 1, 2022 and granted December 16, 2025 to Shimano Inc. (inventors Kento Mitsuyasu and…","fr":"US 12 497 127 B2, « Caliper adaptor and disc brake caliper assembly for human-powered vehicle », déposé le 1er décembre 2022 et délivré le 16 décembre 2025 à Shimano Inc. (inventeurs Kento Mitsuyasu…"},"full":{"en":"US 12,497,127 B2, 'Caliper adaptor and disc brake caliper assembly for human-powered vehicle,' filed December 1, 2022 and granted December 16, 2025 to Shimano Inc. (inventors Kento Mitsuyasu and Takehiko Nakajima). The caliper adaptor's axle-coupling portion attaches to the hub axle, and its caliper-mounting hole sits on a center axis running through a plane perpendicular to that axle — receiving the caliper's mounting force coaxially with the wheel rather than through a bracket offset to one side, which Shimano says simplifies the frame-to-caliper coupling and improves mounting flexibility. Companion filings exist in Taiwan (TW 202423773 A), Germany (DE 10 2023 131 850 A1) and China (CN 118124712 A). Filed roughly a year after SRAM published a conceptually similar co-axial brake-mount patent.","fr":"US 12 497 127 B2, « Caliper adaptor and disc brake caliper assembly for human-powered vehicle », déposé le 1er décembre 2022 et délivré le 16 décembre 2025 à Shimano Inc. (inventeurs Kento Mitsuyasu et Takehiko Nakajima). La portion de couplage à l'axe de l'adaptateur d'étrier se fixe à l'axe du moyeu, et son alésage de montage d'étrier se situe sur un axe central traversant un plan perpendiculaire à cet axe — recevant la force de montage de l'étrier de façon coaxiale par rapport à la roue plutôt que via un support décalé d'un côté, ce qui, selon Shimano, simplifie le couplage cadre-étrier et améliore la flexibilité de montage. Des dépôts jumeaux existent à Taïwan (TW 202423773 A), en Allemagne (DE 10 2023 131 850 A1) et en Chine (CN 118124712 A). Déposée environ un an après que SRAM a publié un brevet de fixation de frein coaxiale conceptuellement similaire."}},{"num":"11866114","cat":"susp","title":{"en":"Shimano AI-assisted suspension & dropper learning model (US 11,866,114)","fr":"Modèle d'apprentissage de suspension et tige télescopique assisté par IA de Shimano (US 11,866,114)"},"assignee":"Shimano","img":"../pictures/US11866114B2.png","alt":{"en":"Patent figure from US 11,866,114: a full bicycle side view labelling the telescopic seatpost (F), its actuator (F2-F5), the suspension fork (G) with its position sensors (S1, S51, S52), and the handlebar-mounted control unit (D)","fr":"Figure du brevet US 11 866 114 : une vue de profil complète du vélo identifiant la tige de selle télescopique (F), son actionneur (F2-F5), la fourche suspendue (G) avec ses capteurs de position (S1, S51, S52), et l'unité de commande montée au cintre (D)"},"teaser":{"en":"A handlebar-mounted screen and 'learning model' that records a rider's manual suspension, dropper-post, and saddle-tilt adjustments on a given course, then plays them back automatically lap after lap…","fr":"Un écran monté sur le cintre et un « modèle d'apprentissage » qui enregistre les réglages manuels de suspension, de tige télescopique et d'inclinaison de selle d'un pilote sur un parcours donné, puis…"},"full":{"en":"A handlebar-mounted screen and 'learning model' that records a rider's manual suspension, dropper-post, and saddle-tilt adjustments on a given course, then plays them back automatically lap after lap — Shimano's patent text states plainly that 'proper skill is required for the rider to appropriately control the seat post and suspension during riding,' and proposes automating it instead. The patent numbe
