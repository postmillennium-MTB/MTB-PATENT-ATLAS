l":{"en":"GoPro's patents page lists US 12,016,421 under Forcite, the Australian smart-motorcycle-helmet maker (integrated HUD, chin-mounted camera, Bluetooth connectivity) GoPro acquired in a deal announced January 2024 and closed that Q1. Exact title, filing date and claims not independently confirmed this pass — this sandbox couldn't reach Google Patents or USPTO directly to verify beyond the number itself and its Forcite/GoPro association; grant year is an estimate from USPTO numbering pace (patents crossed 12,000,000 in May 2024), not a confirmed date.","fr":"La page de brevets de GoPro liste l'US 12,016,421 sous Forcite, le fabricant australien de casques de moto intelligents (affichage tête haute intégré, caméra montée au menton, connectivité Bluetooth) que GoPro a acquis dans le cadre d'un accord annoncé en janvier 2024 et conclu ce même trimestre. Le titre exact, la date de dépôt et les revendications ne sont pas confirmés de façon indépendante à ce stade — cet environnement n'a pas pu accéder directement à Google Patents ou à l'USPTO pour vérifier au-delà du numéro lui-même et de son association Forcite/GoPro ; l'année de délivrance est une estimation fondée sur le rythme de numérotation de l'USPTO (les brevets ont franchi la barre des 12 000 000 en mai 2024), pas une date confirmée."}},{"num":"10393872","cat":"tech","title":{"en":"Camera-augmented bicycle radar (US 10,393,872)","fr":"Radar de vélo augmenté par caméra (US 10 393 872)"},"assignee":"Evangelos V.A. Brisimitzakis et al. / Garmin Switzerland GmbH","img":"../pictures/US10393872B2.png","alt":{"en":"Figs. 2A/2B of US 10,393,872: a cyclist (202) carrying the radar/camera unit (206/208) on the seatpost as a trailing car (204) is tracked in the sensor field, with the system's informational overlay shown alerting the rider to the approaching vehicle","fr":"Fig. 2A/2B du brevet US 10 393 872 : un cycliste (202) portant l'unité radar/caméra (206/208) sur le tube de selle pendant qu'une voiture arrière (204) est suivie dans le champ du capteur, avec l'incrustation d'information du système alertant le cycliste du véhicule qui approche"},"teaser":{"en":"Filed December 7, 2016 (claiming priority to a December 8, 2015 provisional) and granted August 27, 2019, this Garmin Switzerland GmbH patent covers a bicycle radar unit that pairs its rear-facing…","fr":"Déposé le 7 décembre 2016 (revendiquant la priorité d'une demande provisoire du 8 décembre 2015) et délivré le 27 août 2019, ce brevet de Garmin Switzerland GmbH couvre une unité radar de vélo…"},"full":{"en":"Filed December 7, 2016 (claiming priority to a December 8, 2015 provisional) and granted August 27, 2019, this Garmin Switzerland GmbH patent covers a bicycle radar unit that pairs its rear-facing radar sensor with an integrated camera: the radar tracks the range and closing speed of vehicles approaching from behind, and the system can selectively trigger the camera to capture images or video of a detected target rather than recording continuously. It's the patent underlying Garmin's Varia line of rearview bike radar/taillights.","fr":"Déposé le 7 décembre 2016 (revendiquant la priorité d'une demande provisoire du 8 décembre 2015) et délivré le 27 août 2019, ce brevet de Garmin Switzerland GmbH couvre une unité radar de vélo associant son capteur radar orienté vers l'arrière à une caméra intégrée : le radar suit la distance et la vitesse de rapprochement des véhicules arrivant par l'arrière, et le système peut déclencher sélectivement la caméra pour capturer des images ou une vidéo de la cible détectée plutôt que d'enregistrer en continu. C'est le brevet à l'origine de la gamme Varia de radars/feux arrière pour vélo de Garmin."}},{"num":"10918524","cat":"tech","title":{"en":"Protective eyewear (US 10,918,524)","fr":"Lunettes de protection (US 10 918 524)"},"assignee":"Marc Blanchard, Ludovic Boinnard & Jerome Jacques Marie Mage / 100% Speedlab, LLC","img":"../pictures/US10918524B1.png","alt":{"en":"Fig. 1 of US 10,918,524: front view of the goggle (100), showing the topmost frame member (118) running from the left to right temple mounts (106), the unitary lens (102) bonded to its lower edge, and the raised central portions (120) at the top and bottom of the frame member's nose-bridge area","fr":"Fig. 1 du brevet US 10 918 524 : vue de face du masque (100), montrant l'élément de cadre le plus haut (118) reliant les fixations de tempe gauche et droite (106), l'écran unitaire (102) collé à son bord inférieur, et les portions surélevées (120) en haut et en bas de la zone du pont nasal de l'élément de cadre"},"teaser":{"en":"The earliest non-provisional filing in this patent's continuation chain is US 13/750,093, filed January 25, 2013; this specific continuation was filed October 15, 2020 and granted February 16, 2021,…","fr":"Le dépôt non provisoire le plus ancien de la chaîne de continuations de ce brevet est l'US 13/750 093, déposé le 25 janvier 2013 ; cette continuation spécifique a été déposée le 15 octobre 2020 et…"},"full":{"en":"The earliest non-provisional filing in this patent's continuation chain is US 13/750,093, filed January 25, 2013; this specific continuation was filed October 15, 2020 and granted February 16, 2021, subject to a terminal disclaimer tying its term to that 2013 priority. It claims a motocross/MTB-style goggle whose topmost frame member runs unbroken from one pivoting temple to the other, with a single unitary lens bonded to its lower edge covering both eyes, and a raised central ridge along both the top and bottom edges of that frame member.","fr":"Le dépôt non provisoire le plus ancien de la chaîne de continuations de ce brevet est l'US 13/750 093, déposé le 25 janvier 2013 ; cette continuation spécifique a été déposée le 15 octobre 2020 et délivrée le 16 février 2021, sous réserve d'un désistement terminal (terminal disclaimer) liant sa durée à cette priorité de 2013. Il revendique un masque de style motocross/VTT dont l'élément de cadre le plus haut court sans interruption d'une tempe pivotante à l'autre, avec un écran unitaire unique collé à son bord inférieur couvrant les deux yeux, et une arête centrale surélevée le long des bords supérieur et inférieur de cet élément de cadre."}},{"num":"11318049","cat":"tech","title":{"en":"Roll-off goggle with switchable hand controls (US 11,318,049)","fr":"Masque à film déroulant à commande inversable (US 11 318 049)"},"assignee":"Gavin Michael Vos / VOG — Image Police Inc. (Taichung, Taiwan)","img":"../pictures/US11318049B2.png","alt":{"en":"FIG. 1 of US 11,318,049: a three-quarter view of the assembled goggle (10) — the frame (20) carrying the lens (31) and film sheet (34), with the control assembly (40) and its thumb knob (61) projecting from the lower right end of the frame","fr":"FIG. 1 du brevet US 11 318 049 : une vue de trois quarts du masque assemblé (10) — la monture (20) portant l'écran (31) et le film (34), avec l'ensemble de commande (40) et son bouton moletué (61) faisant saillie à l'extrémité inférieure droite de la monture"},"teaser":{"en":"US 11,318,049 B2, \"Goggle,\" inventor Gavin Michael Vos, assigned to VOG — Image Police Inc. of Taichung, Taiwan. Filed October 23, 2018 as PCT/CN2018/111340 (published WO 2020/082222), entering the US…","fr":"US 11 318 049 B2, « Goggle », inventeur Gavin Michael Vos, cédé à VOG — Image Police Inc. de Taichung (Taïwan). Déposé le 23 octobre 2018 sous le numéro PCT/CN2018/111340 (publié sous WO 2020/082222),…"},"full":{"en":"US 11,318,049 B2, \"Goggle,\" inventor Gavin Michael Vos, assigned to VOG — Image Police Inc. of Taichung, Taiwan. Filed October 23, 2018 as PCT/CN2018/111340 (published WO 2020/082222), entering the US national phase March 26, 2020 and granted May 3, 2022 with no term adjustment. Two reels sit in chambers at the left and right ends of the frame with a soft film sheet strung between them across the lens's outer face; when the film fouls, the rider winds the dirty section onto one reel and draws clean film off the other. The claimed point of novelty is that the control assembly mounts to either reel — the drawings show it and a plain end cap as interchangeable parts — so one goggle is set up left- or right-handed to match the wearer. The same assignee holds helmet filings (US 11,350,687 and the design patent US D804,106); no consumer brand selling this goggle was identified.","fr":"US 11 318 049 B2, « Goggle », inventeur Gavin Michael Vos, cédé à VOG — Image Police Inc. de Taichung (Taïwan). Déposé le 23 octobre 2018 sous le numéro PCT/CN2018/111340 (publié sous WO 2020/082222), entré en phase nationale américaine le 26 mars 2020 et délivré le 3 mai 2022 sans ajustement de durée. Deux bobines sont logées aux extrémités gauche et droite de la monture, reliées par un film souple tendu sur la face extérieure de l'écran ; lorsque le film s'encrasse, le pilote enroule la portion sale sur une bobine et tire du film propre depuis l'autre. Le point de nouveauté revendiqué est que l'ensemble de commande se monte sur l'une ou l'autre bobine — les dessins le montrent, ainsi qu'un capuchon lisse, en pièces interchangeables — de sorte qu'un même masque se configure pour droitier ou pour gaucher. Le même cessionnaire détient des dépôts de casques (US 11 350 687 et le brevet de dessin US D804 106) ; aucune marque grand public commercialisant ce masque n'a pu être identifiée."}},{"num":"11019237","cat":"tech","title":{"en":"Multi-camera wireless sync (US 11,019,237)","fr":"Synchronisation sans fil multi-caméras (US 11,019,237)"},"assignee":"David Newman & Gregory Paul Stewart / GoPro, Inc. (San Mateo, CA)","img":"../pictures/US11019237B2.png","alt":{"en":"Multi-camera wireless synchronization patent drawing, Figs. 3A–3C, showing wireless pairing links between camera A, camera B and camera C","fr":"Dessin de brevet de synchronisation sans fil multi-caméras, Fig. 3A–3C, montrant les liaisons d'appariement sans fil entre la caméra A, la caméra B et la caméra C"},"teaser":{"en":"A wireless synchronization scheme letting multiple cameras — the patent's own figures label them camera A, B and C — pair up and share timing over a wireless link so footage shot simultaneously from…","fr":"Un système de synchronisation sans fil permettant à plusieurs caméras — les propres figures du brevet les nomment caméra A, B et C — de s'apparier et de partager leur référence temporelle via une…"},"full":{"en":"A wireless synchronization scheme letting multiple cameras — the patent's own figures label them camera A, B and C — pair up and share timing over a wireless link so footage shot simultaneously from different angles lines up automatically in post, without a wired genlock connection or manual clap-sync. Now confirmed from the patent's own front page: application 16/884,838, filed May 27, 2020, granted May 25, 2021 to David Newman (San Diego) and Gregory Paul Stewart (San Mateo) for GoPro, Inc. That corrects a previously estimated 2019 filing year. One caveat the front page did not settle: a twelve-month grant is fast enough to suggest this is a continuation, and the related-application data was not legible, so the 2040 expiry derived from the 2020 filing is an upper bound — if an earlier parent exists in the chain, the real term ends sooner.","fr":"Un système de synchronisation sans fil permettant à plusieurs caméras — les propres figures du brevet les nomment caméra A, B et C — de s'apparier et de partager leur référence temporelle via une liaison sans fil afin que des images tournées simultanément sous différents angles s'alignent automatiquement en post-production, sans connexion genlock filaire ni synchronisation manuelle par clap. Désormais confirmé d'après la page de garde du brevet lui-même : demande 16/884,838, déposée le 27 mai 2020, délivrée le 25 mai 2021 à David Newman (San Diego) et Gregory Paul Stewart (San Mateo) pour GoPro, Inc. Cela corrige une année de dépôt précédemment estimée à 2019. Une réserve que la page de garde n'a pas levée : une délivrance en douze mois est assez rapide pour suggérer qu'il s'agit d'une continuation, et les données de demandes apparentées n'étaient pas lisibles ; l'expiration 2040 déduite du dépôt de 2020 est donc une borne supérieure — s'il existe une demande mère antérieure dans la chaîne, le terme réel s'achève plus tôt."}},{"num":"10402445","cat":"tech","title":{"en":"Multicamera content manipulation via content proxy (US 10,402,445)","fr":"Manipulation de contenu multicaméra par proxy de contenu (US 10 402 445)"},"assignee":"David Newman, Mark Vaden, Rolf Fischer & Vadim Polonichko / GoPro, Inc.","img":"../pictures/US10402445B2.png","alt":{"en":"Fig. 7A of US 10,402,445: a handlebar-level view down a singletrack trail, with a rider ahead (704) and an overlay bar (710) showing speed and heart rate for three riders, above a timeline (740) marking highlight segments, and a trail-map inset (630) with a -4% grade readout","fr":"Fig. 7A du brevet US 10 402 445 : une vue au niveau du guidon sur un sentier monotrace, avec un cycliste devant (704) et une barre de superposition (710) affichant la vitesse et la fréquence cardiaque de trois cyclistes, au-dessus d'une ligne de temps (740) repérant les segments marquants, et d'une vignette de carte du sentier (630) avec un indicateur de pente de -4 %"},"teaser":{"en":"US 10,402,445, \"Apparatus and methods for manipulating multicamera content using content proxy,\" granted September 3, 2019 to GoPro, Inc. (application 16/131,542, filed September 14, 2018, published…","fr":"US 10 402 445, « Apparatus and methods for manipulating multicamera content using content proxy », délivré le 3 septembre 2019 à GoPro, Inc. (demande 16/131,542, déposée le 14 septembre 2018, publiée…"},"full":{"en":"US 10,402,445, \"Apparatus and methods for manipulating multicamera content using content proxy,\" granted September 3, 2019 to GoPro, Inc. (application 16/131,542, filed September 14, 2018, published as US 2019/0012332). A \"content proxy\" is the metadata recorded alongside the footage in a session container, plus a lower-data-rate version of the video such as thumbnails. The patent has users view or analyze the proxy to pick highlights, then pull only the matching portions of the full footage, and combines the proxies from several cameras or users to find, display and share moments across a group ride. The drawings show a trail ride with speed and heart-rate overlays for three riders, and an elevation-versus-time trace with highlight points circled. It is a continuation with a 2016 priority date; the 2036 expiry is Google Patents' computed date, and the parent application was not identified.","fr":"US 10 402 445, « Apparatus and methods for manipulating multicamera content using content proxy », délivré le 3 septembre 2019 à GoPro, Inc. (demande 16/131,542, déposée le 14 septembre 2018, publiée sous le numéro US 2019/0012332). Un « proxy de contenu » est l'ensemble des métadonnées enregistrées avec les images dans un conteneur de session, plus une version à débit réduit de la vidéo, comme des vignettes. Le brevet fait examiner ou analyser le proxy pour choisir les moments marquants, puis ne récupère que les portions correspondantes des images complètes, et combine les proxys de plusieurs caméras ou utilisateurs pour trouver, afficher et partager des moments lors d'une sortie en groupe. Les dessins montrent une sortie sur sentier avec superposition de la vitesse et de la fréquence cardiaque de trois cyclistes, et une courbe d'altitude en fonction du temps avec des points marquants cerclés. Il s'agit d'une continuation avec une date de priorité de 2016 ; l'expiration en 2036 est la date calculée par Google Patents, et la demande mère n'a pas été identifiée."}},{"num":"9694235","cat":"tech","title":{"en":"Samsung virtual-ride motion platform (US 9,694,235)","fr":"Plateforme de mouvement de vélo virtuel Samsung (US 9 694 235)"},"assignee":"Heungno Oh, Myungjong Kim, Jongchan Kim, Jongpil Kim, Juyeon Kim, Eunnam Song & Jounggeun Jo / Samsung Electronics Co., Ltd.","img":"../pictures/US9694235B2.1.png","alt":{"en":"Perspective drawing from US 9,694,235 of the indoor rig: an exercise bike (seat 314, handlebar 324, pedals 306) fixed onto a tilting motion platform (200) driven by motors underneath, with a display screen (336) on an adjustable mount (334) above the handlebar","fr":"Dessin en perspective du brevet US 9 694 235 montrant l'installation d'intérieur : un vélo d'appartement (selle 314, guidon 324, pédales 306) fixé sur une plateforme de mouvement inclinable (200) entraînée par des moteurs en dessous, avec un écran (336) sur un support réglable (334) au-dessus du guidon"},"teaser":{"en":"US 9,694,235, \"Method and system for virtual hiking,\" granted July 4, 2017 to Samsung Electronics Co., Ltd. (application 14/324,898, filed July 7, 2014, with a Korean priority filing in 2013). Despite…","fr":"US 9 694 235, « Method and system for virtual hiking », délivré le 4 juillet 2017 à Samsung Electronics Co., Ltd. (demande 14/324,898, déposée le 7 juillet 2014, avec un dépôt coréen prioritaire en…"},"full":{"en":"US 9,694,235, \"Method and system for virtual hiking,\" granted July 4, 2017 to Samsung Electronics Co., Ltd. (application 14/324,898, filed July 7, 2014, with a Korean priority filing in 2013). Despite the title, the abstract describes indoor biking: a PC shows a simulated route, a motion platform moves to match the road state on screen, and a bicycle fixed to the platform changes the picture according to the handlebar's movement and speed. Google Patents lists the status as Expired – Fee Related, meaning it lapsed for unpaid maintenance fees before the nominal 2034 end of term; the lapse date was not seen. The claims were not read.","fr":"US 9 694 235, « Method and system for virtual hiking », délivré le 4 juillet 2017 à Samsung Electronics Co., Ltd. (demande 14/324,898, déposée le 7 juillet 2014, avec un dépôt coréen prioritaire en 2013). Malgré son titre, le résumé décrit du vélo en salle : un PC affiche un parcours simulé, une plateforme de mouvement bouge selon l'état de la route à l'écran, et un vélo fixé sur la plateforme modifie l'image selon le mouvement du guidon et la vitesse. Google Patents indique le statut Expired – Fee Related, c'est-à-dire déchu pour frais de maintien impayés avant la fin nominale du terme en 2034 ; la date de déchéance n'a pas été vue. Les revendications n'ont pas été lues."}},{"num":"11210808","cat":"tech","title":{"en":"Magic Leap augmented-reality sensor fusion (US 11,210,808)","fr":"Fusion de capteurs en réalité augmentée de Magic Leap (US 11 210 808)"},"assignee":"Michael Janusz Woods & Andrew Rabinovich / Magic Leap, Inc.","img":"../pictures/US11210808B2.png","alt":{"en":"Fig. 60A of US 11,210,808: a rider's handlebar-level view of a trail, with augmented-reality panels floating above the bars showing a map, a route trace and a compass, and location pins over the hills and the rider ahead","fr":"Fig. 60A du brevet US 11 210 808 : la vue d'un cycliste au niveau du guidon sur un sentier, avec des panneaux de réalité augmentée flottant au-dessus du guidon et montrant une carte, un tracé de parcours et une boussole, et des repères de position sur les collines et sur le cycliste devant"},"teaser":{"en":"US 11,210,808, \"Systems and methods for augmented reality,\" granted December 28, 2021 to Magic Leap, Inc. (inventors Michael Janusz Woods and Andrew Rabinovich; application 16/833,093, filed March 27,…","fr":"US 11 210 808, « Systems and methods for augmented reality », délivré le 28 décembre 2021 à Magic Leap, Inc. (inventeurs Michael Janusz Woods et Andrew Rabinovich ; demande 16/833,093, déposée le 27…"},"full":{"en":"US 11,210,808, \"Systems and methods for augmented reality,\" granted December 28, 2021 to Magic Leap, Inc. (inventors Michael Janusz Woods and Andrew Rabinovich; application 16/833,093, filed March 27, 2020, in a family that goes back to 2017). The abstract describes reducing error in noisy data from a high-frequency sensor by fusing it with a low-frequency sensor: collect a first set of inputs from the fast sensor, take a correction point from the slow one, then adjust the path of later fast-sensor inputs either by jumping fully to the correction point or by approaching it in a dampened way. It is a general augmented-reality patent, not a cycling one. Cycling appears in the drawings: Fig. 60A shows map, route and compass panels at a trail rider's handlebar, and Fig. 70 shows a rider on a stationary bike wearing a head-mounted display with virtual scenery and a pacer set to her personal best. Google Patents gives an adjusted expiration of January 6, 2038, which includes any patent term adjustment; the earlier family members were not examined, and the claims were not read.","fr":"US 11 210 808, « Systems and methods for augmented reality », délivré le 28 décembre 2021 à Magic Leap, Inc. (inventeurs Michael Janusz Woods et Andrew Rabinovich ; demande 16/833,093, déposée le 27 mars 2020, dans une famille remontant à 2017). Le résumé décrit la réduction de l'erreur des données bruitées d'un capteur haute fréquence en les fusionnant avec celles d'un capteur basse fréquence : on recueille un premier lot d'entrées du capteur rapide, on prend un point de correction auprès du capteur lent, puis on ajuste la trajectoire des entrées suivantes du capteur rapide, soit en sautant entièrement au point de correction, soit en s'en approchant de façon amortie. C'est un brevet général de réalité augmentée, pas un brevet de cyclisme. Le vélo apparaît dans les dessins : la Fig. 60A montre des panneaux de carte, d'itinéraire et de boussole au guidon d'un cycliste sur sentier, et la Fig. 70 montre une cycliste sur un vélo d'appartement portant un visiocasque avec un décor virtuel et un lièvre réglé sur son record personnel. Google Patents indique une expiration ajustée au 6 janvier 2038, qui inclut tout ajustement de durée de brevet ; les membres antérieurs de la famille n'ont pas été examinés et les revendications n'ont pas été lues."}},{"num":"EP1086014B1","cat":"susp","title":{"en":"GT i-Drive independent drivetrain","fr":"Transmission indépendante i-Drive de GT"},"assignee":"James S. Busby / GT Bicycles Inc.","img":"../pictures/EP0913322A2.png","alt":{"en":"Drawing sheet of EP 0,913,322 A2: the i-Drive eccentric link carrying the crank assembly, tied to the main frame by a sensing link so the whole crankset floats independently of the rear swingarm","fr":"Planche de dessin du brevet EP 0 913 322 A2 : la biellette excentrique i-Drive portant le pédalier, reliée au cadre principal par une biellette de détection de sorte que tout le pédalier flotte indépendamment du bras oscillant arrière"},"teaser":{"en":"An eccentric link carries the crank assembly and is coupled to the main frame by a sensing link, letting the whole crankset float semi-independently of the rear swingarm rather than being fixed to it…","fr":"Une biellette excentrique porte le pédalier et est reliée au cadre principal par une biellette de détection, laissant tout le pédalier flotter de façon semi-indépendante par rapport au bras oscillant…"},"full":{"en":"An eccentric link carries the crank assembly and is coupled to the main frame by a sensing link, letting the whole crankset float semi-independently of the rear swingarm rather than being fixed to it — the mechanism behind GT's \"equilibrium sensing\" pitch. Filed as EP99930274A (June 15, 1999, claiming a 1998 US priority); granted and published as EP 1,086,014 B1 on May 28, 2008. EP 0,913,322 A2, from the same priority filing, covers the same crank-assembly suspension concept and published earlier, in 1999.","fr":"Une biellette excentrique porte le pédalier et est reliée au cadre principal par une biellette de détection, laissant tout le pédalier flotter de façon semi-indépendante par rapport au bras oscillant arrière plutôt que d'y être fixé — le mécanisme derrière l'argument « à détection d'équilibre » de GT. Déposé sous EP99930274A (15 juin 1999, revendiquant une priorité américaine de 1998) ; délivré et publié sous EP 1 086 014 B1 le 28 mai 2008. EP 0 913 322 A2, issu de la même demande prioritaire, couvre le même concept de suspension de pédalier et a été publié plus tôt, en 1999."}},{"num":"FR727193A","cat":"drive","title":{"en":"Nieddu gear-shifting device (FR 727,193)","fr":"Dispositif de changement de vitesse Nieddu (FR 727 193)"},"assignee":"Tommaso Nieddu","img":"../pictures/FR727193A.jpeg","alt":{"en":"Fig. 1 of FR 727,193: a side view of a bicycle drivetrain, showing the chainring and crank assembly (5) at right, a smaller sprocket (4') mounted on a pivoting arm (4) at lower left guiding the chain, and a long actuating rod (1/2/2'/2\"/3/3') running up to a control lever (5\"/7) near the seatpost (A)","fr":"Fig. 1 du brevet FR 727 193 : une vue de côté d'une transmission de bicyclette, montrant l'ensemble plateau et manivelle (5) à droite, un petit pignon (4') monté sur un bras pivotant (4) en bas à gauche guidant la chaîne, et une longue tige d'actionnement (1/2/2'/2\"/3/3') remontant jusqu'à un levier de commande (5\"/7) près du tube de selle (A)"},"teaser":{"en":"FR 727,193, 'Gear shifting device for bicycles,' inventor Tommaso Nieddu. Filed November 21, 1931, granted June 14, 1932. Classified under B62M9/131 — the modern patent-classification code…","fr":"FR 727 193, « Dispositif de changement de vitesse pour bicyclettes », inventeur Tommaso Nieddu. Déposé le 21 novembre 1931, délivré le 14 juin 1932. Classé sous B62M9/131 — le code de classification…"},"full":{"en":"FR 727,193, 'Gear shifting device for bicycles,' inventor Tommaso Nieddu. Filed November 21, 1931, granted June 14, 1932. Classified under B62M9/131 — the modern patent-classification code specifically for front derailleurs — confirmed directly against the primary Google Patents record. Fig. 1, the only drawing sheet reviewed this pass, shows a lever-and-rod-actuated mechanism: a control lever near the seatpost connected by a long rod to a pivoting arm carrying a secondary sprocket beside the chain, consistent with an early rod-actuated chain-shifting device. The full French-language specification text wasn't read this pass, so beyond what the drawing itself shows, the claimed mechanism isn't independently described here.","fr":"FR 727 193, « Dispositif de changement de vitesse pour bicyclettes », inventeur Tommaso Nieddu. Déposé le 21 novembre 1931, délivré le 14 juin 1932. Classé sous B62M9/131 — le code de classification de brevets moderne spécifique aux dérailleurs avant — confirmé directement d'après le dossier primaire de Google Patents. La Fig. 1, la seule planche examinée lors de cette recherche, montre un mécanisme actionné par levier et tige : un levier de commande près du tube de selle relié par une longue tige à un bras pivotant portant un pignon secondaire à côté de la chaîne, cohérent avec un dispositif de changement de vitesse à tige précoce. Le texte intégral de la description en français n'a pas été lu lors de cette recherche, donc au-delà de ce que montre le dessin lui-même, le mécanisme revendiqué n'est pas décrit ici de façon indépendante."}},{"num":"6029990","cat":"drive","title":{"en":"Direct drive bicycle (US 6,029,990)","fr":"Vélo à entraînement direct (US 6 029 990)"},"assignee":"James S. Busby / GT Bicycles Inc. → Schwinn Acquisition LLC","img":"../pictures/US6029990A.png","alt":{"en":"Drawing sheet of US 6,029,990: the chain wheel coupled to the input shaft of a variable-rate transmission unit mounted in the main frame","fr":"Planche de dessin du brevet US 6 029 990 : le plateau accouplé à l'arbre d'entrée d'une unité de transmission à taux variable montée dans le cadre principal"},"teaser":{"en":"A separate Busby/GT filing from the same era as i-Drive: a chain wheel mechanically coupled to the input shaft of a variable-rate transmission unit rotatably mounted inside the main frame, with the…","fr":"Un dépôt distinct de Busby/GT de la même époque que l'i-Drive : un plateau mécaniquement accouplé à l'arbre d'entrée d'une unité de transmission à taux variable montée de façon rotative dans le cadre…"},"full":{"en":"A separate Busby/GT filing from the same era as i-Drive: a chain wheel mechanically coupled to the input shaft of a variable-rate transmission unit rotatably mounted inside the main frame, with the transmission's output shaft driving the rear wheel — a direct-drive layout rather than a derailleur cassette. Filed August 26, 1997 (application US08/918,402, originally assigned to GT Bicycles, Inc.); granted February 29, 2000. Later reassigned to GMAC Business Credit and then to Schwinn Acquisition, LLC as GT's parent company changed hands.","fr":"Un dépôt distinct de Busby/GT de la même époque que l'i-Drive : un plateau mécaniquement accouplé à l'arbre d'entrée d'une unité de transmission à taux variable montée de façon rotative dans le cadre principal, dont l'arbre de sortie entraîne la roue arrière — une configuration à entraînement direct plutôt qu'une cassette à dérailleur. Déposé le 26 août 1997 (demande US08/918 402, initialement cédée à GT Bicycles, Inc.) ; délivré le 29 février 2000. Cédé plus tard à GMAC Business Credit puis à Schwinn Acquisition, LLC à mesure que la société mère de GT changeait de mains."}},{"num":"4789174","cat":"susp","title":{"en":"Lawwill four-bar, Gary Fisher RS-1 (US 4,789,174 + family)","fr":"Quatre-barres Lawwill, Gary Fisher RS-1 (US 4 789 174 + famille)"},"assignee":"Mert Lawwill","img":"../pictures/US4789174A.png","alt":{"en":"Fig. 1 of US 4,789,174: a full-suspension bicycle whose rear wheel hangs on a four-bar linkage, with the swing arm (140) from the bottom bracket, the control arm (170) from the seat tube, the hub plate (150) at the axle and a coil-over shock (190) behind the seat tube, plus a linkage front fork (110)","fr":"Fig. 1 du brevet US 4 789 174 : un vélo tout-suspendu dont la roue arrière est portée par un quadrilatère articulé, avec le bras oscillant (140) partant du boîtier de pédalier, le bras de contrôle (170) partant du tube de selle, la plaque de moyeu (150) à l'axe et un amortisseur à ressort (190) derrière le tube de selle, ainsi qu'une fourche à biellettes (110)"},"teaser":{"en":"Mert Lawwill's parallel-link rear end. US 4,789,174 (filed April 27, 1987, granted December 6, 1988) hangs the rear axle on hub plates between swing arms pivoting at the bottom bracket and control…","fr":"L'arrière à biellettes parallèles de Mert Lawwill. Le brevet US 4 789 174 (déposé le 27 avril 1987, délivré le 6 décembre 1988) suspend l'axe arrière à des plaques de moyeu reliant des bras oscillants…"},"full":{"en":"Mert Lawwill's parallel-link rear end. US 4,789,174 (filed April 27, 1987, granted December 6, 1988) hangs the rear axle on hub plates between swing arms pivoting at the bottom bracket and control arms pivoting on the seat tube, arranged as a trapezoid so chain forces balance and pedaling does not compress the shock. US 5,121,937 (granted June 16, 1992) refines the arm geometry, and US 5,957,473 (\"Rear suspension bicycle\") continues the line. Used on the Gary Fisher RS-1, among the first production four-bar MTBs, and later on Schwinn and Yeti Lawwill bikes.","fr":"L'arrière à biellettes parallèles de Mert Lawwill. Le brevet US 4 789 174 (déposé le 27 avril 1987, délivré le 6 décembre 1988) suspend l'axe arrière à des plaques de moyeu reliant des bras oscillants pivotant au boîtier de pédalier et des bras de contrôle pivotant sur le tube de selle, disposés en trapèze pour que les forces de la chaîne s'équilibrent et que le pédalage ne comprime pas l'amortisseur. Le brevet US 5 121 937 (délivré le 16 juin 1992) affine la géométrie des bras, et le US 5 957 473 (« Rear suspension bicycle ») prolonge la lignée. Utilisé sur le Gary Fisher RS-1, parmi les premiers VTT quatre-barres produits en série, puis sur des Schwinn et des Yeti Lawwill."}},{"num":"6471230","cat":"susp","title":{"en":"Ellsworth Instant Center Tracking (ICT) — 3 patents","fr":"Ellsworth Instant Center Tracking (ICT) — 3 brevets"},"assignee":"Anthony S. \"Tony\" Ellsworth / Ellsworth Handcrafted Bicycles (founded 1991)","img":"../pictures/US6471230B2.png","alt":{"en":"Fig. 5 of US 6,471,230: a bicycle side view showing the front and rear triangles (10, 12, 14) joined by a pair of rocker-arm linkages (48) near the head tube, with the shock (below 48) driven off that upper pivot rather than a chainstay pivot","fr":"Fig. 5 du brevet US 6 471 230 : une vue de côté du vélo montrant les triangles avant et arrière (10, 12, 14) reliés par une paire de biellettes basculantes (48) près du tube de direction, l'amortisseur (sous 48) étant entraîné par ce pivot supérieur plutôt que par un pivot de bases"},"teaser":{"en":"Ellsworth's \"Instant Center Tracking\" claim: a rear-triangle linkage tuned so the suspension's instant center migrates along the chainline force vector through the travel, aimed at isolating pedaling…","fr":"La revendication « Instant Center Tracking » d'Ellsworth : une biellette de triangle arrière réglée pour que le centre instantané de la suspension suive le vecteur de force de la ligne de chaîne tout…"},"full":{"en":"Ellsworth's \"Instant Center Tracking\" claim: a rear-triangle linkage tuned so the suspension's instant center migrates along the chainline force vector through the travel, aimed at isolating pedaling and braking forces from suspension movement. Three granted patents, all titled \"Bicycle suspension apparatus and related method\" and all naming Anthony S. Ellsworth as inventor, sit behind the theory: US 6,471,230, US 6,361,059 (a related \"three-bar\" variant using a single pivot and an in-line shock), and US 7,296,815 (granted Nov. 20, 2007). All three trace to the same underlying family, priority dating to a March 2, 1999 international (PCT) filing that itself claims a March 2, 1998 U.S. provisional — the provisional doesn't itself start the 20-year term under this atlas's own rule, so `exp` runs from the 1999 non-provisional/PCT filing. Individual filing and grant dates for 6,471,230 and 6,361,059 beyond what's noted here weren't independently re-confirmed this session.","fr":"La revendication « Instant Center Tracking » d'Ellsworth : une biellette de triangle arrière réglée pour que le centre instantané de la suspension suive le vecteur de force de la ligne de chaîne tout au long du débattement, dans le but d'isoler les forces de pédalage et de freinage du mouvement de la suspension. Trois brevets délivrés, tous intitulés « Bicycle suspension apparatus and related method » et tous au nom d'Anthony S. Ellsworth comme inventeur, soutiennent cette théorie : l'US 6 471 230, l'US 6 361 059 (une variante apparentée « three-bar » utilisant un pivot unique et un amortisseur en ligne), et l'US 7 296 815 (délivré le 20 novembre 2007). Les trois remontent à la même famille sous-jacente, avec une date de priorité fixée au dépôt international (PCT) du 2 mars 1999, qui revendique elle-même une demande provisoire américaine du 2 mars 1998 — la demande provisoire ne fait pas courir elle-même les 20 années selon la règle propre à cet atlas, donc l'expiration court à partir du dépôt non provisoire/PCT de 1999. Les dates individuelles de dépôt et de délivrance de l'US 6 471 230 et de l'US 6 361 059, au-delà de ce qui est noté ici, n'ont pas été reconfirmées de façon indépendante cette session."}},{"num":"7703788","cat":"susp","title":{"en":"Chumba force-channeling suspension (3 filings)","fr":"Suspension à canalisation de force Chumba (3 dépôts)"},"assignee":"Ted K. Tanouye / Chumba Racing (Anaheim, CA)","img":"../pictures/US7703788B2.png","alt":{"en":"Fig. 1 of US 7,703,788 B2: the full frame in profile, with the force-channeling tube (16) routing shock-absorber (21) loads from the rocker link (9/11) down to the rear dropout (22) alongside the seat tube (3) and down tube (1)","fr":"Fig. 1 du brevet US 7 703 788 B2 : le cadre complet en profil, avec le tube de canalisation de force (16) acheminant les charges de l'amortisseur (21) depuis la biellette de bascule (9/11) jusqu'à la patte arrière (22), aux côtés du tube de selle (3) et du tube diagonal (1)"},"teaser":{"en":"Three related filings behind Chumba's \"force channeling\" rear suspension, all naming Ted K. Tanouye as inventor (the first two co-invented with Alan H. Kang). US 7,703,788, \"Force channeling mountain…","fr":"Trois dépôts liés derrière la suspension arrière « force channeling » de Chumba, tous au nom de Ted K. Tanouye comme inventeur (les deux premiers co-inventés avec Alan H. Kang). L'US 7 703 788, «…"},"full":{"en":"Three related filings behind Chumba's \"force channeling\" rear suspension, all naming Ted K. Tanouye as inventor (the first two co-invented with Alan H. Kang). US 7,703,788, \"Force channeling mountain bike rear suspension,\" filed 2008 and granted April 27, 2010 (confirmed directly from the PDF's own front page), covers the five-tube frame layout: a torque-conversion link routes shock-absorber loads through a dedicated force-channeling tube rather than the seat tube, aimed at reducing pedal-induced suspension jack. US 8,136,829, \"Force channelling centralization mountain bike and frame,\" a related filing later assigned to 888 Sports Group LLC, refines the same idea by mounting the rocker link to the down tube instead of the seat tube, moving suspension mass toward the bike and rider's shared center of gravity — its own priority relationship to the 2008 filing wasn't independently confirmed this session, so its own expiry isn't computed from that earlier date. A third application, US 2010/0096831, \"Center of mass technology for mountain bike frames,\" covers the welded-aluminum frame construction itself but was abandoned and never granted.","fr":"Trois dépôts liés derrière la suspension arrière « force channeling » de Chumba, tous au nom de Ted K. Tanouye comme inventeur (les deux premiers co-inventés avec Alan H. Kang). L'US 7 703 788, « Force channeling mountain bike rear suspension » (déposé en 2008), est un brevet délivré couvrant la structure de cadre à cinq tubes : une biellette de conversion de couple achemine les charges de l'amortisseur à travers un tube de canalisation de force dédié plutôt que le tube de selle, dans le but de réduire le pompage de suspension induit par le pédalage. L'US 8 136 829, « Force channelling centralization mountain bike and frame », un dépôt apparenté cédé plus tard à 888 Sports Group LLC, affine la même idée en montant la biellette de bascule sur le tube diagonal plutôt que sur le tube de selle, déplaçant la masse de la suspension vers le centre de gravité partagé du vélo et du cycliste — sa propre relation de priorité avec le dépôt de 2008 n'a pas été confirmée de façon indépendante cette session, donc sa propre expiration n'est pas calculée à partir de cette date antérieure. Une troisième demande, l'US 2010/0096831, « Center of mass technology for mountain bike frames », couvre la construction du cadre en aluminium soudé elle-même mais a été abandonnée et n'a jamais été délivrée."}},{"num":"6854753","cat":"susp","title":{"en":"Maverick Monolink (US 6,854,753)","fr":"Maverick Monolink (US 6 854 753)"},"assignee":"Paul Turner (Maverick American)","img":"../pictures/US6854753B2.png","alt":{"en":"Fig. 1 of US 6,854,753: a full bicycle side view showing the Monolink structural link (36/38/40) carrying the bottom bracket, pivoting between the front triangle's seat tube (18) and the rear swingarm (56), with the rear shock (58/60/62/64) mounted along the link","fr":"Fig. 1 du brevet US 6 854 753 : une vue de côté complète d'un vélo montrant la biellette structurelle Monolink (36/38/40) portant le boîtier de pédalier, pivotant entre le tube de selle du triangle avant (18) et le bras oscillant arrière (56), avec l'amortisseur arrière (58/60/62/64) monté le long de la biellette"},"teaser":{"en":"US 6,854,753 B2, \"Suspension system for a vehicle,\" inventor Paul H. Turner, assignee Maverick American LLC — confirmed directly from the uploaded drawing sheet and cross-confirmed via search. The…","fr":"US 6 854 753 B2, « Suspension system for a vehicle », inventeur Paul H. Turner, cessionnaire Maverick American LLC — confirmé directement à partir de la planche de dessin fournie et recoupé par…"},"full":{"en":"US 6,854,753 B2, \"Suspension system for a vehicle,\" inventor Paul H. Turner, assignee Maverick American LLC — confirmed directly from the uploaded drawing sheet and cross-confirmed via search. The reference numerals on this sheet's Fig. 1 (36, 38, 40, 44, 46, 48, 58, 60, 62, 64, 76, 78) match the close-up link/shock figure already on file for US 2003/0011167 A1, the published application kept in `nums` alongside this granted number — strong circumstantial evidence they're the same underlying filing family, though this session didn't read a \"Ser. No.\" priority trail directly confirming it. An earlier sibling patent under the identical title, US 6,450,521 (filed Feb. 11, 2000, granted Sept. 17, 2002), was reassigned from Maverick American to Blackglass LLC in 2008, then to Santa Cruz Bicycles, Inc. in 2013, then to Red Star Holdings, LLC in 2015 — Santa Cruz's ownership window is a real, if brief, part of this patent family's chain of title. A third sibling, US 7,137,638, shares the same title in search results but wasn't independently read this pass. `g`/`exp` are left unset for 6,854,753 itself: this session couldn't confirm its own grant date, and given the apparent shared family with 6,450,521, applying that patent's earlier 2000 filing date under this atlas's continuation rule would be a guess rather than a confirmed reading.","fr":"US 6 854 753 B2, « Suspension system for a vehicle », inventeur Paul H. Turner, cessionnaire Maverick American LLC — confirmé directement à partir de la planche de dessin fournie et recoupé par recherche. Les repères numériques de la Fig. 1 de cette planche (36, 38, 40, 44, 46, 48, 58, 60, 62, 64, 76, 78) correspondent à la figure en gros plan de la biellette/amortisseur déjà au dossier pour la demande publiée US 2003/0011167 A1, conservée dans `nums` aux côtés de ce numéro délivré — un indice circonstanciel solide qu'il s'agit de la même famille de dépôt sous-jacente, bien que cette session n'ait pas lu directement une chaîne de priorité « Ser. No. » le confirmant. Un brevet frère antérieur sous un titre identique, US 6 450 521 (déposé le 11 février 2000, délivré le 17 septembre 2002), a été cédé de Maverick American à Blackglass LLC en 2008, puis à Santa Cruz Bicycles, Inc. en 2013, puis à Red Star Holdings, LLC en 2015 — la fenêtre de propriété de Santa Cruz est une part réelle, quoique brève, de la chaîne de titre de cette famille de brevets. Un troisième frère, US 7 137 638, partage le même titre dans les résultats de recherche mais n'a pas été lu de façon indépendante cette fois-ci. `g`/`exp` restent non renseignés pour le 6 854 753 lui-même : cette session n'a pas pu confirmer sa propre date de délivrance, et étant donné la famille apparemment partagée avec le 6 450 521, appliquer la date de dépôt antérieure de 2000 de ce dernier selon la règle de continuation de cet atlas relèverait de la conjecture plutôt que d'une lecture confirmée."}},{"num":"6615960","cat":"susp","title":{"en":"Fluid damped shock absorber and method (US 6,615,960)","fr":"Amortisseur à amortissement fluidique et méthode (US 6 615 960)"},"assignee":"Paul H. Turner / Maverick American LLC","img":"../pictures/US6615960B1.png","alt":{"en":"Figs. 1 and 1A of US 6,615,960 B1: the shock's exterior (left) and a cross-section (right) showing the outer tube (12), sliding inner tube (14), and damper tube (30) with the metering valve components (36, 44, 46) between them","fr":"Fig. 1 et 1A du brevet US 6 615 960 B1 : l'extérieur de l'amortisseur (à gauche) et une coupe (à droite) montrant le tube extérieur (12), le tube intérieur coulissant (14), et le tube d'amortissement (30) avec les composants de la valve de dosage (36, 44, 46) entre eux"},"teaser":{"en":"US 6,615,960 B1, \"Fluid damped shock absorber and method,\" filed February 11, 2000 (Appl. No. 09/502,272) and granted September 9, 2003, confirmed directly from the PDF's own front page: inventor Paul…","fr":"US 6 615 960 B1, « Fluid damped shock absorber and method », déposé le 11 février 2000 (n° de demande 09/502 272) et délivré le 9 septembre 2003, confirmé directement à partir de la première page du…"},"full":{"en":"US 6,615,960 B1, \"Fluid damped shock absorber and method,\" filed February 11, 2000 (Appl. No. 09/502,272) and granted September 9, 2003, confirmed directly from the PDF's own front page: inventor Paul H. Turner, assignee Maverick American LLC (Boulder, CO). Claims describe a telescoping damper — an outer tube, a sliding inner tube, and a damper tube between them, with a regulation valve metering fluid flow as the inner tube moves — the shock unit paired with the Monolink frame rather than the frame linkage itself.","fr":"US 6 615 960 B1, « Fluid damped shock absorber and method », déposé le 11 février 2000 (n° de demande 09/502 272) et délivré le 9 septembre 2003, confirmé directement à partir de la première page du PDF : inventeur Paul H. Turner, cessionnaire Maverick American LLC (Boulder, CO). Les revendications décrivent un amortisseur télescopique — un tube extérieur, un tube intérieur coulissant, et un tube d'amortissement entre les deux, avec une valve de régulation dosant le débit de fluide au mouvement du tube intérieur — l'unité d'amortisseur associée au cadre Monolink plutôt que la biellette de cadre elle-même."}},{"num":"6964425","cat":"fork","title":{"en":"Maverick quick-release fork axle clamp (US 6,964,425)","fr":"Pince d'axe à dégagement rapide pour fourche Maverick (US 6 964 425)"},"assignee":"Maverick American LLC → Specialized Bicycle Components, Inc.","img":"../pictures/US6964425B2.png","alt":{"en":"Fig. 1 of US 6,964,425, granted Nov. 15, 2005: the full telescoping fork (10) and front wheel assembly, with the crown (22), stanchions (12/14), lowers (26/28), and the axle-clamp hardware (34/36/38) at the dropouts","fr":"Fig. 1 du brevet US 6 964 425, délivré le 15 novembre 2005 : l'ensemble complet de la fourche télescopique (10) et de la roue avant, avec le té (22), les plongeurs (12/14), les fourreaux (26/28), et la quincaillerie de pince d'axe (34/36/38) aux pattes"},"teaser":{"en":"US 6,964,425 B2, \"Telescoping suspension fork having a quick release wheel axle clamp,\" filed 2002, granted Nov. 15, 2005 — confirmed directly from the drawing sheets, which carry the same title,…","fr":"US 6 964 425 B2, « Telescoping suspension fork having a quick release wheel axle clamp », déposé en 2002, délivré le 15 novembre 2005 — confirmé directement à partir des planches de dessin, qui…"},"full":{"en":"US 6,964,425 B2, \"Telescoping suspension fork having a quick release wheel axle clamp,\" filed 2002, granted Nov. 15, 2005 — confirmed directly from the drawing sheets, which carry the same title, number, and date. The claims cover a pivoting cover plate at the dropout that closes over the axle and is secured by a lever-actuated hook, adjustable for clamping force, rather than a conventional quick-release skewer or through-axle. Part of a wider filing family under the same title (US 6,669,219, US 6,824,154, and later continuations) from the same era of Maverick American forks. Reassigned to Specialized Bicycle Components, Inc. in 2012.","fr":"US 6 964 425 B2, « Telescoping suspension fork having a quick release wheel axle clamp », déposé en 2002, délivré le 15 novembre 2005 — confirmé directement à partir des planches de dessin, qui portent le même titre, numéro et date. Les revendications couvrent une plaque de recouvrement pivotante à la patte qui se referme sur l'axe et est fixée par un crochet actionné par levier, réglable en force de serrage, plutôt qu'un blocage rapide conventionnel ou un axe traversant. Fait partie d'une famille de dépôts plus large sous le même titre (US 6 669 219, US 6 824 154, et des continuations ultérieures) de la même époque de fourches Maverick American. Cédé à Specialized Bicycle Components, Inc. en 2012."}},{"num":"6045470","cat":"susp","title":{"en":"Idler-cog chainline control (US 6,045,470)","fr":"Contrôle de la ligne de chaîne par galet de renvoi (US 6,045,470)"},"assignee":"Independent inventors","img":"../pictures/US6045470A.png","alt":{"en":"Figure I of US 6,045,470: a bicycle side view showing the idler cog (17) mounted near the rear suspension pivot (19), guiding the chain (31) to control chainline as the rear triangle (10/12/13) moves through its travel","fr":"Figure I du brevet US 6 045 470 : une vue de côté du vélo montrant le galet de renvoi (17) monté près du pivot de suspension arrière (19), guidant la chaîne (31) pour contrôler la ligne de chaîne lorsque le triangle arrière (10/12/13) se déplace dans son débattement"},"teaser":{"en":"Filed February 1998: a front-derailleur-mounted idler cog controlling chainline through suspension travel — the high-pivot idler concept, two decades early.","fr":"Déposé en février 1998 : un galet de renvoi monté sur le dérailleur avant contrôlant la ligne de chaîne pendant le débattement de la suspension — le concept de galet de renvoi à pivot haut, avec deux…"},"full":{"en":"Filed February 1998: a front-derailleur-mounted idler cog controlling chainline through suspension travel — the high-pivot idler concept, two decades early.","fr":"Déposé en février 1998 : un galet de renvoi monté sur le dérailleur avant contrôlant la ligne de chaîne pendant le débattement de la suspension — le concept de galet de renvoi à pivot haut, avec deux décennies d'avance."}},{"num":"7661503","cat":"susp","title":{"en":"Orion 6-bar + dual-idler (RMU Nighttrain; platform US 7,661,503)","fr":"Orion 6-barres + double galet de renvoi (RMU Nighttrain ; plateforme US 7 661 503)"},"assignee":"David Weagle / Orion Dynamics Inc. → Rocky Mountain Underground (Breckenridge, CO)","img":"../pictures/US7661503B2.png","alt":{"en":"Fig. 1a of US 7,661,503: a kinematic schematic of a bicycle-length vehicle in side view, with a dashed construction line (7) running from the rear tire contact point (31) to a point (10) on a vertical line (11) above the front contact point (30), the center-of-gravity marker (G, 36), and height dimensions 13 and 15 used to define squat magnitude","fr":"Fig. 1a du brevet US 7 661 503 : un schéma cinématique d'un véhicule de la longueur d'un vélo, vu de profil, avec une ligne de construction en pointillés (7) allant du point de contact du pneu arrière (31) à un point (10) d'une ligne verticale (11) située au-dessus du point de contact avant (30), le repère du centre de gravité (G, 36) et les cotes de hauteur 13 et 15 servant à définir l'amplitude du squat"},"teaser":{"en":"US 7,661,503, 'Vehicle suspension system for stable squat magnitude responses,' filed April 7, 2005 and granted February 16, 2010 to inventor David Weagle, assignee Orion Dynamics Inc. — the…","fr":"US 7 661 503, « Vehicle suspension system for stable squat magnitude responses », déposé le 7 avril 2005 et délivré le 16 février 2010 à l'inventeur David Weagle, cessionnaire Orion Dynamics Inc. — le…"},"full":{"en":"US 7,661,503, 'Vehicle suspension system for stable squat magnitude responses,' filed April 7, 2005 and granted February 16, 2010 to inventor David Weagle, assignee Orion Dynamics Inc. — the vehicle-agnostic base patent behind the Orion platform, originally developed for motorcycle use before Weagle licensed it into bicycles. RMU's Nighttrain runs a mid/high-pivot Orion adaptation paired with a dual-idler drivetrain — two idler pulleys instead of the single idler most high-pivot bikes use, meant to decouple pedaling and suspension forces more completely while limiting the drag and chain-wear penalty of a single high idler. Esker Cycles has also run Orion under license since its 2018 Elkat. This patent's claims cover the squat-stabilizing linkage itself; no separate published number has been located for the dual-idler drivetrain.","fr":"US 7 661 503, « Vehicle suspension system for stable squat magnitude responses », déposé le 7 avril 2005 et délivré le 16 février 2010 à l'inventeur David Weagle, cessionnaire Orion Dynamics Inc. — le brevet de base, indépendant du type de véhicule, derrière la plateforme Orion, d'abord conçue pour un usage moto avant que Weagle ne la licencie pour le vélo. Le Nighttrain de RMU fait tourner une adaptation Orion à pivot médian/haut associée à une transmission à double galet de renvoi — deux poulies de renvoi au lieu du galet unique de la plupart des vélos à pivot haut, destinée à découpler plus complètement les forces de pédalage et de suspension tout en limitant le frottement et l'usure de chaîne d'un galet haut unique. Esker Cycles fait aussi tourner Orion sous licence depuis son Elkat de 2018. Les revendications de ce brevet couvrent la biellette stabilisatrice de squat elle-même ; aucun numéro publié distinct n'a été localisé pour la transmission à double galet de renvoi."}},{"num":"10363988","cat":"susp","title":{"en":"Knolly seat-tube geometry + Fourby4 linkage (US 10,363,988)","fr":"Géométrie de tube de selle Knolly + biellette Fourby4 (US 10,363,988)"},"assignee":"Noel Buckley / Knolly Bikes","img":"../pictures/US10363988B2.png","alt":{"en":"Drawing from US 10,363,988: side view of the frame, with the angled seat tube (26), the rear linkage (40, 44, 46) routed around it, and the coil shock (80) mounted along the down tube (24)","fr":"Dessin du brevet US 10 363 988 : vue de profil du cadre, avec le tube de selle incliné (26), la biellette arrière (40, 44, 46) qui le contourne et l'amortisseur à ressort (80) monté le long du tube diagonal (24)"},"teaser":{"en":"Two Knolly hallmarks, one patent. The seat tube is angled so its axis meets the downtube above and in front of the bottom bracket — a straight, continuous tube allowing very deep dropper-post…","fr":"Deux signatures de Knolly, un seul brevet. Le tube de selle est incliné de sorte que son axe rejoint le tube diagonal au-dessus et devant le boîtier de pédalier — un tube droit et continu permettant…"},"full":{"en":"Two Knolly hallmarks, one patent. The seat tube is angled so its axis meets the downtube above and in front of the bottom bracket — a straight, continuous tube allowing very deep dropper-post insertion alongside at least four inches of rear travel. The suspension linkage that routes around that seat tube is what the patent's own text calls ‘FourX4 or 4X4’ — each push-link carries four pivots transferring force from the rear suspension's own four-bar arrangement around the seat tube to the shock, making the whole system a ‘dual four bar’ — and this is almost certainly the mechanism Knolly's marketing brands Fourby4. Granted to Knolly CEO Noel Buckley in 2019, this is one member of a seven-patent continuation chain running from US 7,467,803 (2004) through US 11,845,510 (2023), all tracing to the same December 2003 priority date — plus a Canadian counterpart, CA 2,980,086, filed the same week in 2003 and finally granted in January 2024 with 83 claims. Because continuations inherit the parent application's term rather than getting their own fresh 20 years, every patent in the US chain expired together on the same day — 10 December 2024 — regardless of how recently each one individually issued.","fr":"Deux signatures de Knolly, un seul brevet. Le tube de selle est incliné de sorte que son axe rejoint le tube diagonal au-dessus et devant le boîtier de pédalier — un tube droit et continu permettant une insertion très profonde de la tige de selle télescopique en plus d'au moins quatre pouces de débattement arrière. La biellette de suspension qui contourne ce tube de selle est ce que le texte même du brevet appelle « FourX4 ou 4X4 » — chaque biellette de poussée porte quatre pivots transférant la force du propre agencement quatre-barres de la suspension arrière autour du tube de selle jusqu'à l'amortisseur, faisant de tout le système un « double quatre-barres » — et il s'agit presque certainement du mécanisme que le marketing de Knolly baptise Fourby4. Délivré au PDG de Knolly, Noel Buckley, en 2019, c'est un membre d'une chaîne de continuation de sept brevets allant de l'US 7,467,803 (2004) à l'US 11,845,510 (2023), tous remontant à la même date de priorité de décembre 2003 — plus un équivalent canadien, CA 2 980 086, déposé la même semaine en 2003 et finalement délivré en janvier 2024 avec 83 revendications. Parce que les continuations héritent de la durée de la demande parente plutôt que d'obtenir leurs propres 20 années fraîches, chaque brevet de la chaîne américaine a expiré ensemble le même jour — le 10 décembre 2024 — quelle que soit la récence de la délivrance de chacun pris individuellement."}},{"num":"10071786","cat":"susp","title":{"en":"Integrated hidden-shock frame design (US 10,071,786)","fr":"Design de cadre à amortisseur intégré caché (US 10 071 786)"},"assignee":"Vincenz Droux / Flow AG → Vinoux AG → Scott Sports SA (Bold Cycles)","img":"../pictures/US10071786B2.1.png","alt":{"en":"Figs. 2A, 2B and 2D of US 10,071,786: a perspective view of the full-suspension frame (102) and swingarm (120) with a component group (140–143) drawn detached below the down tube (104), plus a front view and an A-A section through the frame","fr":"Fig. 2A, 2B et 2D du brevet US 10 071 786 : une vue en perspective du cadre à suspension intégrale (102) et du bras oscillant (120) avec un groupe de pièces (140–143) dessiné détaché sous le tube diagonal (104), ainsi qu'une vue de face et une coupe A-A du cadre"},"teaser":{"en":"US 10,071,786 B2, \"Two-wheeled vehicle with rear-wheel suspension,\" names Vincenz Droux as inventor. Filed September 15, 2014 (claiming a 2013 Swiss priority) by Flow AG, published 2016, and granted…","fr":"US 10 071 786 B2, « Two-wheeled vehicle with rear-wheel suspension », nomme Vincenz Droux comme inventeur. Déposé le 15 septembre 2014 (revendiquant une priorité suisse de 2013) par Flow AG, publié en…"},"full":{"en":"US 10,071,786 B2, \"Two-wheeled vehicle with rear-wheel suspension,\" names Vincenz Droux as inventor. Filed September 15, 2014 (claiming a 2013 Swiss priority) by Flow AG, published 2016, and granted September 11, 2018; assigned to Vinoux AG in 2020 and then to Scott Sports SA later that same year. Claims a spring/damper unit housed entirely inside a frame tube, connected to the rear swingarm through a transmission mechanism whose rotational axis passes through an opening in that same tube — keeping the shock off the frame's outer surface and out of the elements. This is the foundational patent behind Bold Cycles' hidden-shock \"Internal Suspension Technology,\" which Scott adopted after taking a majority stake in Bold in 2019 and later carried into a redesigned Spark.","fr":"US 10 071 786 B2, « Two-wheeled vehicle with rear-wheel suspension », nomme Vincenz Droux comme inventeur. Déposé le 15 septembre 2014 (revendiquant une priorité suisse de 2013) par Flow AG, publié en 2016, et délivré le 11 septembre 2018 ; cédé à Vinoux AG en 2020 puis à Scott Sports SA plus tard la même année. Revendique un ensemble ressort/amortisseur logé entièrement à l'intérieur d'un tube de cadre, relié au bras oscillant arrière par un mécanisme de transmission dont l'axe de rotation traverse une ouverture dans ce même tube — gardant l'amortisseur hors de la surface extérieure du cadre et à l'abri des éléments. C'est le brevet fondateur de la technologie « Internal Suspension Technology » à amortisseur caché de Bold Cycles, que Scott a adoptée après avoir pris une participation majoritaire dans Bold en 2019, puis intégrée à un Spark redessiné."}},{"num":"5259637","cat":"susp","title":{"en":"RTS / LTS suspension era","fr":"L'ère de suspension RTS / LTS"},"assignee":"GT Bicycles","img":"../pictures/US5259637A.png","alt":{"en":"Drawing sheet of US 5,259,637: the RTS/LTS rocker-linkage suspension, showing the seat-tube-mounted upper and lower rockers driving paired seat-stay and chain-stay links to the shock absorber","fr":"Planche de dessin du brevet US 5 259 637 : la suspension à biellette RTS/LTS, montrant les basculeurs supérieur et inférieur montés sur le tube de selle entraînant les biellettes appariées de haubans et bases jusqu'à l'amortisseur"},"teaser":{"en":"GT's first-generation full-suspension portfolio — Rotating Triangle System (RTS) and Linkage Tuned Suspension (LTS) — across four patents: US 5,259,637 and its continuation US 5,306,036 cover the…","fr":"Le portefeuille tout-suspendu de première génération de GT — Rotating Triangle System (RTS) et Linkage Tuned Suspension (LTS) — couvre quatre brevets : US 5 259 637 et sa continuation US 5 306 036…"},"full":{"en":"GT's first-generation full-suspension portfolio — Rotating Triangle System (RTS) and Linkage Tuned Suspension (LTS) — across four patents: US 5,259,637 and its continuation US 5,306,036 cover the rocker-linkage suspension itself, a seat-tube-mounted upper/lower rocker pair driving paired seat-stay and chain-stay links to a shock absorber; US 6,056,307 adds an anti-dive braking system that routes rear-brake force back into the linkage to counter the unweighting braking normally causes; EP 0,825,098 covers a separate flex-joint frame member, a pivot-less bending site encased to move without twisting.","fr":"Le portefeuille tout-suspendu de première génération de GT — Rotating Triangle System (RTS) et Linkage Tuned Suspension (LTS) — couvre quatre brevets : US 5 259 637 et sa continuation US 5 306 036 couvrent la suspension à biellette elle-même, une paire de basculeurs supérieur/inférieur montés sur le tube de selle entraînant des biellettes appariées de haubans et de bases jusqu'à un amortisseur ; US 6 056 307 ajoute un système de freinage anti-plongée qui renvoie la force du frein arrière dans la biellette pour contrer le délestage que le freinage provoque normalement ; EP 0 825 098 couvre un élément de cadre à joint flexible distinct, un site de flexion sans pivot encapsulé pour se mouvoir sans torsion."}},{"num":"8066297","cat":"susp","title":{"en":"Switch / Sine Suspension (eccentric pivot) — US 8,066,297 + 8,201,841 + 8,382,136","fr":"Switch / Suspension Sine (pivot excentrique) — US 8 066 297 + 8 201 841 + 8 382 136"},"assignee":"Luther M. Beale & David M. Earle / Sotto Group LLC → Sine Suspension LLC (licensed to Yeti as Switch, to Alchemy as Sine)","img":"../pictures/US8066297B2.png","alt":{"en":"Patent drawing from US 8,066,297 B2, showing the eccentric main-pivot suspension mechanism first licensed to Yeti as Switch and later relicensed as Sine","fr":"Dessin du brevet US 8 066 297 B2, montrant le mécanisme de suspension à pivot principal excentrique d'abord licencié à Yeti sous le nom Switch, puis relicencié sous le nom Sine"},"teaser":{"en":"The eccentric-pivot mechanism credited to Sotto Group's Luther M. Beale and David M. Earle across three linked patents — 'Bicycle rear suspension linkage,' US 8,066,297 (filed 2009, granted Nov. 2011)…","fr":"Le mécanisme à pivot excentrique crédité à Luther M. Beale et David M. Earle de Sotto Group à travers trois brevets liés — « Bicycle rear suspension linkage », US 8 066 297 (déposé en 2009, délivré en…"},"full":{"en":"The eccentric-pivot mechanism credited to Sotto Group's Luther M. Beale and David M. Earle across three linked patents — 'Bicycle rear suspension linkage,' US 8,066,297 (filed 2009, granted Nov. 2011) and US 8,201,841 (granted 2012), plus 'Bicycle rear suspension system linkage,' US 8,382,136 — all descending from the same PCT/US2010/031640 application. Sotto Group licensed the mechanism exclusively to Yeti as Switch, used on the SB66/SB75/SB95 (2010–2013) before the translating-rail Switch Infinity replaced it in 2014, then reassigned the whole family to Earle's own Sine Suspension LLC in 2020. Sine Suspension LLC now licenses the same mechanism to Alchemy Bikes (Golden, Colorado) as Sine — confirmed directly against Sotto's own patent notice, which lists 'Sine' against this identical four-filing family. A virtual-marking page only lists what its owner holds, which is why Switch never appeared on Yeti's own patent-marking page: Yeti licensed the mechanism, it never owned it.","fr":"Le mécanisme à pivot excentrique crédité à Luther M. Beale et David M. Earle de Sotto Group à travers trois brevets liés — « Bicycle rear suspension linkage », US 8 066 297 (déposé en 2009, délivré en novembre 2011) et US 8 201 841 (délivré en 2012), plus « Bicycle rear suspension system linkage », US 8 382 136 — tous issus de la même demande PCT/US2010/031640. Sotto Group a licencié le mécanisme en exclusivité à Yeti sous le nom Switch, utilisé sur les SB66/SB75/SB95 (2010-2013) avant que le Switch Infinity à rail translatant ne le remplace en 2014, puis a recédé toute la famille à la propre société d'Earle, Sine Suspension LLC, en 2020. Sine Suspension LLC licencie désormais le même mécanisme à Alchemy Bikes (Golden, Colorado) sous le nom Sine — confirmé directement par l'avis de brevet propre à Sotto, qui associe « Sine » à cette même famille de quatre dépôts. Une page de marquage virtuel ne liste que ce que son propriétaire détient, ce qui explique pourquoi le Switch n'est jamais apparu sur la propre page de brevets de Yeti : Yeti a licencié le mécanisme, il ne l'a jamais possédé."}},{"num":"9701361","cat":"susp","title":{"en":"Spot Brand Living Link leaf-spring suspension (4 patents)","fr":"Suspension à lame ressort Spot Brand Living Link (4 brevets)"},"assignee":"Wayne Lumpkin / Spot Brand (Golden, CO)","img":"../pictures/US9701361B2.png","alt":{"en":"Patent figure from US 9,701,361: the Living Link rear end with the titanium leaf spring (24) forming the lower link itself between the bottom-bracket area and the chainstay, rather than a conventional rigid link and pivot","fr":"Figure du brevet US 9 701 361 : le triangle arrière Living Link avec la lame ressort en titane (24) formant elle-même la biellette inférieure entre la zone du boîtier de pédalier et la base, plutôt qu'une biellette rigide et un pivot classiques"},"teaser":{"en":"A titanium leaf spring built into the lower linkage — four patents (US 9,701,361, 9,359,039, 9,156,521, 8,740,239) — designed to return energy into the pedal stroke at the right moment.","fr":"Une lame ressort en titane intégrée à la biellette inférieure — quatre brevets (US 9,701,361, 9,359,039, 9,156,521, 8,740,239) — conçue pour restituer de l'énergie au coup de pédale au bon moment."},"full":{"en":"A titanium leaf spring built into the lower linkage — four patents (US 9,701,361, 9,359,039, 9,156,521, 8,740,239) — designed to return energy into the pedal stroke at the right moment.","fr":"Une lame ressort en titane intégrée à la biellette inférieure — quatre brevets (US 9,701,361, 9,359,039, 9,156,521, 8,740,239) — conçue pour restituer de l'énergie au coup de pédale au bon moment."}},{"num":"20110227312","cat":"susp","title":{"en":"Turntable rear suspension (US 2011/0227312, application)","fr":"Suspension arrière Turntable (US 2011/0227312, demande)"},"assignee":"David Earle / Sotto Group LLC","img":"../pictures/US20110227312A1.png","alt":{"en":"Fig. 11 of US 2011/0227312 A1: an exploded view of the eccentric bearing unit at a pivot lug (2A) on the frame member (2, 7) — an outer bearing (21) on each side of the lug's bore (2B), a flanged eccentric insert (22; flange 221, boss 222, through-hole 223) and an inner bearing (23) on each side, and a bolt and nut along the common axis","fr":"Fig. 11 du brevet US 2011/0227312 A1 : une vue éclatée de l'unité de palier excentrique sur une patte de pivot (2A) de l'élément de cadre (2, 7) — un palier extérieur (21) de chaque côté de l'alésage de la patte (2B), un insert excentrique à collerette (22 ; collerette 221, bossage 222, trou traversant 223) et un palier intérieur (23) de chaque côté, ainsi qu'un boulon et un écrou le long de l'axe commun"},"teaser":{"en":"'Bicycle rear suspension system' — published as US 2011/0227312 A1, a further Sotto Group linkage design marketed and licensable separately from Switch/Sine per Sotto's own patent notice. Assigned to…","fr":"« Bicycle rear suspension system » — publiée sous le numéro US 2011/0227312 A1, une autre conception de biellette de Sotto Group, commercialisée et licenciable séparément de Switch/Sine selon l'avis…"},"full":{"en":"'Bicycle rear suspension system' — published as US 2011/0227312 A1, a further Sotto Group linkage design marketed and licensable separately from Switch/Sine per Sotto's own patent notice. Assigned to Sotto Group LLC, crediting David Earle. Whether this specific application went on to grant, and under what number, wasn't independently confirmed this pass — flagged honestly as a published application rather than a presumed-granted patent.","fr":"« Bicycle rear suspension system » — publiée sous le numéro US 2011/0227312 A1, une autre conception de biellette de Sotto Group, commercialisée et licenciable séparément de Switch/Sine selon l'avis de brevet propre à Sotto. Cédée à Sotto Group LLC, créditant David Earle. Le fait que cette demande précise ait ou non abouti à une délivrance, et sous quel numéro, n'a pas été confirmé de façon indépendante cette fois-ci — signalé honnêtement comme une demande publiée plutôt qu'un brevet présumé délivré."}},{"num":"AU2013225624","cat":"susp","title":{"en":"I-Track Virtual High Pivot (AU 2013225624)","fr":"I-Track Virtual High Pivot (AU 2013225624)"},"assignee":"Hugh McLeay / I-Track Suspension (Australia)","img":"../pictures/CA2865915C.png","alt":{"en":"A geometry diagram from the I-Track family (CA 2,865,915): the floating idler pulley (30/31/33) mounted on the suspension linkage above the chainstay pivot (21), shown against the front and rear wheel circles (10/15) and the dashed instant-center line (11)","fr":"Un diagramme de géométrie de la famille I-Track (CA 2 865 915) : le galet de renvoi flottant (30/31/33) monté sur la biellette de suspension au-dessus du pivot de la base (21), représenté avec les cercles de la roue avant et arrière (10/15) et la ligne de centre instantané en pointillés (11)"},"teaser":{"en":"Designed by Australian engineer Hugh McLeay and filed from a single March 2013 priority date, this is a five-jurisdiction family, not just the AU grant its title names: AU 2,013,225,624, US 9,168,977,…","fr":"Conçu par l'ingénieur australien Hugh McLeay et déposé à partir d'une unique date de priorité de mars 2013, il s'agit d'une famille couvrant cinq juridictions, pas seulement le brevet australien que…"},"full":{"en":"Designed by Australian engineer Hugh McLeay and filed from a single March 2013 priority date, this is a five-jurisdiction family, not just the AU grant its title names: AU 2,013,225,624, US 9,168,977, EP 2,819,915, CA 2,865,915 and NZ 629,818, all descending from the same WO 2013/126968 PCT application. In the company's own words: \"At the heart of i-track, is a dynamic idler pulley that engages with the power transmitting segment of the chain. This idler pulley is attached to a member of the suspension linkage, so that it moves relative to the bottom bracket and the rear axle, as the suspension is compressed. When using this technology, a suspension designer is able to strategically control the dynamic movement of the idler pulley relative to the other drivetrain elements (front chainring and rear cassette), to achieve their desired targets for chain growth or shrinkage. This provides independent control of the anti-squat characteristic, allowing it to be tuned independently of axle path and other kinematic properties.\" i-track's own partners page lists eleven partners across six countries: Norco (Canada — Range, Sight, Optic, and the earlier Aurum HSP), Taken Cycles (Boise, Idaho — stacking i-track's idler on top of its own separately-licensed CBF suspension), Velduro (New Zealand/China — the Avinox-powered Rogue e-MTB), Vampire Bike Co (Utah — Chris Canfield's own brand, a second atlas entry for the Canfield name alongside CBF itself), Archibald Cycles (Delta, BC — the gearbox-compatible AC1), Terra Bikes (Italy — the steel gearbox freerider Nera), Pyga Mountain Bikes (South Africa), Craftworks Cycles (McLeay's own house brand), and Trinity MTB (Mic Williams/WRP, Geelong — see the CentreHub entry), plus two World Cup DH factory teams, Intense Factory Racing (2022) and the NS Bikes UR Team (16th at the 2023 World Championships). <a class=\"gp gp-secondary\" href=\"https://i-tracksuspension.com\" target=\"_blank\" rel=\"noopener\">i-tracksuspension.com →</a> <a class=\"gp gp-secondary\" href=\"https://i-tracksuspension.com/patents/\" target=\"_blank\" rel=\"noopener\">Patents page →</a> <a class=\"gp gp-secondary\" href=\"https://i-tracksuspension.com/partners/\" target=\"_blank\" rel=\"noopener\">Partners page →</a>","fr":"Conçu par l'ingénieur australien Hugh McLeay et déposé à partir d'une unique date de priorité de mars 2013, il s'agit d'une famille couvrant cinq juridictions, pas seulement le brevet australien que son titre nomme : AU 2 013 225 624, US 9,168,977, EP 2 819 915, CA 2 865 915 et NZ 629 818, tous descendant de la même demande PCT WO 2013/126968. Dans les mots de l'entreprise elle-même : « Au cœur d'i-track se trouve une poulie de renvoi dynamique qui vient en prise avec le brin moteur de la chaîne. Cette poulie de renvoi est fixée à un élément de la biellette de suspension, de sorte qu'elle se déplace par rapport au boîtier de pédalier et à l'axe arrière à mesure que la suspension se comprime. Avec cette technologie, un concepteur de suspension peut contrôler stratégiquement le mouvement dynamique de la poulie de renvoi par rapport aux autres éléments de la transmission (plateau avant et cassette arrière), pour atteindre les objectifs souhaités de croissance ou de réduction de la longueur de chaîne. Cela offre un contrôle indépendant de la caractéristique d'anti-squat, permettant de la régler indépendamment de la trajectoire d'axe et des autres propriétés cinématiques. » La propre page de partenaires d'i-track en liste onze répartis dans six pays : Norco (Canada — Range, Sight, Optic, et l'ancien Aurum HSP), Taken Cycles (Boise, Idaho — superposant le galet i-track à sa propre suspension CBF licenciée séparément), Velduro (Nouvelle-Zélande/Chine — le VTTAE Rogue propulsé par Avinox), Vampire Bike Co (Utah — la propre marque de Chris Canfield, une deuxième fiche de l'atlas pour le nom Canfield aux côtés du CBF lui-même), Archibald Cycles (Delta, C.-B. — l'AC1 compatible boîte de vitesses), Terra Bikes (Italie — le freerider acier à boîte de vitesses Nera), Pyga Mountain Bikes (Afrique du Sud), Craftworks Cycles (la marque maison de McLeay lui-même), et Trinity MTB (Mic Williams/WRP, Geelong — voir la fiche CentreHub), plus deux équipes d'usine de Coupe du monde DH, Intense Factory Racing (2022) et la NS Bikes UR Team (16e aux Championnats du monde 2023). <a class=\"gp gp-secondary\" href=\"https://i-tracksuspension.com\" target=\"_blank\" rel=\"noopener\">i-tracksuspension.com →</a> <a class=\"gp gp-secondary\" href=\"https://i-tracksuspension.com/patents/\" target=\"_blank\" rel=\"noopener\">Page des brevets →</a> <a class=\"gp gp-secondary\" href=\"https://i-tracksuspension.com/partners/\" target=\"_blank\" rel=\"noopener\">Page des partenaires →</a>"}},{"num":"9908583","cat":"susp","title":{"en":"Two-axis rear-wheel suspension path (US 9,908,583)","fr":"Suspension arrière à trajectoire d'axe à deux axes (US 9 908 583)"},"assignee":"W. Hank Matheson & Jonathan R. Heim","img":"../pictures/US9908583B2.png","alt":{"en":"Fig. 1 of US 9,908,583 B2: a full-suspension bike in profile with the swing arm's independent vertical (A1) and rearward (A4) axle-travel axes both labeled at the rear wheel (106), and the force-vector components FX/FY shown resolving near the bottom-bracket pivot (120/122)","fr":"Fig. 1 du brevet US 9 908 583 B2 : un vélo tout-suspendu en profil avec les deux axes de débattement indépendants du bras oscillant, vertical (A1) et rétrograde (A4), indiqués au niveau de la roue arrière (106), et les composantes du vecteur de force FX/FY représentées se résolvant près du pivot du boîtier de pédalier (120/122)"},"teaser":{"en":"Granted patent \"Bicycle rear suspension with a two axis wheel path,\" filed December 23, 2014 by W. Hank Matheson and Jonathan R. Heim and originally assigned to their company Bicycle Fabrications LLC…","fr":"Brevet délivré « Bicycle rear suspension with a two axis wheel path », déposé le 23 décembre 2014 par W. Hank Matheson et Jonathan R. Heim et initialement cédé à leur société Bicycle Fabrications LLC…"},"full":{"en":"Granted patent \"Bicycle rear suspension with a two axis wheel path,\" filed December 23, 2014 by W. Hank Matheson and Jonathan R. Heim and originally assigned to their company Bicycle Fabrications LLC (later reassigned to the two inventors individually). It claims a swing-arm suspension that lets the rear axle move independently along two axes — vertical and rearward — rather than tracing a single fixed arc, so the axle's actual path shifts with the direction of the impact force. The pair had been developing the concept since 2010, four years before this application was filed.","fr":"Brevet délivré « Bicycle rear suspension with a two axis wheel path », déposé le 23 décembre 2014 par W. Hank Matheson et Jonathan R. Heim et initialement cédé à leur société Bicycle Fabrications LLC (rétrocédé ensuite aux deux inventeurs à titre individuel). Il revendique une suspension à bras oscillant permettant à l'axe arrière de se déplacer indépendamment selon deux axes — vertical et rétrograde — plutôt que de suivre un arc unique fixe, de sorte que la trajectoire réelle de l'axe varie selon la direction de la force d'impact. Le duo développait le concept depuis 2010, quatre ans avant le dépôt de cette demande."}},{"num":"2160034","cat":"fork","title":{"en":"Schwinn Knee-Action Spring Fork (US 2,160,034)","fr":"Fourche à ressort Knee-Action de Schwinn (US 2,160,034)"},"assignee":"Frank W. Schwinn / Arnold, Schwinn & Co.","img":"../pictures/US2160034A.png","alt":{"en":"Fig. 2 of US 2,160,034: a close-up section through the head tube showing the stack of rubber cushion discs (36/37/43/54) around the fork's sliding upper tube (18), clamped between collars (30-35) at the steerer","fr":"Fig. 2 du brevet US 2 160 034 : une coupe rapprochée du tube de direction montrant l'empilement de rondelles en caoutchouc amortissantes (36/37/43/54) autour du tube coulissant supérieur de la fourche (18), pincées entre des colliers (30-35) au niveau de la douille de direction"},"teaser":{"en":"A telescoping front fork with a spring-and-rubber-cushion mechanism that let the wheel move relative to the frame, marketed on 1938 Autocycle-line balloon-tire bikes as the 'Knee-Action Spring Fork.'…","fr":"Une fourche avant télescopique avec un mécanisme à ressort et coussin de caoutchouc qui laissait la roue se déplacer par rapport au cadre, commercialisée sur les vélos à pneus ballon de la gamme…"},"full":{"en":"A telescoping front fork with a spring-and-rubber-cushion mechanism that let the wheel move relative to the frame, marketed on 1938 Autocycle-line balloon-tire bikes as the 'Knee-Action Spring Fork.' Filed the same day (March 3, 1938) as Schwinn's cantilever frame patent below. Patents of this era ran 17 years from grant rather than 20 years from filing, so protection lapsed in 1956.","fr":"Une fourche avant télescopique avec un mécanisme à ressort et coussin de caoutchouc qui laissait la roue se déplacer par rapport au cadre, commercialisée sur les vélos à pneus ballon de la gamme Autocycle de 1938 sous le nom de « Knee-Action Spring Fork ». Déposée le même jour (3 mars 1938) que le brevet de cadre cantilever de Schwinn ci-dessous. Les breve
