<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Match — MTB Patent Atlas</title>
<meta name="description" content="Match real mountain-bike patent drawings to their descriptions, drawn from the MTB Patent Atlas's own verified entries.">
<style>
/* ===========================================================
   PATENT MATCH -- live at postmillenniumrenaissance.com/atlas/match
   ===========================================================
   Single file, no build step, no framework -- same rule as the main
   Atlas (index.html one level up). Wired into the PMR site 2026-10-01
   via a wrapper page in the pmr-website repo (same pattern as the main
   Atlas's own /atlas/ wrapper) -- still NOT linked from this repo's own
   index.html nav (a separate call, not yet made). CSS variable names
   match the Atlas's own default ("WMBC") theme values so this can be
   reskinned or folded into the main tool later with minimal rework.
   Known shipped-with-a-gap: MATCH_DATA's `teaser` field is still an
   algorithmic truncation, not hand-written -- see the header comment on
   MATCH_DATA below. Jon chose to launch with that gap and improve
   teaser copy in a later pass rather than hold the page back for it.
   =========================================================== */
:root{
  --bg:#EEF3EC; --surface:#FFFFFF; --ink:#16261C; --ink-soft:#4b5f53;
  --primary:#2D6A4F; --accent:#8AB17D; --card-border:#D8E2D9;
  --ok:#2D6A4F; --ok-bg:#E3EFE6; --bad:#B5532A; --bad-bg:#F6E4DC;
  --radius:14px; --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --badge-bg:#26382E; /* fixed, doesn't invert with theme -- badges sit on the always-white drawing/on a surface card, so a floating dark chip reads in either theme */
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 60px}

/* ---- Header ---- */
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.proto-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);background:var(--surface);border:1px solid var(--card-border);border-radius:999px;padding:3px 9px;margin-bottom:10px}
.lang-btn{flex:none;border:1px solid var(--card-border);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}
.lang-btn:hover{border-color:var(--primary)}
.lang-btn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
h1{font-size:24px;margin:0 0 6px}
.lede{color:var(--ink-soft);margin:0 0 4px;font-size:15px;max-width:60ch}
.lede.small{font-size:13px}

/* ---- Controls panel ---- */
/* Mobile-first: .controls is a <details> element, CLOSED by default (no
   [open] attribute in the markup) so the 2 pair chips + 9 category chips
   don't push the actual game board below the fold on a phone. A small
   bootstrap script (near the end of this file's own <script>) re-opens it
   by default on >=760px viewports only, matching the board's own
   side-by-side breakpoint -- desktop keeps the always-visible panel it had
   before. */
.controls{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin:16px 0;display:flex;flex-direction:column;gap:12px}
.controls summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft)}
.controls summary::-webkit-details-marker{display:none}
.controls summary::after{content:"\25BE";font-size:15px;transition:transform .15s}
.controls[open] summary::after{transform:rotate(180deg)}
.ctrl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctrl-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);min-width:98px}
/* Mobile-first: scroll sideways instead of wrapping to several lines --
   matters most for the 9-chip Categories row. Desktop (>=760px, below)
   restores wrapping since there's room for it and side-scrolling a mouse
   is worse UX than just letting it wrap. */
.chip-set{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--card-border);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;display:inline-flex;align-items:center;min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip:hover{border-color:var(--primary)}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:13px}
.new-round-btn{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px}
.new-round-btn:hover{opacity:.92}
.clamp-note{font-size:12.5px;color:var(--bad);margin:0}

/* ---- Status bar ---- */
.status-bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:14px;margin:0 0 14px;padding:0 2px}
.status-bar b{font-variant-numeric:tabular-nums}
.status-bar .mistakes b{color:var(--bad)}

/* ---- Board: mobile-first, stacked; side-by-side from 760px ---- */
.board{display:flex;flex-direction:column;gap:22px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 8px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.desc-list{display:flex;flex-direction:column;gap:8px}

.tile{position:relative;border:2px solid var(--card-border);border-radius:var(--radius);background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;overflow:hidden;transition:border-color .15s,transform .1s,background .2s}
.tile:hover:not(.matched){border-color:var(--primary);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tile.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.18)}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.tile.matched{border-color:var(--ok);background:var(--ok-bg);cursor:default;transform:none}
.tile.matched:hover{transform:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.img-tile{aspect-ratio:1/1;display:flex;flex-direction:column}
.img-tile .badge{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--badge-bg);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.img-tile.matched .badge{background:var(--ok)}
.img-tile img{width:100%;height:100%;object-fit:contain;background:#fff;padding:6px;flex:1}
.img-tile .reveal{display:none;font-size:11px;padding:6px 8px;border-top:1px solid var(--card-border);color:var(--ink-soft);line-height:1.3}
.img-tile.matched .reveal{display:block}

.desc-tile{display:flex;gap:10px;padding:11px 12px;align-items:flex-start}
.desc-tile .badge{flex:none;width:22px;height:22px;border-radius:50%;background:var(--badge-bg);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.desc-tile.matched .badge{background:var(--ok)}
.desc-tile .txt{font-size:13.5px;line-height:1.4}
.desc-tile.matched .txt{color:var(--ink-soft)}

@media(min-width:760px){
  .board{flex-direction:row}
  .panel{flex:1;min-width:0}
  .chip-set{flex-wrap:wrap;overflow-x:visible}
}

/* ---- Completion banner ---- */
.done-banner{display:none;background:var(--ok-bg);border:1px solid var(--ok);border-radius:var(--radius);padding:18px;margin:18px 0;text-align:center}
.done-banner.show{display:block}
.done-banner h2{margin:0 0 6px;font-size:18px;color:var(--ok)}
.done-banner p{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.done-banner button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

footer{margin-top:40px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--card-border);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <span class="proto-badge" id="txProtoBadge"></span>
    <button type="button" class="lang-btn" id="langBtn"></button>
  </div>
  <h1 id="txH1"></h1>
  <p class="lede" id="txLede1"></p>
  <p class="lede small" id="txLede2"></p>

  <details class="controls" id="controlsPanel">
    <summary><span id="controlsSummaryText"></span></summary>
    <div class="ctrl-row">
      <span class="ctrl-label" id="pairsLabel"></span>
      <div class="chip-set" id="pairsChips" role="group" aria-labelledby="pairsLabel"></div>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label" id="catLabel"></span>
      <div class="chip-set" id="catChips" role="group" aria-labelledby="catLabel"></div>
    </div>
    <div class="ctrl-row">
      <label class="toggle-row"><input type="checkbox" id="timerToggle" checked> <span id="txTimerLabel"></span></label>
      <button type="button" class="new-round-btn" id="newRoundBtn"></button>
    </div>
    <p class="clamp-note" id="clampNote" hidden></p>
  </details>

  <div class="status-bar">
    <span id="txMatchedLabel">Matched <b id="statMatched">0</b>/<b id="statTotal">0</b></span>
    <span class="mistakes" id="txMistakesLabel">Mistakes <b id="statMistakes">0</b></span>
    <span id="statTimeWrap"></span>
  </div>

  <div class="board">
    <div class="panel">
      <h2 id="txDrawingsH"></h2>
      <div class="img-grid" id="imgGrid"></div>
    </div>
    <div class="panel">
      <h2 id="txDescriptionsH"></h2>
      <div class="desc-list" id="descList"></div>
    </div>
  </div>

  <div class="done-banner" id="doneBanner">
    <h2 id="doneHeadline"></h2>
    <p id="doneStats"></p>
    <button type="button" id="playAgainBtn"></button>
  </div>

  <div class="sr-only" aria-live="polite" id="liveRegion"></div>

  <footer id="txFooter"></footer>
</div>

<script>
/* ======================================================================
   MATCH_DATA -- every D entry in the live Atlas (as of 2026-10-07) that
   has at least one drawing: 277 entries, every category, any confidence
   tier. Generated from index.html's own D array one directory up --
   title, assignee, img, imgAlt and the full summary are all copied
   verbatim, nothing invented. `teaser` is the one field this page adds:
   an ALGORITHMIC truncation of the entry's own summary (first ~200
   characters, cut at a word boundary, "..." appended) -- not the
   hand-written, mechanism-first one-liners the original 27-entry demo
   used. That trade is deliberate: hand-writing a good one-line teaser
   for 277 entries in two languages isn't a one-session task, and a
   truncation is honest (it's the entry's own words) where a rushed
   paraphrase risks drifting from what the patent actually says. The
   real cost: a algorithmic cut often leads with filing/citation
   boilerplate ("US 5,630,338, filed July 11, 1995...") rather than the
   mechanism, which is a weaker teaser than a hand-written one -- worth
   revisiting entry-by-entry now that this is live as /atlas/match, the
   same way the Atlas's own README documents en/fr coverage honestly
   rather than papering over it.

   Regenerate this block (after a data session adds/edits entries with
   images) with the Node snippet kept in the sibling comment at the
   bottom of this file's <script> -- it re-derives everything from
   index.html's D array, so there is nothing to hand-edit here directly.
   ====================================================================== */
const MATCH_DATA = [{"num":"439095","cat":"susp","title":{"en":"Becker spring-suspended velocipede frame (US 439,095)","fr":"Cadre de vélocipède à suspension à ressorts de Becker (US 439 095)"},"assignee":"Hugo Auguste Becker","img":"../pictures/US439095-becker-page-1.png","alt":{"en":"Becker's 1890 velocipede patent drawing, Fig. 1, showing coil springs cushioning both the head-tube and seat-tube frame junctions","fr":"Dessin du brevet de vélocipède de Becker de 1890, Fig. 1, montrant des ressorts hélicoïdaux amortissant les jonctions du cadre au tube de direction et au tube de selle"},"teaser":{"en":"Filed October 19, 1889 and granted October 28, 1890, Hugo Auguste Becker's \"Velocipede\" patent splits the frame into hinged front and rear sections, each cushioned by its own coil spring at the joint…","fr":"Déposé le 19 octobre 1889 et délivré le 28 octobre 1890, le brevet « Velocipede » de Hugo Auguste Becker divise le cadre en sections avant et arrière articulées, chacune amortie par son propre ressort…"},"full":{"en":"Filed October 19, 1889 and granted October 28, 1890, Hugo Auguste Becker's \"Velocipede\" patent splits the frame into hinged front and rear sections, each cushioned by its own coil spring at the joint — one behind the head tube, one under the seat — rather than relying on the wheels or tires alone to absorb road shock. The claims cover the combination of a frame-piece, sprocket-wheel, hinged rod, spring, connecting brace, and a transverse connecting-spring tying the two halves together.","fr":"Déposé le 19 octobre 1889 et délivré le 28 octobre 1890, le brevet « Velocipede » de Hugo Auguste Becker divise le cadre en sections avant et arrière articulées, chacune amortie par son propre ressort hélicoïdal au niveau de la jonction — l'un derrière le tube de direction, l'autre sous le tube de selle — plutôt que de s'en remettre uniquement aux roues ou aux pneus pour absorber les chocs de la route. Les revendications couvrent la combinaison d'une pièce de cadre, d'une roue à pignon, d'une tige articulée, d'un ressort, d'une entretoise de liaison, et d'un ressort de liaison transversal reliant les deux moitiés."}},{"num":"6843494","cat":"susp","title":{"en":"Rocky Mountain rear suspension system (US 6,843,494)","fr":"Système de suspension arrière Rocky Mountain (US 6,843,494)"},"assignee":"Duhane Lam → Rocky Mountain Bicycles","img":"../pictures/US6843494B2.png","alt":{"en":"Fig. 1 of US 6,843,494: the full linkage in the frame, an upper link (26/28/34) and lower link (31/40) carrying the rear stay (12) between the seat area and dropout (35/36), with the shock mount (21/22/23) on the down tube","fr":"Fig. 1 du brevet US 6 843 494 : la biellette complète dans le cadre, un bras supérieur (26/28/34) et un bras inférieur (31/40) portant le bras arrière (12) entre la zone de selle et la patte (35/36), avec le point d'ancrage de l'amortisseur (21/22/23) sur le tube diagonal"},"teaser":{"en":"Rocky Mountain's foundational rear-suspension patent, filed by Duhane Lam and assigned to the Vancouver-area brand — a linkage aimed at a near-vertical rear-axle path with a roughly constant…","fr":"Le brevet fondateur de suspension arrière de Rocky Mountain, déposé par Duhane Lam et cédé à la marque de la région de Vancouver — une biellette visant une trajectoire d'axe arrière presque verticale…"},"full":{"en":"Rocky Mountain's foundational rear-suspension patent, filed by Duhane Lam and assigned to the Vancouver-area brand — a linkage aimed at a near-vertical rear-axle path with a roughly constant leverage-curve rate. It's the parent of a small continuation family (US 7,216,883 and 7,392,999, both credited to designer D'Arcy O'Connor) that carried the platform through the following years.","fr":"Le brevet fondateur de suspension arrière de Rocky Mountain, déposé par Duhane Lam et cédé à la marque de la région de Vancouver — une biellette visant une trajectoire d'axe arrière presque verticale avec un taux de levier à peu près constant. C'est le brevet parent d'une petite famille de continuations (US 7,216,883 et 7,392,999, toutes deux créditées au designer D'Arcy O'Connor) qui a porté la plateforme durant les années suivantes."}},{"num":"5509679","cat":"susp","title":{"en":"Horst Link rear suspension (US 5,509,679)","fr":"Suspension arrière Horst Link (US 5,509,679)"},"assignee":"Horst Leitner / AMP Research → Specialized","img":"../pictures/US5509679A.png","alt":{"en":"Fig. 1 of US 5,509,679: a bicycle side view showing the four-bar linkage (22, 24, 26, 30, 36) at the chainstay/seatstay junction and the shock (5) it drives, mounted low on the seat tube","fr":"Fig. 1 du brevet US 5 509 679 : une vue de côté du vélo montrant la biellette à quatre barres (22, 24, 26, 30, 36) à la jonction bases/haubans et l'amortisseur (5) qu'elle entraîne, monté bas sur le tube de selle"},"teaser":{"en":"A chainstay pivot located in front of and below the rear axle, isolating pedaling and braking forces from the suspension — the original four-bar that became Specialized FSR.","fr":"Un pivot de bases-arrière situé devant et sous l'axe de roue arrière, isolant les forces de pédalage et de freinage de la suspension — le quatre-barres original devenu le FSR de Specialized."},"full":{"en":"A chainstay pivot located in front of and below the rear axle, isolating pedaling and braking forces from the suspension — the original four-bar that became Specialized FSR.","fr":"Un pivot de bases-arrière situé devant et sous l'axe de roue arrière, isolant les forces de pédalage et de freinage de la suspension — le quatre-barres original devenu le FSR de Specialized."}},{"num":"5678837","cat":"susp","title":{"en":"Horst Link continuations (US 5,678,837 + 5,899,480)","fr":"Continuations du Horst Link (US 5,678,837 + 5,899,480)"},"assignee":"Horst Leitner → Specialized","img":"../pictures/US5678837A.png","alt":{"en":"Fig. 1 of US 5,678,837: side view of the complete bicycle showing the four-bar rear suspension — lower arm (3) pivoting near the bottom bracket, upper arm pivot (26) connecting toward the rear wheel dropout area, and the shock absorber (5) mounted between the seat tube and the upper arm","fr":"Fig. 1 du brevet US 5 678 837 : vue de profil du vélo complet montrant la suspension arrière à quatre barres — bras inférieur (3) pivotant près du boîtier de pédalier, pivot du bras supérieur (26) relié vers la zone de la patte arrière, et l'amortisseur (5) monté entre le tube de selle et le bras supérieur"},"teaser":{"en":"Two follow-on filings extending and refining the original four-bar claims, both carrying the same 'paired lower arm members... paired upper arm members' language as 5,509,679: US 5,678,837 (filed…","fr":"Deux dépôts complémentaires étendant et affinant les revendications originales du quatre-barres, tous deux reprenant la même formulation « paires de bras inférieurs... paires de bras supérieurs » que…"},"full":{"en":"Two follow-on filings extending and refining the original four-bar claims, both carrying the same 'paired lower arm members... paired upper arm members' language as 5,509,679: US 5,678,837 (filed 1996, granted 1997) and a second continuation, US 5,899,480 (filed 1997, granted 1999), both eventually assigned to Specialized.","fr":"Deux dépôts complémentaires étendant et affinant les revendications originales du quatre-barres, tous deux reprenant la même formulation « paires de bras inférieurs... paires de bras supérieurs » que le brevet 5,509,679 : US 5,678,837 (déposé en 1996, délivré en 1997) et une seconde continuation, US 5,899,480 (déposée en 1997, délivrée en 1999), toutes deux finalement cédées à Specialized."}},{"num":"5452910","cat":"susp","title":{"en":"RockShox three-link rear suspension, straight-line wheel path (US 5,452,910)","fr":"Suspension arrière à trois biellettes RockShox, trajectoire de roue rectiligne (US 5 452 910)"},"assignee":"Trevor L. Harris / RockShox, Inc. (now SRAM LLC)","img":"../pictures/US5452910A.png","alt":{"en":"Fig. 6 of US 5,452,910: side view of a bicycle with the swing arm carrying the rear wheel (5) from the underside of the frame (F) on two short links (L1, L2) beside the crank, and the shock (11) running up the seat tube","fr":"Fig. 6 du brevet US 5 452 910 : vue de côté d'un vélo avec le bras oscillant portant la roue arrière (5) sous le cadre (F) par deux biellettes courtes (L1, L2) près du pédalier, et l'amortisseur (11) montant le long du tube de selle"},"teaser":{"en":"US 5,452,910, \"Rear wheel suspension for a bicycle and bicycle equipped therewith,\" filed September 9, 1994 by RockShox, Inc. and granted September 26, 1995 to inventor Trevor L. Harris; now assigned…","fr":"US 5 452 910, « Rear wheel suspension for a bicycle and bicycle equipped therewith », déposé le 9 septembre 1994 par RockShox, Inc. et délivré le 26 septembre 1995 à l'inventeur Trevor L. Harris ;…"},"full":{"en":"US 5,452,910, \"Rear wheel suspension for a bicycle and bicycle equipped therewith,\" filed September 9, 1994 by RockShox, Inc. and granted September 26, 1995 to inventor Trevor L. Harris; now assigned to SRAM LLC. An essentially horizontal swing arm carries the rear wheel and hangs from the underside of the frame on a pair of short links. The links are set so the wheel travels in a nearly straight line up and rearward, preferably 20° to 30° off vertical, so that acceleration loads the frame upward and braking loads it downward, reducing frame pitch. The crank axis is also held to less than 5% of the wheel's vertical travel (about 0.25 in. on 4 in. of travel) for a constant pedal feel, and the design fits a standard frame with room for the derailleur. Filed before June 8, 1995 and still in force then, so the term is the later of grant + 17 (2012) and filing + 20 (2014): 2014, matching Google Patents. The claims were not read.","fr":"US 5 452 910, « Rear wheel suspension for a bicycle and bicycle equipped therewith », déposé le 9 septembre 1994 par RockShox, Inc. et délivré le 26 septembre 1995 à l'inventeur Trevor L. Harris ; aujourd'hui cédé à SRAM LLC. Un bras oscillant essentiellement horizontal porte la roue arrière et est suspendu sous le cadre par une paire de biellettes courtes. Les biellettes sont réglées pour que la roue suive une trajectoire presque rectiligne vers le haut et l'arrière, de préférence à 20° à 30° de la verticale, de sorte que l'accélération charge le cadre vers le haut et le freinage vers le bas, ce qui réduit le tangage du cadre. L'axe du pédalier est aussi limité à moins de 5 % du débattement vertical de la roue (environ 0,25 po pour 4 po de débattement) pour une sensation de pédalage constante, et la conception s'adapte à un cadre standard avec de la place pour le dérailleur. Déposé avant le 8 juin 1995 et encore en vigueur à cette date : la durée est la plus longue de grant + 17 (2012) et dépôt + 20 (2014), soit 2014, conforme à Google Patents. Les revendications n'ont pas été lues."}},{"num":"EP1024994B1","cat":"susp","title":{"en":"Full floating double-action rear suspension (EP 1,024,994)","fr":"Suspension arrière entièrement flottante à double action (EP 1 024 994)"},"assignee":"John Nelson Smirneos (individual)","img":"../pictures/EP1024994B1.png","alt":{"en":"Side view of the bicycle in EP 1,024,994: the main frame (1), the main suspension arm (2) carrying the rear wheel (9), the smaller secondary arm (4) under it carrying the drivetrain discs (41) and pedal axle (13), the connecting link (3) and the shock absorber (5)","fr":"Vue de côté du vélo du brevet EP 1 024 994 : le cadre principal (1), le bras de suspension principal (2) portant la roue arrière (9), le bras secondaire plus petit (4) en dessous portant les plateaux (41) et l'axe de pédalier (13), la biellette de liaison (3) et l'amortisseur (5)"},"teaser":{"en":"EP 1,024,994 B1, \"Full floating double action bicycle suspension system,\" by John Nelson Smirneos; the application was filed August 26, 1999 with a 1998 Greek priority and granted November 29, 2006. A…","fr":"EP 1 024 994 B1, « Full floating double action bicycle suspension system », de John Nelson Smirneos ; la demande a été déposée le 26 août 1999 avec une priorité grecque de 1998 et le brevet délivré le…"},"full":{"en":"EP 1,024,994 B1, \"Full floating double action bicycle suspension system,\" by John Nelson Smirneos; the application was filed August 26, 1999 with a 1998 Greek priority and granted November 29, 2006. A main suspension arm carries the rear wheel, and a smaller secondary arm below it carries the bottom bracket. A straight connecting link joins the two, pivoting on the main arm at its upper end and on the bottom-bracket tube at its lower end. The shock sits between the two arms, so both of its ends move, which is the \"full floating, double action\" of the title. The text lists six pretuning options (three shock mounts on the secondary arm and two link pivot positions) and aims at pedaling-induced sinking, chain-force compression, climbing sag and front-derailleur alignment. Pedaling out of the saddle loads the bottom bracket and stiffens the suspension. Google Patents lists the assignee as an individual, so no RockShox or SRAM link is claimed here. The 20-year term from the 1999 filing ended in 2019. The claims were not read.","fr":"EP 1 024 994 B1, « Full floating double action bicycle suspension system », de John Nelson Smirneos ; la demande a été déposée le 26 août 1999 avec une priorité grecque de 1998 et le brevet délivré le 29 novembre 2006. Un bras de suspension principal porte la roue arrière, et un bras secondaire plus petit en dessous porte le boîtier de pédalier. Une biellette de liaison droite relie les deux, pivotant sur le bras principal à son extrémité supérieure et sur le tube de boîtier de pédalier à son extrémité inférieure. L'amortisseur se trouve entre les deux bras, si bien que ses deux extrémités se déplacent, ce qui fait le « flottant intégral à double action » du titre. Le texte énumère six options de préréglage (trois fixations d'amortisseur sur le bras secondaire et deux positions de pivot de biellette) et vise l'affaissement dû au pédalage, la compression due à la chaîne, l'affaissement en montée et l'alignement du dérailleur avant. Pédaler en danseuse charge le boîtier de pédalier et raidit la suspension. Google Patents indique un cessionnaire individuel : aucun lien avec RockShox ou SRAM n'est donc revendiqué ici. Le terme de 20 ans depuis le dépôt de 1999 a pris fin en 2019. Les revendications n'ont pas été lues."}},{"num":"5553881","cat":"susp","title":{"en":"Outland Virtual Pivot Point (original) (US 5,553,881)","fr":"Virtual Pivot Point Outland (original) (US 5 553 881)"},"assignee":"Outland → Santa Cruz","img":"../pictures/US5553881A.png","alt":{"en":"Outland Virtual Pivot Point patent drawing, US 5,553,881, showing the counter-rotating short-link suspension layout","fr":"Dessin du brevet Virtual Pivot Point d'Outland, US 5 553 881, montrant la disposition de suspension à biellettes courtes contrarotatives"},"teaser":{"en":"Counter-rotating short links creating a migrating 'virtual' pivot, designed by David Earle; Outland couldn't commercialize it and Santa Cruz bought the patent in 2001.","fr":"Des biellettes courtes contrarotatives créant un pivot « virtuel » migrant, conçues par David Earle ; Outland n'a pas pu le commercialiser et Santa Cruz a racheté le brevet en 2001."},"full":{"en":"Counter-rotating short links creating a migrating 'virtual' pivot, designed by David Earle; Outland couldn't commercialize it and Santa Cruz bought the patent in 2001.","fr":"Des biellettes courtes contrarotatives créant un pivot « virtuel » migrant, conçues par David Earle ; Outland n'a pas pu le commercialiser et Santa Cruz a racheté le brevet en 2001."}},{"num":"6206397","cat":"susp","title":{"en":"Counter-rotating links / VPP (US 6,206,397)","fr":"Biellettes contrarotatives / VPP (US 6,206,397)"},"assignee":"Santa Cruz (Intense licensed)","img":"../pictures/US6206397B1.png","alt":{"en":"Fig. 1 of US 6,206,397 B1: a full bike side view showing the counter-rotating dual-link cluster (03/12) connecting the seat area to the chainstay/dropout assembly (06/08), with the chainrings (10) below","fr":"Fig. 1 du brevet US 6 206 397 B1 : une vue de côté du vélo montrant l'ensemble de biellettes contrarotatives (03/12) reliant la zone de selle au bloc bases/patte (06/08), avec les plateaux (10) en dessous"},"teaser":{"en":"The key VPP-era patent covering counter-rotating dual links, deployed on the original V10 and Intense M3 in 2002. Inventor James B. Klassen filed this one (Ser. No. 09/039,135) on March 13, 1998, per…","fr":"Le brevet clé de l'ère VPP couvrant les doubles biellettes contrarotatives, déployé sur le V10 original et l'Intense M3 en 2002. L'inventeur James B. Klassen a déposé celui-ci (n° de série 09/039 135)…"},"full":{"en":"The key VPP-era patent covering counter-rotating dual links, deployed on the original V10 and Intense M3 in 2002. Inventor James B. Klassen filed this one (Ser. No. 09/039,135) on March 13, 1998, per the patent's own front page — this run corrected an earlier version of this entry that had stated 1999. The front page also names it a continuation-in-part of the January 25, 1995 application that became US 5,553,881, the original Outland VPP patent already in this atlas; a CIP's term can run from that earlier parent filing rather than the CIP's own filing date, which would put this patent's true expiry closer to the mid-2010s than 2019 — that recalculation needs a level of patent-term-law confidence this pass didn't reach, so exp is left as previously recorded rather than guessed at, flagged here for a future pass to resolve properly.","fr":"Le brevet clé de l'ère VPP couvrant les doubles biellettes contrarotatives, déployé sur le V10 original et l'Intense M3 en 2002. L'inventeur James B. Klassen a déposé celui-ci (n° de série 09/039 135) le 13 mars 1998, d'après la première page du brevet lui-même — cette recherche a corrigé une version antérieure de cette fiche qui indiquait 1999. La première page le désigne aussi comme une continuation-in-part de la demande du 25 janvier 1995 devenue le brevet US 5 553 881, le brevet Outland VPP original déjà présent dans cet atlas ; le terme d'une CIP peut courir à partir de ce dépôt parent antérieur plutôt qu'à partir du dépôt propre de la CIP, ce qui rapprocherait la véritable expiration de ce brevet du milieu des années 2010 plutôt que de 2019 — ce recalcul exige un niveau de certitude en droit des brevets que cette recherche n'a pas atteint, donc l'expiration reste telle qu'enregistrée précédemment plutôt que devinée, signalée ici pour qu'une future recherche la résolve correctement."}},{"num":"DE102008011364A1","cat":"susp","title":{"en":"Propain PRO10 floating-shock linkage (DE 10 2008 011 364 A1)","fr":"Biellette à amortisseur flottant PRO10 de Propain (DE 10 2008 011 364 A1)"},"assignee":"Robert Krauss / Propain Bicycles (Germany)","img":"../pictures/DE102008011364A1.png","alt":{"en":"Fig. 1 of DE 10 2008 011 364 A1: the rear triangle of a soft-tail bicycle frame, with the two counter-rotating seesaw links (6, 11) pivoting between the main frame and rear triangle, squeezing the shock spring (4) between them","fr":"Fig. 1 du brevet DE 10 2008 011 364 A1 : le triangle arrière d'un cadre de vélo souple, avec les deux biellettes contrarotatives en bascule (6, 11) pivotant entre le cadre principal et le triangle arrière, comprimant le ressort de l'amortisseur (4) entre elles"},"teaser":{"en":"German published application \"Bicycle frame has soft tail...\" (Robert Krauss, filed and published from Propain Bicycles, the company Krauss founded), describing a rear triangle pivoted at the main…","fr":"Demande publiée allemande « Bicycle frame has soft tail... » (Robert Krauss, déposée et publiée depuis Propain Bicycles, l'entreprise fondée par Krauss), décrivant un triangle arrière pivoté sur le…"},"full":{"en":"German published application \"Bicycle frame has soft tail...\" (Robert Krauss, filed and published from Propain Bicycles, the company Krauss founded), describing a rear triangle pivoted at the main frame and driven by two seesaw links, each with one pivot on the main frame and one on the rear triangle — the mechanism behind Propain's PRO10 rear end. Propain's own product material describes PRO10 as four pivot points driving a floating shock activated by two counter-rotating links, squeezed from both ends at once for a highly progressive leverage curve; that description matches this document's drawing closely enough to treat them as the same mechanism. A second, earlier German filing by Krauss (reported elsewhere as DE 10 2006 042 165 A1, \"Hinterradfederung für ein Zweirad\" / rear-wheel suspension for a two-wheeled vehicle, filed September 2006) may be this design's direct parent, but this pass could not independently confirm that number exists — Google Patents itself is blocked to this session's network, and no search result corroborated it, so it's named here as an unconfirmed lead rather than added as a linked filing. This document's own examination/grant status is likewise unconfirmed: \"A1\" marks an unexamined published application, not a grant, and no later grant record was found this pass.","fr":"Demande publiée allemande « Bicycle frame has soft tail... » (Robert Krauss, déposée et publiée depuis Propain Bicycles, l'entreprise fondée par Krauss), décrivant un triangle arrière pivoté sur le cadre principal et entraîné par deux biellettes en bascule, chacune avec un pivot sur le cadre principal et un sur le triangle arrière — le mécanisme derrière l'arrière-train PRO10 de Propain. La documentation produit de Propain elle-même décrit le PRO10 comme quatre points de pivot entraînant un amortisseur flottant activé par deux biellettes contrarotatives, comprimé des deux côtés à la fois pour une courbe de levier fortement progressive ; cette description correspond suffisamment au dessin de ce document pour les traiter comme le même mécanisme. Un second dépôt allemand antérieur de Krauss (rapporté ailleurs sous le numéro DE 10 2006 042 165 A1, « Hinterradfederung für ein Zweirad » / suspension de roue arrière pour véhicule à deux roues, déposé en septembre 2006) pourrait être le parent direct de cette conception, mais cette recherche n'a pas pu confirmer indépendamment l'existence de ce numéro — Google Patents lui-même est bloqué pour le réseau de cette session, et aucun résultat de recherche ne l'a corroboré, donc il est mentionné ici comme une piste non confirmée plutôt qu'ajouté comme dépôt lié. Le statut d'examen/délivrance de ce document est lui aussi non confirmé : « A1 » marque une demande publiée non examinée, pas une délivrance, et aucune trace de délivrance ultérieure n'a été trouvée lors de cette recherche."}},{"num":"20180099723A1","cat":"susp","title":{"en":"Mondraker ZERO floating-shock suspension (US 2018/0099723 A1)","fr":"Suspension à amortisseur flottant ZERO de Mondraker (US 2018/0099723 A1)"},"assignee":"Cesar Rojo Vidal (Barcelona, Spain)","img":"../pictures/US20180099723A1-fig3.png","alt":{"en":"Fig. 3 of US 2018/0099723 A1: the overall link cluster on the frame — the damper (2) mounted between the seat-tube junction (1/101/102) and the swing arm (3), via the lower connecting element (4/5/100) that lets the whole assembly float","fr":"Fig. 3 du brevet US 2018/0099723 A1 : l'ensemble de biellettes complet sur le cadre — l'amortisseur (2) monté entre la jonction du tube de selle (1/101/102) et le bras oscillant (3), via l'élément de liaison inférieur (4/5/100) qui permet à l'ensemble de flotter"},"teaser":{"en":"\"Suspension system for bicycles or other similar vehicles,\" published application US 2018/0099723 A1, confirmed directly from the PDF's own front page: applicant and inventor Cesar Rojo Vidal…","fr":"« Suspension system for bicycles or other similar vehicles », demande publiée US 2018/0099723 A1, confirmée directement à partir de la première page du PDF : demandeur et inventeur Cesar Rojo Vidal…"},"full":{"en":"\"Suspension system for bicycles or other similar vehicles,\" published application US 2018/0099723 A1, confirmed directly from the PDF's own front page: applicant and inventor Cesar Rojo Vidal (Barcelona, Spain), filed October 4, 2017 (Appl. No. 15/724,517), claiming priority from Spanish application P201631298 filed October 6, 2016, published April 12, 2018. The claims describe a main triangle (1) connected to a damper (2) and a swinging element (3) via a lower connecting element (5) and an upper connecting element (4) — the floating-shock, dual-link mounting behind Mondraker's ZERO system, introduced commercially in 2009 on the Dune, several years before this specific application was filed; the 2009 product and this 2017 filing are not necessarily the same patent in a family that may include earlier filings. Mondraker markets four kinematic claims around it, per the company's own product page: \"Zero Power Loss\" (high anti-squat under pedaling), \"Zero Pedal Kickback\" (minimal chain-length growth through travel), \"Zero Brake Jack\" (rear-brake force isolated from suspension force), and \"Zero Bumps\" (small-bump sensitivity with a progressive end stroke). A WO 2018/065096 A1 international publication was also named as a companion filing for this entry; given the confirmed Spanish priority date it is plausibly the PCT publication of the same application, but that number itself wasn't independently verified this pass. A third number named for this entry, ES 2,377,317, doesn't fit this filing's timeline (that number range corresponds to Spanish patents from around 2010–2012, not a 2016 priority) and is likely a mismatch — the real Spanish priority filing is P201631298. This document's own grant status is unconfirmed: \"A1\" marks a published application, not a grant, and exp is an estimate (filing + 20) contingent on this exact application maturing to grant under this number.","fr":"« Suspension system for bicycles or other similar vehicles », demande publiée US 2018/0099723 A1, confirmée directement à partir de la première page du PDF : demandeur et inventeur Cesar Rojo Vidal (Barcelone, Espagne), déposée le 4 octobre 2017 (n° de demande 15/724 517), revendiquant la priorité de la demande espagnole P201631298 déposée le 6 octobre 2016, publiée le 12 avril 2018. Les revendications décrivent un triangle principal (1) relié à un amortisseur (2) et à un élément oscillant (3) via un élément de liaison inférieur (5) et un élément de liaison supérieur (4) — le montage à amortisseur flottant à double biellette derrière le système ZERO de Mondraker, commercialisé dès 2009 sur le Dune, plusieurs années avant le dépôt de cette demande précise ; le produit de 2009 et ce dépôt de 2017 ne sont pas nécessairement le même brevet au sein d'une famille qui pourrait inclure des dépôts antérieurs. Mondraker met en avant quatre revendications cinématiques à ce sujet, d'après la page produit de l'entreprise elle-même : « Zero Power Loss » (anti-squat élevé au pédalage), « Zero Pedal Kickback » (croissance minimale de la longueur de chaîne pendant le débattement), « Zero Brake Jack » (force de freinage arrière isolée de la force de suspension), et « Zero Bumps » (sensibilité aux petites bosses avec une fin de course progressive). Une publication internationale WO 2018/065096 A1 avait aussi été fournie comme dépôt compagnon pour cette fiche ; compte tenu de la date de priorité espagnole confirmée, il s'agit probablement de la publication PCT de la même demande, mais ce numéro n'a pas été vérifié indépendamment lors de cette recherche. Un troisième numéro fourni pour cette fiche, ES 2 377 317, ne correspond pas à la chronologie de ce dépôt (cette plage de numéros correspond à des brevets espagnols d'environ 2010-2012, pas à une priorité de 2016) et constitue probablement une erreur — le véritable dépôt prioritaire espagnol est P201631298. Le statut de délivrance de ce document n'est pas confirmé : « A1 » marque une demande publiée, pas une délivrance, et l'expiration est une estimation (dépôt + 20 ans) conditionnée à ce que cette demande précise aboutisse à une délivrance sous ce même numéro."}},{"num":"7128329","cat":"susp","title":{"en":"DW-Link patent family (US 7,048,292 + 7,128,329 + 7,661,503)","fr":"Famille de brevets DW-Link (US 7,048,292 + 7,128,329 + 7,661,503)"},"assignee":"David Weagle / DW-Link Incorporated → Ibis, Pivot, Turner, Iron Horse","img":"../pictures/US7048292B2.png","alt":{"en":"DW-Link patent drawing, US 7,048,292, the instant-center geometric construction behind the squat-curve method","fr":"Dessin de brevet DW-Link, US 7 048 292, la construction géométrique du centre instantané derrière la méthode de la courbe de squat"},"teaser":{"en":"Anti-squat-focused dual-link design controlling pedaling behavior via instant-center placement; licensed rather than sold, the model Weagle made famous. US 7,048,292, 'Bicycle suspension systems'…","fr":"Une conception à double biellette axée sur l'anti-squat, contrôlant le comportement au pédalage via le placement du centre instantané ; licenciée plutôt que vendue, le modèle qui a rendu Weagle…"},"full":{"en":"Anti-squat-focused dual-link design controlling pedaling behavior via instant-center placement; licensed rather than sold, the model Weagle made famous. US 7,048,292, 'Bicycle suspension systems' (priority Sept. 25, 2003), and US 7,128,329 together introduced the underlying method — graphing anti-squat as a curve against compressive travel rather than a single static number — while US 7,661,503, 'Vehicle suspension system for stable squat magnitude responses' (56 sheets of drawings), extends the same framework to motorcycles, ATVs and other powered vehicles alongside bicycles.","fr":"Une conception à double biellette axée sur l'anti-squat, contrôlant le comportement au pédalage via le placement du centre instantané ; licenciée plutôt que vendue, le modèle qui a rendu Weagle célèbre. Les brevets US 7,048,292, « Bicycle suspension systems » (priorité du 25 septembre 2003), et US 7,128,329 ont ensemble introduit la méthode sous-jacente — représenter l'anti-squat comme une courbe en fonction du débattement en compression plutôt qu'un chiffre statique unique — tandis que l'US 7,661,503, « Vehicle suspension system for stable squat magnitude responses » (56 planches de dessins), étend le même cadre aux motos, quads et autres véhicules motorisés en plus des vélos."}},{"num":"7717212","cat":"susp","title":{"en":"Split Pivot (US 7,717,212)","fr":"Split Pivot (US 7,717,212)"},"assignee":"Dave Weagle → Devinci, Salsa, Morewood","img":"../pictures/US7717212B2.png","alt":{"en":"Split Pivot patent drawing, Fig. 8, a cross-section of the concentric rear-axle pivot's bearing and seal stack","fr":"Dessin de brevet Split Pivot, Fig. 8, coupe transversale de l'empilement de roulements et de joints du pivot arrière concentrique"},"teaser":{"en":"A rear pivot concentric with the wheel axle, decoupling braking from suspension while freeing main-pivot placement for acceleration performance.","fr":"Un pivot arrière concentrique à l'axe de roue, découplant le freinage de la suspension tout en libérant le placement du pivot principal pour la performance à l'accélération."},"full":{"en":"A rear pivot concentric with the wheel axle, decoupling braking from suspension while freeing main-pivot placement for acceleration performance.","fr":"Un pivot arrière concentrique à l'axe de roue, découplant le freinage de la suspension tout en libérant le placement du pivot principal pour la performance à l'accélération."}},{"num":"7837213","cat":"susp","title":{"en":"Active Braking Pivot — ABP (US 7,837,213)","fr":"Active Braking Pivot — ABP (US 7,837,213)"},"assignee":"Trek","img":"../pictures/US7837213B2.png","alt":{"en":"Trek Active Braking Pivot patent drawing, Fig. 5, an exploded view of the concentric rear-axle pivot's bearing stack","fr":"Dessin de brevet Active Braking Pivot de Trek, Fig. 5, vue éclatée de l'empilement de roulements du pivot arrière concentrique"},"teaser":{"en":"Trek's concentric rear-axle pivot, developed (Trek says) independently of Weagle's Split Pivot, and patented in the US and Europe. The original US application — Ser. No. 11/735,816, filed April 16,…","fr":"Le pivot arrière concentrique de Trek, développé (selon Trek) indépendamment du Split Pivot de Weagle, et breveté aux États-Unis et en Europe. La demande américaine d'origine — n° de série 11/735 816,…"},"full":{"en":"Trek's concentric rear-axle pivot, developed (Trek says) independently of Weagle's Split Pivot, and patented in the US and Europe. The original US application — Ser. No. 11/735,816, filed April 16, 2007 — issued as US 7,837,213 in 2010; Trek's own patents page lists three later continuations of that same filing (US 9,378,162, US 8,882,127, and US 10,106,221) rather than separate new inventions, so the whole family shares one 2007-rooted expiration rather than each continuation buying extra years.","fr":"Le pivot arrière concentrique de Trek, développé (selon Trek) indépendamment du Split Pivot de Weagle, et breveté aux États-Unis et en Europe. La demande américaine d'origine — n° de série 11/735 816, déposée le 16 avril 2007 — a été délivrée sous le numéro US 7 837 213 en 2010 ; la propre page de brevets de Trek liste trois continuations ultérieures de ce même dépôt (US 9 378 162, US 8 882 127 et US 10 106 221) plutôt que de nouvelles inventions distinctes, si bien que toute la famille partage une seule expiration ancrée en 2007 plutôt que chaque continuation n'achète des années supplémentaires."}},{"num":"7934739","cat":"susp","title":{"en":"Niner CVA suspension (2 patents)","fr":"Suspension CVA de Niner (2 brevets)"},"assignee":"Steve Domahidy / Niner, Inc. (founded 2005, Fort Collins, CO)","img":"../pictures/US7934739B2.png","alt":{"en":"Fig. 5 of US 7,934,739: a 29-inch-wheel bicycle frame showing the rigid front (10) and rear (14) triangles joined by a pair of linkages (12, 48/50) near the seat tube, arranged so chain tension and bump forces pivot the linkages in different directions","fr":"Fig. 5 du brevet US 7 934 739 : un cadre de vélo à roues de 29 pouces montrant les triangles avant (10) et arrière (14) rigides reliés par une paire de biellettes (12, 48/50) près du tube de selle, disposées pour que la tension de la chaîne et les forces d'impact fassent pivoter les biellettes dans des directions différentes"},"teaser":{"en":"Niner co-founder Steve Domahidy's Constantly Varying Arc (CVA) suspension: a 29er frame with rigid front and rear triangles joined by a pair of linkages positioned so chain tension pivots them in…","fr":"La suspension Constantly Varying Arc (CVA) de Steve Domahidy, cofondateur de Niner : un cadre de 29 pouces à triangles avant et arrière rigides reliés par une paire de biellettes positionnées pour que…"},"full":{"en":"Niner co-founder Steve Domahidy's Constantly Varying Arc (CVA) suspension: a 29er frame with rigid front and rear triangles joined by a pair of linkages positioned so chain tension pivots them in opposite directions while bump forces pivot them together, aimed at separating pedaling feedback from suspension compliance. US 7,934,739, \"Bicycle rear suspension,\" was filed May 6, 2008 (claiming an earlier July 2008 provisional, which doesn't itself start the term) and granted 2011. A related patent, US 8,590,914, carries the same title and claims priority back to the same 2007 provisional and 2008 non-provisional filing, so both patents' `exp` runs from that shared 2008 date rather than 8,590,914's own later application date. Exact grant-date precision for both wasn't independently re-confirmed beyond the year.","fr":"La suspension Constantly Varying Arc (CVA) de Steve Domahidy, cofondateur de Niner : un cadre de 29 pouces à triangles avant et arrière rigides reliés par une paire de biellettes positionnées pour que la tension de chaîne les fasse pivoter en sens opposés tandis que les forces d'impact les font pivoter ensemble, dans le but de séparer le retour de pédalage de la compliance de la suspension. L'US 7 934 739, « Bicycle rear suspension », a été déposé le 6 mai 2008 (revendiquant une demande provisoire antérieure de juillet 2008, qui ne fait pas elle-même courir la durée) et délivré en 2011. Un brevet apparenté, l'US 8 590 914, porte le même titre et revendique la priorité de la même demande provisoire de 2007 et du dépôt non provisoire de 2008, de sorte que l'expiration des deux brevets court à partir de cette date de 2008 partagée plutôt qu'à partir du dépôt ultérieur propre à l'US 8 590 914. La précision exacte de la date de délivrance des deux brevets n'a pas été reconfirmée de façon indépendante au-delà de l'année."}},{"num":"9061729","cat":"susp","title":{"en":"Canfield Balance Formula — CBF (US 9,061,729)","fr":"Canfield Balance Formula — CBF (US 9,061,729)"},"assignee":"Lance & Chris Canfield","img":"../pictures/US9061729B2.png","alt":{"en":"Canfield Balance Formula suspension patent drawing, showing the parallel-link layout","fr":"Dessin du brevet de suspension Canfield Balance Formula, montrant la disposition à biellettes parallèles"},"teaser":{"en":"Seven-plus years in development: a parallel-link design that aims drive forces through the Center of Curvature above the chainring, making anti-squat consistent regardless of sag. In 2019 Lance…","fr":"Plus de sept ans de développement : une conception à biellettes parallèles qui vise les forces d'entraînement à travers le Centre de Courbure au-dessus du plateau, rendant l'anti-squat constant quel…"},"full":{"en":"Seven-plus years in development: a parallel-link design that aims drive forces through the Center of Curvature above the chainring, making anti-squat consistent regardless of sag. In 2019 Lance assigned his interest to Christopher; in 2022 the patent moved to Suspension Formulas LLC, which now licenses CBF to Revel Bikes and Canfield Bikes. <a class=\"gp gp-secondary\" href=\"https://canfieldbikes.com/pages/cbf-suspension\" target=\"_blank\" rel=\"noopener\">Canfield's own CBF explainer →</a>","fr":"Plus de sept ans de développement : une conception à biellettes parallèles qui vise les forces d'entraînement à travers le Centre de Courbure au-dessus du plateau, rendant l'anti-squat constant quel que soit l'affaissement (sag). En 2019, Lance a cédé sa part à Christopher ; en 2022, le brevet est passé à Suspension Formulas LLC, qui licencie désormais le CBF à Revel Bikes et Canfield Bikes. <a class=\"gp gp-secondary\" href=\"https://canfieldbikes.com/pages/cbf-suspension\" target=\"_blank\" rel=\"noopener\">L'explication du CBF par Canfield lui-même →</a>"}},{"num":"7712757","cat":"susp","title":{"en":"Kona Magic Link Active Geometry (US 7,712,757)","fr":"Magic Link Active Geometry de Kona (US 7 712 757)"},"assignee":"Brian David Berthold / Kona USA, Inc. (Ferndale, WA)","img":"../pictures/US7712757B2.png","alt":{"en":"Fig. 1 of US 7,712,757: a full bicycle side view showing the main air shock (30) linking the seat-tube area (28) to a rocker (40/42/44), with a smaller auxiliary coil spring (46) mounted beside it near the same pivot, and the chainstay (26) carrying the rear axle (20) below","fr":"Fig. 1 du brevet US 7 712 757 : une vue latérale complète du vélo montrant l'amortisseur pneumatique principal (30) reliant la zone du tube de selle (28) à une biellette (40/42/44), avec un ressort hélicoïdal auxiliaire plus petit (46) monté à côté sur le même pivot, et le hauban (26) portant l'axe de roue arrière (20) en dessous"},"teaser":{"en":"US 7,712,757, \"Suspension for mountain bicycles,\" filed June 20, 2008 by inventor Brian David Berthold and granted May 11, 2010, assigned jointly to Kona USA, Inc. of Ferndale, Washington and to…","fr":"US 7 712 757, « Suspension for mountain bicycles », déposé le 20 juin 2008 par l'inventeur Brian David Berthold et délivré le 11 mai 2010, cédé conjointement à Kona USA, Inc. de Ferndale (Washington)…"},"full":{"en":"US 7,712,757, \"Suspension for mountain bicycles,\" filed June 20, 2008 by inventor Brian David Berthold and granted May 11, 2010, assigned jointly to Kona USA, Inc. of Ferndale, Washington and to Berthold himself. The claimed linkage pairs a primary shock absorber with a smaller auxiliary spring at the same pivot, so that as the bike compresses further into its travel the auxiliary spring progressively engages and changes the suspension's leverage curve, spring rate, and effective geometry without any manual lockout or mode switch. Sold as Kona's Magic Link Active Geometry, first appearing on the 2009 Kona Cadabra and later the Mount Vision.","fr":"US 7 712 757, « Suspension for mountain bicycles », déposé le 20 juin 2008 par l'inventeur Brian David Berthold et délivré le 11 mai 2010, cédé conjointement à Kona USA, Inc. de Ferndale (Washington) et à Berthold lui-même. La biellette revendiquée associe un amortisseur principal à un ressort auxiliaire plus petit sur le même pivot, de sorte qu'à mesure que le vélo s'enfonce plus profondément dans son débattement, le ressort auxiliaire s'engage progressivement et modifie la courbe de levier, le taux de ressort et la géométrie effective de la suspension, sans blocage manuel ni changement de mode. Commercialisé sous le nom Magic Link Active Geometry de Kona, apparu d'abord sur le Kona Cadabra 2009 puis sur le Mount Vision."}},{"num":"7566066","cat":"susp","title":{"en":"Maestro suspension (US 7,566,066)","fr":"Suspension Maestro (US 7 566 066)"},"assignee":"Owen Chang & Leo Wu / Giant Manufacturing Co., Ltd.","img":"../pictures/US7566066B2.1.png","alt":{"en":"Fig. 1 of US 7,566,066: the full bicycle in side view, showing the rear triangle's dual links (10/11, 20/21/22) connecting the frame to the swingarm, with the shock (30) mounted between them","fr":"Fig. 1 du brevet US 7 566 066 : le vélo complet vu de profil, montrant les deux biellettes du triangle arrière (10/11, 20/21/22) reliant le cadre au bras oscillant, avec l'amortisseur (30) monté entre elles"},"teaser":{"en":"US 7,566,066 B2, \"Bicycle rear suspension system,\" names Owen Chang and Leo Wu as inventors, filed June 29, 2004 and granted July 28, 2009 directly to Giant Manufacturing Co., Ltd. — Giant's own…","fr":"US 7 566 066 B2, « Bicycle rear suspension system », nomme Owen Chang et Leo Wu comme inventeurs, déposé le 29 juin 2004 et délivré le 28 juillet 2009 directement à Giant Manufacturing Co., Ltd. — un…"},"full":{"en":"US 7,566,066 B2, \"Bicycle rear suspension system,\" names Owen Chang and Leo Wu as inventors, filed June 29, 2004 and granted July 28, 2009 directly to Giant Manufacturing Co., Ltd. — Giant's own dual-link system, not a licensed outside design. Claims a virtual pivot point that sits close to the chain/chainring junction through roughly the first quarter to third of the shock's travel, then moves rearward as the rear wheel rises, holding the line between the rear triangle's instant center and the rear tire's ground-contact point at roughly 45°. In 2013 Dave Weagle sued Giant for patent infringement and breach of contract, alleging Maestro read on his DW-Link IP; the two sides settled and jointly ended the suit in mid-2014, with Giant continuing to ship Maestro unchanged.","fr":"US 7 566 066 B2, « Bicycle rear suspension system », nomme Owen Chang et Leo Wu comme inventeurs, déposé le 29 juin 2004 et délivré le 28 juillet 2009 directement à Giant Manufacturing Co., Ltd. — un système à double biellette propre à Giant, non licencié d'un concepteur externe. Revendique un point de pivot virtuel situé près de la jonction chaîne/plateau durant environ le premier quart au tiers du débattement de l'amortisseur, puis se déplaçant vers l'arrière à mesure que la roue arrière remonte, maintenant la ligne entre le centre instantané du triangle arrière et le point de contact au sol du pneu arrière à environ 45°. En 2013, Dave Weagle a poursuivi Giant pour contrefaçon de brevet et rupture de contrat, affirmant que le Maestro tombait sous sa propriété intellectuelle DW-Link ; les deux parties ont transigé et mis fin conjointement au procès mi-2014, Giant continuant de produire le Maestro sans changement."}},{"num":"9821879","cat":"susp","title":{"en":"Switch Infinity translating pivot — 'Reciprocating Rail Movement Suspension System' (4 patents)","fr":"Pivot translatant Switch Infinity — « Reciprocating Rail Movement Suspension System » (4 brevets)"},"assignee":"Peter Zawistowski / Yeti Cycling LLC (co-developed with Fox)","img":"../pictures/US9821879B2.2.png","alt":{"en":"Fig. 1 of US 9,821,879: a complete bicycle (100), showing the general arrangement of the frame (102), wheels (104/106), fork (136), and the rear-suspension linkage and shock near the seat tube (120–132)","fr":"Fig. 1 du brevet US 9 821 879 : un vélo complet (100), montrant la disposition générale du cadre (102), des roues (104/106), de la fourche (136), et de la biellette de suspension arrière et de l'amortisseur près du tube de selle (120-132)"},"teaser":{"en":"A main pivot that translates vertically on Kashima-coated rails, switching direction mid-travel to shape anti-squat. Yeti's own virtual patent marking page (yeticycles.com/en-us/patents) lists this as…","fr":"Un pivot principal qui se déplace verticalement sur des rails traités Kashima, changeant de direction à mi-débattement pour façonner l'anti-squat. La propre page de marquage virtuel de brevets de Yeti…"},"full":{"en":"A main pivot that translates vertically on Kashima-coated rails, switching direction mid-travel to shape anti-squat. Yeti's own virtual patent marking page (yeticycles.com/en-us/patents) lists this as a four-patent family under 'Reciprocating Rail Movement Suspension System' — US 9,821,879, 10,822,048, 11,485,447 and 12,077,243, all currently ISSUED — and marks it against every non-six-bar model in the current lineup: SB115 through SB165-MIX. The earliest published application in the family, US 2015/0069735, surfaced in 2015, consistent with the platform's 2014 public debut.","fr":"Un pivot principal qui se déplace verticalement sur des rails traités Kashima, changeant de direction à mi-débattement pour façonner l'anti-squat. La propre page de marquage virtuel de brevets de Yeti (yeticycles.com/en-us/patents) présente ceci comme une famille de quatre brevets sous « Reciprocating Rail Movement Suspension System » — US 9,821,879, 10,822,048, 11,485,447 et 12,077,243, tous actuellement DÉLIVRÉS — et les applique à chaque modèle non-six-barres de la gamme actuelle : du SB115 au SB165-MIX. La première demande publiée de la famille, US 2015/0069735, est apparue en 2015, cohérent avec le lancement public de la plateforme en 2014."}},{"num":"11173983","cat":"susp","title":{"en":"Sixfinity six-bar — 'Six Bar Linkage Rear Suspension' (2 patents)","fr":"Six-barres Sixfinity — « Six Bar Linkage Rear Suspension » (2 brevets)"},"assignee":"Yeti Cycling LLC","img":"../pictures/11173983.png","alt":{"en":"Yeti Six Bar Linkage Rear Suspension patent drawing, Fig. 3, showing the six-bar shock linkage assembly","fr":"Dessin de brevet Yeti Six Bar Linkage Rear Suspension, Fig. 3, montrant l'ensemble de biellettes d'amortisseur à six barres"},"teaser":{"en":"A six-bar evolution of the Switch concept, initially built for the added power and mass of e-MTBs. Yeti's own marking page lists two issued patents — US 11,173,983 and 12,522,316 — and, as of this…","fr":"Une évolution six-barres du concept Switch, initialement conçue pour la puissance et la masse accrues des VTTAE. La page de marquage de Yeti liste deux brevets délivrés — US 11,173,983 et 12,522,316 —…"},"full":{"en":"A six-bar evolution of the Switch concept, initially built for the added power and mass of e-MTBs. Yeti's own marking page lists two issued patents — US 11,173,983 and 12,522,316 — and, as of this pass, marks them only against the 160e, MTE and LTE columns, not against any pedal-bike SB model.","fr":"Une évolution six-barres du concept Switch, initialement conçue pour la puissance et la masse accrues des VTTAE. La page de marquage de Yeti liste deux brevets délivrés — US 11,173,983 et 12,522,316 — et, à ce stade, ne les applique qu'aux colonnes 160e, MTE et LTE, pas à un modèle SB à pédalage classique."}},{"num":"7722072","cat":"susp","title":{"en":"Rear Suspension System for a Bicycle (4 patents, 3 expired 2025)","fr":"Rear Suspension System for a Bicycle (4 brevets, 3 expirés en 2025)"},"assignee":"Steven W. Hoogendoorn / Yeti Cycling LLC","img":"../pictures/7722072.png","alt":{"en":"Yeti Rear Suspension System for a Bicycle patent drawing, Figs. 8 and 9, showing the rear-triangle linkage and shock mount","fr":"Dessin de brevet Yeti Rear Suspension System for a Bicycle, Fig. 8 et 9, montrant la biellette du triangle arrière et le point de fixation de l'amortisseur"},"teaser":{"en":"Yeti's foundational rear-suspension filing, predating Switch Infinity by years: US 7,722,072, filed 2005 and granted May 2010, credited to inventor Steven W. Hoogendoorn. Per Yeti's own marking page,…","fr":"Le dépôt fondateur de suspension arrière de Yeti, antérieur de plusieurs années au Switch Infinity : US 7,722,072, déposé en 2005 et délivré en mai 2010, crédité à l'inventeur Steven W. Hoogendoorn.…"},"full":{"en":"Yeti's foundational rear-suspension filing, predating Switch Infinity by years: US 7,722,072, filed 2005 and granted May 2010, credited to inventor Steven W. Hoogendoorn. Per Yeti's own marking page, three siblings from the same family — US 8,272,658, 10,293,881 and 8,696,008 — all expired on the same day, September 15, 2025, while 7,722,072 itself remains listed ISSUED. All four are marked against the entire current lineup, SB115 through SB165-MIX — the broadest product coverage of any patent in Yeti's portfolio.","fr":"Le dépôt fondateur de suspension arrière de Yeti, antérieur de plusieurs années au Switch Infinity : US 7,722,072, déposé en 2005 et délivré en mai 2010, crédité à l'inventeur Steven W. Hoogendoorn. Selon la propre page de marquage de Yeti, trois brevets apparentés de la même famille — US 8,272,658, 10,293,881 et 8,696,008 — ont tous expiré le même jour, le 15 septembre 2025, tandis que le 7,722,072 lui-même reste listé comme DÉLIVRÉ. Les quatre sont appliqués à toute la gamme actuelle, du SB115 au SB165-MIX — la couverture produit la plus large de tout brevet du portefeuille de Yeti."}},{"num":"9102378","cat":"susp","title":{"en":"Link Suspension System (US 9,102,378)","fr":"Link Suspension System (US 9,102,378)"},"assignee":"Yeti Cycling LLC","img":"../pictures/9102378.png","alt":{"en":"Yeti Link Suspension System patent drawing, Fig. 18B, showing the rocker-link and main-pivot area near the seat tube and bottom bracket","fr":"Dessin de brevet Yeti Link Suspension System, Fig. 18B, montrant la zone du basculeur et du pivot principal près du tube de selle et du boîtier de pédalier"},"teaser":{"en":"Granted August 11, 2015 — a 62-sheet filing covering the rocker-link and main-pivot hardware at the seat tube/bottom bracket junction, distinct from (and layered on top of) the Reciprocating Rail…","fr":"Délivré le 11 août 2015 — un dépôt de 62 planches couvrant le matériel du basculeur et du pivot principal à la jonction tube de selle/boîtier de pédalier, distinct des familles Reciprocating Rail…"},"full":{"en":"Granted August 11, 2015 — a 62-sheet filing covering the rocker-link and main-pivot hardware at the seat tube/bottom bracket junction, distinct from (and layered on top of) the Reciprocating Rail Movement and foundational Rear Suspension System families above. Marked on the full current lineup, SB115 through SB165-MIX, per Yeti's own patent page.","fr":"Délivré le 11 août 2015 — un dépôt de 62 planches couvrant le matériel du basculeur et du pivot principal à la jonction tube de selle/boîtier de pédalier, distinct des familles Reciprocating Rail Movement et Rear Suspension System fondatrices ci-dessus (et superposé à celles-ci). Appliqué à toute la gamme actuelle, du SB115 au SB165-MIX, selon la propre page de brevets de Yeti."}},{"num":"10926830","cat":"susp","title":{"en":"Vehicle Suspension Linkage (US 10,926,830 + 12,344,347)","fr":"Vehicle Suspension Linkage (US 10,926,830 + 12,344,347)"},"assignee":"Peter Zawistowski / Yeti Cycling LLC","img":"../pictures/US10926830B2.png","alt":{"en":"FIG. 7: Suspension linkage assembly showing interconnected extension bodies and pivot pin orientation","fr":"FIG. 7 : Assemblage de liaison de suspension montrant les corps d'extension interconnectés et l'orientation du goupille de pivot"},"teaser":{"en":"'A two-wheel vehicle suspension linkage, including a shock and a shock extension assembly' — US 10,926,830, filed July 2018 off a July 2017 priority date, granted February 2021, plus a 2025…","fr":"« Une biellette de suspension de véhicule à deux roues, incluant un amortisseur et un ensemble d'extension d'amortisseur » — US 10,926,830, déposé en juillet 2018 sur la base d'une date de priorité de…"},"full":{"en":"'A two-wheel vehicle suspension linkage, including a shock and a shock extension assembly' — US 10,926,830, filed July 2018 off a July 2017 priority date, granted February 2021, plus a 2025 continuation, US 12,344,347. Per Yeti's marking page this family is notably narrower than the others: marked on SB130 through SB165-MIX, but not on the entry-level SB115.","fr":"« Une biellette de suspension de véhicule à deux roues, incluant un amortisseur et un ensemble d'extension d'amortisseur » — US 10,926,830, déposé en juillet 2018 sur la base d'une date de priorité de juillet 2017, délivré en février 2021, plus une continuation de 2025, US 12,344,347. Selon la page de marquage de Yeti, cette famille est nettement plus restreinte que les autres : appliquée du SB130 au SB165-MIX, mais pas au SB115 d'entrée de gamme."}},{"num":"1023842","cat":"susp","title":{"en":"Shock Extension (US D1,023,842, design patent)","fr":"Shock Extension (US D1,023,842, brevet de dessin)"},"assignee":"Peter Zawistowski / Yeti Cycling LLC","img":"../pictures/USD1023842.png","alt":{"en":"FIG. 4: Design patent perspective view of shock extension showing body contours, mounting bosses, and axle interface","fr":"FIG. 4 : Vue en perspective du brevet de conception montrant les contours du corps d'extension, les bossages de montage et l'interface d'essieu"},"teaser":{"en":"A design patent on the ornamental shape of the shock-extension hardware referenced in the Vehicle Suspension Linkage utility patents above — filed February 2021, granted April 2024. Marked on the same…","fr":"Un brevet de dessin sur la forme ornementale du matériel d'extension d'amortisseur mentionné dans les brevets d'utilité Vehicle Suspension Linkage ci-dessus — déposé en février 2021, délivré en avril…"},"full":{"en":"A design patent on the ornamental shape of the shock-extension hardware referenced in the Vehicle Suspension Linkage utility patents above — filed February 2021, granted April 2024. Marked on the same SB130-through-SB165-MIX band as its utility-patent companion, not on SB115 or the six-bar 160e/MTE/LTE models.","fr":"Un brevet de dessin sur la forme ornementale du matériel d'extension d'amortisseur mentionné dans les brevets d'utilité Vehicle Suspension Linkage ci-dessus — déposé en février 2021, délivré en avril 2024. Appliqué à la même plage SB130-à-SB165-MIX que son brevet d'utilité compagnon, pas au SB115 ni aux modèles six-barres 160e/MTE/LTE."}},{"num":"10021931","cat":"tech","title":{"en":"Helmet-chin mount for accessories, including cameras (US 10,021,931)","fr":"Fixation menton de casque pour accessoires, dont les caméras (US 10,021,931)"},"assignee":"Eric Brock Tulley / Sopro Mounts Inc.","img":"../pictures/US10021931B2.png","alt":{"en":"Fig. 1 of US 10,021,931: an exploded view showing the Y-shaped mount (100) attaching to a full-face helmet's chin bar via a strap (118/120A) and bracket (108A), with a camera (114) sliding onto the mating bracket (108B)","fr":"Fig. 1 du brevet US 10 021 931 : une vue éclatée montrant la fixation en Y (100) s'attachant à la mentonnière d'un casque intégral via une sangle (118/120A) et un support (108A), avec une caméra (114) se fixant sur le support complémentaire (108B)"},"teaser":{"en":"A Y-shaped accessory mount that straps to the chin bar of a full-face helmet, claiming the mount, a removable fastener such as a quick-release buckle, and the strap-and-slit retention geometry. Claims…","fr":"Une fixation d'accessoire en forme de Y qui se sangle à la mentonnière d'un casque intégral, revendiquant la fixation, une attache amovible telle qu'une boucle à dégagement rapide, et la géométrie de…"},"full":{"en":"A Y-shaped accessory mount that straps to the chin bar of a full-face helmet, claiming the mount, a removable fastener such as a quick-release buckle, and the strap-and-slit retention geometry. Claims cover full-face, off-road/motocross and modular/flip-up helmets, and the accessory may be a camera, video recorder, phone or flashlight. Filed 2015 by Eric Brock Tulley and assigned to Sopro Mounts Inc.; the record now shows expired/fee-related status rather than running to its ~2035 term.","fr":"Une fixation d'accessoire en forme de Y qui se sangle à la mentonnière d'un casque intégral, revendiquant la fixation, une attache amovible telle qu'une boucle à dégagement rapide, et la géométrie de rétention par sangle et fente. Les revendications couvrent les casques intégraux, tout-terrain/motocross et modulables/à mentonnière relevable, et l'accessoire peut être une caméra, un enregistreur vidéo, un téléphone ou une lampe torche. Déposé en 2015 par Eric Brock Tulley et cédé à Sopro Mounts Inc. ; le dossier indique désormais un statut expiré/lié aux annuités plutôt qu'une durée jusqu'à son terme d'environ 2035."}},{"num":"10015413","cat":"tech","title":{"en":"Image processing & field of view — SuperView / OverCapture (bundle)","fr":"Traitement d'image et champ de vision — SuperView / OverCapture (regroupement)"},"assignee":"GoPro","img":"../pictures/US10015413B1.png","alt":{"en":"Fig. 3 of US 10,015,413 B1: three versions of the same scuba-diver frame (302, 304, 306) showing the aspect-ratio conversion claimed by the patent — the source-ratio image, an intermediate scaled version, and the final warped result with distortion pushed toward the edges rather than the image center","fr":"Fig. 3 du brevet US 10 015 413 B1 : trois versions de la même image de plongeur (302, 304, 306) montrant la conversion de rapport d'aspect revendiquée par le brevet — l'image au rapport source, une version intermédiaire mise à l'échelle, et le résultat final déformé avec la distorsion repoussée vers les bords plutôt que le centre de l'image"},"teaser":{"en":"A representative filing from GoPro's FOV-manipulation family, granted July 3, 2018 to named inventors Nicholas D. Woodman, Sumit Chawla and Loic Segapelli (GoPro, Inc., San Mateo, CA) — confirmed…","fr":"Un dépôt représentatif de la famille de manipulation du champ de vision de GoPro, couvrant l'étirement dynamique d'une capture de capteur 4:3 plus haute vers un cadre 16:9 tout en gardant le centre de…"},"full":{"en":"A representative filing from GoPro's FOV-manipulation family, granted July 3, 2018 to named inventors Nicholas D. Woodman, Sumit Chawla and Loic Segapelli (GoPro, Inc., San Mateo, CA) — confirmed directly from the PDF's own front page. It claims the dynamic stretch of a taller 4:3 sensor capture into a 16:9 frame while keeping the image center undistorted and pushing distortion to the edges. The related OverCapture family covers reframing a flat crop out of a spherical 360° canvas in post. Grouped here as a category rather than enumerated — GoPro holds 1,600+ granted patents globally, 1,000+ in the US.","fr":"Un dépôt représentatif de la famille de manipulation du champ de vision de GoPro, couvrant l'étirement dynamique d'une capture de capteur 4:3 plus haute vers un cadre 16:9 tout en gardant le centre de l'image non déformé et en repoussant la distorsion vers les bords. La famille apparentée OverCapture couvre le recadrage en post-production d'un cadre plat extrait d'une image sphérique à 360°. Regroupé ici comme catégorie plutôt qu'énuméré — GoPro détient plus de 1 600 brevets délivrés dans le monde, plus de 1 000 aux États-Unis."}},{"num":"10574894","cat":"tech","title":{"en":"Stabilization & horizon leveling — HyperSmooth (US 10,574,894 + 10,958,840)","fr":"Stabilisation et mise à niveau de l'horizon — HyperSmooth (US 10,574,894 + 10,958,840)"},"assignee":"César Douady, Thomas Derbanne & Maxim Karpushin / GoPro","img":"../pictures/US10574894B2.png","alt":{"en":"Fig. 3 of US 10,574,894: a labeled diagram of the image capture device's hardware — the optical element (304), image sensor (306), position sensor (308, i.e. the accelerometer/gyroscope used for horizon leveling), processor (310) and housing (312)","fr":"Fig. 3 du brevet US 10 574 894 : un schéma annoté du matériel de l'appareil de capture d'image — l'élément optique (304), le capteur d'image (306), le capteur de position (308, c'est-à-dire l'accéléromètre/gyroscope utilisé pour la mise à niveau de l'horizon), le processeur (310) et le boîtier (312)"},"teaser":{"en":"Both titled 'Systems and methods for stabilizing videos': US 10,574,894 (filed August 2019, granted February 2020) and US 10,958,840 (filed December 2019, granted March 2021) cover the electronic…","fr":"Tous deux intitulés « Systems and methods for stabilizing videos » : US 10,574,894 (déposé en août 2019, délivré en février 2020) et US 10,958,840 (déposé en décembre 2019, délivré en mars 2021)…"},"full":{"en":"Both titled 'Systems and methods for stabilizing videos': US 10,574,894 (filed August 2019, granted February 2020) and US 10,958,840 (filed December 2019, granted March 2021) cover the electronic image stabilization that analyzes camera motion and crops the sensor in real time to cancel vibration and impacts, plus horizon leveling that uses the onboard accelerometers and gyroscopes to hold the horizon flat through full camera rotation.","fr":"Tous deux intitulés « Systems and methods for stabilizing videos » : US 10,574,894 (déposé en août 2019, délivré en février 2020) et US 10,958,840 (déposé en décembre 2019, délivré en mars 2021) couvrent la stabilisation d'image électronique qui analyse le mouvement de la caméra et recadre le capteur en temps réel pour annuler vibrations et impacts, plus la mise à niveau de l'horizon qui utilise les accéléromètres et gyroscopes embarqués pour garder l'horizon à plat malgré une rotation complète de la caméra."}},{"num":"12167211","cat":"tech","title":{"en":"Hardware, form factor & acoustics — HERO design + mounts (bundle)","fr":"Matériel, format et acoustique — dessin HERO et fixations (regroupement)"},"assignee":"GoPro","img":"../pictures/US12167211B2.png","alt":{"en":"Figs. 1A and 1B of US 12,167,211 B2: the boxy HERO camera body from the front (lens 104, status screen 108, microphone mesh 128) and the back (secondary display 110, mode/shutter buttons 132/136)","fr":"Fig. 1A et 1B du brevet US 12 167 211 B2 : le boîtier carré de la caméra HERO vu de face (objectif 104, écran de statut 108, grille de microphone 128) et de dos (second écran 110, boutons de mode/déclencheur 132/136)"},"teaser":{"en":"Design patents on the boxy HERO chassis — lens placement, dual screens, overall geometry — alongside utility filings on multi-microphone wind-noise mitigation (US 12,167,211 cited as representative)…","fr":"Des brevets de dessin sur le châssis carré du HERO — placement de l'objectif, doubles écrans, géométrie générale — ainsi que des dépôts d'utilité sur l'atténuation du bruit du vent à microphones…"},"full":{"en":"Design patents on the boxy HERO chassis — lens placement, dual screens, overall geometry — alongside utility filings on multi-microphone wind-noise mitigation (US 12,167,211 cited as representative) and on the integrated folding mounting fingers that collapse into the frame. The underlying two-prong mount interface has become a quasi-open standard the industry builds to freely.","fr":"Des brevets de dessin sur le châssis carré du HERO — placement de l'objectif, doubles écrans, géométrie générale — ainsi que des dépôts d'utilité sur l'atténuation du bruit du vent à microphones multiples (US 12,167,211 cité à titre représentatif) et sur les languettes de fixation pliantes intégrées qui se replient dans le boîtier. L'interface de fixation à deux ergots sous-jacente est devenue une quasi-norme ouverte que l'industrie utilise librement."}},{"num":"12016421","cat":"tech","title":{"en":"Forcite smart helmet electronics (US 12,016,421)","fr":"Électronique de casque intelligent Forcite (US 12,016,421)"},"assignee":"Forcite Helmet Systems (Australia) → GoPro","img":"../pictures/US12016421B2.png","alt":{"en":"Figures 1(a) and 1(b) of US 12,016,421: two views of a full-face helmet (100) — the outer shell (104) with its vents (106) and liner (102), and, along the lower edge of the chin bar, the electronics module (108) broken out into its housed components (110, 112, 114, 118) alongside the circular side unit (116)","fr":"Figures 1(a) et 1(b) du brevet US 12 016 421 : deux vues d'un casque intégral (100) — la coque extérieure (104) avec ses aérations (106) et sa coiffe (102), et, le long du bord inférieur de la mentonnière, le module électronique (108) détaillé en ses composants logés (110, 112, 114, 118) aux côtés de l'unité latérale circulaire (116)"},"teaser":{"en":"GoPro's patents page lists US 12,016,421 under Forcite, the Australian smart-motorcycle-helmet maker (integrated HUD, chin-mounted camera, Bluetooth connectivity) GoPro acquired in a deal announced…","fr":"La page de brevets de GoPro liste l'US 12,016,421 sous Forcite, le fabricant australien de casques de moto intelligents (affichage tête haute intégré, caméra montée au menton, connectivité Bluetooth)…"},"ful
