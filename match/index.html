 expiry February 2043, with a continuation (application 18/624,239) filed April 2, 2024. The derailleur is a base member, a movable member and a linkage of inner and outer links; the claim is that the outer link has a receiving part for a power source, positioned so that it crosses the line between the outer link's two pivot axes. The family also includes a 2022 German filing and 2023 Taiwanese and Chinese applications.","fr":"US 11 975 800 B2 (publié sous US 2023/0348018 A1), « Derailleur for human-powered vehicle » : déposé le 28 février 2023, délivré le 7 mai 2024, expiration prévue en février 2043, avec une continuation (demande 18/624 239) déposée le 2 avril 2024. Le dérailleur se compose d'une base, d'un élément mobile et d'une timonerie à biellettes intérieure et extérieure ; la revendication porte sur une partie de la biellette extérieure destinée à recevoir une source d'énergie, placée de façon à couper la ligne entre les deux axes de pivotement de la biellette. La famille comprend aussi un dépôt allemand de 2022 et des demandes taïwanaise et chinoise de 2023."}},{"num":"11697473","cat":"drive","title":{"en":"Shimano three-pulley rear derailleur (US 11,697,473)","fr":"Dérailleur arrière à trois galets dentés Shimano (US 11 697 473)"},"assignee":"Nobukatsu Hara / Shimano Inc.","img":"../pictures/US11697473B2.png","alt":{"en":"Fig. 2 of US 11,697,473 (sheet shown rotated): the rear derailleur (10) beside a twelve-sprocket cassette (RS1–RS12), with the first pulley assembly (18) and the second pulley assembly (20) carrying toothed pulleys","fr":"Fig. 2 du US 11 697 473 (feuille pivotée) : le dérailleur arrière (10) à côté d'une cassette de douze pignons (RS1–RS12), avec le premier ensemble de galets (18) et le second (20) portant des galets dentés"},"teaser":{"en":"US 11,697,473 B2 (published as US 2022/0289337 A1), \"Bicycle rear derailleur\": filed March 15, 2021, granted July 11, 2023, adjusted expiry July 2041. The movable member carries two pivoting pulley…","fr":"US 11 697 473 B2 (publié sous US 2022/0289337 A1), « Bicycle rear derailleur » : déposé le 15 mars 2021, délivré le 11 juillet 2023, expiration ajustée en juillet 2041. L'élément mobile porte deux…"},"full":{"en":"US 11,697,473 B2 (published as US 2022/0289337 A1), \"Bicycle rear derailleur\": filed March 15, 2021, granted July 11, 2023, adjusted expiry July 2041. The movable member carries two pivoting pulley supports. The first holds one toothed pulley on an axis offset from its pivot; the second holds two toothed pulleys, for three toothed pulleys in all. Taiwanese and German counterparts were filed in 2022.","fr":"US 11 697 473 B2 (publié sous US 2022/0289337 A1), « Bicycle rear derailleur » : déposé le 15 mars 2021, délivré le 11 juillet 2023, expiration ajustée en juillet 2041. L'élément mobile porte deux supports de galets pivotants. Le premier tient un galet denté sur un axe décalé par rapport à son pivot ; le second tient deux galets dentés, soit trois galets dentés au total. Des demandes taïwanaise et allemande ont été déposées en 2022."}},{"num":"3364762","cat":"drive","title":{"en":"SunTour slant-parallelogram derailleur (US 3,364,762)","fr":"Dérailleur à parallélogramme incliné SunTour (US 3 364 762)"},"assignee":"Tetsuo Maeda / Maeda Industries (SunTour), Japan","img":"../pictures/US3364762A.png","alt":{"en":"Figs. 3 and 4 of US 3,364,762: the derailleur seen from behind beside the freewheel, hung from the dropout (2) with its upper and lower pulleys (17, 18) at the smallest sprocket (32); Fig. 4 shows the linkage swung inward to the largest sprocket (33), its moved parts marked b′, c′, d′, e′ and 17′","fr":"Fig. 3 et 4 du brevet US 3 364 762 : le dérailleur vu de l'arrière à côté de la roue libre, suspendu à la patte (2), ses galets supérieur et inférieur (17, 18) alignés sur le plus petit pignon (32) ; la Fig. 4 montre la timonerie déplacée vers l'intérieur jusqu'au plus grand pignon (33), les pièces déplacées étant repérées b′, c′, d′, e′ et 17′"},"teaser":{"en":"US 3,364,762, \"Change speed gear control device for bicycles or the like,\" filed November 4, 1964 and granted January 23, 1968 in the name of Tetsuo Maeda, owner of SunTour maker Maeda Industries; the…","fr":"US 3 364 762, « Change speed gear control device for bicycles or the like », déposé le 4 novembre 1964 et délivré le 23 janvier 1968 au nom de Tetsuo Maeda, propriétaire de Maeda Industries, fabricant…"},"full":{"en":"US 3,364,762, \"Change speed gear control device for bicycles or the like,\" filed November 4, 1964 and granted January 23, 1968 in the name of Tetsuo Maeda, owner of SunTour maker Maeda Industries; the design is usually credited to his chief designer, Nobuo Ozaki. The rear derailleur's parallelogram is tilted to match the slope of the freewheel cluster, so the upper pulley stays close to every sprocket from smallest to largest instead of drifting away from the big ones. Most histories put the patent's expiry in 1984; the US patent's 17-year term ran to January 1985.","fr":"US 3 364 762, « Change speed gear control device for bicycles or the like », déposé le 4 novembre 1964 et délivré le 23 janvier 1968 au nom de Tetsuo Maeda, propriétaire de Maeda Industries, fabricant de SunTour ; la conception est généralement attribuée à son dessinateur en chef, Nobuo Ozaki. Le parallélogramme du dérailleur arrière est incliné pour suivre la pente de la roue libre, de sorte que le galet supérieur reste proche de chaque pignon, du plus petit au plus grand, au lieu de s'éloigner des grands. La plupart des historiques situent l'expiration du brevet en 1984 ; la durée de 17 ans du brevet américain courait jusqu'en janvier 1985."}},{"num":"4889521","cat":"drive","title":{"en":"Hyperglide ramped-tooth cassette (US 4,889,521)","fr":"Cassette à dents rampées Hyperglide (US 4 889 521)"},"assignee":"Masashi Nagano / Shimano Industrial Co.","img":"../pictures/US4889521A.png","alt":{"en":"Fig. 1 of US 4,889,521: an end view of a multistage sprocket assembly with a chain (3) engaging the larger sprocket (1) and the smaller one (2), showing the tooth shapes (4, 4a–4e) cut and profiled to guide the chain across, with the chain-pin centers (O1, O2) and link pitch dimensions (L, l) marked","fr":"Fig. 1 du brevet US 4 889 521 : une vue de bout d'un ensemble de pignons multiples avec une chaîne (3) engagée sur le grand pignon (1) et le plus petit (2), montrant les formes de dents (4, 4a–4e) découpées et profilées pour guider la chaîne d'un pignon à l'autre, avec les centres des axes de chaîne (O1, O2) et les cotes de pas des maillons (L, l)"},"teaser":{"en":"US 4,889,521, \"Multistage sprocket assembly for a bicycle,\" filed October 24, 1988 by Masashi Nagano and granted December 26, 1989 to Shimano Industrial Co. The claims cover the spacing and tooth…","fr":"US 4 889 521, « Multistage sprocket assembly for a bicycle », déposé le 24 octobre 1988 par Masashi Nagano et délivré le 26 décembre 1989 à Shimano Industrial Co. Les revendications portent sur…"},"full":{"en":"US 4,889,521, \"Multistage sprocket assembly for a bicycle,\" filed October 24, 1988 by Masashi Nagano and granted December 26, 1989 to Shimano Industrial Co. The claims cover the spacing and tooth relationships between adjacent sprockets — shift ramps cut into the sprocket faces, with individual teeth profiled and timed to the chain's pitch — that let the chain climb from one sprocket to the next while still under pedaling load. Shimano's own later sprocket patents cite this number directly as the Hyper Glide assembly and describe it as having become an industry standard. Filed before June 8, 1995, so the term ran to the later of grant+17 and filing+20: 2008.","fr":"US 4 889 521, « Multistage sprocket assembly for a bicycle », déposé le 24 octobre 1988 par Masashi Nagano et délivré le 26 décembre 1989 à Shimano Industrial Co. Les revendications portent sur l'espacement et les rapports de dents entre pignons adjacents — des rampes de passage usinées dans les faces des pignons, avec des dents profilées et synchronisées au pas de la chaîne — qui permettent à la chaîne de monter d'un pignon au suivant tout en restant en charge. Les brevets de pignons ultérieurs de Shimano citent directement ce numéro comme l'ensemble Hyper Glide et le décrivent comme devenu une norme industrielle. Déposé avant le 8 juin 1995 : la durée a donc couru jusqu'à la plus tardive des échéances délivrance+17 et dépôt+20, soit 2008."}},{"num":"4900291","cat":"drive","title":{"en":"SRAM Grip Shift twist shifter (US 4,900,291)","fr":"Manette tournante Grip Shift de SRAM (US 4 900 291)"},"assignee":"Sam H. Patterson / Sram Corporation","img":"../pictures/US4900291A.png","alt":{"en":"Fig. 1 of US 4,900,291: a road bike with a twist-grip shifter (34/36) at each end of the handlebar in place of a thumb lever, with Figs. 3 and 4 (same sheet) showing the internal cam mechanism (64/107/108/112/114) that pulls derailleur cable as the grip rotates","fr":"Fig. 1 du brevet US 4 900 291 : un vélo de route avec une manette tournante (34/36) à chaque extrémité du cintre à la place d'un levier à pouce, les Fig. 3 et 4 (même planche) montrant le mécanisme de came interne (64/107/108/112/114) qui tire le câble de dérailleur lorsque la manette tourne"},"teaser":{"en":"US 4,900,291, \"Bicycle gearshifting method and apparatus,\" granted February 13, 1990 to Sam H. Patterson of Chicago, assigned to Sram Corporation — a continuation-in-part tracing to an application…","fr":"US 4 900 291, « Bicycle gearshifting method and apparatus », délivré le 13 février 1990 à Sam H. Patterson, de Chicago, cédé à Sram Corporation — une continuation partielle remontant à une demande…"},"full":{"en":"US 4,900,291, \"Bicycle gearshifting method and apparatus,\" granted February 13, 1990 to Sam H. Patterson of Chicago, assigned to Sram Corporation — a continuation-in-part tracing to an application first filed January 6, 1988. A rotatable handgrip actuator, geared through a cam profiled to compensate for the derailleur return spring's changing force and for accumulated slack in the cable and shifting mechanism, lets the rider dump several gears in one twist without lifting a hand from the bar, unlike a thumb-lever shifter's one-click-per-motion action. Pre-GATT filing: the term ran 17 years from grant, to 2007.","fr":"US 4 900 291, « Bicycle gearshifting method and apparatus », délivré le 13 février 1990 à Sam H. Patterson, de Chicago, cédé à Sram Corporation — une continuation partielle remontant à une demande déposée pour la première fois le 6 janvier 1988. Une manette tournante, entraînant une came profilée pour compenser la force changeante du ressort de rappel du dérailleur ainsi que le mou accumulé dans le câble et le mécanisme de passage, permet au cycliste de descendre plusieurs vitesses d'un seul geste sans lâcher le cintre — contrairement à un levier à pouce, dont chaque geste ne change qu'un seul cran. Dépôt antérieur au GATT : la durée courait 17 ans à compter de la délivrance, jusqu'en 2007."}},{"num":"5799541","cat":"drive","title":{"en":"Twist-grip shifter with contamination seal (US 5,799,541)","fr":"Manette tournante avec joint anti-contamination (US 5 799 541)"},"assignee":"Markus Arbeiter / Fichtel & Sachs AG (now SRAM Deutschland GmbH)","img":"../pictures/US5799541A.png","alt":{"en":"Fig. 1 of US 5,799,541: exploded perspective of the twist-grip shifter, with the twist grip (1) and its rubber outer grip (3) at right, the shifter housing (2) with its gear-indicator window (10) and cable adjuster (14) at left, and the housing-side collar (5) that fits into the recessed end of the grip (4)","fr":"Fig. 1 du brevet US 5 799 541 : perspective éclatée de la manette tournante, avec la poignée tournante (1) et sa poignée extérieure en caoutchouc (3) à droite, le boîtier de la manette (2) avec sa fenêtre d'indication de vitesse (10) et son réglage de câble (14) à gauche, et le collier du côté boîtier (5) qui s'insère dans l'extrémité en creux de la poignée (4)"},"teaser":{"en":"US 5,799,541, \"Twist-grip shifter for bicycles and a bicycle having a twist-grip shifter,\" filed March 4, 1996 by Fichtel & Sachs AG and granted September 1, 1998 to inventor Markus Arbeiter; now…","fr":"US 5 799 541, « Twist-grip shifter for bicycles and a bicycle having a twist-grip shifter », déposé le 4 mars 1996 par Fichtel & Sachs AG et délivré le 1er septembre 1998 à l'inventeur Markus Arbeiter…"},"full":{"en":"US 5,799,541, \"Twist-grip shifter for bicycles and a bicycle having a twist-grip shifter,\" filed March 4, 1996 by Fichtel & Sachs AG and granted September 1, 1998 to inventor Markus Arbeiter; now assigned to SRAM Deutschland GmbH. It is a continuation-in-part of US 5,588,925 (filed November 29, 1995, Arbeiter and Christian Weishaupt) and US 5,666,859 (filed December 1, 1995), with a September 20, 1995 provisional. The twist grip and the cable-winding mechanism are rigidly joined, and the patent keeps debris out of that joint with a collar on the winder that extends into a groove in the end of the grip. The contactless version, which the text says is enough for most uses, leaves the collar clear of the groove walls. For cross-country and competition bikes it describes a lip seal instead: the rubber outer grip is molded onto an inner part and carries a sealing lip that bears on the collar. The term runs from the earliest non-provisional filing in the chain, November 29, 1995, to 2015, matching Google Patents; Google also lists it as Expired – Fee Related, meaning it lapsed on unpaid maintenance fees. The claims were not read.","fr":"US 5 799 541, « Twist-grip shifter for bicycles and a bicycle having a twist-grip shifter », déposé le 4 mars 1996 par Fichtel & Sachs AG et délivré le 1er septembre 1998 à l'inventeur Markus Arbeiter ; aujourd'hui cédé à SRAM Deutschland GmbH. Il s'agit d'une continuation-in-part des brevets US 5 588 925 (déposé le 29 novembre 1995, Arbeiter et Christian Weishaupt) et US 5 666 859 (déposé le 1er décembre 1995), avec une provisoire du 20 septembre 1995. La poignée tournante et le mécanisme d'enroulement du câble sont solidaires, et le brevet empêche les débris d'entrer dans ce raccord grâce à un collier du mécanisme d'enroulement qui pénètre dans une gorge à l'extrémité de la poignée. La version sans contact, que le texte juge suffisante pour la plupart des usages, laisse le collier à distance des parois de la gorge. Pour les vélos de cross-country et de compétition, il décrit plutôt un joint à lèvre : la poignée extérieure en caoutchouc est surmoulée sur une pièce intérieure et porte une lèvre d'étanchéité qui s'appuie sur le collier. La durée court depuis le premier dépôt non provisoire de la chaîne, le 29 novembre 1995, jusqu'en 2015, conforme à Google Patents ; Google indique aussi Expired – Fee Related, c'est-à-dire déchu pour frais de maintien impayés. Les revendications n'ont pas été lues."}},{"num":"8608610","cat":"drive","title":{"en":"Transmission unit (US 8,608,610)","fr":"Unité de transmission (US 8 608 610)"},"assignee":"Michael Schmitz & Christoph Lermen / Pinion GmbH (Stuttgart, Germany)","img":"../pictures/US8608610B2.png","alt":{"en":"Fig. 2 of US 8,608,610 B2: an exploded view of the sealed transmission unit (10) mounted at the bottom bracket between the two crank arms (16/16'), with the internal gear cluster and shift ring visible mid-assembly","fr":"Fig. 2 du brevet US 8 608 610 B2 : une vue éclatée de l'unité de transmission scellée (10) montée au boîtier de pédalier entre les deux manivelles (16/16'), avec le groupe d'engrenages interne et la bague de changement de vitesse visibles au milieu de l'assemblage"},"teaser":{"en":"Pinion's foundational sealed multi-gear transmission unit at the bottom bracket: an input shaft geared to a countershaft through a first partial transmission, feeding a second partial transmission and…","fr":"Le brevet fondateur de Pinion pour sa boîte de transmission scellée à engrenages multiples au niveau du boîtier de pédalier : un arbre d'entrée engrenant sur un arbre intermédiaire via une première…"},"full":{"en":"Pinion's foundational sealed multi-gear transmission unit at the bottom bracket: an input shaft geared to a countershaft through a first partial transmission, feeding a second partial transmission and output shaft — the two-stage sequential spur-gear architecture behind every Pinion gearbox since. Filed as a continuation of PCT/EP2009/009193 (international filing date December 21, 2009, which governs the U.S. 20-year term rather than the later June 21, 2011 U.S. national-phase entry date), claiming a December 22, 2008 German priority (DE 10 2008 064514), and granted December 17, 2013 as US 8,608,610, naming Pinion co-founders Michael Schmitz and Christoph Lermen as inventors — all read directly off the patent's own front page.","fr":"Le brevet fondateur de Pinion pour sa boîte de transmission scellée à engrenages multiples au niveau du boîtier de pédalier : un arbre d'entrée engrenant sur un arbre intermédiaire via une première transmission partielle, alimentant une seconde transmission partielle et un arbre de sortie — l'architecture à deux étages séquentiels à engrenages droits derrière chaque boîte Pinion depuis lors. Déposé comme continuation de la demande PCT/EP2009/009193 (date de dépôt international le 21 décembre 2009, qui régit la durée de 20 ans aux États-Unis plutôt que la date d'entrée en phase nationale américaine du 21 juin 2011), revendiquant une priorité allemande du 22 décembre 2008 (DE 10 2008 064514), et délivré le 17 décembre 2013 sous le numéro US 8 608 610, nommant les cofondateurs de Pinion Michael Schmitz et Christoph Lermen comme inventeurs — le tout lu directement sur la première page du brevet."}},{"num":"6182991","cat":"drive","title":{"en":"Christini All-Wheel Drive bicycle (US 6,182,991)","fr":"Vélo à transmission intégrale Christini (US 6 182 991)"},"assignee":"Steven J. Christini et al. / Christini Technologies, Inc.","img":"../pictures/US6182991B1.png","alt":{"en":"Fig. 1 of US 6,182,991: the frame's internal drive path in isolation — a shaft (2) running from the bottom-bracket area up through the down tube and head tube, connected through universal joints (3, 14) to a second shaft (15) continuing up toward the steerer","fr":"Fig. 1 du brevet US 6 182 991 : le trajet d'entraînement interne du cadre isolé — un arbre (2) remontant de la zone du boîtier de pédalier à travers le tube diagonal et le tube de direction, relié par des joints de cardan (3, 14) à un second arbre (15) se prolongeant vers le pilote"},"teaser":{"en":"US 6,182,991 B1, \"Two wheel drive bicycle with a shock-absorbing front fork,\" filed August 11, 1999 by Steven J. Christini, Michael J. Dunn, Jeremy T. Shook, Robert L. Pigeon and Louis J. Allora,…","fr":"US 6 182 991 B1, « Two wheel drive bicycle with a shock-absorbing front fork », déposé le 11 août 1999 par Steven J. Christini, Michael J. Dunn, Jeremy T. Shook, Robert L. Pigeon et Louis J. Allora,…"},"full":{"en":"US 6,182,991 B1, \"Two wheel drive bicycle with a shock-absorbing front fork,\" filed August 11, 1999 by Steven J. Christini, Michael J. Dunn, Jeremy T. Shook, Robert L. Pigeon and Louis J. Allora, granted February 6, 2001 to Christini Technologies, Inc. of Philadelphia. A series of rigid shafts and universal joints carries power from the rear-wheel drivetrain up through the down tube and head tube, then down a custom fork leg to a bevel-gear joint at the front dropout — engaging the front wheel only as the rear wheel's own drive demands it, so the shaft length can grow and shrink with fork travel. This patent is a continuation-in-part of an October 23, 1998 application (itself tracing to an April 1996 provisional filing); term calculated from that October 1998 non-provisional filing runs 20 years, to 2018.","fr":"US 6 182 991 B1, « Two wheel drive bicycle with a shock-absorbing front fork », déposé le 11 août 1999 par Steven J. Christini, Michael J. Dunn, Jeremy T. Shook, Robert L. Pigeon et Louis J. Allora, délivré le 6 février 2001 à Christini Technologies, Inc. de Philadelphie. Une série d'arbres rigides et de joints de cardan transmet la puissance de la transmission de la roue arrière, en remontant par le tube diagonal et le tube de direction, puis en redescendant dans un fourreau de fourche sur mesure jusqu'à un joint à pignons coniques à la patte avant — n'entraînant la roue avant qu'en fonction de ce qu'exige l'entraînement de la roue arrière elle-même, la longueur de l'arbre pouvant s'allonger et se raccourcir avec le débattement de la fourche. Ce brevet est une continuation partielle d'une demande du 23 octobre 1998 (elle-même issue d'un dépôt provisoire d'avril 1996) ; la durée calculée à partir de ce dépôt non provisoire d'octobre 1998 court 20 ans, jusqu'en 2018."}},{"num":"9011282","cat":"drive","title":{"en":"OneUp cassette extender cog (US 9,011,282)","fr":"Pignon d'extension de cassette OneUp (US 9 011 282)"},"assignee":"Jonathan Staples / D3 Innovation Inc. (OneUp Components)","img":"../pictures/US9011282B2.png","alt":{"en":"Fig. 2 of US 9,011,282: a perspective view of a ten-sprocket rear cassette (30) with each sprocket labeled S1 through S10, the largest sprocket S10 — the axially rearmost extender cog the patent claims — visible at the outer edge of the stack","fr":"Fig. 2 du brevet US 9 011 282 : une vue en perspective d'une cassette arrière à dix pignons (30) dont chaque pignon est repéré de S1 à S10, le plus grand pignon S10 — le pignon d'extension axialement le plus reculé revendiqué par le brevet — visible au bord extérieur de l'empilement"},"teaser":{"en":"US 9,011,282 B2, 'Bicycle sprocket for use with a multi-gear rear cassette,' inventor Jonathan Staples, assignee D3 Innovation Inc. — OneUp Components' trade name and the entity behind its own virtual…","fr":"US 9 011 282 B2, « Bicycle sprocket for use with a multi-gear rear cassette », inventeur Jonathan Staples, cessionnaire D3 Innovation Inc. — le nom commercial de OneUp Components et l'entité derrière…"},"full":{"en":"US 9,011,282 B2, 'Bicycle sprocket for use with a multi-gear rear cassette,' inventor Jonathan Staples, assignee D3 Innovation Inc. — OneUp Components' trade name and the entity behind its own virtual patent-marking page. Filed Nov. 21, 2014, granted April 21, 2015. Claims a rear sprocket mounted axially rearmost on a cassette, built from a chain-engaging portion and a mounting portion joined by integrally-formed support arms carrying axially-projecting spacer protrusions — the internal spacer geometry that lets one oversized cog bolt onto an otherwise-stock cassette body without a separate spacer ring. Google Patents lists the record as expired for an unpaid maintenance fee, short of its anticipated 2034 full term; the patent doesn't appear on OneUp's own current virtual patent-marking page, which as of this pass covers only its bash/chain guides, EDC tools, dropper post, chainring and carbon bar — consistent with a lapsed patent no longer being actively marked.","fr":"US 9 011 282 B2, « Bicycle sprocket for use with a multi-gear rear cassette », inventeur Jonathan Staples, cessionnaire D3 Innovation Inc. — le nom commercial de OneUp Components et l'entité derrière sa propre page de marquage virtuel de brevets. Déposé le 21 novembre 2014, délivré le 21 avril 2015. Revendique un pignon arrière monté à l'extrémité axialement la plus reculée d'une cassette, constitué d'une portion d'engagement de chaîne et d'une portion de montage reliées par des bras de support formés d'une seule pièce portant des saillies d'espacement en saillie axiale — la géométrie d'espacement interne qui permet à un seul grand pignon de se boulonner sur un corps de cassette autrement standard sans bague d'espacement séparée. Google Patents indique le dossier comme expiré faute de paiement d'une annuité, avant son terme complet anticipé de 2034 ; ce brevet n'apparaît pas sur la page de marquage virtuel de brevets actuelle de OneUp, qui à ce stade ne couvre que ses guide-chaînes/bash guards, outils EDC, tige de selle télescopique, plateau et cintre carbone — cohérent avec un brevet éteint qui n'est plus activement marqué."}},{"num":"10088020","cat":"drive","title":{"en":"Gates Carbon Drive / CDX CenterTrack","fr":"Gates Carbon Drive / CDX CenterTrack"},"assignee":"Gates (CenterTrack: Wayne Lumpkin)","img":"../pictures/AU2018271340B2.png","alt":{"en":"Fig. 5 of AU 2018271340: the full sprocket (100) wrapped by the toothed belt (50), with the sprocket's center-track ribs (40) riding in the belt's groove (51)","fr":"Fig. 5 du brevet AU 2018271340 : le pignon complet (100) entouré par la courroie crantée (50), les nervures centrales du pignon (40) circulant dans la rainure de la courroie (51)"},"teaser":{"en":"Carbon tensile-cord belts plus the CenterTrack center-rib sprocket system — designed and patented by Wayne Lumpkin, the founder of Avid Brakes, to fix the first-generation belt's alignment and tension…","fr":"Des courroies à câbles de traction en carbone plus le système de pignon à nervure centrale CenterTrack — conçu et breveté par Wayne Lumpkin, fondateur d'Avid Brakes, pour corriger les problèmes…"},"full":{"en":"Carbon tensile-cord belts plus the CenterTrack center-rib sprocket system — designed and patented by Wayne Lumpkin, the founder of Avid Brakes, to fix the first-generation belt's alignment and tension problems. A separate 'Drop-Out' frame patent (a split dropout that lets a one-piece belt pass into the rear triangle) sits at the center of a 2024 lawsuit. Patents on the belt system include US 10,088,020, 'Belt drive system,' and Australian patent AU 2018271340 B2.","fr":"Des courroies à câbles de traction en carbone plus le système de pignon à nervure centrale CenterTrack — conçu et breveté par Wayne Lumpkin, fondateur d'Avid Brakes, pour corriger les problèmes d'alignement et de tension de la courroie de première génération. Un brevet de cadre distinct « Drop-Out » (une patte fendue permettant à une courroie monobloc de passer dans le triangle arrière) est au centre d'un procès de 2024. Parmi les brevets couvrant le système de courroie figurent le US 10 088 020, « Belt drive system », et le brevet australien AU 2018271340 B2."}},{"num":"321932","cat":"drive","title":{"en":"Kelley strap-drum bicycle drive (US 321,932)","fr":"Entraînement à tambour et sangle de Kelley (US 321,932)"},"assignee":"William S. Kelley (Smithville, NJ)","img":"../pictures/US321932A.png","alt":{"en":"William S. Kelley bicycle patent drawing, Fig. 1 and Fig. 4, showing the high-wheel ordinary and the spring-loaded ratchet drum detail","fr":"Dessin de brevet du vélo de William S. Kelley, Fig. 1 et Fig. 4, montrant le grand-bi et le détail du tambour à cliquet à ressort"},"teaser":{"en":"Filed March 24, 1884, granted July 7, 1885, titled simply 'Bicycle.' The specification describes the driving wheel actuated by a clutch/ratchet mechanism from a drum wound forward by a strap connected…","fr":"Déposé le 24 mars 1884, délivré le 7 juillet 1885, intitulé simplement « Bicycle ». Le mémoire décrit la roue motrice actionnée par un mécanisme d'embrayage/cliquet à partir d'un tambour enroulé vers…"},"full":{"en":"Filed March 24, 1884, granted July 7, 1885, titled simply 'Bicycle.' The specification describes the driving wheel actuated by a clutch/ratchet mechanism from a drum wound forward by a strap connected to a foot lever, and turned back by a spring when the lever releases — a treadle-and-drum alternative to the crank-and-pedal drive that eventually won out, on a high-wheel 'ordinary.'","fr":"Déposé le 24 mars 1884, délivré le 7 juillet 1885, intitulé simplement « Bicycle ». Le mémoire décrit la roue motrice actionnée par un mécanisme d'embrayage/cliquet à partir d'un tambour enroulé vers l'avant par une sangle reliée à un levier de pied, et ramené en arrière par un ressort quand le levier se relâche — une alternative à pédale à bascule et tambour à l'entraînement à manivelle et pédale qui a fini par s'imposer, sur un « ordinaire » à grande roue."}},{"num":"4127038","cat":"drive","title":{"en":"Browning sprocket shift assembly (US 4,127,038)","fr":"Ensemble de changement de vitesse à pignons de Browning (US 4 127 038)"},"assignee":"Bruce W. Browning","img":"../pictures/US4127038A.png","alt":{"en":"Figs. 1–3 of US 4,127,038: a side view of the crank, chain and rear sprocket cluster (Fig. 1), a front view of the same assembly (Fig. 2), and an exploded view of the hinged sprocket cluster (Fig. 3) showing the individually pivoting segments (35, 36) and their actuating pins (44) that realign to hand the chain across","fr":"Fig. 1-3 du brevet US 4 127 038 : une vue latérale du pédalier, de la chaîne et de l'ensemble de pignons arrière (Fig. 1), une vue de face du même ensemble (Fig. 2), et une vue éclatée de l'ensemble de pignons articulés (Fig. 3) montrant les segments pivotant individuellement (35, 36) et leurs broches d'actionnement (44) qui se réalignent pour transférer la chaîne"},"teaser":{"en":"US 4,127,038, filed August 6, 1976 and granted November 28, 1978 to Bruce W. Browning — grandson of firearms designer John Moses Browning — covers a cluster of sprockets of different diameters where a…","fr":"Le brevet US 4 127 038, déposé le 6 août 1976 et délivré le 28 novembre 1978 à Bruce W. Browning — petit-fils de l'armurier John Moses Browning — couvre un ensemble de pignons de diamètres différents…"},"full":{"en":"US 4,127,038, filed August 6, 1976 and granted November 28, 1978 to Bruce W. Browning — grandson of firearms designer John Moses Browning — covers a cluster of sprockets of different diameters where a hinged segment of each sprocket realigns to hand the chain off to the next sprocket, keeping the chain in positive contact with the cluster at all times rather than having a derailleur push it across. Assigned jointly to seven Browning family members rather than a company; SunTour licensed the mechanism around 1990 as the Browning Electronic AccuShift Transmission (BEAST).","fr":"Le brevet US 4 127 038, déposé le 6 août 1976 et délivré le 28 novembre 1978 à Bruce W. Browning — petit-fils de l'armurier John Moses Browning — couvre un ensemble de pignons de diamètres différents dont un segment articulé de chaque pignon se réaligne pour transférer la chaîne au pignon suivant, la maintenant en contact positif avec l'ensemble en permanence plutôt que de la pousser au moyen d'un dérailleur. Cédé conjointement à sept membres de la famille Browning plutôt qu'à une société ; SunTour a concédé une licence sur ce mécanisme vers 1990 sous le nom de Browning Electronic AccuShift Transmission (BEAST)."}},{"num":"323289","cat":"frame","title":{"en":"Blount bicycle frame/steering patent (US 323,289)","fr":"Brevet de cadre/direction de vélo de Blount (US 323,289)"},"assignee":"John G. Blount (Boston, MA)","img":"../pictures/US323289A.png","alt":{"en":"John G. Blount bicycle patent drawing, Fig. 1, showing the high-wheel ordinary with head-tube-to-rear-wheel bracing","fr":"Dessin de brevet du vélo de John G. Blount, Fig. 1, montrant le grand-bi avec un contreventement du tube de direction à la roue arrière"},"teaser":{"en":"Granted July 28, 1885, titled simply 'Bicycle' on a high-wheel 'ordinary.' The drawing shows a bracing/linkage system running from the head tube area down toward the small trailing wheel; the exact…","fr":"Délivré le 28 juillet 1885, intitulé simplement « Bicycle » pour un « ordinaire » à grande roue. Le dessin montre un système de contreventement/biellette allant de la zone du tube de direction vers la…"},"full":{"en":"Granted July 28, 1885, titled simply 'Bicycle' on a high-wheel 'ordinary.' The drawing shows a bracing/linkage system running from the head tube area down toward the small trailing wheel; the exact claimed mechanism isn't independently confirmed this pass — Google Patents doesn't carry searchable specification text for this one, and the description here is read directly from the drawing rather than the claims.","fr":"Délivré le 28 juillet 1885, intitulé simplement « Bicycle » pour un « ordinaire » à grande roue. Le dessin montre un système de contreventement/biellette allant de la zone du tube de direction vers la petite roue arrière ; le mécanisme exact revendiqué n'est pas confirmé de façon indépendante à ce stade — Google Patents ne propose pas de texte de spécification consultable pour celui-ci, et la description ici est lue directement sur le dessin plutôt que sur les revendications."}},{"num":"566201","cat":"comp","title":{"en":"Mackinnon & Gage saddle-spring suspension (US 566,201)","fr":"Suspension de selle à ressort de Mackinnon et Gage (US 566,201)"},"assignee":"Alexander H. Mackinnon & Stuart M. Gage","img":"../pictures/US566201A.png","alt":{"en":"Mackinnon and Gage bicycle patent drawing, Fig. 1 and Fig. 2, showing the spring-looped saddle mount and the complete safety bicycle","fr":"Dessin de brevet du vélo de Mackinnon et Gage, Fig. 1 et Fig. 2, montrant la fixation de selle à ressort en boucle et le vélo de sécurité complet"},"teaser":{"en":"Granted August 18, 1896, titled 'Bicycle.' A looped spring assembly under the saddle, connecting it to the seatpost so the seat itself absorbs shock independently of the frame — shown mounted on a…","fr":"Délivré le 18 août 1896, intitulé « Bicycle ». Un assemblage de ressort en boucle sous la selle, la reliant à la tige de selle afin que le siège lui-même absorbe les chocs indépendamment du cadre —…"},"full":{"en":"Granted August 18, 1896, titled 'Bicycle.' A looped spring assembly under the saddle, connecting it to the seatpost so the seat itself absorbs shock independently of the frame — shown mounted on a full chain-drive safety bicycle in the patent's second figure, not a high-wheeler. Read directly from the drawing; the specification text wasn't independently confirmed this pass.","fr":"Délivré le 18 août 1896, intitulé « Bicycle ». Un assemblage de ressort en boucle sous la selle, la reliant à la tige de selle afin que le siège lui-même absorbe les chocs indépendamment du cadre — montré fixé sur un vélo de sécurité à transmission par chaîne complète dans la deuxième figure du brevet, pas un grand-bi. Lu directement sur le dessin ; le texte de la spécification n'a pas été confirmé de façon indépendante à ce stade."}},{"num":"662346","cat":"comp","title":{"en":"Brooks cycle-saddle attachment (US 662,346)","fr":"Fixation de selle de cycle Brooks (US 662 346)"},"assignee":"John Boultbee Brooks & John Holt / J. B. Brooks & Co. Ltd.","img":"../pictures/US662346A.png","alt":{"en":"Fig. 1 of US 662,346: a saddle carried on a coil spring at the front and another at the rear, mounted on a rail that passes through a clamp (a) on the seat post, with a central bolt (b) and a ring of lettered fittings (a1, a3, a4, d, e, g) around it","fr":"Fig. 1 du brevet US 662 346 : une selle portée par un ressort hélicoïdal à l'avant et un autre à l'arrière, montés sur un rail qui traverse une pince (a) fixée sur la tige de selle, avec un boulon central (b) et une couronne de pièces repérées (a1, a3, a4, d, e, g) autour"},"teaser":{"en":"US 662,346, \"Cycle-saddle attachment,\" filed March 6, 1900 and granted November 20, 1900 to John Boultbee Brooks and John Holt, assigned to J. B. Brooks & Co. Ltd. Per the title and Fig. 1, it covers…","fr":"US 662 346, « Cycle-saddle attachment », déposé le 6 mars 1900 et délivré le 20 novembre 1900 à John Boultbee Brooks et John Holt, cédé à J. B. Brooks & Co. Ltd. D'après le titre et la Fig. 1, il…"},"full":{"en":"US 662,346, \"Cycle-saddle attachment,\" filed March 6, 1900 and granted November 20, 1900 to John Boultbee Brooks and John Holt, assigned to J. B. Brooks & Co. Ltd. Per the title and Fig. 1, it covers how a saddle is fixed to the seat post: a saddle on coil springs at each end, carried on a rail that passes through a clamp on the post and is held by a central bolt. Pre-1916 US numbering, so the number links normally. The 17-year term ran from grant, to 1917, matching Google Patents' anticipated expiration. The patent text was not read; this entry rests on its front-page data and drawing.","fr":"US 662 346, « Cycle-saddle attachment », déposé le 6 mars 1900 et délivré le 20 novembre 1900 à John Boultbee Brooks et John Holt, cédé à J. B. Brooks & Co. Ltd. D'après le titre et la Fig. 1, il porte sur la fixation de la selle à la tige : une selle sur des ressorts hélicoïdaux à chaque extrémité, portée par un rail qui traverse une pince sur la tige et qu'un boulon central maintient. La durée de 17 ans courait depuis la délivrance, jusqu'en 1917, conforme à l'expiration calculée par Google Patents. Le texte du brevet n'a pas été lu ; cette fiche repose sur les données de première page et sur le dessin."}},{"num":"6241636","cat":"drive","title":{"en":"NuVinci continuously variable planetary hub (US 6,241,636 + family)","fr":"Moyeu planétaire à variation continue NuVinci (US 6 241 636 + famille)"},"assignee":"Donald C. Miller / Motion Technologies, LLC (later Fallbrook Technologies, brand NuVinci)","img":"../pictures/US6241636B1.png","alt":{"en":"Fig. 1 of US 6,241,636, a cutaway perspective of the hub assembly (100): the input shaft (102) driving the first disc (120), the second disc (170) on the output axle (180), with the spherical power-adjuster elements visible in cutaway (122A/122B) between them","fr":"Fig. 1 du brevet US 6 241 636, vue en coupe en perspective de l'ensemble du moyeu (100) : l'arbre d'entrée (102) entraînant le premier disque (120), le second disque (170) sur l'axe de sortie (180), avec les éléments sphériques de réglage de puissance visibles en coupe (122A/122B) entre les deux"},"teaser":{"en":"US 6,241,636 B1, \"Continuously Variable Transmission,\" filed August 12, 1998 by Donald C. Miller and granted June 5, 2001 to Motion Technologies, LLC of Fallbrook, California — the foundational patent…","fr":"US 6 241 636 B1, « Continuously Variable Transmission », déposé le 12 août 1998 par Donald C. Miller et délivré le 5 juin 2001 à Motion Technologies, LLC de Fallbrook, Californie — le brevet fondateur…"},"full":{"en":"US 6,241,636 B1, \"Continuously Variable Transmission,\" filed August 12, 1998 by Donald C. Miller and granted June 5, 2001 to Motion Technologies, LLC of Fallbrook, California — the foundational patent behind what became the NuVinci hub. It claims a set of spherical balls frictionally interposed between a driving and a driven member, each rotatably mounted on a main shaft; tilting each ball's rotational axis continuously changes the ratio between input and output speed, with no discrete gear steps at all. The application claims priority to four 1997 provisionals, the earliest dated September 2, 1997 — provisionals don't start this atlas's 20-year clock, so `exp` runs from the 1998 non-provisional filing.","fr":"US 6 241 636 B1, « Continuously Variable Transmission », déposé le 12 août 1998 par Donald C. Miller et délivré le 5 juin 2001 à Motion Technologies, LLC de Fallbrook, Californie — le brevet fondateur derrière ce qui deviendra le moyeu NuVinci. Il revendique un ensemble de billes sphériques interposées par friction entre un organe menant et un organe mené, chacun monté de façon rotative sur un arbre principal ; incliner l'axe de rotation de chaque bille modifie continûment le rapport entre la vitesse d'entrée et de sortie, sans aucun cran de vitesse discret. La demande revendique la priorité de quatre demandes provisoires de 1997, la plus ancienne datée du 2 septembre 1997 — les demandes provisoires ne déclenchent pas les 20 ans de cet atlas, donc `exp` court à partir du dépôt non provisoire de 1998."}},{"num":"7712566","cat":"drive","title":{"en":"Schlumpf planetary crank drive → SRAM HammerSchmidt (US 7,712,566)","fr":"Transmission planétaire au pédalier Schlumpf → SRAM HammerSchmidt (US 7,712,566)"},"assignee":"Florian Schlumpf (Switzerland) → Haberstock-Mobility → SRAM (Truvativ)","img":"../pictures/US7712566B2.png","alt":{"en":"Fig. 1 of US 7,712,566: the planetary transmission housing (46) mounted at the bottom bracket (10/14/32), with the crank arm (18) and chainring/pulley (90/94) alongside","fr":"Fig. 1 du brevet US 7 712 566 : le boîtier de transmission planétaire (46) monté au niveau du pédalier (10/14/32), avec la manivelle (18) et le plateau/poulie (90/94) à côté"},"teaser":{"en":"A two-ratio planetary gear assembly behind the chainring, shifted by a heel-tap on the axle button — prototyped in Switzerland in 1988 by Florian Schlumpf, whose own 1994 patent (US 5,303,942) is…","fr":"Un ensemble planétaire à deux rapports derrière le plateau, changé de vitesse par un talon appuyé sur le bouton de l'axe — prototypé en Suisse en 1988 par Florian Schlumpf, dont le propre brevet de…"},"full":{"en":"A two-ratio planetary gear assembly behind the chainring, shifted by a heel-tap on the axle button — prototyped in Switzerland in 1988 by Florian Schlumpf, whose own 1994 patent (US 5,303,942) is cited as prior art here. SRAM commercialized the concept as the Truvativ HammerSchmidt for freeride, and US 7,712,566 is SRAM's own follow-on 'Bicycle transmission' patent — not Schlumpf's original filing — covering the specific crank-mounted planetary mechanism, invented by SRAM engineers Brian Jordan, Kevin Wesling and Christopher Shipman. It's a continuation of an application filed April 11, 2007; this document's own filing (August 8, 2008) is later, but patent term runs from that earlier 2007 filing, giving an expiry of 2027 rather than 2028. The Schlumpf-to-SRAM acquisition chain in the 'assignee' line above reflects prior research on this entry and wasn't independently re-verified this pass.","fr":"Un ensemble planétaire à deux rapports derrière le plateau, changé de vitesse par un talon appuyé sur le bouton de l'axe — prototypé en Suisse en 1988 par Florian Schlumpf, dont le propre brevet de 1994 (US 5 303 942) est cité ici comme antériorité. SRAM a commercialisé le concept sous le nom de Truvativ HammerSchmidt pour le freeride, et l'US 7 712 566 est le propre brevet de suivi de SRAM « Bicycle transmission » — et non le dépôt original de Schlumpf — couvrant le mécanisme planétaire monté sur la manivelle, inventé par les ingénieurs de SRAM Brian Jordan, Kevin Wesling et Christopher Shipman. Il s'agit d'une continuation d'une demande déposée le 11 avril 2007 ; le dépôt propre à ce document (8 août 2008) est postérieur, mais la durée du brevet court à partir de ce dépôt antérieur de 2007, donnant une expiration en 2027 plutôt qu'en 2028. La chaîne d'acquisition Schlumpf-vers-SRAM dans la ligne « cessionnaire » ci-dessus reflète des recherches antérieures sur cette fiche et n'a pas été vérifiée de façon indépendante lors de cette passe."}},{"num":"EP4536547","cat":"drive","title":{"en":"O-Chain floating chainring decoupler (EP 4,536,547, application)","fr":"Découpleur de plateau flottant O-Chain (EP 4 536 547, demande)"},"assignee":"Fabrizio Dragoni / Ochain S.R.L. (Italy) → SRAM","img":"../pictures/WO2024003949A1.png","alt":{"en":"Fig. 2 of WO 2024/003949: side view of a full-suspension bicycle's chainstay area, showing the chainring (26) and crank (20), the rear sprocket (22), and the upper and lower chain runs (29a, 29b), with angle A1 marked at the crank","fr":"Fig. 2 du WO 2024/003949 : vue de profil de la zone des bases d'un vélo tout-suspendu, montrant le plateau (26) et la manivelle (20), le pignon arrière (22) et les brins supérieur et inférieur de la chaîne (29a, 29b), avec l'angle A1 indiqué au pédalier"},"teaser":{"en":"A compensation device interposed between the chainring and the crank's rotation shaft, allowing a controlled angular stroke — a rest position with no chain pull, and a compensation position triggered…","fr":"Un dispositif de compensation interposé entre le plateau et l'arbre de rotation du pédalier, autorisant une course angulaire contrôlée — une position de repos sans tension de chaîne, et une position…"},"full":{"en":"A compensation device interposed between the chainring and the crank's rotation shaft, allowing a controlled angular stroke — a rest position with no chain pull, and a compensation position triggered by the chain-tension pulling generated as the rear suspension moves through its travel. Founded by Fabrizio Dragoni in 2019, Ochain S.R.L.'s spider mounts between crank and chainring and lets the ring rotate backward a set number of degrees (3° to 12°, adjustable) before the two lock together again, decoupling pedal/crank motion from chain-tension spikes for a 'chainless' feel on rough ground. Also published as WO 2024/003949. Filing date and grant status of the EP publication are unconfirmed; it is listed as a published application.","fr":"Un dispositif de compensation interposé entre le plateau et l'arbre de rotation du pédalier, autorisant une course angulaire contrôlée — une position de repos sans tension de chaîne, et une position de compensation déclenchée par la traction de tension de chaîne générée lorsque la suspension arrière se déplace dans son débattement. Fondée par Fabrizio Dragoni en 2019, l'araignée d'Ochain S.R.L. se monte entre le pédalier et le plateau et laisse le plateau tourner vers l'arrière d'un nombre de degrés défini (3° à 12°, réglable) avant que les deux ne se reverrouillent, découplant le mouvement des pédales/manivelles des pics de tension de chaîne pour une sensation « sans chaîne » sur terrain accidenté. Également publié sous WO 2024/003949. La date de dépôt et le statut de délivrance de la publication EP ne sont pas confirmés ; elle est répertoriée comme une demande publiée."}},{"num":"11560201","cat":"drive","title":{"en":"Supre Drive split derailleur (US 11,560,201 + family)","fr":"Dérailleur scindé Supre Drive (US 11 560 201 + famille)"},"assignee":"Cedric Eveleigh / Lal Bikes (Canada)","img":"../pictures/US11560201B2.png","alt":{"en":"Drawing from US 11,560,201: the split drivetrain, with the rear derailleur (42) at the cassette (36), the chain tensioner (41) beside the crank (33), and the idler pulley (119) lifting the upper chain run (35U) above the lower run (35L)","fr":"Dessin du brevet US 11 560 201 : la transmission scindée, avec le dérailleur arrière (42) à la cassette (36), le tendeur de chaîne (41) à côté du pédalier (33) et le galet (119) qui élève le brin supérieur (35U) au-dessus du brin inférieur (35L)"},"teaser":{"en":"Separates the derailleur's two jobs: chain tensioning moves to a separate tensioner at the bottom bracket while shifting stays at the rear — near-constant chain tension in every gear and no vulnerable…","fr":"Sépare les deux fonctions du dérailleur : la tension de chaîne passe à un tendeur séparé au boîtier de pédalier tandis que le changement de vitesse reste à l'arrière — une tension de chaîne quasi…"},"full":{"en":"Separates the derailleur's two jobs: chain tensioning moves to a separate tensioner at the bottom bracket while shifting stays at the rear — near-constant chain tension in every gear and no vulnerable pulley cage. First production bike: the Nicolai Nucleon 16. Two companion filings: US design patent D1,025,842 (filed November 2022, granted May 2024 to Lal Bikes of Sechelt, B.C.) covers the derailleur's appearance, and New Zealand patent NZ 795636 covers the drivetrain itself, claiming a slack lower chain run held above a line from the bottom of the chainring to the bottom of the cassette — the ground-clearance argument in patent form.","fr":"Sépare les deux fonctions du dérailleur : la tension de chaîne passe à un tendeur séparé au boîtier de pédalier tandis que le changement de vitesse reste à l'arrière — une tension de chaîne quasi constante dans chaque vitesse et aucune chape de galets vulnérable. Premier vélo de série : le Nicolai Nucleon 16. Deux dépôts complémentaires : le brevet de dessin américain D1 025 842 (déposé en novembre 2022, délivré en mai 2024 à Lal Bikes, de Sechelt, C.-B.) protège l'apparence du dérailleur, et le brevet néo-zélandais NZ 795636 couvre la transmission elle-même, en revendiquant un brin inférieur de chaîne détendu maintenu au-dessus d'une ligne allant du bas du plateau au bas de la cassette — l'argument de la garde au sol sous forme de brevet."}},{"num":"5630338","cat":"drive","title":{"en":"Sealed derailleur cable preload system (US 5,630,338)","fr":"Système de précharge de câble de dérailleur étanche (US 5 630 338)"},"assignee":"Sam Patterson, Frederick W. Day, Michael Larson, Brian Jordan / SRAM Corporation","img":"../pictures/US5630338A.png","alt":{"en":"Sheet 2 of US 5,630,338: Fig. 2, the derailleur cable's routing past the cassette and through the sealing assembly (30/32/34), and Fig. 4, a cross-section of that same tensioning tube showing the threaded preload adjuster (86/88/92) and the sealed cable pass-through (76-79)","fr":"Planche 2 du brevet US 5 630 338 : Fig. 2, le cheminement du câble de dérailleur le long de la cassette et à travers l'ensemble d'étanchéité (30/32/34), et Fig. 4, une coupe transversale de ce même tube de tension montrant la vis de précharge filetée (86/88/92) et le passage étanche du câble (76-79)"},"teaser":{"en":"US 5,630,338, \"Bicycle Derailleur Cable Preload and Sealing System,\" filed July 11, 1995 and granted May 20, 1997 to SRAM Corporation of Chicago. A resilient tubular sleeve seals one end to the…","fr":"US 5 630 338, « Bicycle Derailleur Cable Preload and Sealing System », déposé le 11 juillet 1995 et délivré le 20 mai 1997 à SRAM Corporation de Chicago. Un manchon tubulaire souple scelle une…"},"full":{"en":"US 5,630,338, \"Bicycle Derailleur Cable Preload and Sealing System,\" filed July 11, 1995 and granted May 20, 1997 to SRAM Corporation of Chicago. A resilient tubular sleeve seals one end to the derailleur control cable and the other to a frame-mounted connector, stretching between two configurations as the cable moves — regulating cable tension and keeping contamination out of the housing in a single part.","fr":"US 5 630 338, « Bicycle Derailleur Cable Preload and Sealing System », déposé le 11 juillet 1995 et délivré le 20 mai 1997 à SRAM Corporation de Chicago. Un manchon tubulaire souple scelle une extrémité au câble de commande du dérailleur et l'autre à un connecteur fixé au cadre, s'étirant entre deux configurations au gré du mouvement du câble — régulant la tension du câble et empêchant les contaminants de pénétrer dans la gaine, le tout dans une seule pièce."}},{"num":"9404565","cat":"drive","title":{"en":"Wolf Tooth Drop-Stop & component portfolio","fr":"Portefeuille Wolf Tooth Drop-Stop et composants"},"assignee":"Wolf Tooth Components (Minnesota)","img":"../pictures/US9404565B2.png","alt":{"en":"Fig. 1 of US 9,404,565: a plan view of the chainring (10), showing the alternating narrow-wide tooth profile (18/20/100/200) around the outer diameter and the chain-travel direction arrow (D)","fr":"Fig. 1 du brevet US 9 404 565 : une vue de face du plateau (10), montrant le profil de dents alterné étroit-large (18/20/100/200) sur le pourtour extérieur et la flèche de sens de déplacement de la chaîne (D)"},"teaser":{"en":"Fourteen published patents — including US 9,404,565, the 9,581,229–231 family, 11,235,827 and two design patents — covering Drop-Stop chainring profiles, the CAMO modular interface and the Resolve…","fr":"Quatorze brevets publiés — dont l'US 9,404,565, la famille 9,581,229-231, le 11,235,827 et deux brevets de dessin — couvrant les profils de plateau Drop-Stop, l'interface modulaire CAMO et la tige…"},"full":{"en":"Fourteen published patents — including US 9,404,565, the 9,581,229–231 family, 11,235,827 and two design patents — covering Drop-Stop chainring profiles, the CAMO modular interface and the Resolve dropper. All listed on Wolf Tooth's own patent page.","fr":"Quatorze brevets publiés — dont l'US 9,404,565, la famille 9,581,229-231, le 11,235,827 et deux brevets de dessin — couvrant les profils de plateau Drop-Stop, l'interface modulaire CAMO et la tige télescopique Resolve. Tous listés sur la propre page de brevets de Wolf Tooth."}},{"num":"7334846","cat":"wheel","title":{"en":"Bead Socket Technology portfolio (US 7,334,846 + 4 continuations)","fr":"Portefeuille Bead Socket Technology (US 7 334 846 + 4 continuations)"},"assignee":"Stan Koziatek / Stan's NoTubes","img":"../pictures/US7334846B2.png","alt":{"en":"Fig. 1 (prior art) and Fig. 2 of US 7,334,846 B2: the old hooked bead-lock rim profile (100–112) next to the patented rim cross-section (500–536) with its shorter sidewalls and recessed central groove (511–517)","fr":"Fig. 1 (antériorité) et Fig. 2 du brevet US 7 334 846 B2 : l'ancien profil de jante à crochet de talon (100-112) à côté de la coupe de jante brevetée (500-536), avec ses flancs plus courts et sa gorge centrale en retrait (511-517)"},"teaser":{"en":"A rim bead-seat geometry enabling low-pressure tubeless with standard tires, protected by an unbroken five-patent continuation chain rather than four separate inventions — a gap this atlas flagged in…","fr":"Une géométrie de siège de talon de jante permettant le tubeless basse pression avec des pneus standards, protégée par une chaîne ininterrompue de cinq brevets par continuation plutôt que par quatre…"},"full":{"en":"A rim bead-seat geometry enabling low-pressure tubeless with standard tires, protected by an unbroken five-patent continuation chain rather than four separate inventions — a gap this atlas flagged in its own prior text without ever closing it. All five were filed by Stanley F. Koziatek through K.G. Motors, Inc. (Horseheads, NY), Stan's NoTubes' patent-holding entity, and all five inherit their 20-year term from the same original filing (Appl. No. 10/959,743, Oct. 6, 2004) — read directly from each patent's own front page via the GitHub Actions figure tool: US 7,334,846 (granted Feb. 2008); US 8,007,053 (continuation filed Apr. 8, 2009, granted Aug. 30, 2011, adding specific rim-to-tire interface dimensions); US 8,613,485 (continuation filed Aug. 26, 2011, granted Dec. 24, 2013, expanding interior-shape and structural-integrity parameters); US 9,162,524 (continuation filed Nov. 25, 2013, granted Oct. 20, 2015, refining the interior profile and sidewall interface); and US 9,649,878 (continuation filed Sep. 21, 2015, granted Apr. 7, 2017, adding sidewall-height and dimensional-range claims). Because a continuation inherits its parent's filing date rather than its own, all five share the same 2024 expiry as the original.","fr":"Une géométrie de siège de talon de jante permettant le tubeless basse pression avec des pneus standards, protégée par une chaîne ininterrompue de cinq brevets par continuation plutôt que par quatre inventions séparées — un écart que cet atlas avait lui-même signalé dans son propre texte sans jamais le combler. Les cinq ont été déposés par Stanley F. Koziatek via K.G. Motors, Inc. (Horseheads, NY), l'entité détentrice des brevets de Stan's NoTubes, et les cinq héritent de leur durée de 20 ans du même dépôt d'origine (demande n° 10/959 743, 6 octobre 2004) — lu directement sur la première page de chaque brevet via l'outil GitHub Actions de récupération de figures : US 7 334 846 (délivré en février 2008) ; US 8 007 053 (continuation déposée le 8 avril 2009, délivrée le 30 août 2011, ajoutant des dimensions spécifiques d'interface jante-pneu) ; US 8 613 485 (continuation déposée le 26 août 2011, délivrée le 24 décembre 2013, élargissant les paramètres de forme intérieure et d'intégrité structurelle) ; US 9 162 524 (continuation déposée le 25 novembre 2013, délivrée le 20 octobre 2015, affinant le profil intérieur et l'interface des flancs) ; et US 9 649 878 (continuation déposée le 21 septembre 2015, délivrée le 7 avril 2017, ajoutant des revendications sur la hauteur des flancs et les plages dimensionnelles). Une continuation héritant de la date de dépôt de son parent plutôt que de la sienne propre, les cinq partagent la même expiration en 2024 que le brevet d'origine."}},{"num":"6257676","cat":"wheel","title":{"en":"UST tubeless system (US 6,257,676)","fr":"Système tubeless UST (US 6,257,676)"},"assignee":"Mavic / Michelin / Hutchinson","img":"../pictures/US6257676B1.png","alt":{"en":"Figs. 1–2 of US 6,257,676 B1: the assembled tubeless wheel (top) and a cross-section of the rim's central well and hooked bead flanges (24a/24b, 25a/25b) that seal the tire without an inner tube","fr":"Fig. 1-2 du brevet US 6 257 676 B1 : la roue tubeless assemblée (en haut) et une coupe du puits central de la jante et des crochets de talon (24a/24b, 25a/25b) qui assurent l'étanchéité du pneu sans chambre à air"},"teaser":{"en":"The original certified tubeless standard: a rim bed with a narrow recessed central well and oblique bead seats, a hooked bead interface, and a licensing program requiring both a certified UST rim and…","fr":"Le standard tubeless certifié original : un lit de jante avec un puits central étroit et en retrait, des sièges de talon obliques, une interface de talon crocheté, et un programme de licence exigeant…"},"full":{"en":"The original certified tubeless standard: a rim bed with a narrow recessed central well and oblique bead seats, a hooked bead interface, and a licensing program requiring both a certified UST rim and a certified UST tire. US 6,257,676, filed July 24, 1998 and granted July 10, 2001, credited to Jean-Pierre Lacombe and Jean-Pierre Mercat, with two later continuations (6,443,533; 6,641,227) extending the family into 2003.","fr":"Le standard tubeless certifié original : un lit de jante avec un puits central étroit et en retrait, des sièges de talon obliques, une interface de talon crocheté, et un programme de licence exigeant à la fois une jante UST certifiée et un pneu UST certifié. US 6,257,676, déposé le 24 juillet 1998 et délivré le 10 juillet 2001, crédité à Jean-Pierre Lacombe et Jean-Pierre Mercat, avec deux continuations ultérieures (6,443,533 ; 6,641,227) étendant la famille jusqu'en 2003."}},{"num":"6402256","cat":"wheel","title":{"en":"Mavic ISM & FORE rim manufacturing patents","fr":"Brevets de fabrication de jante Mavic ISM et FORE"},"assignee":"Mavic S.A. (Annecy, France)","img":"../pictures/US6402256B1.png","alt":{"en":"Figs. 1 and 2 of US 6,402,256 B1: the rim's cross-section (top) showing the milled-thin wall sections (18/20/21) between spoke seats, and a hoop segment (bottom) showing the full-thickness spoke-hole pads (25) left at regular intervals (29a/29b/29c) along the otherwise-thinned rim wall","fr":"Fig. 1 et 2 du brevet US 6 402 256 B1 : la coupe transversale de la jante (en haut) montrant les sections de paroi fraisées plus fines (18/20/21) entre les sièges de rayons, et un segment de cerclage (en bas) montrant les plots d'épaisseur pleine aux trous de rayon (25) laissés à intervalles réguliers (29a/29b/29c) le long de la paroi de jante autrement amincie"},"teaser":{"en":"Two related manufacturing techniques from the same era as UST, both still marketed on current Mavic wheels. ISM (Inter Spoke Milling) mills the rim wall down to a lower thickness in the material…","fr":"Deux techniques de fabrication apparentées de la même époque que l'UST, toutes deux encore commercialisées sur les roues Mavic actuelles. L'ISM (Inter Spoke Milling) fraise la paroi de la jante…"},"full":{"en":"Two related manufacturing techniques from the same era as UST, both still marketed on current Mavic wheels. ISM (Inter Spoke Milling) mills the rim wall down to a lower thickness in the material between spoke holes while leaving full thickness right at each hole — cutting rim weight 10-20% without losing strength (US 6,402,256, filed 2000, granted 2002, credited to Jean-Pierre Mercat). FORE threads a spoke tunnel into only the outer rim wall via a flow-drilled 'chimney,' rather than piercing straight through — eliminating rim tape and the spoke-hole leak path (closest documented match: US 6,216,344 and 6,224,165, filed 1997-99).","fr":"Deux techniques de fabrication apparentées de la même époque que l'UST, toutes deux encore commercialisées sur les roues Mavic actuelles. L'ISM (Inter Spoke Milling) fraise la paroi de la jante jusqu'à une épaisseur plus fine dans le matériau entre les trous de rayons tout en laissant l'épaisseur complète juste à chaque trou — réduisant le poids de la jante de 10 à 20 % sans perdre en résistance (US 6,402,256, déposé en 2000, délivré en 2002, crédité à Jean-Pierre Mercat). Le FORE perce un tunnel de rayon uniquement dans la paroi externe de la jante via une « cheminée » percée par flux, plutôt que de traverser de part en part — éliminant le fond de jante et le chemin de fuite au trou de rayon (correspondance documentée la plus proche : US 6,216,344 et 6,224,165, déposés en 1997-99)."}},{"num":"10787043","cat":"wheel","title":{"en":"CushCore tire insert + Hi-Flo valve (4 patents)","fr":"Insert de pneu CushCore + valve Hi-Flo (4 brevets)"},"assignee":"CushCore, Inc. (Adam Krefting)","img":"../pictures/US10787043B2.png","alt":{"en":"Fig. 1 of US 10,787,043: a cross-section through the tire and insert (2), showing the annular foam ring (4) seated inside the tire casing (6) against the bead (8), pre-loaded wide enough to press outward against both sidewalls","fr":"Fig. 1 du brevet US 10 787 043 : une coupe transversale du pneu et de l'insert (2), montrant l'anneau de mousse annulaire (4) logé à l'intérieur de la carcasse du pneu (6) contre le talon (8), précomprimé suffisamment large pour presser vers l'extérieur contre les deux flancs"},"teaser":{"en":"A closed-cell foam insert (US 10,787,043, plus earlier continuations 10,286,736 and 10,293,640) occupying 80-90% of a tire's inner volume, pre-loaded wider than the tire itself so it wedges constant…","fr":"Un insert en mousse à cellules fermées (US 10,787,043, plus les continuations antérieures 10,286,736 et 10,293,640) occupant 80 à 90 % du volume intérieur d'un pneu, précomprimé plus large que le pneu…"},"full":{"en":"A closed-cell foam insert (US 10,787,043, plus earlier continuations 10,286,736 and 10,293,640) occupying 80-90% of a tire's inner volume, pre-loaded wider than the tire itself so it wedges constant outward pressure against both sidewalls — stabilizing cornering, damping impacts, and resisting burping. A separate patent (10,703,149) covers the Hi-Flo valve, whose T-shaped, multi-hole air passage resists clogging from tire sealant. In 2026 CushCore added a separate patent-pending rotary tool that glides a tire onto the rim, tackling the notoriously hard installation its own inserts are known for.","fr":"Un insert en mousse à cellules fermées (US 10,787,043, plus les continuations antérieures 10,286,736 et 10,293,640) occupant 80 à 90 % du volume intérieur d'un pneu, précomprimé plus large que le pneu lui-même de sorte qu'il exerce une pression constante vers l'extérieur contre les deux flancs — stabilisant les virages, amortissant les impacts, et résistant au déjantage. Un brevet distinct (10,703,149) couvre la valve Hi-Flo, dont le passage d'air en T à trous multiples résiste à l'obstruction par le liquide préventif. En 2026, CushCore a ajouté un outil rotatif distinct, en instance de brevet, qui fait glisser un pneu sur la jante, s'attaquant au montage notoirement difficile pour lequel ses propres inserts sont connus."}},{"num":"1129585","cat":"wheel","title":{"en":"Valve for Pneumatic Tires (US 1,129,585)","fr":"Valve pour pneus pneumatiques (US 1,129,585)"},"assignee":"Joseph N. Newsom → St. Louis Pneumatic Valve Co.","img":"../pictures/US1129585A.png","alt":{"en":"Newsom 1915 pneumatic tire valve patent drawing, showing the internal stem, disk and grooved seat","fr":"Dessin de brevet de la valve de pneu pneumatique Newsom de 1915, montrant la tige interne, le disque et le siège rainuré"},"teaser":{"en":"Filed April 1913, granted February 1915. Newsom's valve moves the seal away from a simple pin-and-spring core: a disk on the end of an internal stem is drawn up against a grooved seat at the base of…","fr":"Déposé en avril 1913, délivré en février 1915. La valve de Newsom éloigne le joint d'un simple noyau à broche et ressort : un disque à l'extrémité d'une tige interne est tiré contre un siège rainuré à…"},"full":{"en":"Filed April 1913, granted February 1915. Newsom's valve moves the seal away from a simple pin-and-spring core: a disk on the end of an internal stem is drawn up against a grooved seat at the base of the housing by threading an external cap down, compressing a rubber gasket into concentric grooves for the seal — then released by backing the cap off. No springs, described in the patent's own text as deliberately 'devoid of all springs and other delicate parts.'","fr":"Déposé en avril 1913, délivré en février 1915. La valve de Newsom éloigne le joint d'un simple noyau à broche et ressort : un disque à l'extrémité d'une tige interne est tiré contre un siège rainuré à la base du boîtier en vissant un capuchon externe, comprimant un joint en caoutchouc dans des rainures concentriques pour l'étanchéité — puis relâché en desserrant le capuchon. Sans ressort, décrit dans le texte même du brevet comme délibérément « dépourvu de tout ressort et autre pièce délicate »."}},{"num":"11904644","cat":"wheel","title":{"en":"Reserve Fillmore valve (US 11,904,644 + US 12,215,796 + US 10,926,591)","fr":"Valve Reserve Fillmore (US 11 904 644 + US 12 215 796 + US 10 926 591)"},"assignee":"Reserve Wheels (Santa Cruz Bicycles, LLC)","img":"../pictures/US11904644B2.png","alt":{"en":"Reserve Fillmore valve patent drawing, showing the external valve seat and plunger","fr":"Dessin de brevet de la valve Reserve Fillmore, montrant le siège de valve externe et le plongeur"},"teaser":{"en":"A coreless Presta-diameter valve with an external valve seat: the seal sits on the outside face of the valve body rather than inside a narrow core, so airflow runs in a wide annulus around it instead…","fr":"Une valve sans noyau de diamètre Presta avec un siège de valve externe : le joint se trouve sur la face extérieure du corps de valve plutôt qu'à l'intérieur d'un noyau étroit, si bien que l'air…"},"full":{"en":"A coreless Presta-diameter valve with an external valve seat: the seal sits on the outside face of the valve body rather than inside a narrow core, so airflow runs in a wide annulus around it instead of through a pinhole. Three related filings, all assigned to Santa Cruz Bicycles: the base valve architecture (US 11,904,644, priority April 2019, granted 2024, credited to Brett Courtney and James Amaral) and a second filing adding anti-rotation features to the stem — a slot-and-tang or keyway that stops the plunger from spinning freely, which is what makes the cap's partial-unscrew-and-press 'Micro-Adjust' bleed function actually reliable (US 12,215,796, priority August 2021, granted 2025, with Nick Anderson and Jon Wood added as co-inventors). A third patent, also credited to Courtney and Amaral, covers the injection side of the same system rather than the valve itself: US 10,926,591, \"Inflation system for tubeless tires,\" filed April 17, 2020 and granted February 23, 2021, anticipated to expire April 17, 2040. It claims the pump head, sealant canister, and valve-core adapter that let a rider inject sealant straight through the valve, built around the same external-valve-seat architecture — sealant flows through the same wide annulus air does, rather than needing a narrow removable core pulled first. Released as a retail product in November 2021.","fr":"Une valve sans noyau de diamètre Presta avec un siège de valve externe : le joint se trouve sur la face extérieure du corps de valve plutôt qu'à l'intérieur d'un noyau étroit, si bien que l'air circule dans un large anneau autour de lui plutôt qu'à travers un trou d'épingle. Trois dépôts apparentés, tous cédés à Santa Cruz Bicycles : l'architecture de valve de base (US 11 904 644, priorité avril 2019, délivré en 2024, crédité à Brett Courtney et James Amaral) et un second dépôt ajoutant des caractéristiques anti-rotation à la tige — une fente et languette ou une clavette qui empêche le plongeur de tourner librement, ce qui rend la fonction de purge « Micro-Adjust » (dévissage partiel du capuchon et pression) réellement fiable (US 12 215 796, priorité août 2021, délivré en 2025, avec Nick Anderson et Jon Wood ajoutés comme co-inventeurs). Un troisième brevet, également crédité à Courtney et Amaral, couvre le volet injection du même système plutôt que la valve elle-même : US 10 926 591, « Inflation system for tubeless tires », déposé le 17 avril 2020 et délivré le 23 février 2021, dont l'expiration est anticipée au 17 avril 2040. Il revendique la tête de pompe, la cartouche de liquide préventif et l'adaptateur de noyau de valve qui permettent à un cycliste d'injecter du liquide préventif directement par la valve, construits autour de la même architecture à siège de valve externe — le liquide traverse le même large anneau que l'air, plutôt que de nécessiter le retrait préalable d'un noyau étroit amovible. Sortie en tant que produit de détail en novembre 2021."}},{"num":"11179979","cat":"wheel","title":{"en":"milKit tubeless valve + Booster (US 11,179,979 + 11,136,006)","fr":"Valve tubeless milKit + Booster (US 11,179,979 + 11,136,006)"},"assignee":"Sport Components AG (Switzerland)","img":"../pictures/US11179979B2.png","alt":{"en":"FIG. 6: Tubeless valve cross-section showing sealed membrane and one-way flow path","fr":"FIG. 6 : Coupe transversale de la soupape tubeless montrant la membrane étanche et le trajet de circulation unidirectionnelle"},"teaser":{"en":"Two related filings from the Swiss company behind milKit. US 11,179,979 (‘Valve for tubeless tires’) covers a valve with an integrated one-way membrane that stays sealed when the core is removed —…","fr":"Deux dépôts apparentés de l'entreprise suisse derrière milKit. L'US 11,179,979 (« Valve for tubeless tires ») couvre une valve avec une membrane unidirectionnelle intégrée qui reste étanche quand le…"},"full":{"en":"Two related filings from the Swiss company behind milKit. US 11,179,979 (‘Valve for tubeless tires’) covers a valve with an integrated one-way membrane that stays sealed when the core is removed — letting a syringe be pushed through to measure or top up sealant without breaking the tire bead or losing air. US 11,136,006 (‘Device for inflating a tire’) covers the Booster, a sealed bottle that stores compressed air from a floor pump and dumps it in one burst to seat a stubborn tubeless bead.","fr":"Deux dépôts apparentés de l'entreprise suisse derrière milKit. L'US 11,179,979 (« Valve for tubeless tires ») couvre une valve avec une membrane unidirectionnelle intégrée qui reste étanche quand le noyau est retiré — permettant de pousser une seringue à travers pour mesurer ou compléter le liquide préventif sans rompre le talon du pneu ni perdre d'air. L'US 11,136,006 (« Device for inflating a tire ») couvre le Booster, une bouteille scellée qui stocke l'air comprimé d'une pompe à pied et le libère en une seule fois pour asseoir un talon tubeless récalcitrant."}},{"num":"11719351","cat":"wheel","title":{"en":"Clik Valve pneumatic system (US 11,719,351)","fr":"Système pneumatique Clik Valve (US 11,719,351)"},"assignee":"John Quintana → Clik Corporation","img":"../pictures/US11719351B2.png","alt":{"en":"Fig. 1A of US 11,719,351: a cross-section through the valve body (130), showing the spring-loaded retaining pins (134, 136, 141, 142) that grip the pump head, and a second cross-section of the stem/core assembly (110-125) below it","fr":"Fig. 1A du brevet US 11 719 351 : une coupe du corps de valve (130), montrant les goupilles de retenue à ressort (134, 136, 141, 142) qui saisissent la tête de pompe, et une seconde coupe de l’ensemble tige/noyau (110-125) en dessous"},"teaser":{"en":"A clean-sheet replacement for Presta, Schrader and Dunlop rather than an improvement on any of them. A ball-bearing collar and elastic sleeve let the pump head push straight on and pull straight off —…","fr":"Un remplacement conçu de zéro pour Presta, Schrader et Dunlop plutôt qu'une amélioration de l'un d'eux. Un collier à roulement à billes et un manchon élastique permettent à la tête de pompe de se…"},"full":{"en":"A clean-sheet replacement for Presta, Schrader and Dunlop rather than an improvement on any of them. A ball-bearing collar and elastic sleeve let the pump head push straight on and pull straight off — no lever, no chuck, no threaded collar — while a miniature ball check valve seals the stem. Because the seal is made against the inflation pin itself rather than around the outside of the stem, blowback force on the pump head is small enough that no locking mechanism is needed; the patent claims one-handed, two-finger operation. Filed January 2021 with 2020 priority, granted August 2023, expiring 2041. Assignment moved from Quintana personally to SmartPhysX Corporation in 2023, which was renamed Clik Corporation in May 2024.","fr":"Un remplacement conçu de zéro pour Presta, Schrader et Dunlop plutôt qu'une amélioration de l'un d'eux. Un collier à roulement à billes et un manchon élastique permettent à la tête de pompe de se pousser et de se retirer tout droit — sans levier, sans mandrin, sans collier fileté — tandis qu'un mini clapet à bille scelle la tige. Comme le joint se fait contre la broche de gonflage elle-même plutôt qu'autour de l'extérieur de la tige, la force de retour sur la tête de pompe est assez faible pour qu'aucun mécanisme de verrouillage ne soit nécessaire ; le brevet revendique une utilisation à une main, à deux doigts. Déposé en janvier 2021 avec priorité 2020, délivré en août 2023, expirant en 2041. La cession est passée de Quintana personnellement à SmartPhysX Corporation en 2023, renommée Clik Corporation en mai 2024."}},{"num":"GB2615585","cat":"wheel","title":{"en":"Peaty's Holeshot CO2 inflator valve (GB 2,615,585)","fr":"Valve du gonfleur CO2 Peaty's Holeshot (GB 2 615 585)"},"assignee":"Peaty's Products","img":"../pictures/GB2615585A.png","alt":{"en":"Fig. 2 of GB 2,615,585: cross-section A-A of the valve, showing the two sliding body parts (14/16) compressed by a spring (60/62) around a central stem (26/54) with two O-ring seals (28/38) sealing the egress aperture until the parts are pushed together","fr":"Fig. 2 du brevet GB 2 615 585 : coupe A-A de la valve, montrant les deux parties coulissantes du corps (14/16) comprimées par un ressort (60/62) autour d'une tige centrale (26/54) avec deux joints toriques (28/38) scellant l'ouverture d'échappement jusqu'à ce que les parties soient poussées l'une vers l'autre"},"teaser":{"en":"GB 2,615,585, granted June 11, 2025 to Peatys Ltd (inventor Morgan Bryn), covers the valve inside Peaty's Holeshot CO2 tyre inflator: two body parts that slide against a spring, with an egress…","fr":"Le brevet GB 2 615 585, délivré le 11 juin 2025 à Peatys Ltd (inventeur Morgan Bryn), couvre la valve du gonfleur CO2 Holeshot de Peaty's : deux parties du corps coulissant contre un ressort, avec une…"},"full":{"en":"GB 2,615,585, granted June 11, 2025 to Peatys Ltd (inventor Morgan Bryn), covers the valve inside Peaty's Holeshot CO2 tyre inflator: two body parts that slide against a spring, with an egress aperture on the connecting stem that sits between a pair of O-ring seals when closed and clears them once the parts are pushed together, opening a fluid path from the compressed-gas cylinder into the tyre's valve stem. Filed February 14, 2022. This is a separate product and a separate filing from the Holeshot Fast Flow tubeless valve entry above — the two share a brand and a name prefix but not a mechanism.","fr":"Le brevet GB 2 615 585, délivré le 11 juin 2025 à Peatys Ltd (inventeur Morgan Bryn), couvre la valve du gonfleur CO2 Holeshot de Peaty's : deux parties du corps coulissant contre un ressort, avec une ouverture d'échappement sur la tige de raccordement qui se situe entre une paire de joints toriques à l'état fermé et les dégage une fois les parties poussées l'une vers l'autre, ouvrant un passage de fluide depuis la cartouche de gaz comprimé jusqu'à la tige de valve du pneu. Déposé le 14 février 2022. Il s'agit d'un produit distinct et d'un dépôt distinct de la valve tubeless Holeshot Fast Flow ci-dessus — les deux partagent une marque et un préfixe de nom mais pas un mécanisme."}},{"num":"11794517","cat":"wheel","title":{"en":"Cam-actuated thru-axle (US 11,794,517)","fr":"Axe traversant à came (US 11 794 517)"},"assignee":"Fox Factory","img":"../pictures/US11794517B2.png","alt":{"en":"Fig. 1A of US 11,794,517: an isometric view of the fork's lower legs, labeled '1', with the cam-actuated axle shaft (2) shown running through the dropouts at the bottom of each leg","fr":"Fig. 1A du brevet US 11 794 517 : une vue isométrique des fourreaux inférieurs de la fourche, repérés « 1 », montrant l'axe à came (2) traversant les pattes de fourche au bas de chaque fourreau"},"teaser":{"en":"An axle assembly with a lever-actuated cam that clamps the wheel between the dropouts without threading — the mechanism family behind Fox's thru-axle hardware. Read directly off this patent's own…","fr":"Un ensemble d'essieu à came actionnée par un levier qui serre la roue entre les pattes de fourche sans filetage — la famille de mécanismes derrière la quincaillerie d'axe traversant de Fox. Lu…"},"full":{"en":"An axle assembly with a lever-actuated cam that clamps the wheel between the dropouts without threading — the mechanism family behind Fox's thru-axle hardware. Read directly off this patent's own front page: the family's earliest non-provisional filing is application Ser. No. 12/470,432, filed May 21, 2009 (now Pat. No. 8,226,172) — the May 21, 2008 date some listings show is only provisional application No. 61/054,852, which doesn't start the 20-year clock. Fox has re-filed continuations on the same core mechanism across at least four granted numbers since (8,974,009 → 9,796,446 → 10,611,426 → 11,794,517) over 14 years.","fr":"Un ensemble d'essieu à came actionnée par un levier qui serre la roue entre les pattes de fourche sans filetage — la famille de mécanismes derrière la quincaillerie d'axe traversant de Fox. Lu directement sur la première page du brevet lui-même : le premier dépôt non provisoire de cette famille est la demande n° de série 12/470 432, déposée le 21 mai 2009 (délivrée sous le n° 8 226 172) — la date du 21 mai 2008 indiquée par certaines listes n'est que la demande provisoire n° 61/054 852, qui ne déclenche pas le délai de 20 ans. Fox a redéposé des continuations sur le même mécanisme central sur au moins quatre numéros délivrés depuis (8 974 009 → 9 796 446 → 10 611 426 → 11 794 517) sur 14 ans."}},{"num":"5964332","cat":"wheel","title":{"en":"RingDrive hub engagement (US 5,964,332)","fr":"Engagement de moyeu RingDrive (US 5,964,332)"},"assignee":"Christopher D. King / Chris King","img":"../pictures/US5964332A.png","alt":{"en":"Chris King RingDrive patent drawing, US 5,964,332, showing the helically-splined face-gear hub engagement","fr":"Dessin du brevet RingDrive de Chris King, US 5 964 332, montrant l'engagement de moyeu à couronnes dentées hélicoïdales"},"teaser":{"en":"Helically-splined face gears giving 72-point simultaneous engagement and the signature 'angry bee' sound — filed 1997, granted 1999, and cited by name in competitors' later filings.","fr":"Des couronnes dentées à cannelures hélicoïdales offrant un engagement simultané à 72 points et le son signature « d'abeille en colère » — déposé en 1997, délivré en 1999, et cité nommément dans des…"},"full":{"en":"Helically-splined face gears giving 72-point simultaneous engagement and the signature 'angry bee' sound — filed 1997, granted 1999, and cited by name in competitors' later filings.","fr":"Des couronnes dentées à cannelures hélicoïdales offrant un engagement simultané à 72 points et le son signature « d'abeille en colère » — déposé en
