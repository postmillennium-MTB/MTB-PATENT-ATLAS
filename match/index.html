ts de cette époque duraient 17 ans à compter de la délivrance plutôt que 20 ans à compter du dépôt, la protection s'est donc éteinte en 1956."}},{"num":"9404552","cat":"fork","title":{"en":"Three-way damping cartridge (US 9,404,552)","fr":"Cartouche d'amortissement à trois voies (US 9,404,552)"},"assignee":"Stefan Sack & Andreas Felsl / B-LABS AG (Switzerland) → Fox Factory","img":"../pictures/US9404552B2.png","alt":{"en":"FIG. 1: Three-way damping cartridge (1) in side view, with its B-B cross-section above, showing the piston rod (12) and the cartridge sections (2, 4)","fr":"FIG. 1 : Cartouche d'amortissement à trois voies (1) en vue latérale, avec sa coupe B-B au-dessus, montrant la tige de piston (12) et les parties de la cartouche (2, 4)"},"teaser":{"en":"A suspension-fork damping cartridge with a three-way compression circuit — separate low-, mid-, and high-speed flow paths controlled by a shim-based mid-speed ring — plus a tube-bladder compensating…","fr":"Une cartouche d'amortissement de fourche de suspension à circuit de compression à trois voies — des trajets d'écoulement basse, moyenne et haute vitesse séparés, contrôlés par une bague à shims pour…"},"full":{"en":"A suspension-fork damping cartridge with a three-way compression circuit — separate low-, mid-, and high-speed flow paths controlled by a shim-based mid-speed ring — plus a tube-bladder compensating volume in place of an internal floating piston. Filed by Stefan Sack and Andreas Felsl through their Swiss company B-LABS AG in 2013, several years before Sack co-founded BikeYoke. Fox Factory acquired the patent from B-LABS AG in 2017 and still holds it.","fr":"Une cartouche d'amortissement de fourche de suspension à circuit de compression à trois voies — des trajets d'écoulement basse, moyenne et haute vitesse séparés, contrôlés par une bague à shims pour la vitesse moyenne — plus un volume de compensation à vessie tubulaire remplaçant un piston flottant interne. Déposée par Stefan Sack et Andreas Felsl via leur société suisse B-LABS AG en 2013, plusieurs années avant que Sack ne cofonde BikeYoke. Fox Factory a racheté le brevet à B-LABS AG en 2017 et le détient toujours."}},{"num":"4971344","cat":"fork","title":{"en":"RockShox RS-1 suspension fork (US 4,971,344)","fr":"Fourche suspendue RockShox RS-1 (US 4 971 344)"},"assignee":"Paul H. Turner / RockShox, Inc.","img":"../pictures/US4971344A.png","alt":{"en":"Fig. 1 of US 4,971,344, granted Nov. 20, 1990: a full bicycle side view with the telescoping suspension fork (10) at the front, built around otherwise-standard frame, wheel, and drivetrain components","fr":"Fig. 1 du brevet US 4 971 344, délivré le 20 novembre 1990 : une vue de côté complète d'un vélo avec la fourche suspendue télescopique (10) à l'avant, construite autour de composants de cadre, de roues et de transmission par ailleurs standards"},"teaser":{"en":"US 4,971,344, \"Bicycle with a front fork wheel suspension,\" inventor Paul H. Turner, assignee RockShox, Inc. — confirmed directly from the drawing sheet: filed 1989, granted Nov. 20, 1990. The claims…","fr":"US 4 971 344, « Bicycle with a front fork wheel suspension », inventeur Paul H. Turner, cessionnaire RockShox, Inc. — confirmé directement à partir de la planche de dessin : déposé en 1989, délivré le…"},"full":{"en":"US 4,971,344, \"Bicycle with a front fork wheel suspension,\" inventor Paul H. Turner, assignee RockShox, Inc. — confirmed directly from the drawing sheet: filed 1989, granted Nov. 20, 1990. The claims describe two telescoping tubes with a fluid valve metering flow between them on compression and extension, turning bump energy into viscous heat loss without absorbing pedaling energy, while keeping the fork compatible with standard wheel, brake, and steering components. Greg Herbold won the first UCI downhill world title on it in 1990. Filed before the post-GATT rule took effect, so `exp` follows the pre-1995 grant+17 formula rather than filing+20.","fr":"US 4 971 344, « Bicycle with a front fork wheel suspension », inventeur Paul H. Turner, cessionnaire RockShox, Inc. — confirmé directement à partir de la planche de dessin : déposé en 1989, délivré le 20 novembre 1990. Les revendications décrivent deux tubes télescopiques avec une valve de fluide dosant le débit entre eux en compression et en extension, transformant l'énergie des chocs en perte de chaleur visqueuse sans absorber l'énergie de pédalage, tout en gardant la fourche compatible avec des composants de roue, de frein et de direction standards. Greg Herbold a remporté le premier titre mondial de descente UCI dessus en 1990. Déposé avant l'entrée en vigueur de la règle post-GATT, donc `exp` suit la formule pré-1995 délivrance+17 plutôt que dépôt+20."}},{"num":"5509674","cat":"fork","title":{"en":"Cannondale HeadShok / Lefty (US 5,308,099 + 5,509,674)","fr":"Cannondale HeadShok / Lefty (US 5,308,099 + 5,509,674)"},"assignee":"Cannondale Corporation","img":"../pictures/US5308099A.png","alt":{"en":"Figs. 2 and 3 of US 5,308,099: two cross-sections through the head-tube suspension unit, showing the telescoping steerer tube (10) riding on a stack of coil springs (16) between the top adjustment knob (26/27) and the fork crown (6)","fr":"Fig. 2 et 3 du brevet US 5 308 099 : deux coupes de l'unité de suspension du tube de direction, montrant le tube de direction télescopique (10) reposant sur un empilement de ressorts hélicoïdaux (16) entre le bouton de réglage supérieur (26/27) et la couronne de fourche (6)"},"teaser":{"en":"Needle-bearing telescoping steerer suspension, in-head-tube, evolving into the single-sided Lefty with its square-race bearing system. The core 'Bicycle suspension system' filing traces to a September…","fr":"Une suspension de pivot de direction télescopique à roulements à aiguilles, intégrée dans le tube de direction, ayant évolué vers la Lefty à fourreau unique avec son système de roulement à section…"},"full":{"en":"Needle-bearing telescoping steerer suspension, in-head-tube, evolving into the single-sided Lefty with its square-race bearing system. The core 'Bicycle suspension system' filing traces to a September 1990 application that issued as US 5,308,099, with US 5,509,674 — same title, same assignee — granted in 1996 as a divisional carrying the same priority date. HeadShok reached the public in 1992, two years into that filing.","fr":"Une suspension de pivot de direction télescopique à roulements à aiguilles, intégrée dans le tube de direction, ayant évolué vers la Lefty à fourreau unique avec son système de roulement à section carrée. Le dépôt central « Bicycle suspension system » remonte à une demande de septembre 1990 délivrée sous le numéro US 5,308,099, avec l'US 5,509,674 — même titre, même cessionnaire — délivré en 1996 comme division portant la même date de priorité. La HeadShok a atteint le public en 1992, deux ans après ce dépôt."}},{"num":"6267400","cat":"fork","title":{"en":"Brain inertia-valve damper (US 6,267,400)","fr":"Amortisseur à valve d'inertie Brain (US 6 267 400)"},"assignee":"Michael McAndrews / Specialized Bicycle Components, Inc.","img":"../pictures/US6267400B1.png","alt":{"en":"Fig. 3 of US 6,267,400: a cross-section of the damper body running from the seat-tube mount (318) down through the main chamber (314) to the wheel-member mount (342), with the inertial-valve hardware (304-340) that opens the fluid path between chambers only under a terrain-induced hit","fr":"Fig. 3 du brevet US 6 267 400 : une coupe du corps de l'amortisseur, de la fixation au tube de selle (318) jusqu'à la fixation côté roue (342) en passant par la chambre principale (314), avec le mécanisme de valve d'inertie (304-340) qui n'ouvre le passage de fluide entre les chambres que sous un choc provenant du terrain"},"teaser":{"en":"US 6,267,400 B1, \"Bicycle damping enhancement system,\" filed April 6, 1999 by Michael McAndrews of Santa Cruz, California, granted July 31, 2001 to Specialized Bicycle Components, Inc. of Morgan Hill,…","fr":"US 6 267 400 B1, « Bicycle damping enhancement system », déposé le 6 avril 1999 par Michael McAndrews, de Santa Cruz (Californie), délivré le 31 juillet 2001 à Specialized Bicycle Components, Inc. de…"},"full":{"en":"US 6,267,400 B1, \"Bicycle damping enhancement system,\" filed April 6, 1999 by Michael McAndrews of Santa Cruz, California, granted July 31, 2001 to Specialized Bicycle Components, Inc. of Morgan Hill, California. A brass inertial mass sits inside a second fluid chamber connected to the main damping chamber; a slow, rider-induced push (pedaling) doesn't move the mass enough to open the path between chambers, so the shock stays firm, but a sharp, terrain-induced hit throws the mass clear and lets fluid flow, opening the damper instantly — no electronics, no lever. Post-GATT filing, so the term ran 20 years from filing, to 2019.","fr":"US 6 267 400 B1, « Bicycle damping enhancement system », déposé le 6 avril 1999 par Michael McAndrews, de Santa Cruz (Californie), délivré le 31 juillet 2001 à Specialized Bicycle Components, Inc. de Morgan Hill (Californie). Une masse d'inertie en laiton est logée dans une seconde chambre de fluide reliée à la chambre d'amortissement principale ; une poussée lente d'origine pédalage ne déplace pas assez la masse pour ouvrir le passage entre les chambres, si bien que l'amortisseur reste ferme, mais un choc brusque venant du terrain projette la masse et laisse le fluide circuler, ouvrant l'amortisseur instantanément — sans électronique, sans levier. Dépôt postérieur au GATT, la durée courait donc 20 ans à compter du dépôt, jusqu'en 2019."}},{"num":"9746049","cat":"fork","title":{"en":"Inertia-valve damper + adjustable pressure-relief (US 9,746,049)","fr":"Amortisseur à valve d'inertie et purge de pression réglable (US 9 746 049)"},"assignee":"Fox Factory","img":"../pictures/US9746049B2.png","alt":{"en":"Fig. 1 of US 9,746,049: a cross-section through the whole damper assembly (10), running from the top cap (232) down the shaft (220) through the piston/valve region (250-268) to the base (432)","fr":"Fig. 1 du brevet US 9 746 049 : une coupe de l'ensemble amortisseur complet (10), du bouchon supérieur (232) le long de la tige (220) jusqu'à la région du piston/de la valve (250-268) puis la base (432)"},"teaser":{"en":"Fox's own terrain-activated damper: an inertia valve that stays firm until a bump physically opens it, paired with a tool-free, rider-adjustable knob that sets the pressure-relief threshold. Named…","fr":"Le propre amortisseur à activation par le terrain de Fox : une valve d'inertie qui reste ferme jusqu'à ce qu'une bosse l'ouvre physiquement, associée à une molette réglable par le pilote, sans outil,…"},"full":{"en":"Fox's own terrain-activated damper: an inertia valve that stays firm until a bump physically opens it, paired with a tool-free, rider-adjustable knob that sets the pressure-relief threshold. Named inventors are William M. Becker, Robert C. Fox and Dennis K. Wootten, per this patent's own front page. Granted in 2017, but the family's priority traces to an April 2006 filing, with Fox re-filing the same core invention across at least five granted numbers (7,699,146 → 8,607,942 → 9,261,163 → 9,746,049 → 10,359,092).","fr":"Le propre amortisseur à activation par le terrain de Fox : une valve d'inertie qui reste ferme jusqu'à ce qu'une bosse l'ouvre physiquement, associée à une molette réglable par le pilote, sans outil, fixant le seuil de purge de pression. Les inventeurs nommés sont William M. Becker, Robert C. Fox et Dennis K. Wootten, selon la première page du brevet lui-même. Délivré en 2017, mais la priorité de cette famille remonte à un dépôt d'avril 2006, Fox ayant redéposé la même invention centrale sur au moins cinq numéros délivrés (7 699 146 → 8 607 942 → 9 261 163 → 9 746 049 → 10 359 092)."}},{"num":"7163222","cat":"fork","title":{"en":"Fox fork architecture portfolio","fr":"Portefeuille d'architecture de fourche Fox"},"assignee":"Fox Factory","img":"../pictures/US7163222B2.png","alt":{"en":"FIG. 3: Fork damper cartridge showing internal damping architecture and oil pathways","fr":"FIG. 3 : Cartouche d'amortisseur de fourche montrant l'architecture d'amortissement interne et les voies de circulation de l'huile"},"teaser":{"en":"The eight-patent foundation listed on every premium Fox fork — damper internals, air-spring architecture and chassis design spanning filings from the mid-2000s through the 2010s. Numbers published on…","fr":"La base de huit brevets listée sur chaque fourche Fox haut de gamme — mécanique interne d'amortisseur, architecture de ressort pneumatique et conception de fourreaux, couvrant des dépôts du milieu des…"},"full":{"en":"The eight-patent foundation listed on every premium Fox fork — damper internals, air-spring architecture and chassis design spanning filings from the mid-2000s through the 2010s. Numbers published on Fox's own virtual patent marking page (35 U.S.C. § 287).","fr":"La base de huit brevets listée sur chaque fourche Fox haut de gamme — mécanique interne d'amortisseur, architecture de ressort pneumatique et conception de fourreaux, couvrant des dépôts du milieu des années 2000 aux années 2010. Numéros publiés sur la propre page de marquage virtuel de brevets de Fox (35 U.S.C. § 287)."}},{"num":"6135434","cat":"fork","title":{"en":"Fox Float self-equalizing air spring (US 6,135,434)","fr":"Ressort pneumatique autoéquilibré Fox Float (US 6 135 434)"},"assignee":"John Marking / Fox Factory, Inc.","img":"../pictures/US6135434A.png","alt":{"en":"Figs. 3–5 of US 6,135,434: the air shock in section at three points in its stroke — the air cylinder (12A) slides over the damper body (14A); seals split the air into a positive chamber (62) and a small negative chamber (64), and the bypass channel (66) formed in the cylinder wall lets the two equalize when the damper body's seal passes over it","fr":"Fig. 3 à 5 du brevet US 6 135 434 : l'amortisseur pneumatique en coupe à trois points de sa course — le cylindre d'air (12A) coulisse sur le corps d'amortisseur (14A) ; des joints divisent l'air en une chambre positive (62) et une petite chambre négative (64), et le canal de dérivation (66) formé dans la paroi du cylindre permet aux deux de s'équilibrer lorsque le joint du corps d'amortisseur passe dessus"},"teaser":{"en":"US 6,135,434, \"Shock absorber with positive and negative gas spring chambers,\" inventor John Marking of El Cajon, California, assigned to Fox Factory: filed January 15, 1999 on a February 3, 1998…","fr":"US 6 135 434, « Shock absorber with positive and negative gas spring chambers », inventeur John Marking d'El Cajon (Californie), cédé à Fox Factory : déposé le 15 janvier 1999 sur la base d'une…"},"full":{"en":"US 6,135,434, \"Shock absorber with positive and negative gas spring chambers,\" inventor John Marking of El Cajon, California, assigned to Fox Factory: filed January 15, 1999 on a February 3, 1998 provisional, granted October 24, 2000. The damper body slides inside an air cylinder, and seals divide the air into a positive chamber that holds the bike up and a smaller negative chamber that pulls against it near full extension. A bypass channel formed in the cylinder wall lets air flow past the damper-body seal whenever the seal passes over it, so the two chambers equalize without a second valve. Expired in 2019, 20 years after filing.","fr":"US 6 135 434, « Shock absorber with positive and negative gas spring chambers », inventeur John Marking d'El Cajon (Californie), cédé à Fox Factory : déposé le 15 janvier 1999 sur la base d'une demande provisoire du 3 février 1998, délivré le 24 octobre 2000. Le corps d'amortisseur coulisse dans un cylindre d'air, et des joints divisent l'air en une chambre positive qui soutient le vélo et une chambre négative plus petite qui tire en sens inverse près de l'extension complète. Un canal de dérivation formé dans la paroi du cylindre laisse passer l'air autour du joint du corps d'amortisseur chaque fois que ce joint passe dessus, si bien que les deux chambres s'équilibrent sans seconde valve. Expiré en 2019, 20 ans après le dépôt."}},{"num":"20220242191","cat":"fork","title":{"en":"Multiple gas volumes / bottomless tokens (US 2022/0242191)","fr":"Volumes de gaz multiples / jetons de fond (US 2022/0242191)"},"assignee":"Fox Factory","img":"../pictures/US20220242191A1.png","alt":{"en":"Fig. 2A of US 2022/0242191: a cross-section through the top of the fork leg's air-spring assembly (200), showing the main chamber body (202) and the adjacent volume-adjustment piece (210) separated by seals (203, 212, 213, 215) — the hardware equivalent of adding or removing a volume spacer","fr":"Fig. 2A du brevet US 2022/0242191 : une coupe du haut de l'ensemble ressort pneumatique du fourreau de fourche (200), montrant le corps de la chambre principale (202) et la pièce de réglage de volume adjacente (210) séparées par des joints (203, 212, 213, 215) — l'équivalent matériel de l'ajout ou du retrait d'une entretoise de volume"},"teaser":{"en":"The Fox Factory patent family behind volume-adjustable air springs — the 'bottomless tokens'/volume-spacer concept now essentially universal across the air-sprung fork and shock industry. Named…","fr":"La famille de brevets de Fox Factory à l'origine des ressorts pneumatiques à volume réglable — le concept de « jetons de fond »/entretoise de volume aujourd'hui pratiquement universel dans l'industrie…"},"full":{"en":"The Fox Factory patent family behind volume-adjustable air springs — the 'bottomless tokens'/volume-spacer concept now essentially universal across the air-sprung fork and shock industry. Named inventors on this specific application are Mario Galasso, Joshua Benjamin Yablon, Andrew Laird, William M. Becker, Dennis K. Wootten and Joseph Franklin, per the patent's own front page, which also spells out the full continuation chain: this 2022-filed application is a division of application Ser. No. 16/453,474 (filed Jun. 26, 2019, now Pat. No. 11,312,203), itself a continuation running back through Pat. Nos. 10,384,509, 9,855,812 and 9,156,325 to application Ser. No. 12/407,610, filed Mar. 19, 2009 (now Pat. No. 8,894,050) — the earliest non-provisional filing in the chain, and the date this atlas's 'exp' is computed from. The Mar. 19, 2008 date some listings show is only provisional application No. 61/038,015, which doesn't start the 20-year clock. This specific division is still pending; its immediate parent already issued as US 11,312,203.","fr":"La famille de brevets de Fox Factory à l'origine des ressorts pneumatiques à volume réglable — le concept de « jetons de fond »/entretoise de volume aujourd'hui pratiquement universel dans l'industrie des fourches et amortisseurs à ressort pneumatique. Les inventeurs nommés sur cette demande précise sont Mario Galasso, Joshua Benjamin Yablon, Andrew Laird, William M. Becker, Dennis K. Wootten et Joseph Franklin, selon la première page du brevet lui-même, qui détaille aussi la chaîne complète de continuations : cette demande déposée en 2022 est une division de la demande n° de série 16/453 474 (déposée le 26 juin 2019, délivrée sous le n° 11 312 203), elle-même une continuation remontant, via les brevets n° 10 384 509, 9 855 812 et 9 156 325, jusqu'à la demande n° de série 12/407 610, déposée le 19 mars 2009 (délivrée sous le n° 8 894 050) — le premier dépôt non provisoire de la chaîne, et la date à partir de laquelle le champ « exp » de cet atlas est calculé. La date du 19 mars 2008 indiquée par certaines listes n'est que la demande provisoire n° 61/038 015, qui ne déclenche pas le délai de 20 ans. Cette division précise est encore en instance ; son parent immédiat a déjà été délivré sous le n° US 11 312 203."}},{"num":"12442429","cat":"fork","title":{"en":"Vorsprung high-dynamic-range air spring (US 12,442,429)","fr":"Ressort pneumatique à grande plage dynamique Vorsprung (US 12 442 429)"},"assignee":"Vorsprung Technologies Ltd (British Columbia, Canada)","img":"../pictures/US20220373056A1.png","alt":{"en":"Fig. 1G of US 2022/0373056: spring force plotted against displacement as a percentage of travel, split into three zones (190, 191, 192); one curve (195) rises in a straight line and turns sharply upward near the end of travel (196), while a second curve (197) climbs steeply at first (194), flattens mid-stroke and ramps up at the end","fr":"Fig. 1G du US 2022/0373056 : la force du ressort en fonction du déplacement en pourcentage de la course, divisée en trois zones (190, 191, 192) ; une courbe (195) monte en ligne droite puis se redresse brusquement près de la fin de course (196), tandis qu'une seconde courbe (197) monte fortement au départ (194), s'aplatit en milieu de course et remonte en fin de course"},"teaser":{"en":"An air spring with two negative chambers. A separator connects the secondary negative chamber to the primary one for the first part of the stroke, then cuts it off for the rest. With the extra…","fr":"Un ressort pneumatique à deux chambres négatives. Un séparateur relie la chambre négative secondaire à la chambre principale sur la première partie de la course, puis l'isole pour le reste. Tant que…"},"full":{"en":"An air spring with two negative chambers. A separator connects the secondary negative chamber to the primary one for the first part of the stroke, then cuts it off for the rest. With the extra negative volume in play, the spring force rises in a near-straight, coil-like line; once it is sealed off, the air spring's usual end-stroke ramp takes over. Published in 2022 as US 2022/0373056 and granted October 14, 2025; the filing date is unconfirmed, so the 2042 expiry is an estimate.","fr":"Un ressort pneumatique à deux chambres négatives. Un séparateur relie la chambre négative secondaire à la chambre principale sur la première partie de la course, puis l'isole pour le reste. Tant que ce volume négatif supplémentaire est actif, la force du ressort augmente de façon quasi linéaire, comme un ressort hélicoïdal ; une fois isolé, la montée progressive habituelle d'un ressort pneumatique en fin de course prend le relais. Publié en 2022 sous US 2022/0373056 et délivré le 14 octobre 2025 ; la date de dépôt n'est pas confirmée, l'expiration en 2042 est donc une estimation."}},{"num":"9033122","cat":"fork","title":{"en":"Live Valve electronic suspension","fr":"Suspension électronique Live Valve"},"assignee":"Fox Factory","img":"../pictures/US9033122B2.png","alt":{"en":"Fig. 1A/1B of US 9,033,122: a cutaway of the damper-side fork leg (180/181) showing the internal shim stack and piston assembly (105/106/108/115/136), alongside the damper shaft in isolation with the electronically actuated solenoid valve (20/40/45) circled at its top","fr":"Fig. 1A/1B du brevet US 9 033 122 : une coupe du fourreau côté amortisseur (180/181) montrant la pile de rondelles et l'ensemble piston internes (105/106/108/115/136), aux côtés de l'axe de l'amortisseur isolé avec la valve à solénoïde à actionnement électronique (20/40/45) entourée à son sommet"},"teaser":{"en":"Accelerometer-driven solenoid damping that opens and firms the suspension in milliseconds — seven patents covering sensors, control logic and valve hardware, all listed on Fox's virtual patent marking…","fr":"Un amortissement par solénoïde piloté par accéléromètre qui ouvre et ferme la suspension en quelques millisecondes — sept brevets couvrant les capteurs, la logique de contrôle et le matériel de valve,…"},"full":{"en":"Accelerometer-driven solenoid damping that opens and firms the suspension in milliseconds — seven patents covering sensors, control logic and valve hardware, all listed on Fox's virtual patent marking page.","fr":"Un amortissement par solénoïde piloté par accéléromètre qui ouvre et ferme la suspension en quelques millisecondes — sept brevets couvrant les capteurs, la logique de contrôle et le matériel de valve, tous listés sur la page de marquage virtuel de brevets de Fox."}},{"num":"20210300140","cat":"fork","title":{"en":"Integrated active valve assembly (US 2021/0300140)","fr":"Ensemble de valve active intégrée (US 2021/0300140)"},"assignee":"Fox Factory","img":"../pictures/US20210300140A1.png","alt":{"en":"Fig. 1A of US 2021/0300140: the whole bicycle (50), with the rear shock's linkage (26) at the rear wheel (30), a suspension controller module (38) mounted near the seat tube, and a wire (33) running down to a second valve near the front axle (34)","fr":"Fig. 1A du brevet US 2021/0300140 : le vélo complet (50), avec la biellette de l'amortisseur arrière (26) à la roue arrière (30), un module de contrôleur de suspension (38) monté près du tube de selle, et un fil (33) descendant vers une seconde valve près de l'axe avant (34)"},"teaser":{"en":"A newer Live Valve filing from two of the named inventors on the 2015-era Live Valve portfolio directly above (Everet Owen Ericksen and William M. Becker, per this application's own front page) — this…","fr":"Un dépôt Live Valve plus récent, de deux des inventeurs nommés sur le portefeuille Live Valve de l'ère 2015 juste au-dessus (Everet Owen Ericksen et William M. Becker, selon la première page de cette…"},"full":{"en":"A newer Live Valve filing from two of the named inventors on the 2015-era Live Valve portfolio directly above (Everet Owen Ericksen and William M. Becker, per this application's own front page) — this one claims the physical packaging: a suspension controller module wired directly to an active shock assembly as one integrated unit, rather than a separate control box. Filed March 2021 (provisional filed March 2020), published September 2021, still pending as of this pass.","fr":"Un dépôt Live Valve plus récent, de deux des inventeurs nommés sur le portefeuille Live Valve de l'ère 2015 juste au-dessus (Everet Owen Ericksen et William M. Becker, selon la première page de cette demande) — celui-ci revendique l'intégration physique : un module de contrôleur de suspension câblé directement à un ensemble d'amortisseur actif en une seule unité intégrée, plutôt qu'un boîtier de commande séparé. Déposé en mars 2021 (demande provisoire déposée en mars 2020), publié en septembre 2021, toujours en instance à ce stade."}},{"num":"12253139","cat":"susp","title":{"en":"Dual Live Valve — independently controlled main damper and base valve (US 12,253,139)","fr":"Dual Live Valve — amortisseur principal et clapet de base à contrôle indépendant (US 12 253 139)"},"assignee":"Fox Factory, Inc.","img":"../pictures/US12253139B2.png","alt":{"en":"Fig. 1A of US 12,253,139 B2: an isometric view of the complete rear shock assembly (100), showing the upper mounting eyelet (140), the main damper body (120/125) and a secondary valve housing near the shock's top (450), the shaft (142) and lower mounting eyelet (138)","fr":"Fig. 1A du brevet US 12 253 139 B2 : une vue isométrique de l'amortisseur arrière complet (100), montrant l'œillet de fixation supérieur (140), le corps de l'amortisseur principal (120/125) et un second boîtier de valve près du sommet de l'amortisseur (450), la tige (142) et l'œillet de fixation inférieur (138)"},"teaser":{"en":"A rear shock with its main damper piston and base valve independently, electronically actuated, rather than sharing one solenoid circuit — extending the accelerometer-driven, millisecond-scale damping…","fr":"Un amortisseur arrière dont le piston d'amortissement principal et le clapet de base sont actionnés électroniquement de façon indépendante, plutôt que de partager un seul circuit à solénoïde —…"},"full":{"en":"A rear shock with its main damper piston and base valve independently, electronically actuated, rather than sharing one solenoid circuit — extending the accelerometer-driven, millisecond-scale damping control of the original Live Valve system (cataloged above under Forks & Damping) to both halves of a twin-circuit shock. Filed September 17, 2020 and granted March 18, 2025 as US 12,253,139, cross-confirmed via Justia Patents and Google Patents. The granted PDF itself is an unindexed image scan with no extractable text layer, so this pass confirmed the figure against the rendered page rather than a text-searchable front page.","fr":"Un amortisseur arrière dont le piston d'amortissement principal et le clapet de base sont actionnés électroniquement de façon indépendante, plutôt que de partager un seul circuit à solénoïde — étendant le contrôle d'amortissement piloté par accéléromètre, à l'échelle de la milliseconde, du système Live Valve original (répertorié plus haut sous Fourches et amortissement) aux deux moitiés d'un amortisseur à double circuit. Déposé le 17 septembre 2020 et délivré le 18 mars 2025 sous le numéro US 12 253 139, recoupé via Justia Patents et Google Patents. Le PDF délivré lui-même est une numérisation image sans couche de texte extractible, si bien que cette session a vérifié la figure sur la page rendue plutôt que sur une première page interrogeable par le texte."}},{"num":"10578184","cat":"fork","title":{"en":"GRIP2 damper (US 10,578,184)","fr":"Amortisseur GRIP2 (US 10,578,184)"},"assignee":"Fox Factory","img":"../pictures/US10578184B2.png","alt":{"en":"Fig. 2 of US 10,578,184: an assembled isometric view of the damper's top-cap assembly, showing the two concentric adjustment dials (118) for independent high-speed and low-speed compression, seated above the damper body (106) and shaft assembly (210)","fr":"Fig. 2 du brevet US 10 578 184 : une vue isométrique assemblée du bouchon supérieur de l'amortisseur, montrant les deux molettes de réglage concentriques (118) pour le réglage indépendant de la compression haute et basse vitesse, au-dessus du corps de l'amortisseur (106) et de l'ensemble tige (210)"},"teaser":{"en":"The four-way-adjustable damper architecture with VVC (Variable Valve Control) — the patented cartridge inside Fox's gravity-oriented Factory forks since 2018, listed against GRIP2-equipped models on…","fr":"L'architecture d'amortisseur à quatre réglages avec VVC (Variable Valve Control) — la cartouche brevetée à l'intérieur des fourches Factory orientées gravité de Fox depuis 2018, listée pour les…"},"full":{"en":"The four-way-adjustable damper architecture with VVC (Variable Valve Control) — the patented cartridge inside Fox's gravity-oriented Factory forks since 2018, listed against GRIP2-equipped models on Fox's patent page.","fr":"L'architecture d'amortisseur à quatre réglages avec VVC (Variable Valve Control) — la cartouche brevetée à l'intérieur des fourches Factory orientées gravité de Fox depuis 2018, listée pour les modèles équipés du GRIP2 sur la page de brevets de Fox."}},{"num":"10328993","cat":"fork","title":{"en":"Bicycle steerer tube with variant stiffness (US 10,328,993)","fr":"Tube de direction de vélo à rigidité variable (US 10 328 993)"},"assignee":"Jonathan Blair Watt & Robert Powell / SRAM, LLC","img":"../pictures/US10328993B2.png","alt":{"en":"Fig. 2 of US 10,328,993: the steerer tube (200) seated in the fork crown (112) between the two fork legs (106/108), with dashed section lines 3-3 and 4-4 marking where the cross-sections below are taken","fr":"Fig. 2 du brevet US 10 328 993 : le tube de direction (200) logé dans la couronne de fourche (112) entre les deux fourreaux (106/108), avec les lignes de coupe en pointillés 3-3 et 4-4 indiquant où sont prises les coupes ci-dessous"},"teaser":{"en":"Filed December 30, 2014 and granted June 25, 2019, this SRAM patent covers a steerer tube whose wall thickness varies around its circumference rather than staying uniform: the inner bore is elliptical…","fr":"Déposé le 30 décembre 2014 et délivré le 25 juin 2019, ce brevet SRAM couvre un tube de direction dont l'épaisseur de paroi varie sur sa circonférence plutôt que de rester uniforme : l'alésage…"},"full":{"en":"Filed December 30, 2014 and granted June 25, 2019, this SRAM patent covers a steerer tube whose wall thickness varies around its circumference rather than staying uniform: the inner bore is elliptical rather than round, with the wall thickest in the fore-aft plane of travel and thinnest to the sides. That asymmetry gives the steerer more resistance to bending in the direction that actually matters — braking and impact loads through the fork — without adding the extra material a uniformly thicker round tube would need.","fr":"Déposé le 30 décembre 2014 et délivré le 25 juin 2019, ce brevet SRAM couvre un tube de direction dont l'épaisseur de paroi varie sur sa circonférence plutôt que de rester uniforme : l'alésage intérieur est elliptique plutôt que circulaire, la paroi étant la plus épaisse dans le plan avant-arrière de déplacement et la plus fine sur les côtés. Cette asymétrie confère au tube de direction une plus grande résistance à la flexion dans la direction qui compte réellement — les charges de freinage et d'impact traversant la fourche — sans ajouter la matière supplémentaire qu'exigerait un tube rond uniformément plus épais."}},{"num":"10926827","cat":"fork","title":{"en":"Eccentric bicycle fork shaft (US 10,926,827)","fr":"Pivot de fourche excentré (US 10 926 827)"},"assignee":"Ricco Süsse / Scott Sports SA (Givisiez, Switzerland)","img":"../pictures/US10926827B2.png","alt":{"en":"Fig. 1 of US 10,926,827: a cross-section down through the head tube (13), showing the fork shaft (4) carried on lower and upper headset bearings (11, 12) with the fork crown (1) below and the stem (16) above — and, dimensioned at the foot of the drawing, the offset e between the steering axis (5) and the eccentric segment's own central axis (6)","fr":"Fig. 1 du brevet US 10 926 827 : une coupe longitudinale du tube de direction (13), montrant le pivot de fourche (4) porté par les roulements inférieur et supérieur du jeu de direction (11, 12), avec le té de fourche (1) en dessous et la potence (16) au-dessus — et, coté au bas du dessin, le décalage e entre l'axe de direction (5) et l'axe central propre du segment excentré (6)"},"teaser":{"en":"US 10,926,827 B2, \"Eccentric bicycle fork shaft,\" inventor Ricco Süsse, assigned to Scott Sports SA of Givisiez, Switzerland. German priority filing in 2017; US application 16/133,886 filed September…","fr":"US 10 926 827 B2, « Eccentric bicycle fork shaft » (pivot de fourche excentré), inventeur Ricco Süsse, cédé à Scott Sports SA de Givisiez (Suisse). Dépôt prioritaire allemand en 2017 ; demande…"},"full":{"en":"US 10,926,827 B2, \"Eccentric bicycle fork shaft,\" inventor Ricco Süsse, assigned to Scott Sports SA of Givisiez, Switzerland. German priority filing in 2017; US application 16/133,886 filed September 18, 2018, published March 28, 2019 as US 2019/0092417 A1, granted February 23, 2021. The headset bearings still carry the fork shaft so it turns about the steering axis, but one segment of that shaft is a hollow right circular cylinder whose own longitudinal axis runs parallel to the steering axis rather than on it — lying in the frame's symmetry plane and displaced toward the rear, opposite the direction of travel. The drawings go further than the claim language: Fig. 1 dimensions that offset as e, and Fig. 2 shows a port through the shaft wall just above the crown with lines running up through a slotted top cap. On the term, the front page states the patent is extended under 35 U.S.C. 154(b) by 319 days — so the expiry is August 3, 2039 rather than the 2038 that twenty years from the 2018 US filing would give. The 2017 German priority does not start the US clock.","fr":"US 10 926 827 B2, « Eccentric bicycle fork shaft » (pivot de fourche excentré), inventeur Ricco Süsse, cédé à Scott Sports SA de Givisiez (Suisse). Dépôt prioritaire allemand en 2017 ; demande américaine 16/133 886 déposée le 18 septembre 2018, publiée le 28 mars 2019 sous US 2019/0092417 A1, délivrée le 23 février 2021. Les roulements du jeu de direction portent toujours le pivot de fourche, qui tourne donc autour de l'axe de direction, mais l'un des segments de ce pivot est un cylindre circulaire droit creux dont l'axe longitudinal est parallèle à l'axe de direction sans se confondre avec lui — situé dans le plan de symétrie du cadre et décalé vers l'arrière, à l'opposé du sens de marche. Les dessins en disent plus que les revendications : la Fig. 1 cote ce décalage sous la lettre e, et la Fig. 2 montre un orifice traversant la paroi du pivot juste au-dessus du té, avec des câbles remontant par un capuchon supérieur fendu. Sur la durée, la page de garde indique une prolongation au titre du 35 U.S.C. 154(b) de 319 jours — l'expiration tombe donc au 3 août 2039 et non en 2038 comme le donneraient vingt ans à compter du dépôt américain de 2018. La priorité allemande de 2017 ne fait pas courir le délai américain."}},{"num":"10549813","cat":"fork","title":{"en":"Trust Performance linkage fork patent portfolio","fr":"Portefeuille de brevets de fourche à biellettes Trust Performance"},"assignee":"Trust / Trvstper, Inc. (Dave Weagle co-design) → Specialized","img":"../pictures/US11345432B2.png","alt":{"en":"FIG. 6: Linkage fork head tube junction showing dual-taper arm geometry and pivot axis","fr":"FIG. 6 : Jonction du tube de direction de la fourche à liaison montrant la géométrie du bras à double conicité et l'axe de pivot"},"teaser":{"en":"Three confirmed US patents from the Trust Performance/Trvstper family, all credited to Dave Weagle: US 10,549,813 — a trailing-link, multi-link suspension assembly whose mechanical trail increases as…","fr":"Trois brevets américains confirmés de la famille Trust Performance/Trvstper, tous crédités à Dave Weagle : l'US 10 549 813 — un ensemble de suspension à biellette traînante multi-liaison dont le trail…"},"full":{"en":"Three confirmed US patents from the Trust Performance/Trvstper family, all credited to Dave Weagle: US 10,549,813 — a trailing-link, multi-link suspension assembly whose mechanical trail increases as the fork compresses, the core kinematic patent behind the original Trust Message/Shout forks (filed 2017, granted 2020, exact filing/grant day unconfirmed); US 11,345,432 — a fork-arm cross-section that tapers in two opposing directions along its length (filed 2018, granted 2022); and US D860,061 — a design patent titled 'Cycle suspension assembly,' co-credited to Dave Weagle and Michael Giese, filed Feb. 8, 2018 (the same day as sibling design patents D880,371 and D880,372 in the same family) and granted Sept. 17, 2019, protecting the fork's ornamental appearance rather than its mechanism. Trust Performance folded as a company, and Specialized acquired the patent portfolio in 2021, alongside a companion 'dual sided suspension' family (US 11,945,539 and its 2025 continuation US 12,448,078). These three are very likely not the whole portfolio — Trvstper, Inc. filed a broader family of suspension-assembly patents and applications around the same period, including at least two more sibling design patents (D880,371, D880,372) not yet independently confirmed enough to add here, and further confirmed numbers should be added as they turn up.","fr":"Trois brevets américains confirmés de la famille Trust Performance/Trvstper, tous crédités à Dave Weagle : l'US 10 549 813 — un ensemble de suspension à biellette traînante multi-liaison dont le trail mécanique augmente à mesure que la fourche se comprime, le brevet cinématique central des fourches Trust Message/Shout originales (déposé en 2017, délivré en 2020, jour exact de dépôt/délivrance non confirmé) ; l'US 11 345 432 — une section de bras de fourche qui se rétrécit dans deux directions opposées sur sa longueur (déposé en 2018, délivré en 2022) ; et l'US D860 061 — un brevet de dessin intitulé « Cycle suspension assembly », co-crédité à Dave Weagle et Michael Giese, déposé le 8 février 2018 (le même jour que les brevets de dessin apparentés D880 371 et D880 372 de la même famille) et délivré le 17 septembre 2019, protégeant l'apparence ornementale de la fourche plutôt que son mécanisme. Trust Performance a cessé ses activités en tant qu'entreprise, et Specialized a racheté le portefeuille de brevets en 2021, aux côtés d'une famille compagnon « dual sided suspension » (US 11 945 539 et sa continuation de 2025, US 12 448 078). Ces trois brevets ne représentent très probablement pas l'ensemble du portefeuille — Trvstper, Inc. a déposé une famille plus large de brevets et de demandes de suspension à la même période, dont au moins deux autres brevets de dessin apparentés (D880 371, D880 372) non encore confirmés de façon indépendante pour être ajoutés ici, et d'autres numéros confirmés devraient être ajoutés au fur et à mesure."}},{"num":"6044940","cat":"fork","title":{"en":"Marzocchi damping & hub portfolio (US 6,044,940 + 5 more)","fr":"Portefeuille d'amortissement et de moyeu Marzocchi (US 6 044 940 + 5 autres)"},"assignee":"Paolo Marzocchi, Adriano Marzocchi et al. / Marzocchi S.p.A. → Fox Factory Inc.","img":"../pictures/US6105740A.png","alt":{"en":"Fig. 1 of US 6,105,740, granted Aug. 22, 2000: a full damper-cartridge cross-section showing the piston rod (3) sliding in the damping cylinder (4), an open oil reservoir chamber (P) at the top separated by a floating piston (9/10), and the lower clevis mount (101) — the open-bath, floating-piston layout behind this entry's damping half","fr":"Fig. 1 du brevet US 6 105 740, délivré le 22 août 2000 : une coupe complète de la cartouche d'amortisseur montrant la tige de piston (3) coulissant dans le cylindre d'amortissement (4), une chambre de réserve d'huile à bain ouvert (P) en haut séparée par un piston flottant (9/10), et la chape de fixation inférieure (101) — la disposition à bain ouvert et piston flottant derrière le volet amortissement de cette fiche"},"teaser":{"en":"Six Marzocchi S.p.A. (Bologna, Italy) filings cover the Bomber-era open-bath damping system and its dropout/hub hardware. Four are confirmed: US 6,044,940, \"Remote-controlled hydropneumatic shock…","fr":"Six dépôts de Marzocchi S.p.A. (Bologne, Italie) couvrent le système d'amortissement à bain ouvert de l'ère Bomber et sa quincaillerie de patte/moyeu. Quatre sont confirmés : US 6 044 940, «…"},"full":{"en":"Six Marzocchi S.p.A. (Bologna, Italy) filings cover the Bomber-era open-bath damping system and its dropout/hub hardware. Four are confirmed: US 6,044,940, \"Remote-controlled hydropneumatic shock absorber\" (filed 1997, granted Apr. 4, 2000; inventors Paolo Marzocchi, Sandro Musiani, Loris Vignocchi); US 6,105,740, \"Hydraulic shock absorber\" (filed 1998, granted Aug. 22, 2000; same three inventors) — an open-bath cartridge with a floating-piston oil reservoir; US 6,328,291, \"Shock absorber\" (priority Dec. 19, 1996; continuation filed Mar. 27, 2000, granted Dec. 11, 2001; inventor Adriano Marzocchi), now assigned to Fox Factory Inc.; and US 6,386,643, \"Quick releasable dropout and wheel hub assembly\" (family priority Nov. 10, 1998; continuation filed Jun. 23, 2000; same three named inventors as 6,044,940) — a dropout/hub pairing rather than a damping patent. Two Italian patents, IT 1,192,909 and IT 1,156,632, are unconfirmed and listed on secondary sourcing alone. `y`/`g`/`exp` are computed from the four confirmed US numbers only and likely understate the portfolio's real age, since Marzocchi's fork lineage runs back to 1950.","fr":"Six dépôts de Marzocchi S.p.A. (Bologne, Italie) couvrent le système d'amortissement à bain ouvert de l'ère Bomber et sa quincaillerie de patte/moyeu. Quatre sont confirmés : US 6 044 940, « Remote-controlled hydropneumatic shock absorber » (déposé en 1997, délivré le 4 avril 2000 ; inventeurs Paolo Marzocchi, Sandro Musiani, Loris Vignocchi) ; US 6 105 740, « Hydraulic shock absorber » (déposé en 1998, délivré le 22 août 2000 ; mêmes trois inventeurs) — une cartouche à bain ouvert avec réserve d'huile à piston flottant ; US 6 328 291, « Shock absorber » (priorité du 19 décembre 1996 ; continuation déposée le 27 mars 2000, délivrée le 11 décembre 2001 ; inventeur Adriano Marzocchi), désormais cédé à Fox Factory Inc. ; et US 6 386 643, « Quick releasable dropout and wheel hub assembly » (priorité de la famille au 10 novembre 1998 ; continuation déposée le 23 juin 2000 ; mêmes trois inventeurs nommés que le 6 044 940) — un couplage patte/moyeu plutôt qu'un brevet d'amortissement. Deux brevets italiens, IT 1 192 909 et IT 1 156 632, restent non confirmés et figurent ici sur la foi d'un sourcing secondaire. Les champs `y`/`g`/`exp` sont calculés uniquement à partir des quatre numéros américains confirmés et sous-estiment probablement l'âge réel du portefeuille, la lignée de fourches Marzocchi remontant à 1950."}},{"num":"5462302","cat":"fork","title":{"en":"AMP F1/BLT linkage fork + through-shaft damper (US 5,462,302)","fr":"Fourche à biellettes AMP F1/BLT + amortisseur à tige traversante (US 5,462,302)"},"assignee":"Horst Leitner / AMP Research","img":"../pictures/US5462302A.png","alt":{"en":"Fig. 1 of US 5,462,302: a side view of the double-swingarm front suspension, showing the upper and lower swingarm links (2, 4), the spring-and-elastomer cartridge (9, 11) between them, and the geometry lines tracking wheel travel from extended to compressed suspension","fr":"Fig. 1 du brevet US 5 462 302 : une vue latérale de la suspension avant à double bras oscillant, montrant les biellettes supérieure et inférieure (2, 4), la cartouche ressort-élastomère (9, 11) entre elles, et les lignes de géométrie suivant le débattement de la roue de la suspension étendue à comprimée"},"teaser":{"en":"A parallelogram double-swingarm fork derived from Leitner's moto designs — filed as 'Double swingarm front suspension for bicycles and motorcycles,' pairing a spring-and-elastomer combination with a…","fr":"Une fourche à double bras oscillant en parallélogramme dérivée des designs moto de Leitner — déposée sous le titre « Double swingarm front suspension for bicycles and motorcycles », associant une…"},"full":{"en":"A parallelogram double-swingarm fork derived from Leitner's moto designs — filed as 'Double swingarm front suspension for bicycles and motorcycles,' pairing a spring-and-elastomer combination with a through-shaft hydraulic damper sealed at both ends — frame, fork and shock all built in-house at AMP in Laguna Beach.","fr":"Une fourche à double bras oscillant en parallélogramme dérivée des designs moto de Leitner — déposée sous le titre « Double swingarm front suspension for bicycles and motorcycles », associant une combinaison ressort-élastomère à un amortisseur hydraulique à tige traversante scellé aux deux extrémités — cadre, fourche et amortisseur tous conçus et fabriqués en interne chez AMP à Laguna Beach."}},{"num":"5470090","cat":"fork","title":{"en":"Manitou fork & axle patents (US 5,470,090 → US 9,376,160)","fr":"Brevets Manitou de fourches et d'axes (US 5 470 090 → US 9 376 160)"},"assignee":"E. Douglas Bradbury / Manitou Mountain Bikes, Inc. → Answer Products, Inc. (1990s); Hayes Bicycle Group (Manitou) (later)","img":"../pictures/US5509677A.png","alt":{"en":"Precision suspension fork family patent drawing, US 5,509,677, Fig. 1, showing the telescoping fork legs and crown","fr":"Dessin de brevet de la famille de fourches de suspension de précision, US 5,509,677, Fig. 1, montrant les fourreaux télescopiques et le té de fourche"},"teaser":{"en":"E. Douglas Bradbury's suspension-fork patent family, filed by his own company Manitou Mountain Bikes, Inc. and later reassigned to Answer Products: US 5,470,090 (\"Precision suspension fork for…","fr":"La famille de brevets de fourche à suspension d'E. Douglas Bradbury, déposée par sa propre société Manitou Mountain Bikes, Inc. puis cédée à Answer Products : US 5 470 090 (« Precision suspension fork…"},"full":{"en":"E. Douglas Bradbury's suspension-fork patent family, filed by his own company Manitou Mountain Bikes, Inc. and later reassigned to Answer Products: US 5,470,090 (\"Precision suspension fork for bicycles,\" co-invented with Gerald M. Stewart, filed September 7, 1993, granted November 28, 1995), US 5,445,401 (\"Suspension fork for bicycles,\" elastomer-sprung legs), and US 5,509,677 (\"Suspension fork for bicycles with dual, fluid-based dampers,\" granted April 23, 1996). Together they cover telescoping legs sprung with an elastomer stack and damped independently — compression in one leg, rebound in the other. Those three have long since expired. The family's later numbers, now under Hayes Bicycle Group, run from a US reissue (RE45684) and two Taiwan grants through the Mattoc, Mara, Mastodon and Minute lines, for twelve numbers in all. The headline of that later group, US 9,376,160 (\"Axle assembly\"; Nicholas William Pye; filed October 22, 2014, granted June 28, 2016), claims a bolt nested in a retainer that secures an axle with non-circular sections engaging matching sections in the fork or frame, so the wheel is removed by removing the axle alone. It appears to be the basis of Manitou's Hexlock axle; that mapping was not checked against Manitou's patent-marking page. The card's 2034 expiry is that axle patent's; later members were not examined and may run longer.","fr":"La famille de brevets de fourche à suspension d'E. Douglas Bradbury, déposée par sa propre société Manitou Mountain Bikes, Inc. puis cédée à Answer Products : US 5 470 090 (« Precision suspension fork for bicycles », co-inventé avec Gerald M. Stewart, déposé le 7 septembre 1993, délivré le 28 novembre 1995), US 5 445 401 (« Suspension fork for bicycles », fourreaux à ressort élastomère) et US 5 509 677 (« Suspension fork for bicycles with dual, fluid-based dampers », délivré le 23 avril 1996). Ensemble, ils couvrent des fourreaux télescopiques amortis par un empilement d'élastomères, avec un amortissement indépendant — compression d'un côté, détente de l'autre. Ces trois brevets sont éteints depuis longtemps. Les numéros plus récents de la famille, aujourd'hui sous Hayes Bicycle Group, vont d'un brevet américain de réédition (RE45684) et de deux délivrances taïwanaises aux gammes Mattoc, Mara, Mastodon et Minute, soit douze numéros au total. Le numéro principal de ce second groupe, US 9 376 160 (« Axle assembly » ; Nicholas William Pye ; déposé le 22 octobre 2014, délivré le 28 juin 2016), revendique un boulon logé dans une retenue qui fixe un axe à sections non circulaires s'engageant dans des sections correspondantes de la fourche ou du cadre, de sorte que la roue se démonte en retirant le seul axe. Il semble être la base de l'axe Hexlock de Manitou ; cette correspondance n'a pas été vérifiée sur la page de marquage des brevets de Manitou. L'expiration de 2034 retenue pour la fiche est celle de ce brevet d'axe ; les membres plus récents n'ont pas été examinés et peuvent courir plus longtemps."}},{"num":"20240229892","cat":"fork","title":{"en":"Frequency-adjustable tuned mass damper (US 2024/0229892 A1)","fr":"Amortisseur à masse accordée réglable en fréquence (US 2024/0229892 A1)"},"assignee":"Fox Factory","img":"../pictures/US20240229892A1.png","alt":{"en":"Fig. 3B of US 2024/0229892: a plot of position in metres against time in seconds over about one second, comparing two oscillation traces labelled 351 and 355","fr":"Fig. 3B du US 2024/0229892 : un graphique de la position en mètres en fonction du temps en secondes sur environ une seconde, comparant deux courbes d'oscillation repérées 351 et 355"},"teaser":{"en":"US 2024/0229892 A1, filed January 10, 2024 (application 18/409,689; Taiwanese and European counterparts filed the next day), inventors Keith Christman, Connor Randall, Bjorn Borgers and Fraser Andrew.…","fr":"US 2024/0229892 A1, déposé le 10 janvier 2024 (demande 18/409,689 ; équivalents taïwanais et européen déposés le lendemain), inventeurs Keith Christman, Connor Randall, Bjorn Borgers et Fraser Andrew.…"},"full":{"en":"US 2024/0229892 A1, filed January 10, 2024 (application 18/409,689; Taiwanese and European counterparts filed the next day), inventors Keith Christman, Connor Randall, Bjorn Borgers and Fraser Andrew. A weight suspended between springs targeting 22–26Hz wheel oscillation — the frequency range above where conventional suspension stops working but where the fork oscillates against the ground. Published July 2024.","fr":"US 2024/0229892 A1, déposé le 10 janvier 2024 (demande 18/409,689 ; équivalents taïwanais et européen déposés le lendemain), inventeurs Keith Christman, Connor Randall, Bjorn Borgers et Fraser Andrew. Une masse suspendue entre des ressorts ciblant une oscillation de roue de 22-26 Hz — la plage de fréquence au-dessus de laquelle la suspension classique cesse de fonctionner mais où la fourche oscille contre le sol. Publiée en juillet 2024."}},{"num":"EP2242939B1","cat":"fork","title":{"en":"TTX twin-tube damper (EP 2,242,939 + US D752,482)","fr":"Amortisseur bi-tube TTX (EP 2 242 939 + US D752,482)"},"assignee":"Öhlins Racing AB (Sweden) → licensed to Cane Creek","img":"../pictures/EP2242939B1.png","alt":{"en":"Fig. 1a/1b of EP 2,242,939 B1, labeled \"Prior art\" in the patent itself: a cross-section of a general twin-tube damper, showing the piston rod and seal head (1, 7) sliding inside a damping tube (2/2a/2b) alongside a separate gas-pressure tube (6/6a) connected via a pressure chamber (P1) — the baseline architecture the patent's own dual-piston refinement (detailed later in the document, not shown here) builds on","fr":"Fig. 1a/1b du brevet EP 2 242 939 B1, désignée « Prior art » (antériorité) dans le brevet lui-même : une coupe d'un amortisseur bi-tube général, montrant la tige de piston et la tête d'étanchéité (1, 7) coulissant dans un tube d'amortissement (2/2a/2b) aux côtés d'un tube de pression de gaz séparé (6/6a) relié par une chambre de pression (P1) — l'architecture de référence sur laquelle s'appuie le perfectionnement à double piston propre au brevet (détaillé plus loin dans le document, non montré ici)"},"teaser":{"en":"EP 2,242,939 B1, \"Shock absorber with dual piston,\" filed by Öhlins Racing AB (Upplands Väsby, Sweden) December 17, 2008 — the EP/PCT phase of an earlier Swedish priority application (SE 0702838,…","fr":"EP 2 242 939 B1, « Amortisseur à double piston », déposé par Öhlins Racing AB (Upplands Väsby, Suède) le 17 décembre 2008 — la phase EP/PCT d'une demande de priorité suédoise antérieure (SE 0702838,…"},"full":{"en":"EP 2,242,939 B1, \"Shock absorber with dual piston,\" filed by Öhlins Racing AB (Upplands Väsby, Sweden) December 17, 2008 — the EP/PCT phase of an earlier Swedish priority application (SE 0702838, filed December 19, 2007) — and granted August 28, 2019. Covers the core twin-tube mechanism: a damping cylinder split into two chambers by a main piston device whose continuous ducts and flow limiters, mounted on the piston rod, keep oil pressure above gas pressure to eliminate cavitation under hard use. The identical invention has a granted US counterpart, US 8,807,302 B2 (same assignee; inventors Nils Göran Nygren and Johan Jarl; granted August 19, 2014) — the primary source read directly for this entry, since the EP document itself is unreachable from this environment. Öhlins also holds a companion design patent, US D752,482 S, \"Rear shock absorber for a bicycle,\" filed January 22, 2015 (a division of an earlier June 6, 2013 filing, now Des. 734,219) and granted March 29, 2016 with a 14-year term — protecting the shock body's outward shape rather than its mechanism. Öhlins co-developed the Cane Creek Double Barrel (2005) — the first mass-market twin-tube MTB shock — before launching its own TTX line.","fr":"EP 2 242 939 B1, « Amortisseur à double piston », déposé par Öhlins Racing AB (Upplands Väsby, Suède) le 17 décembre 2008 — la phase EP/PCT d'une demande de priorité suédoise antérieure (SE 0702838, déposée le 19 décembre 2007) — et délivré le 28 août 2019. Couvre le mécanisme bi-tube central : un cylindre d'amortissement divisé en deux chambres par un ensemble de piston principal dont les conduits continus et les limiteurs de débit, montés sur la tige de piston, maintiennent la pression d'huile au-dessus de la pression de gaz pour éliminer la cavitation en usage intensif. L'invention identique possède un équivalent américain délivré, l'US 8 807 302 B2 (même cessionnaire ; inventeurs Nils Göran Nygren et Johan Jarl ; délivré le 19 août 2014) — la source primaire lue directement pour cette fiche, le document EP lui-même étant inaccessible depuis cet environnement. Öhlins détient aussi un brevet de dessin compagnon, l'US D752,482 S, « Amortisseur arrière pour bicyclette », déposé le 22 janvier 2015 (une division d'un dépôt antérieur du 6 juin 2013, désormais Des. 734 219) et délivré le 29 mars 2016 avec une durée de 14 ans — protégeant la forme extérieure de l'amortisseur plutôt que son mécanisme. Öhlins a co-développé le Cane Creek Double Barrel (2005) — le premier amortisseur bi-tube VTT grand public — avant de lancer sa propre gamme TTX."}},{"num":"20240149970","cat":"fork","title":{"en":"ThyssenKrupp Bilstein amplitude-dependent fork damper (US 2024/0149970, application)","fr":"Amortisseur de fourche à amortissement dépendant de l'amplitude de ThyssenKrupp Bilstein (demande US 2024/0149970)"},"assignee":"Michael Heyer, Hanno Luczak, Dennis Gundlach, Daniel Hansen / ThyssenKrupp AG, ThyssenKrupp Bilstein GmbH","img":"../pictures/US20240149970A1.1.png","alt":{"en":"Fig. 1 of US 2024/0149970 A1, sheet 1 of 3: a cross-section of the damper mechanism at the fork crown, showing the working piston (8/19/25) inside the damper tube, the parallel compensation space (4/5) split by the separating piston, and the throttle device (27) at the bottom of the assembly","fr":"Fig. 1 du brevet US 2024/0149970 A1, planche 1 sur 3 : une coupe du mécanisme d'amortissement au niveau du té de fourche, montrant le piston de travail (8/19/25) à l'intérieur du tube amortisseur, l'espace de compensation parallèle (4/5) divisé par le piston séparateur, et le dispositif d'étranglement (27) en bas de l'ensemble"},"teaser":{"en":"US 2024/0149970 A1, \"Vibration Damper, Bicycle Fork, Spring Strut, and Use of a Vibration Damper,\" filed October 27, 2023 (Appl. No. 18/384,793, claiming a 2022 German priority) and published May 9,…","fr":"US 2024/0149970 A1, « Vibration Damper, Bicycle Fork, Spring Strut, and Use of a Vibration Damper », déposée le 27 octobre 2023 (demande n° 18/384 793, revendiquant une priorité allemande de 2022) et…"},"full":{"en":"US 2024/0149970 A1, \"Vibration Damper, Bicycle Fork, Spring Strut, and Use of a Vibration Damper,\" filed October 27, 2023 (Appl. No. 18/384,793, claiming a 2022 German priority) and published May 9, 2024 by ThyssenKrupp AG and ThyssenKrupp Bilstein GmbH. Describes a damper with amplitude-dependent damping: a cylindrical compensation space runs fluidically parallel to the main working piston and damper tube, split by its own displaceable separating piston into two part-spaces, each connected to one of the main damper's two damping spaces through a throttle device that shapes fluid flow between them. Still a published application, not yet a granted patent, so no expiry is estimated.","fr":"US 2024/0149970 A1, « Vibration Damper, Bicycle Fork, Spring Strut, and Use of a Vibration Damper », déposée le 27 octobre 2023 (demande n° 18/384 793, revendiquant une priorité allemande de 2022) et publiée le 9 mai 2024 par ThyssenKrupp AG et ThyssenKrupp Bilstein GmbH. Décrit un amortisseur à amortissement dépendant de l'amplitude : un espace de compensation cylindrique, relié fluidiquement en parallèle au piston de travail principal et au tube amortisseur, est divisé par son propre piston séparateur déplaçable en deux espaces partiels, chacun relié à l'un des deux espaces d'amortissement du système principal via un dispositif d'étranglement qui régule le débit de fluide entre eux. Toujours une demande publiée, pas encore un brevet délivré, donc aucune date d'expiration n'est estimée."}},{"num":"10156280","cat":"fork","title":{"en":"Dual-valve adjustable shock controller (US 10,156,280)","fr":"Contrôleur d'amortisseur réglable à double valve (US 10 156 280)"},"assignee":"Darren W. Murphy / Push Industries","img":"../pictures/US10156280B2.png","alt":{"en":"FIG. 1 of US 10,156,280: an end view of the reservoir/controller housing, showing its two identical circular valve assemblies (194, 196) side by side — the flow director's twin flow paths that give the shock its two independently adjustable damping circuits — with the mounting eyelet (292) below and a bleed screw (222) between the two valves","fr":"FIG. 1 du brevet US 10 156 280 : une vue en bout du boîtier réservoir/contrôleur, montrant ses deux ensembles de valve circulaires identiques (194, 196) côte à côte — les deux voies de circulation du répartiteur de débit qui donnent à l'amortisseur ses deux circuits d'amortissement réglables indépendamment — avec la chape de fixation (292) en dessous et une vis de purge (222) entre les deux valves"},"teaser":{"en":"Filed September 9, 2015 (claiming priority to a September 9, 2014 provisional application, which doesn't itself count toward the term), granted December 18, 2018 — fetched and read directly via the…","fr":"Déposé le 9 septembre 2015 (revendiquant la priorité d'une demande provisoire du 9 septembre 2014, qui ne compte pas elle-même dans la durée), délivré le 18 décembre 2018 — récupéré et lu directement…"},"full":{"en":"Filed September 9, 2015 (claiming priority to a September 9, 2014 provisional application, which doesn't itself count toward the term), granted December 18, 2018 — fetched and read directly via the GitHub Actions figure tool, since this sandbox's egress to Google Patents/USPTO stayed blocked throughout. Inventor Darren W Murphy is Push Industries' own founder. Claims a remote-reservoir shock controller with a first valve and a second valve, each independently adjustable to its own damping rate, plus a flow director that routes shock fluid to one or the other — giving a single shock two completely separate, on-the-fly-selectable damping circuits rather than one dial with intermediate settings. This is the mechanism Push markets as the ElevenSix's Dual Overhead Valve, introduced in February 2015 as \"patent pending\" — consistent with this filing date — and marketed as \"Patented\" only after the 2018 grant.","fr":"Déposé le 9 septembre 2015 (revendiquant la priorité d'une demande provisoire du 9 septembre 2014, qui ne compte pas elle-même dans la durée), délivré le 18 décembre 2018 — récupéré et lu directement via l'outil GitHub Actions de récupération de figures, l'accès sortant de ce bac à sable vers Google Patents/USPTO étant resté bloqué tout du long. L'inventeur Darren W Murphy est le propre fondateur de Push Industries. Revendique un contrôleur d'amortisseur à réservoir déporté doté d'une première et d'une seconde valve, chacune réglable indépendamment sur son propre taux d'amortissement, ainsi que d'un répartiteur de débit qui achemine le fluide vers l'une ou l'autre — donnant à un seul amortisseur deux circuits d'amortissement entièrement distincts, sélectionnables à la volée, plutôt qu'une molette à réglages intermédiaires. C'est le mécanisme que Push commercialise sous le nom de Dual Overhead Valve de l'ElevenSix, introduit en février 2015 comme « brevet en instance » — cohérent avec cette date de dépôt — et commercialisé comme « breveté » seulement après la délivrance de 2018."}},{"num":"6607185","cat":"fork","title":{"en":"Reverse Arch fork chassis (US 6,607,185)","fr":"Fourreau à arche inversée Reverse Arch (US 6,607,185)"},"assignee":"Answer Products, Inc. → Manitou / Hayes","img":"../pictures/US6607185B2.png","alt":{"en":"Manitou Reverse Arch fork patent drawing, showing the rearward-inclined arch and brake-hardware clearance","fr":"Dessin de brevet de la fourche Manitou Reverse Arch, montrant l'arche inclinée vers l'arrière et le dégagement du matériel de frein"},"teaser":{"en":"'Suspension fork having reversed arch' — filed October 17, 2001, granted April 17, 2003. Manitou's signature rearward-facing arch, inclined behind the fork legs to clear brake hardware and better…","fr":"« Suspension fork having reversed arch » — déposé le 17 octobre 2001, délivré le 17 avril 2003. L'arche signature de Manitou orientée vers l'arrière, inclinée derrière les fourreaux pour dégager le…"},"full":{"en":"'Suspension fork having reversed arch' — filed October 17, 2001, granted April 17, 2003. Manitou's signature rearward-facing arch, inclined behind the fork legs to clear brake hardware and better resist braking loads — instantly recognizable on every Manitou fork since.","fr":"« Suspension fork having reversed arch » — déposé le 17 octobre 2001, délivré le 17 avril 2003. L'arche signature de Manitou orientée vers l'arrière, inclinée derrière les fourreaux pour dégager le matériel de frein et mieux résister aux charges de freinage — instantanément reconnaissable sur chaque fourche Manitou depuis lors."}},{"num":"10746250","cat":"fork","title":{"en":"Bleed valve patent + Fox v. SRAM (US 10,746,250)","fr":"Brevet de valve de purge + Fox c. SRAM (US 10,746,250)"},"assignee":"Fox Factory","img":"../pictures/US10746250B2.png","alt":{"en":"Fig. 1 of US 10,746,250: an isometric view of a fork lower leg, calling out the two push-button bleed screws (108, 103) on the leg's outer casting (114) that vent trapped air pressure","fr":"Fig. 1 du brevet US 10 746 250 : une vue isométrique d'un fourreau inférieur de fourche, repérant les deux vis de purge à bouton-poussoir (108, 103) sur le corps moulé extérieur du fourreau (114) qui évacuent la pression d'air emprisonnée"},"teaser":{"en":"Granted in 2020 despite MRP, Manitou, DVO and X-Fusion shipping similar relief valves earlier. Fox sued SRAM over the 2023 Pike, Lyrik and Zeb — while in a separate Fox case a court ruled 15 of 19…","fr":"Délivré en 2020 malgré le fait que MRP, Manitou, DVO et X-Fusion commercialisaient déjà des valves de décompression similaires. Fox a poursuivi SRAM au sujet des Pike, Lyrik et Zeb 2023 — tandis que…"},"full":{"en":"Granted in 2020 despite MRP, Manitou, DVO and X-Fusion shipping similar relief valves earlier. Fox sued SRAM over the 2023 Pike, Lyrik and Zeb — while in a separate Fox case a court ruled 15 of 19 claims in a 2013 Fox patent unpatentable as obvious or anticipated.","fr":"Délivré en 2020 malgré le fait que MRP, Manitou, DVO et X-Fusion commercialisaient déjà des valves de décompression similaires. Fox a poursuivi SRAM au sujet des Pike, Lyrik et Zeb 2023 — tandis que dans une affaire Fox distincte, un tribunal a jugé 15 des 19 revendications d'un brevet Fox de 2013 non brevetables pour cause d'évidence ou d'antériorité."}},{"num":"9182027","cat":"drive","title":{"en":"X-Sync narrow-wide chainring (US 9,182,027)","fr":"Plateau à denture alternée X-Sync (US 9,182,027)"},"assignee":"SRAM","img":"../pictures/US9182027B2.png","alt":{"en":"Fig. 3 of US 9,182,027 B2: the assembled chainring (12/14) and crank arm (48) with chain (10) wrapped around the rim, the alternating narrow and wide tooth profiles (50, 52, 54, 56, 58) visible around the circumference","fr":"Fig. 3 du brevet US 9 182 027 B2 : le plateau assemblé (12/14) et la manivelle (48) avec la chaîne (10) enroulée sur la couronne, les profils de dents alternant étroit et large (50, 52, 54, 56, 58) visibles sur la circonférence"},"teaser":{"en":"Alternating narrow and wide tooth profiles with offset geometry to retain the chain without a guide — the enabling patent of the 1x revolution. Filed December 6, 2011 (Ser. No. 13/311,735) — this run…","fr":"Des profils de dents alternant étroit et large avec une géométrie décalée pour retenir la chaîne sans guide-chaîne — le brevet fondateur de la révolution du mono-plateau (1x). Déposé le 6 décembre…"},"full":{"en":"Alternating narrow and wide tooth profiles with offset geometry to retain the chain without a guide — the enabling patent of the 1x revolution. Filed December 6, 2011 (Ser. No. 13/311,735) — this run corrected an earlier version of this entry that had stated a 2012 filing year and a 2032 expiry; the PDF itself has no text layer to read directly, so this filing date and the inventor names (Markus Reiter, Raymond Florczyk, Henrik Braedt) were cross-confirmed against two independent search sources rather than read off the primary document, which a future session with a searchable copy should still double-check.","fr":"Des profils de dents alternant étroit et large avec une géométrie décalée pour retenir la chaîne sans guide-chaîne — le brevet fondateur de la révolution du mono-plateau (1x). Déposé le 6 décembre 2011 (n° de série 13/311 735) — cette recherche a corrigé une version antérieure de cette fiche qui indiquait un dépôt en 2012 et une expiration en 2032 ; le PDF lui-même n'a pas de couche de texte lisible directement, donc cette date de dépôt et les noms des inventeurs (Markus Reiter, Raymond Florczyk, Henrik Braedt) ont été confirmés par recoupement via deux sources de recherche indépendantes plutôt que lus directement sur le document primaire, ce qu'une session future disposant d'une copie interrogeable devrait tout de même revérifier."}},{"num":"9062758","cat":"drive","title":{"en":"X-Sync companion patent (US 9,062,758)","fr":"Brevet compagnon du X-Sync (US 9,062,758)"},"assignee":"SRAM","img":"../pictures/US9062758B2.png","alt":{"en":"Fig. 3 of US 9,062,758: the chainring (12) mounted on the crank arm (48) with the drive chain (14) engaged around it, calling out the alternating wide and narrow tooth profile (50, 52, 54, 56, 58, 60) that keys each tooth to a specific link of the chain","fr":"Fig. 3 du brevet US 9 062 758 : le plateau (12) monté sur la manivelle (48) avec la chaîne (14) engagée autour de lui, indiquant le profil de dents alternant large et étroit (50, 52, 54, 56, 58, 60) qui associe chaque dent à un maillon précis de la chaîne"},"teaser":{"en":"The second patent in SRAM's narrow-wide enforcement campaign, covering complementary tooth and offset features.","fr":"Le second brevet de la campagne de mise en application du narrow-wide de SRAM, couvrant des caractéristiques complémentaires de denture et de décalage."},"full":{"en":"The second patent in SRAM's narrow-wide enforcement campaign, covering complementary tooth and offset features.","fr":"Le second brevet de la campagne de mise en application du narrow-wide de SRAM, couvrant des caractéristiques complémentaires de denture et de décalage."}},{"num":"4174642","cat":"drive","title":{"en":"Gehl alternating-width sprocket (US 4,174,642, prior art)","fr":"Pignon à denture de largeur alternée Gehl (US 4 174 642, antériorité)"},"assignee":"Virgil B. Martin & Roger L. Villers / Gehl Company (West Bend, WI)","img":"../pictures/US4174642A.png","alt":{"en":"Fig. 1 of US 4,174,642: a face-on view of the sprocket hub, with the alternating wide and narrow teeth (18A/18B) called out around the rim and the mounting bolt holes (34) between them","fr":"Fig. 1 du brevet US 4 174 642 : une vue de face du moyeu du pignon, avec les dents alternant large et étroite (18A/18B) indiquées autour de la jante et les trous de boulon de fixation (34) entre elles"},"teaser":{"en":"US 4,174,642, 'Chain drive including sprocket having alternate wide and narrow teeth,' filed February 9, 1978 and granted November 20, 1979 to inventors Virgil B. Martin and Roger L. Villers, assigned…","fr":"US 4 174 642, « Chain drive including sprocket having alternate wide and narrow teeth », déposé le 9 février 1978 et délivré le 20 novembre 1979 aux inventeurs Virgil B. Martin et Roger L. Villers,…"},"full":{"en":"US 4,174,642, 'Chain drive including sprocket having alternate wide and narrow teeth,' filed February 9, 1978 and granted November 20, 1979 to inventors Virgil B. Martin and Roger L. Villers, assigned to the Gehl Company of West Bend, Wisconsin — a farm-equipment maker, not a bicycle company. The claims cover a sprocket with an even number of alternating wide and narrow tapered teeth matched to a chain whose successive links alternate wide and narrow tooth-engaging openings, so an oncoming link always registers against a tooth of the correct width even if the chain flight has drifted slightly out of the sprocket's own plane — preventing a loose chain from jumping the sprocket, or a tight one from breaking it. Built for high-torque agricultural drives like forage harvesters and balers, not derailleur bicycles.","fr":"US 4 174 642, « Chain drive including sprocket having alternate wide and narrow teeth », déposé le 9 février 1978 et délivré le 20 novembre 1979 aux inventeurs Virgil B. Martin et Roger L. Villers, cédé à la Gehl Company de West Bend, dans le Wisconsin — un fabricant de matériel agricole, pas une entreprise de vélos. Les revendications couvrent un pignon à nombre pair de dents coniques alternant largeur large et étroite, apparié à une chaîne dont les maillons successifs alternent des ouvertures d'engagement larges et étroites, de sorte qu'un maillon entrant s'aligne toujours sur une dent de la largeur appropriée même si le brin de chaîne a légèrement dérivé hors du plan du pignon — empêchant une chaîne détendue de sauter le pignon, ou une chaîne tendue de le briser. Conçu pour des entraînements agricoles à couple élevé comme les ensileuses et les presses à balles, pas pour des vélos à dérailleur."}},{"num":"20250010943","cat":"drive","title":{"en":"Modular mechanical derailleur (US 2025/0010943, application)","fr":"Dérailleur mécanique modulaire (demande US 2025/0010943)"},"assignee":"SRAM Deutschland GmbH","img":"../pictures/US20250010943A1.png","alt":{"en":"A full rear-derailleur assembly drawing from US 2025/0010943, with reference labels marking the boundaries between its modules: the base module (B) at the mount, the swivel/knuckle module (K) below it, the shifting/parallelogram module (A) and spring (P_S/M_S), and the cage and chain-guiding module (P_C/C_C, W_CL) at the lower pulley wheel.","fr":"Un dessin complet de l'ensemble dérailleur arrière du brevet US 2025/0010943, avec des repères marquant les limites entre ses modules : le module de base (B) à la fixation, le module pivot (K) en dessous, le module de passage/parallélogramme (A) et le ressort (P_S/M_S), et le module de cage et de guidage de chaîne (P_C/C_C, W_CL) au niveau de la poulie inférieure."},"teaser":{"en":"US 2025/0010943 A1, filed Sept. 17, 2024 by SRAM Deutschland GmbH (inventors Heiko Redecker, Tobias Harcke), published January 2025. Describes a rear derailleur built as a hierarchical, modular…","fr":"US 2025/0010943 A1, déposée le 17 septembre 2024 par SRAM Deutschland GmbH (inventeurs Heiko Redecker, Tobias Harcke), publiée en janvier 2025. Décrit un dérailleur arrière construit comme un système…"},"full":{"en":"US 2025/0010943 A1, filed Sept. 17, 2024 by SRAM Deutschland GmbH (inventors Heiko Redecker, Tobias Harcke), published January 2025. Describes a rear derailleur built as a hierarchical, modular construction system with separately replaceable base-element, swivel-formation, shifting-element, and chain-guiding-device modules, each serviceable on its own.","fr":"US 2025/0010943 A1, déposée le 17 septembre 2024 par SRAM Deutschland GmbH (inventeurs Heiko Redecker, Tobias Harcke), publiée en janvier 2025. Décrit un dérailleur arrière construit comme un système modulaire hiérarchique, avec des modules d'élément de base, de formation pivotante, d'élément de passage et de guide-chaîne remplaçables séparément et réparables individuellement."}},{"num":"11407475","cat":"drive","title":{"en":"Shimano electronic derailleur user interface (US 11,407,475)","fr":"Interface utilisateur de dérailleur électronique Shimano (US 11 407 475)"},"assignee":"Hiroyuki Kitano, Yu Goto & Takeshi Ueda / Shimano Inc.","img":"../pictures/US11407475B2.1.png","alt":{"en":"Fig. 5 of US 11,407,475: the derailleur's electronics housing (20/20A), with a wireless module (WS) and connector port (CN) called out beside a pushbutton (80) and a second control point (76) on the housing's outer face","fr":"Fig. 5 du brevet US 11 407 475 : le boîtier électronique du dérailleur (20/20A), avec un module sans fil (WS) et un port de connecteur (CN) repérés à côté d'un bouton-poussoir (80) et d'un second point de commande (76) sur la face externe du boîtier"},"teaser":{"en":"US 11,407,475 B2, \"Bicycle derailleur,\" filed December 6, 2019 (Appl. No. 16/705,478), published June 10, 2021 as US 2021/0171156, and granted August 9, 2022 to inventors Hiroyuki Kitano, Yu Goto and…","fr":"US 11 407 475 B2, « Bicycle derailleur », déposé le 6 décembre 2019 (demande n° 16/705 478), publié le 10 juin 2021 sous le numéro US 2021/0171156, et délivré le 9 août 2022 aux inventeurs Hiroyuki…"},"full":{"en":"US 11,407,475 B2, \"Bicycle derailleur,\" filed December 6, 2019 (Appl. No. 16/705,478), published June 10, 2021 as US 2021/0171156, and granted August 9, 2022 to inventors Hiroyuki Kitano, Yu Goto and Takeshi Ueda, assignee Shimano Inc. The claims cover the derailleur's own user interface — a single input mechanism that can trigger any of a long menu of system actions: sensor calibration, assist-motor tuning, display changes, actuator recovery, re-pairing, a wired/wireless communication-channel switch, shut-down, wake-up, restart, and toggling between automatic and manual shifting or between synchronized and non-synchronized shifting. Adjusted expiration is stated directly on the patent's own record as December 27, 2040 (Patent Term Adjustment for USPTO prosecution delay, later than the plain filing+20 estimate of 2039), used here rather than recomputed.","fr":"US 11 407 475 B2, « Bicycle derailleur », déposé le 6 décembre 2019 (demande n° 16/705 478), publié le 10 juin 2021 sous le numéro US 2021/0171156, et délivré le 9 août 2022 aux inventeurs Hiroyuki Kitano, Yu Goto et Takeshi Ueda, cessionnaire Shimano Inc. Les revendications portent sur l'interface utilisateur du dérailleur lui-même — un seul mécanisme de saisie capable de déclencher n'importe laquelle d'une longue liste d'actions système : calibration des capteurs, réglage du moteur d'assistance, changements d'affichage, récupération de l'actionneur, réinitialisation de l'appairage, basculement entre canal de communication filaire et sans fil, arrêt, réveil, redémarrage, et basculement entre passage automatique et manuel ou entre mode synchronisé et non synchronisé. L'expiration ajustée est indiquée directement sur la fiche du brevet au 27 décembre 2040 (ajustement de durée de brevet pour délai de procédure USPTO, postérieur à la simple estimation dépôt+20 de 2039), utilisée ici plutôt que recalculée."}},{"num":"11975800","cat":"drive","title":{"en":"Shimano derailleur with a power-source receptacle in the outer link (US 11,975,800)","fr":"Dérailleur Shimano avec logement de source d'énergie dans la biellette extérieure (US 11 975 800)"},"assignee":"Takafumi Nishino & Satoshi Idogaki / Shimano Inc.","img":"../pictures/US20230348018A1.png","alt":{"en":"Side view from the filing of US 11,975,800 (published as US 2023/0348018 A1): the derailleur (40) hung from the frame (10F), with its linkage (50, 52, 54) and chain cage (56) and the chain (12) running through it","fr":"Vue latérale tirée du dépôt du US 11 975 800 (publié sous US 2023/0348018 A1) : le dérailleur (40) fixé au cadre (10F), avec sa timonerie (50, 52, 54), sa chape (56) et la chaîne (12) qui la traverse"},"teaser":{"en":"US 11,975,800 B2 (published as US 2023/0348018 A1), \"Derailleur for human-powered vehicle\": filed February 28, 2023, granted May 7, 2024, anticipated expiry February 2043, with a continuation…","fr":"US 11 975 800 B2 (publié sous US 2023/0348018 A1), « Derailleur for human-powered vehicle » : déposé le 28 février 2023, délivré le 7 mai 2024, expiration prévue en février 2043, avec une continuation…"},"full":{"en":"US 11,975,800 B2 (published as US 2023/0348018 A1), \"Derailleur for human-powered vehicle\": filed February 28, 2023, granted May 7, 2024, anticipated
