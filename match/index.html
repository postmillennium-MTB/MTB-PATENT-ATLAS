<!--
  Patent Match now lives inside the Atlas itself, as its Match tab
  (index.html one level up, #tab=match), reading the Atlas's own D array
  live. This page used to be a standalone copy of the game with a frozen
  MATCH_DATA snapshot that had to be regenerated by hand and had drifted
  ~20 entries behind; it's kept only so existing links, and the pmr-website
  wrapper at postmillenniumrenaissance.com/atlas/match, still land on the
  game. A visitor who had picked French on the old page keeps French.
-->
<meta http-equiv="refresh" content="0; url=../index.html#tab=match">
<script>
(function(){
  var lang=null;
  try{ lang=localStorage.getItem("pmrMatchLang"); }catch(e){}
  location.replace("../index.html#tab=match"+(lang==="fr"?"&lang=fr":""));
})();
</script>
</head>
<body>
<p><a href="../index.html#tab=match">Patent Match has moved into the MTB Patent Atlas — tap here if you aren't taken there.</a></p>
</body>
