e complète de la tige télescopique, avec le levier déporté (90) et la came (70) au niveau du collier de selle actionnant une tige de soupape qui descend à travers les tubes intérieur et extérieur (20/10) jusqu'au mécanisme de verrouillage (40/50) près de la base de la tige (60)"},"teaser":{"en":"Five utility patents naming Jung-Yu Hsu as inventor, filed under two of Kind Shock's corporate names rather than one — Kind Shock Hi-Tech Co., Ltd. (assignee on US 9,487,256, \"Seat adjustment…","fr":"Cinq brevets d'utilité nommant Jung-Yu Hsu comme inventeur, déposés sous deux des raisons sociales de Kind Shock plutôt qu'une seule — Kind Shock Hi-Tech Co., Ltd. (cessionnaire du brevet US 9 487…"},"full":{"en":"Five utility patents naming Jung-Yu Hsu as inventor, filed under two of Kind Shock's corporate names rather than one — Kind Shock Hi-Tech Co., Ltd. (assignee on US 9,487,256, \"Seat adjustment assembly\") and, on a related Chinese filing, Dongguan Yuanyu Mechanical Co., Ltd. US 8,308,124 (\"Control device for adjustable bicycle seat,\" granted November 13, 2012) and US 8,191,964 (\"Adjustment device for bicycle seat,\" a hydraulic liquid/air balance chamber that holds the post's diameter constant over longer travel) are confirmed by title and inventor. US 7,673,936 and US 9,073,592 cover the same lever-actuated cylinder-and-piston lockout mechanism, but their titles and exact dates are unconfirmed; 7,673,936's 2010 grant year is estimated from its position in the sequential patent-number series rather than read off its own record.","fr":"Cinq brevets d'utilité nommant Jung-Yu Hsu comme inventeur, déposés sous deux des raisons sociales de Kind Shock plutôt qu'une seule — Kind Shock Hi-Tech Co., Ltd. (cessionnaire du brevet US 9 487 256, « Seat adjustment assembly ») et, pour un dépôt chinois apparenté, Dongguan Yuanyu Mechanical Co., Ltd. Les brevets US 8 308 124 (« Control device for adjustable bicycle seat », délivré le 13 novembre 2012) et US 8 191 964 (« Adjustment device for bicycle seat », une chambre d'équilibrage hydraulique liquide/air qui maintient un diamètre de tige constant sur une plus grande course) sont confirmés par leur titre et leur inventeur. Les brevets US 7 673 936 et US 9 073 592 couvrent le même mécanisme de verrouillage à cylindre et piston actionné par levier, mais leurs titres et leurs dates exactes ne sont pas confirmés ; l'année de délivrance de US 7 673 936, 2010, est estimée à partir de sa position dans la séquence numérique des brevets plutôt que lue directement sur sa propre fiche."}},{"num":"12291297","cat":"comp","title":{"en":"SRAM solenoid-valve dropper post (US 12,291,297)","fr":"Tige télescopique à électrovanne SRAM (US 12 291 297)"},"assignee":"SRAM","img":"../pictures/US12291297B2.png","alt":{"en":"Fig. 4 of US 12,291,297: the dropper post's control housing (402) clamped around the post (202, 208), with a block diagram showing the wireless receiver (408) and processor circuitry (410) inside it and a second housing (404) extending from its side","fr":"Fig. 4 du brevet US 12 291 297 : le boîtier de commande (402) de la tige télescopique fixé autour du tube (202, 208), avec un schéma fonctionnel montrant le récepteur sans fil (408) et les circuits du processeur (410) qu'il contient, et un second boîtier (404) prolongeant son côté"},"teaser":{"en":"US 12,291,297 B2, 'Height adjustable seat posts for bicycles,' filed February 15, 2023 and granted May 6, 2025 to SRAM LLC (inventors Rafer Chambers, Christopher Eric Golkiewicz, Chi Hui Su, Donald…","fr":"US 12 291 297 B2, « Height adjustable seat posts for bicycles », déposé le 15 février 2023 et délivré le 6 mai 2025 à SRAM LLC (inventeurs Rafer Chambers, Christopher Eric Golkiewicz, Chi Hui Su,…"},"full":{"en":"US 12,291,297 B2, 'Height adjustable seat posts for bicycles,' filed February 15, 2023 and granted May 6, 2025 to SRAM LLC (inventors Rafer Chambers, Christopher Eric Golkiewicz, Chi Hui Su, Donald Frederick Coffman, Alex Kyle McGee and Charles Dunlap). The post's upper and lower tubes telescope around a shaft-mounted piston that divides the upper tube into two fluid-filled chambers; a solenoid-driven valve blocks or opens the path between them, replacing the mechanical, cable-actuated valve most droppers use with an electronically controlled one.","fr":"US 12 291 297 B2, « Height adjustable seat posts for bicycles », déposé le 15 février 2023 et délivré le 6 mai 2025 à SRAM LLC (inventeurs Rafer Chambers, Christopher Eric Golkiewicz, Chi Hui Su, Donald Frederick Coffman, Alex Kyle McGee et Charles Dunlap). Les tubes supérieur et inférieur de la tige télescopent autour d'un piston monté sur un arbre qui divise le tube supérieur en deux chambres remplies de fluide ; une valve pilotée par électrovanne bloque ou ouvre le passage entre elles, remplaçant la valve mécanique actionnée par câble de la plupart des tiges télescopiques par une valve à commande électronique."}},{"num":"773333","cat":"comp","title":{"en":"Morrow coaster brake — the Repack hub (US 773,333 + 641,983)","fr":"Frein à rétropédalage Morrow — le moyeu de Repack (US 773 333 + 641 983)"},"assignee":"Alexander P. Morrow / Eclipse Bicycle Co. (Elmira, NY)","img":"../pictures/US773333A.png","alt":{"en":"Figs. 1 and 2 of US 773,333: the Morrow coaster-brake hub in section and in cutaway — the axle (A), the sprocket (D), the helically threaded cone (C) and the split expanding members (K, K′) inside the hub shell (X), with the brake arm (G) that anchors the hub to the frame","fr":"Fig. 1 et 2 du brevet US 773 333 : le moyeu à rétropédalage Morrow en coupe et en écorché — l'axe (A), le pignon (D), le cône à filetage hélicoïdal (C) et les éléments fendus expansibles (K, K′) à l'intérieur de la coquille du moyeu (X), avec le bras de frein (G) qui ancre le moyeu au cadre"},"teaser":{"en":"US 773,333, \"Coaster and brake device,\" Alexander P. Morrow of Elmira, New York: filed August 1, 1902, granted October 25, 1904 — one rear hub that drives when pedaled forward, freewheels when the…","fr":"US 773 333, « Coaster and brake device », Alexander P. Morrow d'Elmira (New York) : déposé le 1er août 1902, délivré le 25 octobre 1904 — un moyeu arrière unique qui entraîne quand on pédale vers…"},"full":{"en":"US 773,333, \"Coaster and brake device,\" Alexander P. Morrow of Elmira, New York: filed August 1, 1902, granted October 25, 1904 — one rear hub that drives when pedaled forward, freewheels when the pedals stop and brakes when pedaled backward. His first back-pedaling brake patent, US 641,983, was filed in 1896 and granted in 1900. Morrow's employer, the Eclipse Bicycle Co., was advertising the \"Morrow Automatic Coaster and Brake\" by 1899, and the design reached the U.S. Supreme Court: Eclipse had contracted in June 1897 to sell Willard M. Farrow's pending coaster-brake inventions, then switched to a Morrow design filed that July. In Eclipse Bicycle Co. v. Farrow (1905), Justice Holmes held that Eclipse owed Farrow royalties on the Morrow brakes because they embodied his invention; neither patent listed here is the July 1897 filing. Both expired 17 years after grant.","fr":"US 773 333, « Coaster and brake device », Alexander P. Morrow d'Elmira (New York) : déposé le 1er août 1902, délivré le 25 octobre 1904 — un moyeu arrière unique qui entraîne quand on pédale vers l'avant, tourne en roue libre quand les pédales s'arrêtent et freine quand on rétropédale. Son premier brevet de frein à rétropédalage, US 641 983, a été déposé en 1896 et délivré en 1900. L'employeur de Morrow, l'Eclipse Bicycle Co., faisait déjà la publicité du « Morrow Automatic Coaster and Brake » en 1899, et le système est allé jusqu'à la Cour suprême des États-Unis : en juin 1897, Eclipse s'était engagée par contrat à commercialiser les inventions de frein à rétropédalage de Willard M. Farrow, alors en instance, puis était passée à une conception de Morrow déposée en juillet suivant. Dans Eclipse Bicycle Co. v. Farrow (1905), le juge Holmes a statué qu'Eclipse devait des redevances à Farrow sur les freins Morrow, car ils incorporaient son invention ; aucun des deux brevets cités ici n'est le dépôt de juillet 1897. Tous deux ont expiré 17 ans après leur délivrance."}},{"num":"4765443","cat":"comp","title":{"en":"Cunningham roller-cam brake (US 4,765,443)","fr":"Frein à came à galets Cunningham (US 4 765 443)"},"assignee":"Charles B. Cunningham (Fairfax, CA)","img":"../pictures/US4765443A.png","alt":{"en":"Fig. 11 of US 4,765,443: the roller-cam brake from the front — the cable (50) pulls a cam plate (80) up between rollers (77) on the tops of two brake arms (61), which pivot on bolts (71) at the fork blades (56, 57) and press the brake shoes (92) inward below","fr":"Fig. 11 du brevet US 4 765 443 : le frein à came à galets vu de face — le câble (50) tire vers le haut une plaque-came (80) entre les galets (77) situés au sommet de deux bras de frein (61), qui pivotent sur des vis (71) aux fourreaux de fourche (56, 57) et serrent les patins (92) plus bas"},"teaser":{"en":"US 4,765,443, \"Caliper brake for mountain bicycles having wide tires,\" Charles B. Cunningham of Fairfax, California: filed March 31, 1987 as a continuation of a June 1985 application, itself a…","fr":"US 4 765 443, « Caliper brake for mountain bicycles having wide tires », Charles B. Cunningham de Fairfax (Californie) : déposé le 31 mars 1987 en continuation d'une demande de juin 1985, elle-même…"},"full":{"en":"US 4,765,443, \"Caliper brake for mountain bicycles having wide tires,\" Charles B. Cunningham of Fairfax, California: filed March 31, 1987 as a continuation of a June 1985 application, itself a continuation-in-part of one filed September 21, 1983; granted August 23, 1988. A cam plate pulled up by the cable wedges between rollers on the upper ends of two brake arms, spreading them above their pivots so the shoes close on the rim below; the cam's curved edges set the brake's mechanical advantage. The patent's Fig. 6 places the rear brake under the chainstays, behind the bottom bracket. Pre-1995 filing: the term ran 17 years from grant, to 2005.","fr":"US 4 765 443, « Caliper brake for mountain bicycles having wide tires », Charles B. Cunningham de Fairfax (Californie) : déposé le 31 mars 1987 en continuation d'une demande de juin 1985, elle-même continuation partielle d'une demande du 21 septembre 1983 ; délivré le 23 août 1988. Une plaque-came tirée vers le haut par le câble s'insère entre des galets montés en haut de deux bras de frein, les écartant au-dessus de leurs pivots pour que les patins se referment sur la jante en dessous ; le profil courbe de la came fixe le rapport de levier du frein. La Fig. 6 du brevet place le frein arrière sous les bases, derrière le boîtier de pédalier. Dépôt antérieur à 1995 : la durée courait 17 ans à compter de la délivrance, jusqu'en 2005."}},{"num":"5632362","cat":"comp","title":{"en":"AMP Research hydraulic disc brake (US 5,632,362)","fr":"Frein à disque hydraulique AMP Research (US 5,632,362)"},"assignee":"Horst Leitner / AMP Research → RockShox","img":"../pictures/US5632362A.png","alt":{"en":"Fig. 2 of US 5,632,362, an exploded view of the AMP hydraulic disc caliper: the two-piece body (32/36), opposed pistons (110-115), return spring (56) and the actuating pushrod (70-82) that later became standard mountain-bike brake architecture","fr":"Fig. 2 du brevet US 5 632 362, une vue éclatée de l'étrier de frein à disque hydraulique AMP : le corps en deux parties (32/36), les pistons opposés (110-115), le ressort de rappel (56) et la tige de poussée d'actionnement (70-82) qui est devenue par la suite l'architecture standard des freins de VTT"},"teaser":{"en":"'Bicycle disc brake': a compact hydraulic caliper using a compensating chamber and biased compensating piston for greater braking power in a lighter package. Filed by Leitner through AMP Research and…","fr":"« Bicycle disc brake » : un étrier hydraulique compact utilisant une chambre de compensation et un piston de compensation à charge biaisée pour une plus grande puissance de freinage dans un ensemble…"},"full":{"en":"'Bicycle disc brake': a compact hydraulic caliper using a compensating chamber and biased compensating piston for greater braking power in a lighter package. Filed by Leitner through AMP Research and assigned to RockShox, Inc. — the same filing year as Hope's early hydraulic discs and a year ahead of the Hayes Mag below.","fr":"« Bicycle disc brake » : un étrier hydraulique compact utilisant une chambre de compensation et un piston de compensation à charge biaisée pour une plus grande puissance de freinage dans un ensemble plus léger. Déposé par Leitner via AMP Research et cédé à RockShox, Inc. — la même année de dépôt que les premiers disques hydrauliques de Hope et un an avant le Hayes Mag ci-dessous."}},{"num":"5095770","cat":"comp","title":{"en":"Aheadset threadless headset (US 5,095,770)","fr":"Jeu de direction sans filetage Aheadset (US 5,095,770)"},"assignee":"Homer J. \"John\" Rader III → Dia-Compe / Cane Creek","img":"../pictures/US5095770A.png","alt":{"en":"Fig. 1 of US 5,095,770: a fork/headtube side view showing the threadless steerer tube (21), stem (35/37), and the compression-ring/adjuster-nut stack (47/49) that clamps it in place without threads","fr":"Fig. 1 du brevet US 5 095 770 : une vue de côté de la fourche et du tube de direction montrant le pilote non fileté (21), la potence (35/37), et l'ensemble bague de compression/écrou de réglage (47/49) qui le serre sans filetage"},"teaser":{"en":"'Steering bearing assembly for wheeled vehicle': clamping the stem to an unthreaded steerer via a compression ring and adjuster nut — licensed across the industry until expiration made it the…","fr":"« Steering bearing assembly for wheeled vehicle » : fixer la potence sur un tube de direction non fileté via une bague de compression et un écrou de réglage — licencié dans toute l'industrie jusqu'à…"},"full":{"en":"'Steering bearing assembly for wheeled vehicle': clamping the stem to an unthreaded steerer via a compression ring and adjuster nut — licensed across the industry until expiration made it the universal standard. Filed under Rader's full name, Homer J. Rader III, and originally assigned to him individually before Dia-Compe (now Cane Creek) picked it up.","fr":"« Steering bearing assembly for wheeled vehicle » : fixer la potence sur un tube de direction non fileté via une bague de compression et un écrou de réglage — licencié dans toute l'industrie jusqu'à ce que son expiration en fasse le standard universel. Déposé sous le nom complet de Rader, Homer J. Rader III, et initialement cédé à lui-même à titre individuel avant que Dia-Compe (aujourd'hui Cane Creek) ne le reprenne."}},{"num":"5115692","cat":"comp","title":{"en":"SPD clipless pedal (US 5,115,692)","fr":"Pédale automatique SPD (US 5 115 692)"},"assignee":"Shimano","img":"../pictures/US5115692A.png","alt":{"en":"Fig. 1 of US 5,115,692: a longitudinal cross-section through the pedal axle (1), showing a front and rear clamp assembly (4A/5A and 4B/5B) at each end of the pedal body, with their spring-loaded engaging portions (41a/42a and 41b/42b) that grip the cleat","fr":"Fig. 1 du brevet US 5 115 692 : une coupe longitudinale à travers l'axe de la pédale (1), montrant un ensemble de serrage avant et arrière (4A/5A et 4B/5B) à chaque extrémité du corps de pédale, avec leurs parties d'engagement à ressort (41a/42a et 41b/42b) qui saisissent la cale"},"teaser":{"en":"US 5,115,692, 'Bicycle pedal,' filed August 27, 1991 and granted May 26, 1992 to Shimano Inc., inventor Masashi Nagano. The claims cover a pedal body carrying two spring-loaded clamp assemblies,…","fr":"US 5 115 692, « Bicycle pedal », déposé le 27 août 1991 et délivré le 26 mai 1992 à Shimano Inc., inventeur Masashi Nagano. Les revendications couvrent un corps de pédale portant deux ensembles de…"},"full":{"en":"US 5,115,692, 'Bicycle pedal,' filed August 27, 1991 and granted May 26, 1992 to Shimano Inc., inventor Masashi Nagano. The claims cover a pedal body carrying two spring-loaded clamp assemblies, offset front-to-back and side-to-side across the body, each built from a front and a rear clamp member that grip a shoe cleat — the dual entry-point mechanism behind SPD's mountain pedal. The application claims foreign priority to a 1988 Japanese filing (also filed in Germany and France in 1989); the term math above runs from the US patent's own 1991 filing date, as this atlas's convention requires.","fr":"US 5 115 692, « Bicycle pedal », déposé le 27 août 1991 et délivré le 26 mai 1992 à Shimano Inc., inventeur Masashi Nagano. Les revendications couvrent un corps de pédale portant deux ensembles de serrage à ressort, décalés d'avant en arrière et de part et d'autre du corps, chacun formé d'un élément de serrage avant et arrière qui saisit la cale de la chaussure — le mécanisme à double point d'entrée derrière la pédale VTT SPD. La demande revendique une priorité étrangère sur un dépôt japonais de 1988 (également déposé en Allemagne et en France en 1989) ; le calcul de terme ci-dessus part de la date de dépôt américaine de 1991 elle-même, conformément à la convention de cet atlas."}},{"num":"11858587","cat":"comp","title":{"en":"Shimano pedal-body load-spacing system (US 11,858,587)","fr":"Système d'écartement de charge du corps de pédale Shimano (US 11 858 587)"},"assignee":"Shimano Inc.","img":"../pictures/US11858587B2.png","alt":{"en":"An exploded view from US 11,858,587 of the pedal body (30) and its bearing/bushing stack (46/48/50/52/54) around the axle, with the mounting hardware (68/69) that holds the assembly together","fr":"Une vue éclatée du brevet US 11 858 587 du corps de pédale (30) et de sa pile de bagues/roulements (46/48/50/52/54) autour de l'axe, avec la quincaillerie de fixation (68/69) qui maintient l'ensemble"},"teaser":{"en":"US 11,858,587, 'Bicycle pedal,' filed October 6, 2020 and granted January 2, 2024 to Shimano Inc. (inventors Akira Inoue, Tatsuya Watanabe, and Atsuhiro Emura). The claims cover a pedal shaft with a…","fr":"US 11 858 587, « Bicycle pedal », déposé le 6 octobre 2020 et délivré le 2 janvier 2024 à Shimano Inc. (inventeurs Akira Inoue, Tatsuya Watanabe et Atsuhiro Emura). Les revendications couvrent un axe…"},"full":{"en":"US 11,858,587, 'Bicycle pedal,' filed October 6, 2020 and granted January 2, 2024 to Shimano Inc. (inventors Akira Inoue, Tatsuya Watanabe, and Atsuhiro Emura). The claims cover a pedal shaft with a contact portion and a pedal body whose load-receiving part sits slightly clear of that contact portion under no load, closing the gap and taking up the rider's weight only once a load is actually applied — reducing the constant preload and friction a conventional bushing or bearing interface carries at all times.","fr":"US 11 858 587, « Bicycle pedal », déposé le 6 octobre 2020 et délivré le 2 janvier 2024 à Shimano Inc. (inventeurs Akira Inoue, Tatsuya Watanabe et Atsuhiro Emura). Les revendications couvrent un axe de pédale à portée de contact et un corps de pédale dont la partie réceptrice de charge reste légèrement écartée de cette portée de contact à vide, ne comblant l'écart et ne reprenant le poids du pilote qu'une fois une charge réellement appliquée — réduisant la précontrainte et le frottement constants qu'une interface à bague ou à roulement classique subit en permanence."}},{"num":"6205885","cat":"comp","title":{"en":"Eggbeater clipless pedal (US 6,205,885 + 7,225,703)","fr":"Pédale automatique Eggbeater (US 6 205 885 + 7 225 703)"},"assignee":"California Crank Brothers (Frank Hermansen, Carl Winefordner)","img":"../pictures/US6205885B1.1.png","alt":{"en":"FIG. 1 of US 6,205,885: perspective view of the pedal, with the spindle (20), the wire U-shaped members (110, 120) around the housing, and the retaining plug (140) at the outboard end","fr":"FIG. 1 du US 6 205 885 : vue en perspective de la pédale, avec l'axe (20), les éléments en U en fil (110, 120) autour du boîtier et le bouchon de retenue (140) à l'extrémité extérieure"},"teaser":{"en":"US 6,205,885 (filed September 8, 1999, granted March 27, 2001) is the first Eggbeater patent: a clipless pedal whose latch release is concentric with the spindle, so the cleat engages on any of four…","fr":"Le US 6 205 885 (déposé le 8 septembre 1999, délivré le 27 mars 2001) est le premier brevet Eggbeater : une pédale automatique dont le déclenchement est concentrique à l'axe, de sorte que la cale…"},"full":{"en":"US 6,205,885 (filed September 8, 1999, granted March 27, 2001) is the first Eggbeater patent: a clipless pedal whose latch release is concentric with the spindle, so the cleat engages on any of four sides. Two pairs of U-shaped wire members, one fixed to the housing and one to rotating sleeves, are held perpendicular by a torsion spring coaxial with the spindle, and a cleat with two shoulders locks between any adjacent pair. O-rings seal the housing at both ends. US 7,225,703 (filed March 16, 2004, granted June 5, 2007), by the same inventors, is a later pedal-and-crank filing: a fixed pedal shaft turns in a sealed cartridge bearing in the crank arm, so the pedal itself needs no bearings, bushings or seals.","fr":"Le US 6 205 885 (déposé le 8 septembre 1999, délivré le 27 mars 2001) est le premier brevet Eggbeater : une pédale automatique dont le déclenchement est concentrique à l'axe, de sorte que la cale s'engage sur l'un des quatre côtés. Deux paires d'éléments en U en fil, l'une fixée au boîtier et l'autre à des manchons rotatifs, sont maintenues perpendiculaires par un ressort de torsion coaxial à l'axe, et une cale à deux épaulements se verrouille entre deux éléments adjacents. Des joints toriques étanchent le boîtier aux deux extrémités. Le US 7 225 703 (déposé le 16 mars 2004, délivré le 5 juin 2007), des mêmes inventeurs, est un dépôt ultérieur sur l'ensemble pédale-manivelle : un axe de pédale fixe tourne dans un roulement à billes à cartouche étanche logé dans la manivelle, si bien que la pédale elle-même n'a besoin ni de roulements, ni de bagues, ni de joints."}},{"num":"6263759","cat":"comp","title":{"en":"Lock-On grip system (US 6,263,759 + 6,035,742)","fr":"Système de poignées Lock-On (US 6,263,759 + 6,035,742)"},"assignee":"ODI","img":"../pictures/US6263759B1.png","alt":{"en":"Figs. 1-3 of US 6,263,759: the grip (10) shown on the handlebar with its knurled rubber sleeve, an end-on cross-section through the clamp collar (Fig. 3) showing the locking screw (34) tightening the split ring against the bar, and a longitudinal section (Fig. 2) showing the internal ribs that key the rigid shell to the bar so it can't rotate","fr":"Fig. 1 à 3 du brevet US 6 263 759 : la poignée (10) montée sur le cintre avec son manchon en caoutchouc moleté, une coupe transversale du collier de serrage (Fig. 3) montrant la vis de blocage (34) serrant l'anneau fendu contre le cintre, et une coupe longitudinale (Fig. 2) montrant les nervures internes qui verrouillent la coque rigide sur le cintre pour l'empêcher de tourner"},"teaser":{"en":"Clamp-collar grips that don't twist or slip, licensed and enforced through the 2000s: US 6,035,742 ('Handlebar grip assembly,' filed 1997) and its continuation-in-part US 6,263,759 ('Removable,…","fr":"Des poignées à collier de serrage qui ne tournent ni ne glissent, licenciées et défendues tout au long des années 2000 : US 6,035,742 (« Handlebar grip assembly », déposé en 1997) et sa continuation…"},"full":{"en":"Clamp-collar grips that don't twist or slip, licensed and enforced through the 2000s: US 6,035,742 ('Handlebar grip assembly,' filed 1997) and its continuation-in-part US 6,263,759 ('Removable, non-turning handlebar grip,' filed 1999) — an inner rigid shell with end protrusions, clamped in place by a pair of rigid clamps, with the soft grip material affixed over the outside.","fr":"Des poignées à collier de serrage qui ne tournent ni ne glissent, licenciées et défendues tout au long des années 2000 : US 6,035,742 (« Handlebar grip assembly », déposé en 1997) et sa continuation partielle US 6,263,759 (« Removable, non-turning handlebar grip », déposée en 1999) — une coque rigide interne avec des saillies d'extrémité, maintenue en place par une paire de brides rigides, avec le matériau souple de la poignée fixé par-dessus."}},{"num":"8113087","cat":"comp","title":{"en":"Bicycle handle-bar grip (US 8,113,087)","fr":"Poignée de guidon de vélo (US 8 113 087)"},"assignee":"Franc Arnold / Ergon International GmbH (orig. RTI Sports Vertrieb von Sportartikeln GmbH)","img":"../pictures/US8113087B2.png","alt":{"en":"Fig. 1 of US 8,113,087: a longitudinal section through the bar-end grip assembly, showing the sleeve (10) slipped over the bar end (12), the grip element (16) with its supporting portion (39) for the rider's palm, the sleeve slot (30) and clamping area (18), and the separate holding-bar-end-extension clamp (20/22/24/26/28/38) that locks the assembly to the bar","fr":"Fig. 1 du brevet US 8 113 087 : une coupe longitudinale de l'ensemble poignée d'extrémité de guidon, montrant le manchon (10) glissé sur le bout de cintre (12), l'élément de préhension (16) avec sa portion de soutien (39) pour la paume du cycliste, la fente du manchon (30) et la zone de serrage (18), ainsi que le collier de serrage séparé (20/22/24/26/28/38) qui verrouille l'ensemble sur le cintre"},"teaser":{"en":"Filed under the PCT on August 18, 2004 (claiming German utility-model priority back to May 21, 2004) and granted February 14, 2012, Franc Arnold's 'Bicycle Handle-Bar Grip' splits a bar-end grip into…","fr":"Déposé sous le régime du PCT le 18 août 2004 (revendiquant une priorité de modèle d'utilité allemand remontant au 21 mai 2004) et délivré le 14 février 2012, le brevet « Bicycle Handle-Bar Grip » de…"},"full":{"en":"Filed under the PCT on August 18, 2004 (claiming German utility-model priority back to May 21, 2004) and granted February 14, 2012, Franc Arnold's 'Bicycle Handle-Bar Grip' splits a bar-end grip into a sleeve that clamps to the bar and a separate grip element joined over part of the sleeve's length, with a distinct supporting portion sized to carry the rider's palm through a bar-end grip change. Originally assigned to RTI Sports Vertrieb von Sportartikeln GmbH, now held by Ergon International GmbH.","fr":"Déposé sous le régime du PCT le 18 août 2004 (revendiquant une priorité de modèle d'utilité allemand remontant au 21 mai 2004) et délivré le 14 février 2012, le brevet « Bicycle Handle-Bar Grip » de Franc Arnold divise une poignée d'extrémité de guidon en un manchon qui se serre sur le cintre et un élément de préhension distinct, fixé sur une partie de la longueur du manchon, avec une portion de soutien dédiée dimensionnée pour accueillir la paume du cycliste lors d'un changement de prise en bout de guidon. Cédé à l'origine à RTI Sports Vertrieb von Sportartikeln GmbH, aujourd'hui détenu par Ergon International GmbH."}},{"num":"4939950","cat":"comp","title":{"en":"Girvin Flexstem (US 4,939,950)","fr":"Potence Flexstem de Girvin (US 4 939 950)"},"assignee":"Robert H. Girvin / K G Engineering, Inc.","img":"../pictures/US4939950A.png","alt":{"en":"Figs. 1 and 2 of US 4,939,950: a road bike with the stem assembly (10) at the head tube, and a detail view of the stem itself showing the pivot arm (40) mounted on the column member (18/22/23), resisted by the spring assembly (5) beneath the handlebar clamp (44/60/62)","fr":"Fig. 1 et 2 du brevet US 4 939 950 : un vélo avec l'ensemble potence (10) au tube de direction, et une vue détaillée de la potence montrant le bras pivotant (40) monté sur l'élément colonne (18/22/23), retenu par l'ensemble ressort (5) sous la fixation du cintre (44/60/62)"},"teaser":{"en":"US 4,939,950, \"Handlebar assembly for cycles,\" filed October 24, 1988 and granted July 10, 1990 to Robert H. Girvin of Holliston, Massachusetts, assigned to K G Engineering, Inc. of Woonsocket, Rhode…","fr":"US 4 939 950, « Handlebar assembly for cycles », déposé le 24 octobre 1988 et délivré le 10 juillet 1990 à Robert H. Girvin, de Holliston (Massachusetts), cédé à K G Engineering, Inc. de Woonsocket…"},"full":{"en":"US 4,939,950, \"Handlebar assembly for cycles,\" filed October 24, 1988 and granted July 10, 1990 to Robert H. Girvin of Holliston, Massachusetts, assigned to K G Engineering, Inc. of Woonsocket, Rhode Island. A pivot arm mounted on the steerer-clamping column swings forward to carry the handlebar, resisted by a rubber or elastomer spring element that cushions the pivot instead of locking it rigid — a shock absorber built into the stem rather than the fork. Pre-GATT filing: the term ran 17 years from grant, to 2007.","fr":"US 4 939 950, « Handlebar assembly for cycles », déposé le 24 octobre 1988 et délivré le 10 juillet 1990 à Robert H. Girvin, de Holliston (Massachusetts), cédé à K G Engineering, Inc. de Woonsocket (Rhode Island). Un bras pivotant monté sur la colonne de serrage du pilote se déploie vers l'avant pour porter le cintre, retenu par un élément-ressort en caoutchouc ou en élastomère qui amortit le pivot au lieu de le bloquer rigidement — un amortisseur intégré à la potence plutôt qu'à la fourche. Dépôt antérieur au GATT : la durée courait 17 ans à compter de la délivrance, jusqu'en 2007."}},{"num":"615003","cat":"comp","title":{"en":"Crampon convex pedal platform (US D615,003 S)","fr":"Plateforme de pédale convexe Crampon (US D615,003 S)"},"assignee":"Lance & Chris Canfield / Canfield Brothers","img":"../pictures/USD615003S1.png","alt":{"en":"FIG. 1 of US D615,003 S: a perspective view of the bicycle pedal, showing the convex dome-up platform, its tapered edges, and the center axle boss with mounting hardware","fr":"FIG. 1 du brevet US D615 003 S : une vue en perspective de la pédale de vélo, montrant la plateforme convexe bombée vers le haut, ses bords effilés et le moyeu central de l'axe avec la quincaillerie de montage"},"teaser":{"en":"A patented convex (dome-up) platform that tapers to 6mm leading edges — the opposite of every concave pedal on the market. Covers all Crampon variants (Ultimate, Mountain, Magnesium). Filed May 13,…","fr":"Une plateforme convexe brevetée (bombée vers le haut) qui s'amincit jusqu'à des bords d'attaque de 6 mm — l'inverse de chaque pédale concave sur le marché. Couvre toutes les variantes Crampon…"},"full":{"en":"A patented convex (dome-up) platform that tapers to 6mm leading edges — the opposite of every concave pedal on the market. Covers all Crampon variants (Ultimate, Mountain, Magnesium). Filed May 13, 2009 by Christopher and Lance Canfield, granted May 4, 2010 — fetched and read directly via the GitHub Actions figure tool, which confirms the entry's inventors, dates, and 14-year design term (pre-2015 design-patent term rule, matching this atlas's `exp` math) against the patent's own front page rather than Canfield's FAQ page alone.","fr":"Une plateforme convexe brevetée (bombée vers le haut) qui s'amincit jusqu'à des bords d'attaque de 6 mm — l'inverse de chaque pédale concave sur le marché. Couvre toutes les variantes Crampon (Ultimate, Mountain, Magnesium). Déposé le 13 mai 2009 par Christopher et Lance Canfield, délivré le 4 mai 2010 — récupéré et lu directement via l'outil GitHub Actions de récupération de figures, qui confirme les inventeurs, les dates et le terme de 14 ans du brevet de dessin (règle antérieure à 2015, cohérente avec le calcul `exp` de cet atlas) à partir de la première page du brevet lui-même plutôt que de la seule page FAQ de Canfield."}},{"num":"9234553","cat":"comp","title":{"en":"Ice Tech clad disc brake rotor (US 9,234,553)","fr":"Disque de frein plaqué Ice Tech (US 9,234,553)"},"assignee":"Toru Iwai & Makoto Souwa / Shimano Inc.","img":"../pictures/US9234553B2.png","alt":{"en":"Fig. 1 of US 9,234,553: the rotor (12) mounted on a fork with its caliper (14) and lever (16), the exposed aluminum cooling fin (24/24a) visible in each of the rotor's five spider arms alongside the steel braking ring (22)","fr":"Fig. 1 du brevet US 9 234 553 : le disque (12) monté sur une fourche avec son étrier (14) et son levier (16), l'ailette de refroidissement en aluminium exposée (24/24a) visible dans chacun des cinq bras du disque, à côté de la piste de freinage en acier (22)"},"teaser":{"en":"'Bicycle disc brake rotor' — filed December 29, 2011, published as US 2013/0168193 A1 on July 4, 2013, granted January 12, 2016. Claims a rotor blade built as a three-layer clad sandwich — stainless…","fr":"« Bicycle disc brake rotor » — déposé le 29 décembre 2011, publié sous le numéro US 2013/0168193 A1 le 4 juillet 2013, délivré le 12 janvier 2016. Revendique une lame de disque construite comme un…"},"full":{"en":"'Bicycle disc brake rotor' — filed December 29, 2011, published as US 2013/0168193 A1 on July 4, 2013, granted January 12, 2016. Claims a rotor blade built as a three-layer clad sandwich — stainless steel braking surfaces bonded to either side of an aluminum core — with the aluminum core extending inward past the steel to form an exposed radiator fin at the rotor's inner diameter, wicking heat out of the friction surface faster than a solid-steel disc can shed it alone. This is the mechanism sold as Ice Tech, later extended as Ice Tech Freeza.","fr":"« Bicycle disc brake rotor » — déposé le 29 décembre 2011, publié sous le numéro US 2013/0168193 A1 le 4 juillet 2013, délivré le 12 janvier 2016. Revendique une lame de disque construite comme un sandwich plaqué à trois couches — des surfaces de freinage en acier inoxydable liées de part et d'autre d'un noyau en aluminium — le noyau d'aluminium s'étendant vers l'intérieur au-delà de l'acier pour former une ailette radiatrice exposée au diamètre intérieur du disque, évacuant la chaleur de la surface de friction plus vite qu'un disque tout acier ne peut le faire seul. C'est le mécanisme commercialisé sous le nom Ice Tech, plus tard étendu en Ice Tech Freeza."}},{"num":"11364968","cat":"comp","title":{"en":"eBike ABS pressure modulator (US 11,364,968)","fr":"Modulateur de pression ABS pour vélo électrique (US 11 364 968)"},"assignee":"Alessandro Moia / Robert Bosch GmbH","img":"../pictures/US11364968B2.png","alt":{"en":"A hydraulic schematic from US 11,364,968 B2: the brake-fluid reservoir (15) feeds the modulator housing (2/3) through line 19a; an actuator (6) drives a piston assembly (30/40/41/50-53) that meters pressure out through line 19b to the caliper and wheel (121), with a wheel-speed sensor (11) feeding the control unit (10)","fr":"Un schéma hydraulique du brevet US 11 364 968 B2 : le réservoir de liquide de frein (15) alimente le boîtier du modulateur (2/3) par la ligne 19a ; un actionneur (6) entraîne un ensemble piston (30/40/41/50-53) qui dose la pression vers l'étrier et la roue (121) par la ligne 19b, avec un capteur de vitesse de roue (11) informant l'unité de contrôle (10)"},"teaser":{"en":"The hydraulic pressure-modulator valve block behind Bosch eBike ABS: added wheel-speed sensors feed a compact modulator that individually meters brake-line pressure to prevent the front wheel from…","fr":"Le bloc-valve modulateur de pression hydraulique derrière l'ABS pour vélo électrique de Bosch : des capteurs de vitesse de roue additionnels alimentent un modulateur compact qui dose individuellement…"},"full":{"en":"The hydraulic pressure-modulator valve block behind Bosch eBike ABS: added wheel-speed sensors feed a compact modulator that individually meters brake-line pressure to prevent the front wheel from locking under a hard stop, intervening only when needed rather than constantly adjusting. Filed September 8, 2020 and granted June 21, 2022 as US 11,364,968, naming Bosch researcher Alessandro Moia as inventor, claiming a September 19, 2019 German utility-model priority — all read directly off the patent's own front page.","fr":"Le bloc-valve modulateur de pression hydraulique derrière l'ABS pour vélo électrique de Bosch : des capteurs de vitesse de roue additionnels alimentent un modulateur compact qui dose individuellement la pression de la ligne de frein pour empêcher le blocage de la roue avant lors d'un freinage brusque, n'intervenant qu'en cas de besoin plutôt qu'en ajustant en continu. Déposé le 8 septembre 2020 et délivré le 21 juin 2022 sous le numéro US 11 364 968, nommant comme inventeur le chercheur Bosch Alessandro Moia, revendiquant une priorité de modèle d'utilité allemand du 19 septembre 2019 — le tout lu directement sur la première page du brevet."}},{"num":"8662517","cat":"comp","title":{"en":"GripLock headset retention (US 8,662,517)","fr":"Retenue de jeu de direction GripLock (US 8,662,517)"},"assignee":"Chris King","img":"../pictures/US8662517B2.png","alt":{"en":"Fig. 2 of US 8,662,517 B2: an exploded steering-bearing assembly showing the cap (2), compression ring (41), head tube (12) and steerer (11) stacked in order, with the wedge components (5, 19, 42, 17) that isolate bearing preload from steerer clamping","fr":"Fig. 2 du brevet US 8 662 517 B2 : un ensemble éclaté du jeu de direction montrant le capuchon (2), la bague de compression (41), le tube de direction (12) et le pilote (11) empilés dans l'ordre, avec les éléments coniques (5, 19, 42, 17) qui isolent la précharge des roulements du serrage du pilote"},"teaser":{"en":"An isolated-wedge system separating bearing preload from steerer-tube clamping, so impacts through the steerer can't hammer the headset out of adjustment on long-travel bikes.","fr":"Un système à cale isolée séparant la précharge des roulements du serrage du tube de direction, de sorte que les impacts à travers le tube de direction ne puissent pas dérégler le jeu de direction sur…"},"full":{"en":"An isolated-wedge system separating bearing preload from steerer-tube clamping, so impacts through the steerer can't hammer the headset out of adjustment on long-travel bikes.","fr":"Un système à cale isolée séparant la précharge des roulements du serrage du tube de direction, de sorte que les impacts à travers le tube de direction ne puissent pas dérégler le jeu de direction sur les vélos à grand débattement."}},{"num":"12337923","cat":"comp","title":{"en":"AeroSet internal cable-routed headset (US 12,337,923)","fr":"Jeu de direction AeroSet à câblage interne (US 12 337 923)"},"assignee":"Chris King","img":"../pictures/US12337923B2.png","alt":{"en":"Fig. 3 of US 12,337,923 B2: a headset cross-section with the brake/derailleur housing (180) threaded down through an enlarged top cap (170) and the bearing stack (150/156/160) into the steerer tube (120) and head tube (110), instead of running outside the headset","fr":"Fig. 3 du brevet US 12 337 923 B2 : une coupe du jeu de direction avec la gaine de frein/dérailleur (180) enfilée à travers un capuchon supérieur agrandi (170) et l'empilement de roulements (150/156/160) jusque dans le pilote (120) et le tube de direction (110), au lieu de longer l'extérieur du jeu de direction"},"teaser":{"en":"A GripLock-based headset design in which the upper cap and lower bearing race are enlarged enough to route brake and derailleur housing straight through the headset's own bearing stack rather than…","fr":"Un jeu de direction basé sur GripLock dont le capuchon supérieur et la bague de roulement inférieure sont agrandis pour permettre aux gaines de frein et de dérailleur de traverser directement…"},"full":{"en":"A GripLock-based headset design in which the upper cap and lower bearing race are enlarged enough to route brake and derailleur housing straight through the headset's own bearing stack rather than around it. Chris King announced the grant in July 2025; the AeroSet line the patent covers had already shipped under 'patent pending' status for several years by then. The USPTO/Google Patents record itself was unreachable this pass (a standing network-access block on this session, not a missing document), so the filing year above is inferred from that multi-year 'patent pending' window rather than read off the document — treat 2021 as approximate until a session with working patent-database access confirms the actual filing date and named inventor(s).","fr":"Un jeu de direction basé sur GripLock dont le capuchon supérieur et la bague de roulement inférieure sont agrandis pour permettre aux gaines de frein et de dérailleur de traverser directement l'empilement de roulements du jeu de direction plutôt que de le contourner. Chris King a annoncé la délivrance en juillet 2025 ; la gamme AeroSet couverte par le brevet était déjà commercialisée sous statut « brevet en instance » depuis plusieurs années. Le dossier USPTO/Google Patents lui-même est resté inaccessible lors de cette recherche (un blocage réseau permanent de cette session, pas un document manquant), donc l'année de dépôt ci-dessus est déduite de cette fenêtre pluriannuelle de « brevet en instance » plutôt que lue sur le document — considérer 2021 comme approximatif jusqu'à ce qu'une session ayant un accès fonctionnel aux bases de brevets confirme la date de dépôt réelle et le ou les inventeurs nommés."}},{"num":"DE202017003717U1","cat":"comp","title":{"en":"Intend Stiffmaster headset (DE 20 2017 003 717 U1)","fr":"Jeu de direction Intend Stiffmaster (DE 20 2017 003 717 U1)"},"assignee":"Cornelius Kapfinger / Intend Bicycle Components (Freiburg, Germany)","img":"../pictures/DE202017003717U1.png","alt":{"en":"Exploded view from DE 20 2017 003 717 U1 (published 2017.08.31): from top, the clamping top cap (1), a sleeved spacer/collar (2), the pressed-through sleeve (3), the head-tube cup (4/5), the headset bearing (6), a second bearing/seal (7), and the lower cup — the sleeve runs through the cap, both bearings and the cup so they lock together as one unit on the steerer","fr":"Vue éclatée de la DE 20 2017 003 717 U1 (publiée le 2017.08.31) : de haut en bas, le capuchon de serrage (1), une entretoise/collier à douille (2), la douille traversante (3), la cuvette du tube de direction (4/5), le roulement du jeu de direction (6), un second roulement/joint (7), et la cuvette inférieure — la douille traverse le capuchon, les deux roulements et la cuvette pour qu'ils se verrouillent en une seule unité sur le pilote"},"teaser":{"en":"A registered German utility model (Gebrauchsmuster — DE's unexamined, self-registered protection, distinct from an examined DE patent, with a maximum 10-year term from filing paid in renewal stages…","fr":"Un modèle d'utilité allemand enregistré (Gebrauchsmuster — la protection allemande non examinée et auto-enregistrée, distincte d'un brevet allemand examiné, avec une durée maximale de 10 ans à compter…"},"full":{"en":"A registered German utility model (Gebrauchsmuster — DE's unexamined, self-registered protection, distinct from an examined DE patent, with a maximum 10-year term from filing paid in renewal stages rather than a fixed 20-year grant), published Aug. 31, 2017. The Stiffmaster replaces the usual separate, movable bearing and compression-ring stack with one sleeve pressed through the head-tube cup, both bearings and the top cap, then clamped directly onto the steerer tube with a bolt — locking the entire upper headset assembly to the steerer instead of letting it float on the bearings alone. Intend's own figures (up to 40%) and independent press testing both report a real, measurable cockpit-stiffness gain from the change. Filing year read from the document's own publication date; day-level filing date and whether renewal fees have kept the registration alive past its early renewal stage weren't independently confirmed this pass (this session's patent-database access is blocked, per the standing network constraint) — both images were supplied directly by the user.","fr":"Un modèle d'utilité allemand enregistré (Gebrauchsmuster — la protection allemande non examinée et auto-enregistrée, distincte d'un brevet allemand examiné, avec une durée maximale de 10 ans à compter du dépôt payée par paliers de renouvellement plutôt qu'une délivrance fixe de 20 ans), publié le 31 août 2017. Le Stiffmaster remplace l'habituel empilement séparé et mobile de roulement et de bague de compression par une seule douille traversant la cuvette du tube de direction, les deux roulements et le capuchon supérieur, puis serrée directement sur le pilote avec un boulon — verrouillant l'ensemble du jeu de direction supérieur sur le pilote plutôt que de le laisser flotter sur les seuls roulements. Les propres chiffres d'Intend (jusqu'à 40 %) et des essais de presse indépendants rapportent tous deux un gain réel et mesurable de rigidité du poste de pilotage grâce à ce changement. Année de dépôt lue à partir de la date de publication du document lui-même ; la date de dépôt exacte et le maintien ou non de l'enregistrement au-delà de son premier palier de renouvellement n'ont pas été confirmés de façon indépendante lors de cette recherche (l'accès de cette session aux bases de brevets est bloqué, conformément à la contrainte réseau habituelle) — les deux images ont été fournies directement par l'utilisateur."}},{"num":"667348","cat":"comp","title":{"en":"Crampon pedal, second design (US D667,348)","fr":"Pédale Crampon, second design (US D667,348)"},"assignee":"Christopher & Lance Canfield","img":"../pictures/USD667348S1.png","alt":{"en":"Canfield Crampon second pedal design patent drawing, US D667,348, showing the platform's ornamental shape","fr":"Dessin du second brevet de dessin de la pédale Crampon de Canfield, US D667,348, montrant la forme ornementale de la plateforme"},"teaser":{"en":"Filed June 2011, granted September 2012 — the brothers' second pedal design patent, citing their own D615,003 as prior art. Together the pair cover the Crampon platform family.","fr":"Déposé en juin 2011, délivré en septembre 2012 — le second brevet de dessin de pédale des frères, citant leur propre D615,003 comme antériorité. Ensemble, les deux couvrent la famille de plateformes…"},"full":{"en":"Filed June 2011, granted September 2012 — the brothers' second pedal design patent, citing their own D615,003 as prior art. Together the pair cover the Crampon platform family.","fr":"Déposé en juin 2011, délivré en septembre 2012 — le second brevet de dessin de pédale des frères, citant leur propre D615,003 comme antériorité. Ensemble, les deux couvrent la famille de plateformes Crampon."}},{"num":"EP0792795","cat":"comp","title":{"en":"Hope hydraulic brake & brake-disc patents (EP 0,792,795 + GB 2,437,745)","fr":"Brevets de freins hydrauliques et de disques de frein Hope (EP 0 792 795 + GB 2 437 745)"},"assignee":"Ian Weatherill & Simon Sharp / Hope Technology (Barnoldswick, England)","img":"../pictures/EP0792795A3.png","alt":{"en":"Fig. 4 of EP 0,792,795: a cross-section of the brake caliper assembly (16), showing the fluid reservoir (31) on top, its control knob and bleed piston, the port (32) connecting reservoir to cylinder, and the actuating piston (27/28/29) and brake hose (17) below","fr":"Fig. 4 du brevet EP 0 792 795 : une coupe de l'ensemble étrier de frein (16), montrant le réservoir de liquide (31) au-dessus, son bouton de commande et son piston de purge, l'orifice (32) reliant le réservoir au cylindre, ainsi que le piston d'actionnement (27/28/29) et la durite (17) en dessous"},"teaser":{"en":"Two ex-Rolls-Royce aerospace engineers, unimpressed by cantilever brakes, built a hydraulic disc caliper in 1989 and exhibited 14 bikes' worth at Interbike 1992 — company lore not tied to a specific…","fr":"Deux ingénieurs aérospatiaux ex-Rolls-Royce, peu impressionnés par les freins cantilever, ont construit un étrier à disque hydraulique en 1989 et exposé l'équivalent de 14 vélos à l'Interbike 1992 —…"},"full":{"en":"Two ex-Rolls-Royce aerospace engineers, unimpressed by cantilever brakes, built a hydraulic disc caliper in 1989 and exhibited 14 bikes' worth at Interbike 1992 — company lore not tied to a specific patent number. Two later patents are: EP 0,792,795, \"Hydraulic brakes\" (Ian Weatherill and Simon Sharp, filed February 26, 1997), covering a reservoir-to-cylinder self-bleed port that shuts once the piston moves to actuate the brake; and GB 2,437,745, \"Brake disc manufacture\" (Simon Sharp, assignee Hope Technology, filed May 5, 2006), covering a vacuum-brazed process joining two braking elements and cooling fins into a thin ventilated rotor. Both were withdrawn before grant.","fr":"Deux ingénieurs aérospatiaux ex-Rolls-Royce, peu impressionnés par les freins cantilever, ont construit un étrier à disque hydraulique en 1989 et exposé l'équivalent de 14 vélos à l'Interbike 1992 — une anecdote d'entreprise non rattachée à un numéro de brevet précis. Deux brevets plus tardifs : EP 0 792 795, « Hydraulic brakes » (freins hydrauliques), déposé par Ian Weatherill et Simon Sharp le 26 février 1997, couvrant un orifice d'auto-purge entre le réservoir et le cylindre qui se ferme dès que le piston se déplace pour actionner le frein ; et GB 2 437 745, « Brake disc manufacture » (fabrication de disques de frein), déposé par Simon Sharp, cédé à Hope Technology, le 5 mai 2006, couvrant un procédé de brasage sous vide assemblant deux éléments de freinage et des ailettes de refroidissement en un disque ventilé mince. Les deux ont été retirés avant délivrance."}},{"num":"8562551","cat":"comp","title":{"en":"Leatt-Brace cervical spine protection (US 8,562,551)","fr":"Protection cervicale Leatt-Brace (US 8 562 551)"},"assignee":"Dr. Christopher Leatt / Leatt Corporation (South Africa)","img":"../pictures/US8562551B2.png","alt":{"en":"Fig. 1 of US 8,562,551 B2: a side view of the neck brace (20) worn beneath a motocross-style helmet (100), showing the brace's upward-facing ring surface (38, marked FZ) that catches the helmet's rear edge (74/76) to limit head tilt, and the downward column (40/70/72) that carries the load past the shoulder to the wearer's back","fr":"Fig. 1 du brevet US 8 562 551 B2 : une vue de côté de la minerve (20) portée sous un casque de style motocross (100), montrant la surface annulaire orientée vers le haut de la minerve (38, marquée FZ) qui retient le bord arrière du casque (74/76) pour limiter le basculement de la tête, et la colonne descendante (40/70/72) qui transfère la charge au-delà de l'épaule vers le dos du porteur"},"teaser":{"en":"US 8,562,551 B2, \"Neck Brace,\" naming Christopher James Leatt (Constantia, South Africa) as inventor and Xceed Holdings CC (Cape Town) as assignee — the corporate entity behind the Leatt Corporation…","fr":"US 8 562 551 B2, « Neck Brace » (minerve), nommant Christopher James Leatt (Constantia, Afrique du Sud) comme inventeur et Xceed Holdings CC (Le Cap) comme cessionnaire — l'entité derrière la marque…"},"full":{"en":"US 8,562,551 B2, \"Neck Brace,\" naming Christopher James Leatt (Constantia, South Africa) as inventor and Xceed Holdings CC (Cape Town) as assignee — the corporate entity behind the Leatt Corporation brand. A two-piece ring, releasably split for on/off fitting, with upward-facing surfaces that catch a helmeted head before it tilts too far and a downward column that carries the resulting load to the wearer's back on either side of the spine, redirecting force away from the cervical spine itself. Granted October 22, 2013 as a continuation of an application filed May 25, 2006 (issued as US 7,993,293), itself a continuation of the original PCT filing (PCT/ZA2004/000148, filed November 26, 2004), which claims priority to a South African application filed November 26, 2003 (ZA 2003/9174) — the year after the 2001 racetrack fatality Leatt has said motivated the design. Term runs from that 2004 PCT filing date, giving an estimated expiry of 2024 (already passed); the patent's own front page notes zero days of patent-term adjustment and a terminal disclaimer tying its term to the earlier-filed parent. One of the 30+ patents Leatt holds worldwide spanning the brace mechanism and the later 360° Turbine helmet technology — this is the specific one verified this pass.","fr":"US 8 562 551 B2, « Neck Brace » (minerve), nommant Christopher James Leatt (Constantia, Afrique du Sud) comme inventeur et Xceed Holdings CC (Le Cap) comme cessionnaire — l'entité derrière la marque Leatt Corporation. Un anneau en deux pièces, séparable pour l'enfilage, avec des surfaces orientées vers le haut qui retiennent une tête casquée avant qu'elle ne bascule trop loin, et une colonne descendante qui transfère la charge résultante vers le dos du porteur de part et d'autre de la colonne vertébrale, redirigeant la force loin de la colonne cervicale elle-même. Délivré le 22 octobre 2013 comme continuation d'une demande déposée le 25 mai 2006 (délivrée sous le numéro US 7 993 293), elle-même continuation du dépôt PCT original (PCT/ZA2004/000148, déposé le 26 novembre 2004), qui revendique la priorité d'une demande sud-africaine déposée le 26 novembre 2003 (ZA 2003/9174) — l'année suivant l'accident mortel sur circuit de 2001 que Leatt dit avoir motivé la conception. La durée court à partir de ce dépôt PCT de 2004, donnant une expiration estimée à 2024 (déjà passée) ; la première page du brevet indique zéro jour d'ajustement de durée et un désistement terminal liant sa durée à celle du brevet parent déposé antérieurement. L'un des plus de 30 brevets que Leatt détient dans le monde, couvrant le mécanisme de la minerve et, plus tard, la technologie de casque 360° Turbine — celui-ci est le brevet spécifique vérifié cette fois-ci."}},{"num":"7665929","cat":"comp","title":{"en":"BMX/MTB starting gate (US 7,665,929)","fr":"Portillon de départ BMX/VTT (US 7,665,929)"},"assignee":"Prostuff LLC","img":"../pictures/US7665929B2.png","alt":{"en":"BMX and mountain bike starting gate patent drawing, Fig. 1, showing the multi-lane spring-released gate assembly on the starting ramp","fr":"Dessin de brevet du portillon de départ BMX et VTT, Fig. 1, montrant l'ensemble de portillon multi-couloirs à libération par ressort sur la rampe de départ"},"teaser":{"en":"'Starting gate for BMX and mountain bike racing' — granted February 23, 2010 to Prostuff LLC. A spring-loaded, simultaneously-releasing gate spanning multiple racing lanes, the same basic mechanism…","fr":"« Starting gate for BMX and mountain bike racing » — délivré le 23 février 2010 à Prostuff LLC. Un portillon à ressort se libérant simultanément sur plusieurs couloirs de course, le même mécanisme de…"},"full":{"en":"'Starting gate for BMX and mountain bike racing' — granted February 23, 2010 to Prostuff LLC. A spring-loaded, simultaneously-releasing gate spanning multiple racing lanes, the same basic mechanism behind the start-hill gates at every BMX track and MTB dual-slalom/four-cross course.","fr":"« Starting gate for BMX and mountain bike racing » — délivré le 23 février 2010 à Prostuff LLC. Un portillon à ressort se libérant simultanément sur plusieurs couloirs de course, le même mécanisme de base derrière les portillons de départ sur chaque piste de BMX et chaque parcours de dual-slalom/four-cross VTT."}},{"num":"3514091","cat":"comp","title":{"en":"Park Tool repair stand clamp (US 3,514,091)","fr":"Pince de pied d'atelier Park Tool (US 3,514,091)"},"assignee":"James E. Johnson, Arthur B. Engstrom & Howard C. Hawkins / Park Tool Co. (St. Paul, MN)","img":"../pictures/US3514091A.png","alt":{"en":"The single drawing sheet of US 3,514,091, carrying all four figures: Fig. 1 the whole stand on its cast base (10) and upright post (11); Fig. 2 the clamp head in perspective with its jaws (18/19) and cam lever (21); Fig. 4 a section through the cam and screw mechanism; Fig. 3 a section through the clamp body showing how it mounts to the post","fr":"L'unique planche de dessin du brevet US 3 514 091, portant les quatre figures : Fig. 1 le pied complet sur sa base fondue (10) et son montant (11) ; Fig. 2 la tête de serrage en perspective avec ses mâchoires (18/19) et son levier à came (21) ; Fig. 4 une coupe du mécanisme de came et de vis ; Fig. 3 une coupe du corps de la pince montrant sa fixation au montant"},"teaser":{"en":"The clamp that made the repair stand a category. Park Tool started in 1963 when two St. Paul shop owners built the PRS-1 to get bikes off the floor and up to working height; this filing covers the…","fr":"La pince qui a fait du pied d'atelier une catégorie à part entière. Park Tool a démarré en 1963 quand deux propriétaires de magasin de Saint-Paul ont construit le PRS-1 pour sortir les vélos du sol et…"},"full":{"en":"The clamp that made the repair stand a category. Park Tool started in 1963 when two St. Paul shop owners built the PRS-1 to get bikes off the floor and up to working height; this filing covers the mechanism that made it practical — a cam-style clamp that grips a frame tube one-handed, mounted on a rotating holder atop a wide stable base. The patent is explicit that the clamp is separable from the stand and could be mounted on other uprights, which is essentially the whole later product line described in advance. Verified against the patent's own drawing sheet: 'CLAMPING DEVICE', filed January 13, 1967, granted May 26, 1970, to James E. Johnson, Arthur B. Engstrom and Howard C. Hawkins. An earlier revision of this entry gave the filing year as 1968; the document itself says 1967.","fr":"La pince qui a fait du pied d'atelier une catégorie à part entière. Park Tool a démarré en 1963 quand deux propriétaires de magasin de Saint-Paul ont construit le PRS-1 pour sortir les vélos du sol et les amener à hauteur de travail ; ce dépôt couvre le mécanisme qui l'a rendu pratique — une pince de type came qui saisit un tube de cadre d'une seule main, montée sur un support rotatif au sommet d'une base large et stable. Le brevet précise explicitement que la pince est détachable du pied et pourrait être montée sur d'autres montants, ce qui décrit essentiellement toute la gamme de produits ultérieure à l'avance. Vérifié d'après la planche de dessin du brevet lui-même : « CLAMPING DEVICE », déposé le 13 janvier 1967, délivré le 26 mai 1970, au nom de James E. Johnson, Arthur B. Engstrom et Howard C. Hawkins. Une révision antérieure de cette fiche indiquait 1968 comme année de dépôt ; le document lui-même indique 1967."}},{"num":"4593923","cat":"comp","title":{"en":"Bicycle sprocket chain scrubber (US 4,593,923)","fr":"Nettoyeur de chaîne à pignon de vélo (US 4,593,923)"},"assignee":"Park Tool Co.","img":"../pictures/US4593923A.png","alt":{"en":"Drawing sheet of US 4,593,923: the sealed chain-scrubbing housing that clips around the chain, showing the internal brush layout and solvent reservoir that scrub the chain in place as it's back-pedaled","fr":"Planche de dessin du brevet US 4 593 923 : le boîtier scellé de nettoyage de chaîne qui se clipse autour de la chaîne, montrant la disposition interne des brosses et le réservoir de solvant qui nettoient la chaîne en place pendant qu'elle est pédalée à l'envers"},"teaser":{"en":"The sealed chain-cleaning box: a housing that clips around the chain with internal brushes and a solvent bath, so the chain is scrubbed in place while being back-pedaled rather than removed and…","fr":"Le boîtier scellé de nettoyage de chaîne : un boîtier qui se clipse autour de la chaîne avec des brosses internes et un bain de solvant, de sorte que la chaîne soit brossée en place tout en étant…"},"full":{"en":"The sealed chain-cleaning box: a housing that clips around the chain with internal brushes and a solvent bath, so the chain is scrubbed in place while being back-pedaled rather than removed and soaked. The design became the template for essentially every chain cleaner sold since, Park’s own CM-series included.","fr":"Le boîtier scellé de nettoyage de chaîne : un boîtier qui se clipse autour de la chaîne avec des brosses internes et un bain de solvant, de sorte que la chaîne soit brossée en place tout en étant pédalée à l'envers plutôt que retirée et trempée. Le design est devenu le modèle de pratiquement chaque nettoyeur de chaîne vendu depuis, y compris la propre série CM de Park."}},{"num":"4967435","cat":"comp","title":{"en":"Cool Tool multi-function bike tool (US 4,967,435)","fr":"Outil multifonction de vélo Cool Tool (US 4,967,435)"},"assignee":"Robert L. Seals","img":"../pictures/US4967435A.png","alt":{"en":"Fig. 1 of US 4,967,435: an exploded/cutaway view of the tool body, calling out the adjustable open-end wrench jaws (26/28/29), the chain-link remover's threaded shaft (16/64), and the socket and allen-wrench components (36/50/66) nested inside the handle","fr":"Fig. 1 du brevet US 4 967 435 : une vue éclatée/en coupe du corps de l'outil, repérant les mâchoires de clé plate réglable (26/28/29), la tige filetée du dérive-chaîne (16/64), et les composants de douille et de clés Allen (36/50/66) nichés dans le manche"},"teaser":{"en":"Robert Seals — the godfather of the modern multi-function bike tool. Nearly every folding multitool on the market today, from the cheapest bar-end wrench set to Topeak's and Crankbrothers' current…","fr":"Robert Seals — le parrain de l'outil multifonction de vélo moderne. Presque chaque multi-outil pliant sur le marché aujourd'hui, du kit de clés bout de guidon le moins cher aux gammes actuelles de…"},"full":{"en":"Robert Seals — the godfather of the modern multi-function bike tool. Nearly every folding multitool on the market today, from the cheapest bar-end wrench set to Topeak's and Crankbrothers' current lineups, is a descendant of this one filing.","fr":"Robert Seals — le parrain de l'outil multifonction de vélo moderne. Presque chaque multi-outil pliant sur le marché aujourd'hui, du kit de clés bout de guidon le moins cher aux gammes actuelles de Topeak et Crankbrothers, descend de ce seul dépôt."}},{"num":"9227315","cat":"comp","title":{"en":"Crank Brothers multi-tool (US D437,541 + 9,227,315)","fr":"Multi-outil Crank Brothers (US D437 541 + 9 227 315)"},"assignee":"California Crank Brothers / Crank Brothers (Frank Hermansen, Carl Winefordner)","img":"../pictures/USD437541S1.png","alt":{"en":"US D437,541: perspective views of the folded multi-tool with its retaining band, and the tool with its hex-key implements swung open","fr":"US D437 541 : vues en perspective du multi-outil replié avec sa bague de maintien, et de l'outil avec ses clés hexagonales dépliées"},"teaser":{"en":"Two Crank Brothers multi-tool filings. US D437,541, filed September 8, 2000 and granted February 13, 2001, is the ornamental design for a folding hex-key multi-tool held closed by a band. US 9,227,315…","fr":"Deux dépôts de multi-outils Crank Brothers. Le US D437 541, déposé le 8 septembre 2000 et délivré le 13 février 2001, est le dessin ornemental d'un multi-outil pliant à clés hexagonales maintenu fermé…"},"full":{"en":"Two Crank Brothers multi-tool filings. US D437,541, filed September 8, 2000 and granted February 13, 2001, is the ornamental design for a folding hex-key multi-tool held closed by a band. US 9,227,315 (2010 priority, granted January 5, 2016) claims a multi-tool with several implements articulated on a pivot, each folding from a minimum-size stowed position to an operating position, with an elastic retainer that holds an implement in the operating position, the stowed position, or both. Google lists an adjusted expiration of April 6, 2032.","fr":"Deux dépôts de multi-outils Crank Brothers. Le US D437 541, déposé le 8 septembre 2000 et délivré le 13 février 2001, est le dessin ornemental d'un multi-outil pliant à clés hexagonales maintenu fermé par une bague. Le US 9 227 315 (priorité 2010, délivré le 5 janvier 2016) revendique un multi-outil dont plusieurs outils sont articulés sur un pivot, chacun passant d'une position repliée de moindre encombrement à une position de travail, avec un dispositif élastique qui maintient un outil en position de travail, en position repliée, ou les deux. Google indique une expiration ajustée au 6 avril 2032."}},{"num":"303851","cat":"comp","title":{"en":"Giro vented helmet shell (US D303,851)","fr":"Coque de casque ventilé Giro (US D303 851)"},"assignee":"Jim Gentes / Giro Sport Design","img":"../pictures/USD303851.png","alt":{"en":"Figs. 1–2 of US D303,851: a perspective view and front view of the helmet shell, showing the raised ventilation channels running front to back and the strap hardware at the rear","fr":"Fig. 1-2 du brevet US D303 851 : une vue en perspective et une vue de face de la coque du casque, montrant les canaux de ventilation surélevés courant d'avant en arrière et la fixation de sangle à l'arrière"},"teaser":{"en":"US D303,851, filed August 15, 1988 and granted October 3, 1989 to Jim Gentes, is a design patent covering the shape of Giro's first helmet — large molded ventilation channels built directly into an…","fr":"Le brevet US D303 851, déposé le 15 août 1988 et délivré le 3 octobre 1989 à Jim Gentes, est un brevet de dessin couvrant la forme du premier casque Giro — de larges canaux de ventilation moulés…"},"full":{"en":"US D303,851, filed August 15, 1988 and granted October 3, 1989 to Jim Gentes, is a design patent covering the shape of Giro's first helmet — large molded ventilation channels built directly into an expanded polystyrene (EPS) foam liner, wrapped in a removable Lycra cover instead of a hard outer shell. It's a design patent, protecting the helmet's distinctive shape rather than a utility claim over the foam-molding method itself, and is itself a division of an earlier Gentes helmet design patent (D.299,180) that had already issued two years before.","fr":"Le brevet US D303 851, déposé le 15 août 1988 et délivré le 3 octobre 1989 à Jim Gentes, est un brevet de dessin couvrant la forme du premier casque Giro — de larges canaux de ventilation moulés directement dans une coque en mousse de polystyrène expansé (EPS), enveloppée d'une housse Lycra amovible plutôt que d'une coque rigide. Il s'agit d'un brevet de dessin, protégeant la forme distinctive du casque plutôt qu'une revendication de procédé sur le moulage de la mousse elle-même, et il s'agit lui-même d'une division d'un brevet de dessin de casque antérieur de Gentes (D.299 180), déjà délivré deux ans plus tôt."}},{"num":"4762019","cat":"comp","title":{"en":"Look clipless pedal system (US 4,762,019)","fr":"Système de pédale automatique Look (US 4 762 019)"},"assignee":"Jean J. Beyl / Look","img":"../pictures/US4762019A.png","alt":{"en":"Fig. 1 of US 4,762,019: a perspective view of the pedal and cleat assembly, showing the shoe's sole plate (Q) engaging the pedal's forward stop (10/12) and the rear spring-loaded catch mechanism (17–29)","fr":"Fig. 1 du brevet US 4 762 019 : une vue en perspective de l'ensemble pédale et cale, montrant la plaque de semelle de la chaussure (Q) engagée dans la butée avant de la pédale (10/12) et le mécanisme de retenue arrière à ressort (17-29)"},"teaser":{"en":"US 4,762,019, granted August 9, 1988 to Jean J. Beyl, covers a triangular plastic cleat bolted to a cycling shoe that snaps into spring-loaded jaws on the pedal and releases with a twist of the heel —…","fr":"Le brevet US 4 762 019, délivré le 9 août 1988 à Jean J. Beyl, couvre une cale triangulaire en plastique boulonnée à une chaussure de cyclisme qui s'enclenche dans des mâchoires à ressort sur la…"},"full":{"en":"US 4,762,019, granted August 9, 1988 to Jean J. Beyl, covers a triangular plastic cleat bolted to a cycling shoe that snaps into spring-loaded jaws on the pedal and releases with a twist of the heel — the mechanism behind Look's PP65, the first commercial clipless pedal. The application was filed May 5, 1987 as a continuation of an earlier U.S. filing from May 17, 1985, itself claiming priority from Beyl's French applications of May 18 and December 14, 1984. Beyl had earlier founded Look's ski-binding business and adapted the same step-in, twist-release principle to cycling.","fr":"Le brevet US 4 762 019, délivré le 9 août 1988 à Jean J. Beyl, couvre une cale triangulaire en plastique boulonnée à une chaussure de cyclisme qui s'enclenche dans des mâchoires à ressort sur la pédale et se libère par une torsion du talon — le mécanisme de la PP65 de Look, la première pédale automatique commerciale. La demande a été déposée le 5 mai 1987 en continuation d'un dépôt américain antérieur du 17 mai 1985, lui-même revendiquant la priorité des demandes françaises de Beyl des 18 mai et 14 décembre 1984. Beyl avait auparavant fondé l'activité fixations de ski de Look et a adapté le même principe d'enclenchement et de déverrouillage par torsion au cyclisme."}},{"num":"4893523","cat":"comp","title":{"en":"Scott stud-and-slot pedal system (US 4,893,523)","fr":"Système de pédale à plot et fente de Scott (US 4 893 523)"},"assignee":"Dan C. Lennon / Scott USA Limited Partnership","img":"../pictures/US4893523A.png","alt":{"en":"Fig. 10 of US 4,893,523: side view of a rider on a bicycle (60') with the pedal system (10) under the shoe at the crank, with the handlebar (80) and wheels (90, 92)","fr":"Fig. 10 du brevet US 4 893 523 : vue de côté d'un cycliste sur un vélo (60') avec le système de pédale (10) sous la chaussure au niveau de la manivelle, avec le guidon (80) et les roues (90, 92)"},"teaser":{"en":"US 4,893,523, \"Bicycle and pedal system,\" granted January 16, 1990 to Dan C. Lennon, the inventor on the atlas's Scott DH bar entry (US 4,750,754). Filed January 7, 1988 by Scott USA LP, with the…","fr":"US 4 893 523, « Bicycle and pedal system », délivré le 16 janvier 1990 à Dan C. Lennon, l'inventeur de la fiche du cintre Scott DH de l'atlas (US 4 750 754). Déposé le 7 janvier 1988 par Scott USA LP,…"},"full":{"en":"US 4,893,523, \"Bicycle and pedal system,\" granted January 16, 1990 to Dan C. Lennon, the inventor on the atlas's Scott DH bar entry (US 4,750,754). Filed January 7, 1988 by Scott USA LP, with the assignment to Scott USA Limited Partnership recorded in July 1989. The abstract describes a flanged stud mounted to the sole of a rider's shoe and a pedal platform with one or more slots that engage it, plus a \"free zone\" that lets the rider disengage the stud while still being able to pedal. A second embodiment is a bicycle fitted with the system. Pre-GATT filing still in force in 1995, so the term is the later of grant + 17 (2007) and filing + 20 (2008): 2008, matching Google Patents' anticipated expiration. Google lists it as Expired – Fee Related, meaning it lapsed earlier on unpaid maintenance fees; the lapse date was not seen. The claims were not read.","fr":"US 4 893 523, « Bicycle and pedal system », délivré le 16 janvier 1990 à Dan C. Lennon, l'inventeur de la fiche du cintre Scott DH de l'atlas (US 4 750 754). Déposé le 7 janvier 1988 par Scott USA LP, avec cession à Scott USA Limited Partnership enregistrée en juillet 1989. Le résumé décrit un plot à collerette fixé sous la semelle de la chaussure et une plateforme de pédale à une ou plusieurs fentes qui l'accueillent, plus une « zone libre » permettant au cycliste de dégager le plot tout en continuant à pouvoir pédaler. Un second mode de réalisation est un vélo équipé du système. Dépôt antérieur au GATT et encore en vigueur en 1995 : la durée est la plus longue de grant + 17 (2007) et dépôt + 20 (2008), soit 2008, conforme à l'expiration calculée par Google Patents. Google Patents indique Expired – Fee Related, c'est-à-dire déchu plus tôt pour frais de maintien impayés ; la date de déchéance n'a pas été vue. Les revendications n'ont pas été lues."}},{"num":"4882946","cat":"comp","title":{"en":"Time pedal needle-bearing spindle (US 4,882,946)","fr":"Axe de pédale à roulement à aiguilles Time (US 4 882 946)"},"assignee":"Jean J. Beyl / Time Sport International","img":"../pictures/US4882946A.1.png","alt":{"en":"Fig. 1 of US 4,882,946: a longitudinal cross-section through the pedal, showing the crank-side rotary bearing (24/26) near the spindle's inner end and the smaller needle bearing (29/31/32) near the outer end (16), with the pedal body (1/2) rotating around the fixed spindle (4)","fr":"Fig. 1 du brevet US 4 882 946 : une coupe longitudinale à travers la pédale, montrant le roulement rotatif côté manivelle (24/26) près de l'extrémité intérieure de l'axe et le roulement à aiguilles plus petit (29/31/32) près de l'extrémité extérieure (16), avec le corps de pédale (1/2) tournant autour de l'axe fixe (4)"},"teaser":{"en":"US 4,882,946, 'Pedal for a bicycle or similar device,' filed October 28, 1988 and granted November 28, 1989 to Jean J. Beyl, later assigned to Time Sport International SAS — the company Beyl founded…","fr":"US 4 882 946, « Pedal for a bicycle or similar device », déposé le 28 octobre 1988 et délivré le 28 novembre 1989 à Jean J. Beyl, puis cédé à Time Sport International SAS — l'entreprise fondée par…"},"full":{"en":"US 4,882,946, 'Pedal for a bicycle or similar device,' filed October 28, 1988 and granted November 28, 1989 to Jean J. Beyl, later assigned to Time Sport International SAS — the company Beyl founded after Look, where his earlier clipless-pedal patent (US 4,762,019, above) originated. The claims cover a pedal body mounted on its spindle by two rotary bearings of different sizes: a larger bearing near the crank and a smaller needle bearing near the spindle's outer end, positioned so the pedal's foot-contact surface passes directly over the needle bearing rather than being offset from it — reducing the body's overall radial bulk at the point where a rider's foot actually loads it.","fr":"US 4 882 946, « Pedal for a bicycle or similar device », déposé le 28 octobre 1988 et délivré le 28 novembre 1989 à Jean J. Beyl, puis cédé à Time Sport International SAS — l'entreprise fondée par Beyl après Look, où son brevet antérieur de pédale automatique (US 4 762 019, ci-dessus) est né. Les revendications couvrent un corps de pédale monté sur son axe par deux roulements rotatifs de tailles différentes : un roulement plus grand près de la manivelle et un roulement à aiguilles plus petit près de l'extrémité extérieure de l'axe, positionnés de sorte que la surface d'appui du pied de la pédale passe directement au-dessus du roulement à aiguilles plutôt que d'en être décalée — réduisant l'encombrement radial global du corps à l'endroit où le pied du cycliste le sollicite réellement."}},{"num":"5586652","cat":"frame","title":{"en":"S&S Bicycle Torque Coupling (US 5,586,652)","fr":"Accouplement de couple de vélo S&S (US 5,586,652)"},"assignee":"Steve-Frank Smilanick / S&S Machine","img":"../pictures/US5586652A.png","alt":{"en":"S&S Bicycle Torque Coupling patent drawing, Fig. 18, showing the coupling joints on a full bicycle frame","fr":"Dessin de brevet de l'accouplement de couple de vélo S&S, Fig. 18, montrant les joints d'accouplement sur un cadre de vélo complet"},"teaser":{"en":"'Bicycle torque coupling' — a precision-machined, clutch-toothed locking joint that lets a frame's top and down tubes be split and rejoined without losing alignment or strength, so a full-size bike…","fr":"« Bicycle torque coupling » — un joint de verrouillage à denture d'embrayage usiné avec précision qui permet de séparer et rejoindre le tube supérieur et le tube diagonal d'un cadre sans perdre…"},"full":{"en":"'Bicycle torque coupling' — a precision-machined, clutch-toothed locking joint that lets a frame's top and down tubes be split and rejoined without losing alignment or strength, so a full-size bike packs into a standard airline travel case. Filed July 12, 1993 after Smilanick wanted to bring his own bike on a Mediterranean cruise; granted December 24, 1996. Now used by well over 100 frame builders worldwide under the S&S / BTC name.","fr":"« Bicycle torque coupling » — un joint de verrouillage à denture d'embrayage usiné avec précision qui permet de séparer et rejoindre le tube supérieur et le tube diagonal d'un cadre sans perdre l'alignement ni la résistance, afin qu'un vélo taille réelle tienne dans une valise de voyage aérien standard. Déposé le 12 juillet 1993 après que Smilanick a voulu emmener son propre vélo en croisière en Méditerranée ; délivré le 24 décembre 1996. Utilisé aujourd'hui par bien plus de 100 constructeurs de cadres dans le monde sous le nom S&S / BTC."}},{"num":"4155231","cat":"comp","title":{"en":"Kryptonite bicycle lock & bracket (US 4,155,231)","fr":"Antivol et support Kryptonite (US 4 155 231)"},"assignee":"Michael S. Zane & Peter L. Zane / KBL Corporation (Boston, MA)","img":"../pictures/US4155231A.png","alt":{"en":"Sheet 1 of US 4,155,231: FIG. 1, the U-shaped shackle (16) welded to a straight cross bar (18) forming the lock body (10); and FIG. 4, the same lock (14) mounted around a bicycle's seat tube and rear wheel (12)","fr":"Planche 1 du brevet US 4 155 231 : FIG. 1, l'étrier en U (16) soudé à une barre transversale droite (18) formant le corps de l'antivol (10) ; et FIG. 4, le même antivol (14) monté autour du tube de selle et de la roue arrière (12) d'un vélo"},"teaser":{"en":"US 4,155,231, \"Bicycle lock and bracket,\" filed April 29, 1977 by Michael S. and Peter L. Zane and granted May 22, 1979 to their company, KBL Corporation of Boston, Massachusetts. The patent claims a…","fr":"US 4 155 231, « Bicycle lock and bracket », déposé le 29 avril 1977 par Michael S. et Peter L. Zane et délivré le 22 mai 1979 à leur société, KBL Corporation de Boston (Massachusetts). Le brevet…"},"full":{"en":"US 4,155,231, \"Bicycle lock and bracket,\" filed April 29, 1977 by Michael S. and Peter L. Zane and granted May 22, 1979 to their company, KBL Corporation of Boston, Massachusetts. The patent claims a U-shaped shackle of hardened cylindrical steel stock, formed with a bent foot on one leg, paired with a tubular mounting bracket that holds a key-operated locking mechanism and clamps to the frame for storage when the lock isn't in use. Pre-1995 filing: the utility term ran 17 years from grant, to 1996. KBL Corporation became Kryptonite, and the Zane brothers filed a long series of follow-on lock and bracket patents through the 1980s and 1990s under the same company.","fr":"US 4 155 231, « Bicycle lock and bracket », déposé le 29 avril 1977 par Michael S. et Peter L. Zane et délivré le 22 mai 1979 à leur société, KBL Corporation de Boston (Massachusetts). Le brevet revendique un étrier en U en acier cylindrique trempé, formé d'un pied replié sur l'une des branches, associé à un support de fixation tubulaire contenant un mécanisme de verrouillage à clé et se serrant sur le cadre pour le rangement lorsque l'antivol n'est pas utilisé. Dépôt antérieur à 1995 : la durée d'utilité courait 17 ans à compter de la délivrance, jusqu'en 1996. KBL Corporation est devenue Kryptonite, et les frères Zane ont déposé une longue série de brevets ultérieurs d'antivols et de supports dans les années 1980 et 1990 sous la même société."}},{"num":"20932","cat":"comp","title":{"en":"Safety Bicycle Wrench design (USD 20,932)","fr":"Design de clé Safety Bicycle Wrench (USD 20,932)"},"assignee":"John J. Tower (Brooklyn, NY) / Tower & Lyon","img":"../pictures/USD20932.png","alt":{"en":"Fig. 1 and Fig. 2 of USD 20,932: a side view of the flat-sided, compound-curved wrench handle (labeled a, c, d, e) with a dashed cross-section line x-x, and a small end-on view (Fig. 2) showing the handle's rounded cross-section (b, a')","fr":"Fig. 1 et Fig. 2 du brevet USD 20 932 : une vue de côté du manche de clé à faces plates et courbes composées (repéré a, c, d, e) avec une ligne de coupe en pointillés x-x, et une petite vue de bout (Fig. 2) montrant la section arrondie du manche (b, a')"},"teaser":{"en":"'Design for a wrench-handle' — issued July 14, 1891, for the flat-sided, compound-curved, rounded-end handle shape sold as the T&L Safety pocket wrench. One of the atlas's oldest entries, from an era…","fr":"« Design for a wrench-handle » — délivré le 14 juillet 1891, pour la forme de manche à faces plates, à courbes composées et à extrémité arrondie vendue sous le nom de clé de poche T&L Safety. L'une…"},"full":{"en":"'Design for a wrench-handle' —
