1997, délivré en 1999, et cité nommément dans des dépôts ultérieurs de concurrents."}},{"num":"5676227","cat":"wheel","title":{"en":"Star Ratchet freehub, original (US 5,676,227)","fr":"Corps de roue libre Star Ratchet, original (US 5 676 227)"},"assignee":"Wilfried Hügi / DT-Bike Technology AG (Biel, Switzerland)","img":"../pictures/US5676227A.png","alt":{"en":"Fig. 1 of US 5,676,227: the full hub assembly in cross-section along the axle, from the quick-release skewer (9) at one end to the sprocket-side end member (7) at the other, with the bearing and clutch stack that connects the hub shell to the sprocket body sandwiched between them","fr":"Fig. 1 du brevet US 5 676 227 : l'ensemble du moyeu en coupe le long de l'axe, du levier de serrage rapide (9) à une extrémité jusqu'à l'écrou d'extrémité côté pignon (7) à l'autre, avec l'empilement de roulements et d'embrayage reliant la coque du moyeu au corps porte-pignon entre les deux"},"teaser":{"en":"'Free-wheel hub for bicycles' (US 5,676,227) — inventor Wilfried Hügi, assigned to DT-Bike Technology AG of Biel, Switzerland, the entity behind the DT Hügi hub line. Claims priority to a December 2,…","fr":"« Free-wheel hub for bicycles » (US 5 676 227) — inventeur Wilfried Hügi, cédé à DT-Bike Technology AG de Bienne, Suisse, l'entité derrière la gamme de moyeux DT Hügi. Revendique la priorité d'un…"},"full":{"en":"'Free-wheel hub for bicycles' (US 5,676,227) — inventor Wilfried Hügi, assigned to DT-Bike Technology AG of Biel, Switzerland, the entity behind the DT Hügi hub line. Claims priority to a December 2, 1994 German utility-model filing, the likely real origin of the 'introduced in 1994' story, but the US application itself wasn't filed until November 30, 1995 — after the June 8, 1995 GATT cutoff — so the US term runs filing + 20 = 2015. That replaces a 'January 2020' figure this entry previously stated, which didn't match any date on the actual document and has been corrected now that the patent's own front page has been read directly. The clutch is a spring-separated pair of face-toothed rings between the hub shell and sprocket body — DT Swiss's long-running Star Ratchet principle — serviced by unscrewing a single end member rather than the multi-pawl teardown a conventional freehub requires.","fr":"« Free-wheel hub for bicycles » (US 5 676 227) — inventeur Wilfried Hügi, cédé à DT-Bike Technology AG de Bienne, Suisse, l'entité derrière la gamme de moyeux DT Hügi. Revendique la priorité d'un dépôt de modèle d'utilité allemand du 2 décembre 1994, probablement la véritable origine du récit « introduit en 1994 », mais la demande américaine elle-même n'a été déposée que le 30 novembre 1995 — après la date butoir du GATT du 8 juin 1995 — de sorte que la durée américaine se calcule dépôt + 20 ans = 2015. Cela remplace un chiffre de « janvier 2020 » que cette entrée indiquait auparavant, qui ne correspondait à aucune date du document réel et a été corrigé maintenant que la première page du brevet a été lue directement. L'embrayage est une paire d'anneaux à denture frontale séparés par ressort entre la coque du moyeu et le corps porte-pignon — le principe Star Ratchet de longue date de DT Swiss — entretenu en dévissant un seul écrou d'extrémité plutôt que le démontage multi-cliquets qu'exige un corps de roue libre conventionnel."}},{"num":"8757341","cat":"wheel","title":{"en":"Star Ratchet EXP (US 8,757,341)","fr":"Star Ratchet EXP (US 8,757,341)"},"assignee":"Jo Klieber / Syntace GmbH → DT Swiss AG","img":"../pictures/US8757341B2.png","alt":{"en":"Fig. 3 of US 8,757,341: an exploded view of the hub, showing the fixed and floating ratchet rings (30/32) stacked between the freewheel body (70) and the hub shell (12)","fr":"Fig. 3 du brevet US 8 757 341 : une vue éclatée du moyeu, montrant les bagues à cliquet fixe et flottante (30/32) empilées entre le corps de roue libre (70) et le corps du moyeu (12)"},"teaser":{"en":"One fixed and one floating ratchet ring replacing the original double-floating design — designed by Jo Klieber at Syntace, filed August 2, 2011 (claiming priority to two August 2010 German filings)…","fr":"Une bague à cliquet fixe et une flottante remplaçant le design original à double flottement — conçu par Jo Klieber chez Syntace, déposé le 2 août 2011 (revendiquant la priorité de deux dépôts…"},"full":{"en":"One fixed and one floating ratchet ring replacing the original double-floating design — designed by Jo Klieber at Syntace, filed August 2, 2011 (claiming priority to two August 2010 German filings) and granted June 24, 2014, then formally assigned to DT Swiss in January 2020, exactly as the original ratchet patent expired. The listed expiry accounts for a 296-day patent term adjustment noted on the grant, pushing the flat 20-year date (2031) out to 2032, matching Google Patents' own listed anticipated expiration.","fr":"Une bague à cliquet fixe et une flottante remplaçant le design original à double flottement — conçu par Jo Klieber chez Syntace, déposé le 2 août 2011 (revendiquant la priorité de deux dépôts allemands d'août 2010) et délivré le 24 juin 2014, puis formellement cédé à DT Swiss en janvier 2020, exactement au moment où le brevet du cliquet original expirait. L'expiration indiquée tient compte d'un ajustement de durée de brevet de 296 jours noté sur la délivrance, repoussant la date à taux fixe de 20 ans (2031) jusqu'en 2032, conformément à la date d'expiration prévue indiquée par Google Patents."}},{"num":"10442245","cat":"wheel","title":{"en":"DT Swiss dual-bearing rotor hub (US 10,442,245)","fr":"Moyeu DT Swiss à roulements doubles pour le corps de roue libre (US 10 442 245)"},"assignee":"Martin Walthert & Stefan Spahr / DT Swiss Inc.","img":"../pictures/US10442245B2.png","alt":{"en":"Cross-section of the full hub assembly along the axle: the hub shell running between two roller bearings (44, 47) near each end, with the rotor's own bearing pair and the axially-engaging freewheel components stacked at center","fr":"Coupe de l'ensemble complet du moyeu le long de l'axe : la coque du moyeu s'étendant entre deux roulements à rouleaux (44, 47) près de chaque extrémité, avec la propre paire de roulements du corps de roue libre et les composants de roue libre à engagement axial empilés au centre"},"teaser":{"en":"US 10,442,245 B2, \"Hub, in particular for bicycles,\" filed July 26, 2017 by Martin Walthert and Stefan Spahr and granted October 15, 2019 to DT Swiss Inc. Claims a hub shell supported by two roller…","fr":"US 10 442 245 B2, « Hub, in particular for bicycles », déposé le 26 juillet 2017 par Martin Walthert et Stefan Spahr et délivré le 15 octobre 2019 à DT Swiss Inc. Revendique une coque de moyeu…"},"full":{"en":"US 10,442,245 B2, \"Hub, in particular for bicycles,\" filed July 26, 2017 by Martin Walthert and Stefan Spahr and granted October 15, 2019 to DT Swiss Inc. Claims a hub shell supported by two roller bearings and a separate rotor supported by its own two rotor bearings, with a freewheel device split into hub-side and rotor-side components that shift axially between a disengaged freewheel position and an intermeshing engaging position — the rotor itself stays in the same axial spot in both states. At least two later continuations from the same inventors and assignee (US 10,933,691 and US 11,485,173) carry the same hub architecture forward.","fr":"US 10 442 245 B2, « Hub, in particular for bicycles », déposé le 26 juillet 2017 par Martin Walthert et Stefan Spahr et délivré le 15 octobre 2019 à DT Swiss Inc. Revendique une coque de moyeu soutenue par deux roulements à rouleaux et un corps de roue libre séparé, soutenu par sa propre paire de roulements, avec un mécanisme de roue libre divisé en un composant côté moyeu et un composant côté corps qui se déplacent axialement entre une position de roue libre désengagée et une position d'engagement imbriqué — le corps lui-même restant à la même position axiale dans les deux états. Au moins deux continuations ultérieures des mêmes inventeurs et du même cessionnaire (US 10 933 691 et US 11 485 173) reprennent cette même architecture de moyeu."}},{"num":"9102197","cat":"wheel","title":{"en":"Sprag-clutch silent hub (US 9,102,197 + freehub wear-insert IP)","fr":"Moyeu silencieux à embrayage à roue libre (US 9,102,197 + propriété intellectuelle de l'insert d'usure du corps de roue libre)"},"assignee":"Onyx Racing Products (Minnesota)","img":"../pictures/US9102197B2.png","alt":{"en":"Fig. 8 of US 9,102,197, an exploded view of the whole hub: shell (12), axle (14), the driver (16) carrying the cog (52), and — the reason the hub is silent — the sprag clutch (90) in place of the pawls and ratchet ring every clicking hub uses","fr":"Fig. 8 du brevet US 9 102 197, une vue éclatée de l'ensemble du moyeu : le corps (12), l'axe (14), le moyeu d'entraînement (16) portant le pignon (52), et — la raison du silence du moyeu — l'embrayage à cliquets coincés (90) à la place des cliquets et de la couronne dentée qu'utilisent tous les moyeux qui cliquettent"},"teaser":{"en":"Onyx's core patent (US 9,102,197) covers a sprag clutch — 29 cam-shaped wedges — packed into a bike hub for instant, zero-degree, silent engagement, used across their entire rear-hub lineup. A…","fr":"Le brevet central d'Onyx (US 9,102,197) couvre un embrayage à roue libre — 29 cales en forme de came — logé dans un moyeu de vélo pour un engagement instantané, à degré zéro et silencieux, utilisé sur…"},"full":{"en":"Onyx's core patent (US 9,102,197) covers a sprag clutch — 29 cam-shaped wedges — packed into a bike hub for instant, zero-degree, silent engagement, used across their entire rear-hub lineup. A separate patent (10,119,579) protects the replaceable freehub wear-insert design that fixes alloy freehub-body gouging.","fr":"Le brevet central d'Onyx (US 9,102,197) couvre un embrayage à roue libre — 29 cales en forme de came — logé dans un moyeu de vélo pour un engagement instantané, à degré zéro et silencieux, utilisé sur toute leur gamme de moyeux arrière. Un brevet distinct (10,119,579) protège le design d'insert d'usure de corps de roue libre remplaçable qui corrige le creusement du corps de roue libre en alliage."}},{"num":"11293500","cat":"wheel","title":{"en":"Hydra high-engagement system (US 11,293,500 + 12,326,175)","fr":"Système à engagement élevé Hydra (US 11 293 500 + 12 326 175)"},"assignee":"Industry Nine (Asheville, NC)","img":"../pictures/US11293500B2.png","alt":{"en":"Figure 1 of US 11,293,500: a cutaway perspective of the hub's drive mechanism, showing sets of pawls (14/16) arranged around the inside of the drive ring (10) at staggered engagement points (12/22), the phased-pawl layout behind the patent's 690 engagement points","fr":"Figure 1 du brevet US 11 293 500 : une vue en coupe perspective du mécanisme d'entraînement du moyeu, montrant des ensembles de cliquets (14/16) disposés à l'intérieur de la couronne d'entraînement (10) à des points d'engagement déphasés (12/22), la disposition à cliquets déphasés à l'origine des 690 points d'engagement du brevet"},"teaser":{"en":"690 points of engagement via six phased pawls — only one pawl group engages at a time, multiplying effective engagement points beyond what the drive ring's teeth alone allow. US 12,326,175, \"Bicycle…","fr":"690 points d'engagement via six cliquets déphasés — un seul groupe de cliquets s'engage à la fois, multipliant les points d'engagement effectifs au-delà de ce que les dents de la couronne…"},"full":{"en":"690 points of engagement via six phased pawls — only one pawl group engages at a time, multiplying effective engagement points beyond what the drive ring's teeth alone allow. US 12,326,175, \"Bicycle hub assembly,\" granted June 10, 2025 to the same two inventors (Michael Macfarland Dulken and Clint John Spiegel, Industry Nine's founder), extends the same drive-ring/phased-pawl family to the Hydra2 and Solix hubs — cross-confirmed via independent search results agreeing on inventors, classification (F16D 41/30, freewheel/ratchet mechanisms), and product coverage, though this session couldn't independently reopen the Google Patents record itself (blocked to this sandbox) to confirm whether it's a direct continuation of the original 2018 filing or a separate later one; `exp` is left at the original patent's 2038 pending that check rather than assumed.","fr":"690 points d'engagement via six cliquets déphasés — un seul groupe de cliquets s'engage à la fois, multipliant les points d'engagement effectifs au-delà de ce que les dents de la couronne d'entraînement permettraient seules. L'US 12 326 175, « Bicycle hub assembly », délivré le 10 juin 2025 aux deux mêmes inventeurs (Michael Macfarland Dulken et Clint John Spiegel, fondateur d'Industry Nine), étend la même famille couronne d'entraînement/cliquets déphasés aux moyeux Hydra2 et Solix — recoupé via des résultats de recherche indépendants s'accordant sur les inventeurs, la classification (F16D 41/30, mécanismes de roue libre/cliquet) et la couverture produit, bien que cette session n'ait pas pu rouvrir elle-même la fiche Google Patents (bloquée pour ce bac à sable) afin de confirmer s'il s'agit d'une continuation directe du dépôt de 2018 ou d'un dépôt distinct ultérieur ; `exp` reste à 2038, la date du brevet d'origine, en attendant cette vérification plutôt que d'être supposé."}},{"num":"5064250","cat":"wheel","title":{"en":"Sugino / Tioga Tension Disc wheel (US 5,064,250)","fr":"Roue Sugino / Tioga Tension Disc (US 5 064 250)"},"assignee":"Tadashi Yashiro & Takafumi Nishimoto / Sugino Cycle Industries & Nippon Steel Chemical (Japan)","img":"../pictures/US5064250A.png","alt":{"en":"Fig. 6 of US 5,064,250: the wheel face-on — the hub (1) at the center, the rim (2) around it, and the tensioned disc (3) between them, its straight fiber strands (33) crossing in a lattice between fittings at the rim (5a)","fr":"Fig. 6 du brevet US 5 064 250 : la roue vue de face — le moyeu (1) au centre, la jante (2) autour, et le disque tendu (3) entre les deux, ses brins de fibre rectilignes (33) se croisant en treillis entre les fixations de la jante (5a)"},"teaser":{"en":"US 5,064,250, \"Wheel for light vehicle and disc used therefor,\" inventors Tadashi Yashiro of Nara and Takafumi Nishimoto of Ichihara, assigned jointly to Sugino Cycle Industries and Nippon Steel…","fr":"US 5 064 250, « Wheel for light vehicle and disc used therefor », inventeurs Tadashi Yashiro de Nara et Takafumi Nishimoto d'Ichihara, cédé conjointement à Sugino Cycle Industries et Nippon Steel…"},"full":{"en":"US 5,064,250, \"Wheel for light vehicle and disc used therefor,\" inventors Tadashi Yashiro of Nara and Takafumi Nishimoto of Ichihara, assigned jointly to Sugino Cycle Industries and Nippon Steel Chemical: filed June 13, 1989 on Japanese priority from June 17, 1988, granted November 12, 1991. In place of spokes, a pair of thin resin discs is stretched between hub and rim, tensioned by threaded fittings at the rim and reinforced with straight runs of fiber. Sugino sold it as the Tension Disc and Tioga as the Tension Disk, with aramid (Kevlar) strands under a clear cover. Pre-1995 filing: the term ran 17 years from grant, to 2008.","fr":"US 5 064 250, « Wheel for light vehicle and disc used therefor », inventeurs Tadashi Yashiro de Nara et Takafumi Nishimoto d'Ichihara, cédé conjointement à Sugino Cycle Industries et Nippon Steel Chemical : déposé le 13 juin 1989 sur priorité japonaise du 17 juin 1988, délivré le 12 novembre 1991. À la place des rayons, une paire de fins disques de résine est tendue entre le moyeu et la jante, mise en tension par des raccords filetés à la jante et renforcée par des brins de fibre rectilignes. Sugino l'a vendue sous le nom de Tension Disc et Tioga sous celui de Tension Disk, avec des brins d'aramide (Kevlar) sous un voile transparent. Dépôt antérieur à 1995 : la durée courait 17 ans à compter de la délivrance, jusqu'en 2008."}},{"num":null,"cat":"wheel","title":{"en":"Braided-fiber spoke termination, spoke & generic claims (US 10,150,332 + 10,661,598)","fr":"Terminaison de rayon en fibre tressée, revendications rayon et générique (US 10 150 332 + 10 661 598)"},"assignee":"Charles S. Spanjers & Kyle D. Olson / Berd LLC","img":"../pictures/US10150332B2.png","alt":{"en":"Fig. 2 of US 10,150,332: a perspective view of the assembled wheel's hub end, showing the braided spokes (107) looping through the hub flange and the threaded rod termination (110/111) at the rim-nipple end","fr":"Fig. 2 du brevet US 10 150 332 : une vue en perspective de l'extrémité côté moyeu de la roue assemblée, montrant les rayons tressés (107) bouclés à travers la flasque du moyeu et la terminaison à tige filetée (110/111) à l'extrémité côté écrou de jante"},"teaser":{"en":"Two linked Berd LLC patents from the same priority application: US 10,150,332 B2, \"Spoke composed of braided fiber with hub and rim terminations,\" and US 10,661,598 B2, \"Article having braided fiber…","fr":"Deux brevets Berd LLC liés, issus de la même demande prioritaire : US 10 150 332 B2, « Spoke composed of braided fiber with hub and rim terminations », et US 10 661 598 B2, « Article having braided…"},"full":{"en":"Two linked Berd LLC patents from the same priority application: US 10,150,332 B2, \"Spoke composed of braided fiber with hub and rim terminations,\" and US 10,661,598 B2, \"Article having braided fiber and rod end connection,\" both to inventors Charles S. Spanjers and Kyle D. Olson. Both cover a spoke made of braided ultra-high-molecular-weight-polyethylene (UHMWPE/Dyneema) fiber, with an eye-splice loop at the hub end and a threaded metal rod grafted into the fiber at the rim-nipple end — held mainly by the braid's own rope-in-tension grip on the rod rather than by the fastening agent alone, the same principle as a Chinese finger trap tightening as tension increases. 10,150,332 was filed May 5, 2016 and granted December 11, 2018; it claims the mechanism specifically as a bicycle spoke. 10,661,598 is a divisional of that same May 5, 2016 non-provisional application (Ser. No. 15/147,357) — stated on its own front page as \"Division of application No. 15/147,357, filed on May 5, 2016, now Pat. No. 10,150,332\" — filed December 7, 2018 and granted May 26, 2020, claiming the same termination mechanism more broadly as an \"article,\" independent of end use. Because both share the 2016 priority date, the 20-year term runs from that shared filing for both, expiring 2036.","fr":"Deux brevets Berd LLC liés, issus de la même demande prioritaire : US 10 150 332 B2, « Spoke composed of braided fiber with hub and rim terminations », et US 10 661 598 B2, « Article having braided fiber and rod end connection », tous deux aux inventeurs Charles S. Spanjers et Kyle D. Olson. Les deux couvrent un rayon en fibre tressée de polyéthylène à très haute masse moléculaire (UHMWPE/Dyneema), avec une boucle épissée à l'œil à l'extrémité côté moyeu et une tige métallique filetée greffée dans la fibre à l'extrémité côté écrou de jante — maintenue principalement par la prise de la tresse elle-même sur la tige sous tension plutôt que par le seul agent de fixation, le même principe qu'un piège à doigts chinois qui se resserre à mesure que la tension augmente. L'US 10 150 332 a été déposé le 5 mai 2016 et délivré le 11 décembre 2018 ; il revendique le mécanisme spécifiquement comme un rayon de vélo. L'US 10 661 598 est une division de cette même demande non provisoire du 5 mai 2016 (n° de série 15/147 357) — indiqué sur sa propre première page : « Division of application No. 15/147,357, filed on May 5, 2016, now Pat. No. 10,150,332 » — déposé le 7 décembre 2018 et délivré le 26 mai 2020, revendiquant le même mécanisme de terminaison de façon plus large, comme un « article », indépendamment de son usage final. Les deux partageant la priorité de 2016, la durée de 20 ans court à partir de ce dépôt commun pour les deux, expirant en 2036."}},{"num":"11951768","cat":"wheel","title":{"en":"Hook-flange hub for looped textile spokes (US 11,951,768)","fr":"Moyeu à flasque crochet pour rayons textiles en boucle (US 11 951 768)"},"assignee":"Bradley L. Guertin, Charles S. Spanjers & Allison L. Horner / Berd LLC","img":"../pictures/US11951768B2.png","alt":{"en":"Fig. 2 of US 11,951,768: the hub's two flanges, each ringed with hook-shaped projections (208/210/211/213/215/218) that the braided spokes' loops hook onto instead of passing through a drilled hole","fr":"Fig. 2 du brevet US 11 951 768 : les deux flasques du moyeu, chacune bordée de saillies en crochet (208/210/211/213/215/218) sur lesquelles s'accrochent les boucles des rayons tressés au lieu de passer par un trou percé"},"teaser":{"en":"US 11,951,768 B2, \"Hub for retaining spokes with loops,\" inventors Bradley Leo Guertin, Charles Steven Spanjers and Allison Lynne Horner, assignee Berd LLC. Filed September 7, 2021, granted April 9,…","fr":"US 11 951 768 B2, « Hub for retaining spokes with loops », inventeurs Bradley Leo Guertin, Charles Steven Spanjers et Allison Lynne Horner, cessionnaire Berd LLC. Déposé le 7 septembre 2021, délivré…"},"full":{"en":"US 11,951,768 B2, \"Hub for retaining spokes with loops,\" inventors Bradley Leo Guertin, Charles Steven Spanjers and Allison Lynne Horner, assignee Berd LLC. Filed September 7, 2021, granted April 9, 2024 — a different inventor group and a later, separate filing from the 2016 spoke-termination family above, not a continuation of it. This patent's own PDF is a scanned image with no extractable text layer, so its bibliographic page couldn't be read automatically; the number, title, inventors, assignee and dates above are cross-confirmed across independent search results, and the patent's own drawings (read directly, including a References Cited page that itself cites \"10,150,332 B2 12/2018 Spanjers et al.\") corroborate the Berd/Spanjers connection. Covers hub-flange geometry purpose-built for the looped end of a braided textile spoke: projections around the hub's rotational axis, each with a support shaped to anchor a fiber loop without the sharp metal edge that would otherwise cut into it. This is the mechanism behind Berd's \"Berd Approved\" licensed hub-interface standard, adopted by third-party hub makers building hubs meant to pair with Berd spokes.","fr":"US 11 951 768 B2, « Hub for retaining spokes with loops », inventeurs Bradley Leo Guertin, Charles Steven Spanjers et Allison Lynne Horner, cessionnaire Berd LLC. Déposé le 7 septembre 2021, délivré le 9 avril 2024 — un groupe d'inventeurs différent et un dépôt distinct et postérieur à la famille de terminaison de rayon de 2016 ci-dessus, non une continuation de celle-ci. Le PDF de ce brevet est un document numérisé sans couche de texte extractible, de sorte que sa première page bibliographique n'a pas pu être lue automatiquement ; le numéro, le titre, les inventeurs, le cessionnaire et les dates ci-dessus sont recoupés à partir de résultats de recherche indépendants, et les planches du brevet lui-même (lues directement, y compris une page de documents cités qui cite elle-même « 10,150,332 B2 12/2018 Spanjers et al. ») corroborent le lien avec Berd/Spanjers. Couvre une géométrie de flasque de moyeu conçue spécifiquement pour l'extrémité en boucle d'un rayon textile tressé : des saillies réparties autour de l'axe de rotation du moyeu, chacune dotée d'un support façonné pour ancrer une boucle de fibre sans l'arête métallique vive qui, sinon, l'entaillerait. C'est le mécanisme derrière la norme d'interface de moyeu sous licence « Berd Approved » de la marque, adoptée par des fabricants de moyeux tiers qui conçoivent leurs moyeux pour s'associer aux rayons Berd."}},{"num":"102017116754","cat":"wheel","title":{"en":"Braided high-performance-fiber spoke for a system impeller (DE 10 2017 116 754 B4)","fr":"Rayon en fibres haute performance pour roue système (DE 10 2017 116 754 B4)"},"assignee":"Ingo Berbig, Klaus Nendel, Daniela Storch, Dirk Fischer & Stephanie Mager / PI ROPE GmbH (Chemnitz, Germany)","img":"../pictures/DE102017116754B4.png","alt":{"en":"Figur 1 of DE 10 2017 116 754 B4: a complete wheel viewed face-on, the braided spokes (2) radiating from the hub (1) to the rim (4), with each spoke's rim-end connection (3, 4.1) and the hub flange anchor points called out around the disc-brake rotor (5) at the center","fr":"Figur 1 du brevet DE 10 2017 116 754 B4 : une roue vue de face, les rayons tressés (2) partant du moyeu (1) vers la jante (4), avec la connexion d'extrémité côté jante de chaque rayon (3, 4.1) et les points d'ancrage sur le flasque du moyeu repérés autour du disque de frein (5) au centre"},"teaser":{"en":"DE 10 2017 116 754 B4, \"Spoke based on high-performance fibers for a system impeller and system impeller\" (\"Speiche auf Basis von Hochleistungsfasern für ein Systemlaufrad und Systemlaufrad\"), filed…","fr":"DE 10 2017 116 754 B4, « Speiche auf Basis von Hochleistungsfasern für ein Systemlaufrad und Systemlaufrad » (rayon à base de fibres haute performance pour une roue système), déposé le 25 juillet 2017…"},"full":{"en":"DE 10 2017 116 754 B4, \"Spoke based on high-performance fibers for a system impeller and system impeller\" (\"Speiche auf Basis von Hochleistungsfasern für ein Systemlaufrad und Systemlaufrad\"), filed July 25, 2017 and granted (Veröffentlichungstag der Patenterteilung) May 25, 2023, to Ingo Berbig, Klaus Nendel, Daniela Storch, Dirk Fischer and Stephanie Mager, held by Berbig individually. All of this is read directly off the patent's own front page, fetched via the Fetch patent figure GitHub Actions workflow — a prior pass, blocked from patents.google.com, could only corroborate the number and general timeframe through search snippets. The front page also resolves that prior pass's flagged uncertainty over filing year: this application itself claims internal priority (innere Priorität) from an earlier German filing dated July 25, 2016, but a priority claim shifts novelty assessment only, not the term clock, which German patent law (like the US and most jurisdictions) runs from the application's own filing date — so `y`/`exp` here use 2017/2037, not the 2016 priority date. Covers a spoke whose textile part is a limp braided high-performance fiber (branded product: Vectran) connecting hub to rim through an end connection, tensioned by a clamping element; a claimed feature is the cross-section changing shape under load — square or rectangular in the untensioned, limp state, becoming round or aerodynamically oval once tensioned.","fr":"DE 10 2017 116 754 B4, « Speiche auf Basis von Hochleistungsfasern für ein Systemlaufrad und Systemlaufrad » (rayon à base de fibres haute performance pour une roue système), déposé le 25 juillet 2017 et délivré (Veröffentlichungstag der Patenterteilung) le 25 mai 2023, à Ingo Berbig, Klaus Nendel, Daniela Storch, Dirk Fischer et Stephanie Mager, détenu par Berbig à titre individuel. Tout ceci est lu directement sur la première page du brevet, récupérée via le workflow GitHub Actions Fetch patent figure — une recherche précédente, bloquée face à patents.google.com, n'avait pu corroborer que le numéro et la période générale via des extraits de recherche. La première page résout aussi l'incertitude sur l'année de dépôt signalée par cette recherche précédente : cette demande revendique une priorité interne (innere Priorität) issue d'un dépôt allemand antérieur daté du 25 juillet 2016, mais une revendication de priorité ne déplace que l'appréciation de la nouveauté, pas le point de départ de la durée de protection, laquelle en droit allemand des brevets (comme aux États-Unis et dans la plupart des juridictions) court à partir de la date de dépôt propre de la demande — d'où `y`/`exp` fixés ici à 2017/2037, et non à la date de priorité de 2016. Couvre un rayon dont la partie textile est une fibre haute performance tressée et souple (produit de marque : Vectran) reliant le moyeu à la jante par une connexion d'extrémité, mise en tension par un élément de serrage ; une caractéristique revendiquée est le changement de forme de la section transversale sous charge — carrée ou rectangulaire à l'état souple non tendu, devenant ronde ou ovale aérodynamique une fois tendue."}},{"num":"202017104416U1","cat":"wheel","title":{"en":"System wheel with braided high-performance-fiber spokes, German utility model (DE 20 2017 104 416 U1)","fr":"Roue système à rayons en fibres haute performance tressées, modèle d'utilité allemand (DE 20 2017 104 416 U1)"},"assignee":"Ingo Berbig / PI ROPE GmbH (Chemnitz, Germany)","img":"../pictures/DE202017104416U1.png","alt":{"en":"Figur 1 of DE 20 2017 104 416 U1: the same wheel construction as the companion patent above, viewed face-on — braided spokes (2) from hub (1) to rim (4), with each spoke's rim-end connection (3, 4.1) and hub-flange anchor points called out around the disc-brake rotor (5)","fr":"Figur 1 du brevet DE 20 2017 104 416 U1 : la même construction de roue que le brevet compagnon ci-dessus, vue de face — rayons tressés (2) du moyeu (1) à la jante (4), avec la connexion d'extrémité côté jante de chaque rayon (3, 4.1) et les points d'ancrage sur le flasque du moyeu repérés autour du disque de frein (5)"},"teaser":{"en":"DE 20 2017 104 416 U1, \"System wheel with spokes based on high-performance fiber materials\" (\"Systemlaufrad mit Speichen auf Basis von Hochleistungsfasermaterialien\"), filed the same day as the…","fr":"DE 20 2017 104 416 U1, « Systemlaufrad mit Speichen auf Basis von Hochleistungsfasermaterialien » (roue système à rayons à base de matériaux en fibres haute performance), déposé le même jour que le…"},"full":{"en":"DE 20 2017 104 416 U1, \"System wheel with spokes based on high-performance fiber materials\" (\"Systemlaufrad mit Speichen auf Basis von Hochleistungsfasermaterialien\"), filed the same day as the companion patent above (July 25, 2017), registered (Eintragungstag) October 26, 2017 and published in the Patentblatt December 7, 2017 — all read directly off the document's own front page, fetched via the Fetch patent figure GitHub Actions workflow. The \"U1\" suffix marks this as a Gebrauchsmuster — a German utility model, not an examined patent: registered without a substantive novelty review, with a maximum 10-year term running from filing (paid in renewal stages) rather than a patent's 20 years, the same distinction this atlas already draws for Intend's Stiffmaster headset entry, whose `st`/`exp` precedent this entry now follows (`st:\"active\"`, `exp` = filing + 10 = 2027) rather than the `unknown`/`null` a prior pass used before the term rule was confirmed. Whether renewal fees have kept the registration alive past its early stage isn't independently confirmed. Describes the same braided-high-performance-fiber spoke technology as the companion patent: a textile spoke body plus an end connection, tensioned via a clamping element, with the same claimed square/rectangular-to-round/oval cross-section behavior under tension — its own front page and drawings reproduce the companion patent's Figs. 1–3 essentially unchanged.","fr":"DE 20 2017 104 416 U1, « Systemlaufrad mit Speichen auf Basis von Hochleistungsfasermaterialien » (roue système à rayons à base de matériaux en fibres haute performance), déposé le même jour que le brevet compagnon ci-dessus (25 juillet 2017), enregistré (Eintragungstag) le 26 octobre 2017 et publié au Patentblatt le 7 décembre 2017 — le tout lu directement sur la première page du document, récupérée via le workflow GitHub Actions Fetch patent figure. Le suffixe « U1 » indique qu'il s'agit d'un Gebrauchsmuster — un modèle d'utilité allemand, pas un brevet examiné : enregistré sans revue de nouveauté substantielle, avec une durée maximale de 10 ans à compter du dépôt (payée par paliers de renouvellement) plutôt que les 20 ans d'un brevet, la même distinction que cet atlas établit déjà pour la fiche du jeu de direction Stiffmaster d'Intend, dont ce cas suit désormais le précédent `st`/`exp` (`st:\"active\"`, `exp` = dépôt + 10 = 2027) plutôt que le `unknown`/`null` utilisé lors d'une recherche précédente avant que la règle de durée ne soit confirmée. Le maintien ou non de l'enregistrement au-delà de son premier palier de renouvellement n'est pas confirmé de façon indépendante. Décrit la même technologie de rayon en fibre haute performance tressée que le brevet compagnon : un corps de rayon textile plus une connexion d'extrémité, mise en tension via un élément de serrage, avec le même comportement de section transversale revendiqué, carrée/rectangulaire devenant ronde/ovale sous tension — sa propre première page et ses dessins reproduisent les Fig. 1 à 3 du brevet compagnon, pour l'essentiel inchangées."}},{"num":"11578761","cat":"wheel","title":{"en":"MICRO SPLINE freehub system (US 11,578,761)","fr":"Système de corps de roue libre MICRO SPLINE (US 11 578 761)"},"assignee":"Tomonari Oka / Shimano Inc.","img":"../pictures/US11578761B2.png","alt":{"en":"Fig. 2 of US 11,578,761: an exploded perspective view of the bicycle drive train, showing the largest sprocket (SP12) with its internal-spline teeth (44) facing the hub's sprocket support body (30/50/12), the hub axle (28), bearing (34), and lock ring (32) that clamps the cassette in place","fr":"Fig. 2 du brevet US 11 578 761 : une vue éclatée en perspective de la transmission du vélo, montrant le plus grand pignon (SP12) avec ses cannelures internes (44) face au corps de support de pignon du moyeu (30/50/12), l'axe de moyeu (28), le roulement (34) et la bague de verrouillage (32) qui maintient la cassette en place"},"teaser":{"en":"US 11,578,761 B2, \"Bicycle sprocket arrangement,\" confirmed directly: filed Nov. 5, 2019 (Appl. No. 16/673,980, a continuation-in-part of Ser. No. 16/361,249, filed Mar. 22, 2019), granted Feb. 14,…","fr":"L'US 11 578 761 B2, « Bicycle sprocket arrangement », confirmé directement : déposé le 5 novembre 2019 (demande n° 16/673 980, continuation-in-part de la demande n° 16/361 249, déposée le 22 mars…"},"full":{"en":"US 11,578,761 B2, \"Bicycle sprocket arrangement,\" confirmed directly: filed Nov. 5, 2019 (Appl. No. 16/673,980, a continuation-in-part of Ser. No. 16/361,249, filed Mar. 22, 2019), granted Feb. 14, 2023, inventor Tomonari Oka, assignee Shimano Inc. The claims cover the actual mechanism behind Micro Spline's cross-compatibility: the cassette's internal spline mixes two sets of driving-surface positions — nine positioned at a shared 40° pitch angle plus additional offset positions — so the same cassette can engage two different external-spline hub patterns (the patent's own \"bicycle hub assembly\" and \"additional bicycle hub assembly\") rather than needing a separate cassette per hub standard. Adjusted expiration is stated directly on the patent's own record as Dec. 30, 2040 (Patent Term Adjustment for USPTO prosecution delay, later than the plain filing+20 estimate of 2039), used here rather than recomputed.","fr":"L'US 11 578 761 B2, « Bicycle sprocket arrangement », confirmé directement : déposé le 5 novembre 2019 (demande n° 16/673 980, continuation-in-part de la demande n° 16/361 249, déposée le 22 mars 2019), délivré le 14 février 2023, inventeur Tomonari Oka, cessionnaire Shimano Inc. Les revendications couvrent le mécanisme réel derrière la compatibilité croisée de Micro Spline : la cannelure interne de la cassette combine deux ensembles de positions de surfaces d'entraînement — neuf positionnées à un pas commun de 40° plus des positions décalées supplémentaires — afin que la même cassette puisse s'engager sur deux motifs de cannelure externe de moyeu différents (le « bicycle hub assembly » et l'« additional bicycle hub assembly » du brevet lui-même) plutôt que de nécessiter une cassette distincte par standard de moyeu. L'expiration ajustée est indiquée directement sur la fiche du brevet elle-même au 30 décembre 2040 (ajustement de durée de brevet pour délai de procédure USPTO, postérieur à la simple estimation dépôt+20 de 2039), utilisée ici plutôt que recalculée."}},{"num":"6880897","cat":"wheel","title":{"en":"Hub adapter for a bicycle disc brake (US 6,880,897)","fr":"Adaptateur de moyeu pour frein à disque de vélo (US 6 880 897)"},"assignee":"Eric Goss, Daryl D. Musselman / First Principles Performance Products Ltd.","img":"../pictures/US6880897B2.png","alt":{"en":"Drawing sheet of US 6,880,897: the hub adapter plate bolting to the host hub's original spoke-mounting holes, adding a disc-rotor mounting face and an alternate, wider spoke flange","fr":"Planche de dessin du brevet US 6 880 897 : la plaque adaptatrice de moyeu se boulonnant sur les trous de fixation de rayons d'origine du moyeu hôte, ajoutant une face de fixation de rotor de disque et une flasque de rayons alternative plus large"},"teaser":{"en":"US 6,880,897 B2, \"Hub adapter for a bicycle disc brake,\" filed Jan. 9, 2003 (claiming benefit of a Jan. 9, 2002 provisional application), inventors Eric Goss and Daryl D. Musselman, assignee First…","fr":"US 6 880 897 B2, « Hub adapter for a bicycle disc brake », déposé le 9 janvier 2003 (revendiquant le bénéfice d'une demande provisoire du 9 janvier 2002), inventeurs Eric Goss et Daryl D. Musselman,…"},"full":{"en":"US 6,880,897 B2, \"Hub adapter for a bicycle disc brake,\" filed Jan. 9, 2003 (claiming benefit of a Jan. 9, 2002 provisional application), inventors Eric Goss and Daryl D. Musselman, assignee First Principles Performance Products Ltd. — a commercial manufacturing sister company Musselman founded alongside his engineering consulting firm, First Principles Engineering Inc. The adapter bolts to a non-disc hub's existing spoke-mounting holes, adding a rotor-mounting face and a wider spoke flange, letting a rim-brake hub be converted to disc without a new hub. Application granted and US 6,880,897 B2 published April 19, 2005, confirmed against the primary record.","fr":"US 6 880 897 B2, « Hub adapter for a bicycle disc brake », déposé le 9 janvier 2003 (revendiquant le bénéfice d'une demande provisoire du 9 janvier 2002), inventeurs Eric Goss et Daryl D. Musselman, cessionnaire First Principles Performance Products Ltd. — une société sœur de fabrication commerciale fondée par Musselman aux côtés de son cabinet de conseil en ingénierie, First Principles Engineering Inc. L'adaptateur se boulonne sur les trous de fixation de rayons existants d'un moyeu sans disque, ajoutant une face de fixation de rotor et une flasque de rayons plus large, permettant de convertir un moyeu de frein sur jante en frein à disque sans changer de moyeu. Demande accordée et US 6 880 897 B2 publié le 19 avril 2005, confirmé d'après le dossier primaire."}},{"num":"11999191","cat":"wheel","title":{"en":"Wolf Tooth Hubs / ENVE INNERDRIVE system (US 11,999,191)","fr":"Moyeux Wolf Tooth / système ENVE INNERDRIVE (US 11 999 191)"},"assignee":"Kevin E. Nelson, Jerome Fantin / Enve Composites LLC (Ogden, UT)","img":"../pictures/US11999191B1.png","alt":{"en":"Fig. 4 of US 11,999,191: an exploded view of a bicycle hub, showing the hub shell (210) and end caps (306/308) on the left, and the freehub body (214) with its internal ratchet stack (300/310/332/338) on the right","fr":"Fig. 4 du brevet US 11 999 191 : une vue éclatée d'un moyeu de vélo, montrant la coque du moyeu (210) et les capuchons d'extrémité (306/308) à gauche, et le corps de roue libre (214) avec sa pile de cliquet interne (300/310/332/338) à droite"},"teaser":{"en":"US 11,999,191 B1, assignee Enve Composites LLC, inventors Kevin E. Nelson and Jerome Fantin — the freehub-internals patent behind Enve's INNERDRIVE system, used in Wolf Tooth's own hubs (machined…","fr":"US 11 999 191 B1, cessionnaire Enve Composites LLC, inventeurs Kevin E. Nelson et Jerome Fantin — le brevet sur l'intérieur de la roue libre derrière le système INNERDRIVE d'Enve, utilisé dans les…"},"full":{"en":"US 11,999,191 B1, assignee Enve Composites LLC, inventors Kevin E. Nelson and Jerome Fantin — the freehub-internals patent behind Enve's INNERDRIVE system, used in Wolf Tooth's own hubs (machined in-house from 7075-T6 aluminum) as well as Enve's. INNERDRIVE uses an interchangeable ratchet ring inside the freehub body to tune engagement speed and drag independently of the hub shell itself. This session could not independently re-confirm the number's own filing/grant dates against a primary-source header — the supplied drawing sheet carries no printed bibliographic line — but a consecutively-numbered sibling patent, US 11,999,192 B1 (\"Bicycle drive assembly\"), is independently confirmed under the same assignee and inventor pair, and INNERDRIVE is a real, currently-shipping Enve product line.","fr":"US 11 999 191 B1, cessionnaire Enve Composites LLC, inventeurs Kevin E. Nelson et Jerome Fantin — le brevet sur l'intérieur de la roue libre derrière le système INNERDRIVE d'Enve, utilisé dans les moyeux propres de Wolf Tooth (usinés en interne à partir d'aluminium 7075-T6) ainsi que dans ceux d'Enve. INNERDRIVE utilise une bague de cliquet interchangeable à l'intérieur du corps de roue libre pour régler la vitesse d'engagement et la traînée indépendamment de la coque du moyeu elle-même. Cette session n'a pas pu reconfirmer de façon indépendante les dates de dépôt/délivrance du numéro à partir d'un en-tête de source primaire — la planche fournie ne porte pas de ligne bibliographique imprimée — mais un brevet frère numéroté consécutivement, US 11 999 192 B1 (« Bicycle drive assembly »), est confirmé indépendamment sous le même cessionnaire et la même paire d'inventeurs, et INNERDRIVE est une gamme de produits Enve réelle, actuellement commercialisée."}},{"num":null,"cat":"wheel","title":{"en":"Symmetric fat-bike hub spacing — 170/177x12 & 190/197x12 (no patent)","fr":"Espacement de moyeu symétrique pour fatbike — 170/177x12 et 190/197x12 (sans brevet)"},"assignee":"Greg Matyas / Fatback Bikes → Corvus Cycles (Anchorage, AK)","img":"../pictures/matyas.jpg","alt":{"en":"Hand-drawn comparison sketch: Surly's offset rear-triangle design next to Fatback's symmetric design, each showing the seat stays, chainstay bridge, and rear hub area","fr":"Croquis comparatif dessiné à la main : la conception à triangle arrière décentré de Surly à côté de la conception symétrique de Fatback, montrant chacune les haubans, le pont de bases et la zone du moyeu arrière"},"teaser":{"en":"Greg Matyas, a carpenter in Anchorage, Alaska who bought a 2006 Surly Pugsley, saw the compromise in that first mass-market fat bike: a 135mm rear hub offset 17.5mm in the frame to clear the chain,…","fr":"Greg Matyas, charpentier à Anchorage, en Alaska, qui avait acheté un Surly Pugsley de 2006, a identifié le compromis de ce premier fatbike produit en série : un moyeu arrière de 135 mm déporté de…"},"full":{"en":"Greg Matyas, a carpenter in Anchorage, Alaska who bought a 2006 Surly Pugsley, saw the compromise in that first mass-market fat bike: a 135mm rear hub offset 17.5mm in the frame to clear the chain, producing an asymmetric, dish-imbalanced wheel. His fix was carpenter's arithmetic, not marketing: 135 + (17.5×2) = 170 — a hub 35mm wider lets the frame drop the offset and build a truly symmetric wheel instead. A symmetric wheel is a strong wheel. Greg founded both the 170/177x12 hub standard and the 190/197x12 hub standard. Greg also founded Fatback, which rebranded to Corvus Cycles in 2021.","fr":"Greg Matyas, charpentier à Anchorage, en Alaska, qui avait acheté un Surly Pugsley de 2006, a identifié le compromis de ce premier fatbike produit en série : un moyeu arrière de 135 mm déporté de 17,5 mm dans le cadre pour dégager la chaîne, produisant une roue asymétrique au déséquilibre de tension. Sa solution relevait de l'arithmétique du charpentier, pas du marketing : 135 + (17,5 × 2) = 170 — un moyeu 35 mm plus large permet au cadre de supprimer le déport et de construire une roue véritablement symétrique. Une roue symétrique est une roue solide. Greg a fondé à la fois le standard de moyeu 170/177x12 et le standard de moyeu 190/197x12. Greg a aussi fondé Fatback, qui s'est rebaptisée Corvus Cycles en 2021."}},{"num":"20230312034","cat":"wheel","title":{"en":"Bicycle wheel anti-theft blocking mechanism (US 2023/0312034 A1)","fr":"Mécanisme antivol intégré à la roue de bicyclette (US 2023/0312034 A1)"},"assignee":"Bassem Ghaly, assignor to 12226448 Canada Inc.","img":"../pictures/US20230312034A1.png","alt":{"en":"FIG. 1 of the published application: a full bicycle side view (5) with the blocking assembly's components (67, 71, 73a/73b, 51/53, 27a/27b) called out at the rear wheel's dropout and spindle area","fr":"FIG. 1 de la demande publiée : vue latérale complète d'une bicyclette (5) avec les composants de l'ensemble de blocage (67, 71, 73a/73b, 51/53, 27a/27b) repérés au niveau de la patte de fixation et de l'axe de la roue arrière"},"teaser":{"en":"US 2023/0312034 A1, \"Bicycle with integrated anti-theft system,\" inventor Bassem Ghaly, assigned to the numbered Canadian company 12226448 Canada Inc. Published in 2023, but Google Patents' own family…","fr":"US 2023/0312034 A1, « Bicycle with integrated anti-theft system », inventeur Bassem Ghaly, cédé à la société canadienne numérotée 12226448 Canada Inc. Publié en 2023, mais la liste de famille de…"},"full":{"en":"US 2023/0312034 A1, \"Bicycle with integrated anti-theft system,\" inventor Bassem Ghaly, assigned to the numbered Canadian company 12226448 Canada Inc. Published in 2023, but Google Patents' own family listing traces the invention to a 2020 priority filing (WO/US/EP family members); this pass could not confirm the exact filing date or current examination status, so y follows the confirmed 2020 priority year rather than this publication's own 2023 date, and g/exp are left unset rather than guessed. The claimed mechanism sits at a wheel spindle: a blocking assembly mounted next to the bore that carries the axle, switchable by the owner between letting the spindle rotate freely and physically stopping it so the wheel can't turn while locked.","fr":"US 2023/0312034 A1, « Bicycle with integrated anti-theft system », inventeur Bassem Ghaly, cédé à la société canadienne numérotée 12226448 Canada Inc. Publié en 2023, mais la liste de famille de Google Patents fait remonter l'invention à un dépôt prioritaire de 2020 (famille WO/US/EP) ; cette recherche n'a pas pu confirmer la date de dépôt exacte ni le statut d'examen actuel, donc y suit l'année de priorité 2020 confirmée plutôt que la date de publication 2023, et g/exp restent non renseignés plutôt que devinés. Le mécanisme revendiqué se situe au niveau d'un axe de roue : un ensemble de blocage monté à côté de l'alésage qui reçoit l'axe, commutable par le propriétaire entre laisser l'axe tourner librement et l'immobiliser physiquement, de sorte que la roue ne peut plus tourner en position verrouillée."}},{"num":"5104199","cat":"wheel","title":{"en":"Spinergy Rev-X carbon wheel (US 5,104,199)","fr":"Roue carbone Spinergy Rev-X (US 5 104 199)"},"assignee":"Raphael Schlanger / Spinergy","img":"../pictures/US5104199A.png","alt":{"en":"Fig. 1 of US 5,104,199: a front view of the four-blade wheel, showing the two molded wheel halves (42, 44, 46, 48 and 50, 52, 54, 56) joined at the hub (20) and at the outer rim (16/64/74)","fr":"Fig. 1 du brevet US 5 104 199 : une vue de face de la roue à quatre pales, montrant les deux moitiés de roue moulées (42, 44, 46, 48 et 50, 52, 54, 56) assemblées au moyeu (20) et à la jante extérieure (16/64/74)"},"teaser":{"en":"US 5,104,199, patented by former Cannondale engineer Raphael Schlanger in 1990 and granted April 14, 1992, covers a composite wheel built from two molded halves joined at the hub and rim, each half…","fr":"Le brevet US 5 104 199, déposé par l'ancien ingénieur de Cannondale Raphael Schlanger en 1990 et délivré le 14 avril 1992, couvre une roue composite formée de deux moitiés moulées assemblées au moyeu…"},"full":{"en":"US 5,104,199, patented by former Cannondale engineer Raphael Schlanger in 1990 and granted April 14, 1992, covers a composite wheel built from two molded halves joined at the hub and rim, each half cut away to leave four broad, flat structural spokes rather than a solid disc. It became the Spinergy Rev-X, first appearing in Cannondale's 1995 catalog.","fr":"Le brevet US 5 104 199, déposé par l'ancien ingénieur de Cannondale Raphael Schlanger en 1990 et délivré le 14 avril 1992, couvre une roue composite formée de deux moitiés moulées assemblées au moyeu et à la jante, chacune évidée pour ne laisser que quatre larges rayons structurels plats plutôt qu'un disque plein. Elle est devenue la Spinergy Rev-X, apparue pour la première fois dans le catalogue Cannondale de 1995."}},{"num":"7635170","cat":"wheel","title":{"en":"Crank Brothers paired-spoke wheel (US 7,635,170)","fr":"Roue à rayons appariés Crank Brothers (US 7 635 170)"},"assignee":"Crank Brothers (Frank Hermansen, Carl Winefordner)","img":"../pictures/US20080088175A1.png","alt":{"en":"Perspective view of the wheel (10) from the application: rim (30), hub (50) and the crossed spokes (80, 100) running from the hub flanges to the rim","fr":"Vue en perspective de la roue (10) de la demande : jante (30), moyeu (50) et rayons croisés (80, 100) allant des flasques du moyeu à la jante"},"teaser":{"en":"Filed October 11, 2006 (published as US 2008/0088175 A1) and granted December 22, 2009. A spoked wheel with wishbone-shaped spokes and true paired spoking: the rim has half as many spoke attachments…","fr":"Déposé le 11 octobre 2006 (publié sous le US 2008/0088175 A1) et délivré le 22 décembre 2009. Une roue à rayons en forme de V avec un véritable appariement des rayons : la jante compte moitié moins de…"},"full":{"en":"Filed October 11, 2006 (published as US 2008/0088175 A1) and granted December 22, 2009. A spoked wheel with wishbone-shaped spokes and true paired spoking: the rim has half as many spoke attachments as there are nipples, so spoke tension adds no side-wobble force or rim twist. Rim spoke holes run parallel to the wheel axis and are reinforced with eyelets, with unneeded rim material cut away between them. The nipples sit about midway between hub and rim for easier adjustment, and the hub's aligned longitudinal ribs let the body be machined from an extrusion. The 20-year term ends October 11, 2026.","fr":"Déposé le 11 octobre 2006 (publié sous le US 2008/0088175 A1) et délivré le 22 décembre 2009. Une roue à rayons en forme de V avec un véritable appariement des rayons : la jante compte moitié moins de fixations de rayons que de têtes de rayons, de sorte que la tension n'engendre ni force de voile latéral ni torsion de la jante. Les trous de rayons de la jante sont parallèles à l'axe de la roue et renforcés par des œillets, avec la matière inutile enlevée entre eux. Les têtes de rayons se situent à mi-chemin entre le moyeu et la jante pour faciliter le réglage, et les nervures longitudinales alignées du moyeu permettent d'usiner le corps dans un profilé extrudé. Le brevet expire le 11 octobre 2026, à l'issue de ses 20 ans."}},{"num":"5931544","cat":"wheel","title":{"en":"Rolf paired-spoke wheel (US 5,931,544)","fr":"Roue à rayons appairés Rolf (US 5 931 544)"},"assignee":"Rolf Dietrich / Rolf Prima","img":"../pictures/US5931544A.png","alt":{"en":"Fig. 1 of US 5,931,544: a front view of the wheel showing the paired spokes (20) meeting the rim (18) at shared points, unlike the evenly staggered spokes of a conventional wheel","fr":"Fig. 1 du brevet US 5 931 544 : une vue de face de la roue montrant les rayons appairés (20) rejoignant la jante (18) en des points communs, contrairement aux rayons régulièrement décalés d'une roue conventionnelle"},"teaser":{"en":"US 5,931,544, granted August 3, 1999 to Rolf Dietrich, covers a tensioned spoked wheel where each pair of left and right spokes meets the rim at the same circumferential point instead of the…","fr":"Le brevet US 5 931 544, délivré le 3 août 1999 à Rolf Dietrich, couvre une roue à rayons tendus où chaque paire de rayons gauche et droit rejoint la jante au même point circonférentiel au lieu du…"},"full":{"en":"US 5,931,544, granted August 3, 1999 to Rolf Dietrich, covers a tensioned spoked wheel where each pair of left and right spokes meets the rim at the same circumferential point instead of the traditional staggered pattern, canceling out the lateral pulling force that alternating spokes would otherwise apply against each other. The patent's own filing history is a three-generation continuation chain — the 1998 application on file is itself a continuation of a 1997 continuation of the original filing, Dec. 24, 1991 (Ser. No. 07/813,436) — so per this atlas's continuation-dating rule, the 20-year clock runs from that 1991 filing, not the 1998 one.","fr":"Le brevet US 5 931 544, délivré le 3 août 1999 à Rolf Dietrich, couvre une roue à rayons tendus où chaque paire de rayons gauche et droit rejoint la jante au même point circonférentiel au lieu du motif alterné traditionnel, annulant la force de traction latérale que des rayons alternés exerceraient sinon l'un contre l'autre. L'historique de dépôt du brevet est une chaîne de continuation sur trois générations — la demande de 1998 au dossier est elle-même une continuation d'une continuation de 1997 du dépôt original, le 24 décembre 1991 (n° de série 07/813 436) — de sorte que, selon la règle de datation des continuations de cet atlas, le délai de 20 ans court à partir de ce dépôt de 1991, et non de celui de 1998."}},{"num":"5426570","cat":"comp","title":{"en":"Water-bottle-cage battery light system (US 5,426,570)","fr":"Système d'éclairage à batterie logé en porte-bidon (US 5,426,570)"},"assignee":"McKay H. Davis (Salt Lake City, UT)","img":"../pictures/US5426570.png","alt":{"en":"FIG. 2: Water-bottle-cage battery and light-head assembly showing LED positioning on cage mount","fr":"FIG. 2 : Assemblage de batterie et de tête lumineuse de porte-bidon montrant le positionnement de la LED sur le support du porte-bidon"},"teaser":{"en":"A high-power battery pack encased in a compressible sleeve, sized to force-fit into a standard water bottle cage in place of a bottle and wired to a mountain bike's headlight — filed March 1994,…","fr":"Un bloc-batterie haute puissance enfermé dans un manchon compressible, dimensionné pour se loger de force dans un porte-bidon standard à la place d'une gourde et relié par câble au phare avant du VTT…"},"full":{"en":"A high-power battery pack encased in a compressible sleeve, sized to force-fit into a standard water bottle cage in place of a bottle and wired to a mountain bike's headlight — filed March 1994, granted June 1995. Two continuations (US 5,523,924 and US 5,597,225) refined the same cage-mounted approach through the late 1990s.","fr":"Un bloc-batterie haute puissance enfermé dans un manchon compressible, dimensionné pour se loger de force dans un porte-bidon standard à la place d'une gourde et relié par câble au phare avant du VTT — déposé en mars 1994, délivré en juin 1995. Deux continuations (US 5,523,924 et US 5,597,225) ont affiné la même approche montée en porte-bidon jusqu'à la fin des années 1990."}},{"num":"8770808","cat":"comp","title":{"en":"Light & Motion bike light & tail light patents (US 8,770,808 + 8,974,098)","fr":"Brevets d'éclairage vélo et feu arrière de Light & Motion (US 8 770 808 + 8 974 098)"},"assignee":"Light & Motion Industries → SeeScan, Inc.","img":"../pictures/US8770808B1.png","alt":{"en":"Fig. 6 of US 8,770,808: the tail light body (12) with its side buttons (16/48/46) and swivel clip mount (18), shown above the separate universal mounting bracket (32) that engages a seatpost, rack, or chainstay","fr":"Fig. 6 du brevet US 8 770 808 : le corps du feu arrière (12) avec ses boutons latéraux (16/48/46) et sa fixation à clip pivotante (18), montré au-dessus du support de montage universel distinct (32) qui s'engage sur une tige de selle, un porte-bagages ou une base"},"teaser":{"en":"Two patents, both naming Light & Motion's own engineering team and both now reassigned to SeeScan, Inc. US 8,770,808 B1, \"Bicycle tail light\" (inventors Damon Campbell, Roxanne Lo, Christopher…","fr":"Deux brevets, nommant tous deux des membres de l'équipe d'ingénierie de Light & Motion et tous deux désormais cédés à SeeScan, Inc. US 8 770 808 B1, « Bicycle tail light » (inventeurs Damon Campbell,…"},"full":{"en":"Two patents, both naming Light & Motion's own engineering team and both now reassigned to SeeScan, Inc. US 8,770,808 B1, \"Bicycle tail light\" (inventors Damon Campbell, Roxanne Lo, Christopher McCaslin, Doug Foss and Daniel T. Emerson — Emerson later the company's CEO), filed April 15, 2011 and granted July 8, 2014: a universal mount that clamps to a seatpost, rack, or chainstay, a swivel joint to set the tilt angle, and side-facing LEDs added to the rear-facing beam for over 180° of visibility. Reassigned from Light & Motion Industries to SeeScan, Inc. on January 29, 2025. US 8,974,098 B2, \"Bicycle light\" (inventors Christopher McCaslin, Greg Weisenfeld, Beau Jesse Robertson and Roxanne Lo), filed May 11, 2012 and granted March 10, 2015: a single flat LED board paired with a deep reflector for a focused spot beam and a shallow reflector for flood light on that same board, plus independently switchable side lighting that can be dimmed or turned off on a trail. Google's own record lists this second patent's status as 'Ceased' rather than the 'Active' shown for the tail light — most likely a lapsed maintenance fee, though the specific reason wasn't confirmed directly.","fr":"Deux brevets, nommant tous deux des membres de l'équipe d'ingénierie de Light & Motion et tous deux désormais cédés à SeeScan, Inc. US 8 770 808 B1, « Bicycle tail light » (inventeurs Damon Campbell, Roxanne Lo, Christopher McCaslin, Doug Foss et Daniel T. Emerson — Emerson devenu plus tard PDG de l'entreprise), déposé le 15 avril 2011 et délivré le 8 juillet 2014 : une fixation universelle qui se serre sur une tige de selle, un porte-bagages ou une base, une articulation pivotante pour régler l'angle d'inclinaison, et des LED latérales ajoutées au faisceau arrière pour plus de 180° de visibilité. Cédé de Light & Motion Industries à SeeScan, Inc. le 29 janvier 2025. US 8 974 098 B2, « Bicycle light » (inventeurs Christopher McCaslin, Greg Weisenfeld, Beau Jesse Robertson et Roxanne Lo), déposé le 11 mai 2012 et délivré le 10 mars 2015 : une unique carte LED plate associée à un réflecteur profond pour un faisceau ponctuel concentré et un réflecteur peu profond pour un éclairage large sur cette même carte, plus un éclairage latéral commutable indépendamment, pouvant être atténué ou coupé sur un sentier. La fiche de Google indique le statut de ce second brevet comme « Ceased » plutôt que « Active » comme pour le feu arrière — le plus probablement une taxe de maintien non payée, bien que la raison précise n'ait pas été confirmée directement."}},{"num":"547886","cat":"comp","title":{"en":"Repeating rotary-striker bicycle bell (US 547,886)","fr":"Sonnette de bicyclette à battant rotatif répétiteur (US 547 886)"},"assignee":"Alfred Nicholas (Birmingham, England), assignor to Joseph Lucas & Harry Lucas","img":"../pictures/US547886A.png","alt":{"en":"Fig. 1 (top) of the original filing's Sheet 1: a full cross-section of the bell showing the thumb lever (h), toothed sector (f), coiled spring (g), striker carrier (c) and plunger-like striker (b) inside the dome; Figs. 5 and 6 below show the striker and its casing in isolation","fr":"Fig. 1 (en haut) de la Sheet 1 du dépôt original : coupe complète de la cloche montrant le levier à pouce (h), le secteur denté (f), le ressort spiralé (g), le porte-battant (c) et le battant en forme de piston (b) à l'intérieur du dôme ; les Fig. 5 et 6 ci-dessous montrent le battant et son logement isolément"},"teaser":{"en":"\"Be it known that I, ALFRED NICHOLAS, manufacturer, a subject of the Queen of Great Britain, residing on Water Street, in the city of Birmingham, England, have invented new and useful Improvements in…","fr":"« Be it known that I, ALFRED NICHOLAS, manufacturer, a subject of the Queen of Great Britain, residing on Water Street, in the city of Birmingham, England, have invented new and useful Improvements in…"},"full":{"en":"\"Be it known that I, ALFRED NICHOLAS, manufacturer, a subject of the Queen of Great Britain, residing on Water Street, in the city of Birmingham, England, have invented new and useful Improvements in Bells\" — the patent's own opening line. US 547,886, \"Bicycle-Bell,\" filed August 8, 1895 by Alfred Nicholas of Birmingham, England, and assigned to Joseph Lucas and Harry Lucas — the father-and-son partnership trading as Joseph Lucas & Son, the direct predecessor of Lucas Industries. A companion British patent, No. 22,049 of November 15, 1894, predates the US filing by nine months. The claimed mechanism: a thumb lever winds a toothed sector against a coiled spring, spinning a striker carrier inside the bell; a plunger-like striker riding in that carrier is longer than the carrier itself, so one end always projects beyond it and strikes the bell wall on each half-turn, producing two rings per full rotation. Granted the same year it was filed; under the pre-1995 rule its term runs to grant plus 17 years, expiring in 1912.","fr":"« Be it known that I, ALFRED NICHOLAS, manufacturer, a subject of the Queen of Great Britain, residing on Water Street, in the city of Birmingham, England, have invented new and useful Improvements in Bells » — la phrase d'ouverture du brevet lui-même (citation directe, en anglais dans le texte original). US 547 886, « Bicycle-Bell », déposé le 8 août 1895 par Alfred Nicholas de Birmingham, en Angleterre, et cédé à Joseph Lucas et Harry Lucas — le duo père-fils exploitant l'entreprise sous le nom de Joseph Lucas & Son, prédécesseur direct de Lucas Industries. Un brevet britannique connexe, le n° 22 049 du 15 novembre 1894, précède le dépôt américain de neuf mois. Le mécanisme revendiqué : un levier à pouce arme un secteur denté contre un ressort spiralé, faisant tourner un porte-battant à l'intérieur de la cloche ; un battant en forme de piston logé dans ce porte-battant est plus long que celui-ci, de sorte qu'une extrémité dépasse toujours et vient frapper la paroi de la cloche à chaque demi-tour, produisant deux sonneries par tour complet. Délivré la même année que son dépôt ; selon la règle antérieure à 1995, sa durée court jusqu'à la délivrance plus 17 ans, expirant en 1912."}},{"num":"9734813","cat":"comp","title":{"en":"Timber! mountain bike bell with on/off clapper (US 9,734,813)","fr":"Sonnette VTT Timber! à battant débrayable (US 9 734 813)"},"assignee":"Christopher Lacy (Encinitas, CA) / Timber! Mountain Bike Bells","img":"../pictures/US9734813B2.png","alt":{"en":"Fig. 3 of US 9,734,813 B2: the bell in side view and in section A-A — the lever (2) on the clamp body (3) connects through a cable to the clapper (9) inside the bell (6), held on by a crimp (10); moving the lever draws the clapper up out of reach of the bell's wall","fr":"Fig. 3 du brevet US 9 734 813 B2 : la sonnette vue de côté et en coupe A-A — le levier (2) monté sur le corps de collier (3) est relié par un câble au battant (9) logé dans la cloche (6), retenu par un sertissage (10) ; actionner le levier remonte le battant hors de portée de la paroi de la cloche"},"teaser":{"en":"US 9,734,813 B2, \"Bicycle bell with silencing mechanism,\" inventor and owner Christopher Lacy of Encinitas, California: filed October 14, 2015 on an October 14, 2014 provisional, granted August 15,…","fr":"US 9 734 813 B2, « Bicycle bell with silencing mechanism », inventeur et titulaire Christopher Lacy d'Encinitas (Californie) : déposé le 14 octobre 2015 sur la base d'une demande provisoire du 14…"},"full":{"en":"US 9,734,813 B2, \"Bicycle bell with silencing mechanism,\" inventor and owner Christopher Lacy of Encinitas, California: filed October 14, 2015 on an October 14, 2014 provisional, granted August 15, 2017. A loose clapper hangs inside the bell and rings on its own as the bike moves; a lever on the bar clamp pulls a cable that draws the clapper up into the head of the bell and holds it still. A Lacy design patent, US D774,410 (December 2016), is cited on its face. The 20-year term runs to 2035, plus a 194-day adjustment.","fr":"US 9 734 813 B2, « Bicycle bell with silencing mechanism », inventeur et titulaire Christopher Lacy d'Encinitas (Californie) : déposé le 14 octobre 2015 sur la base d'une demande provisoire du 14 octobre 2014, délivré le 15 août 2017. Un battant libre est suspendu dans la cloche et sonne tout seul quand le vélo roule ; un levier sur le collier de cintre tire un câble qui remonte le battant dans la tête de la cloche et l'y immobilise. Un brevet de dessin de Lacy, US D774 410 (décembre 2016), est cité en première page. La durée de 20 ans court jusqu'en 2035, plus un ajustement de 194 jours."}},{"num":"TWI725811B","cat":"comp","title":{"en":"Spurcycle's redesigned strike-lever bell mechanism (TWI 725,811 B + USD 889,299)","fr":"Mécanisme de sonnette à levier de frappe redessiné de Spurcycle (TWI 725 811 B + USD 889 299)"},"assignee":"Clinton N. Slone, Nicholaus M. Slone & Adam R.L. Reineck / Slone Studio Inc. (Spurcycle), Sausalito, CA","img":"../pictures/US20200327874A1.png","alt":{"en":"Fig. 1A of the corresponding U.S. application (US 2020/0327874 A1): an external view of the bell, showing the dome (20/23/24), the strap-mount loop (40) and the band-clamp fitting (60)","fr":"Fig. 1A de la demande américaine correspondante (US 2020/0327874 A1) : vue externe de la sonnette, montrant le dôme (20/23/24), la boucle de fixation par sangle (40) et le collier de serrage (60)"},"teaser":{"en":"TWI 725,811 B, \"Bell,\" credited to Clinton N. Slone, Nicholaus M. Slone and Adam R.L. Reineck of Slone Studio Inc. (Spurcycle's parent company), claims a spring-loaded strike lever pivoting from…","fr":"TWI 725 811 B, « Bell », attribué à Clinton N. Slone, Nicholaus M. Slone et Adam R.L. Reineck de Slone Studio Inc. (la société mère de Spurcycle), revendique un levier de frappe à ressort pivotant à…"},"full":{"en":"TWI 725,811 B, \"Bell,\" credited to Clinton N. Slone, Nicholaus M. Slone and Adam R.L. Reineck of Slone Studio Inc. (Spurcycle's parent company), claims a spring-loaded strike lever pivoting from inside the bell cavity, swinging outward to ring the bell — a different mechanism from the original Spurcycle bell's wire-hammer design, which this patent's own background section names directly as prior art. The Taiwanese patent traces to a U.S. non-provisional filed March 18, 2020, and was granted in Taiwan on April 21, 2021; the corresponding U.S. application, US 2020/0327874 A1, published that October, was later abandoned without ever granting under its own number. A separate design patent, USD889,299 S1 (\"Bell\"), covers the redesigned bell's ornamental shape — filed April 9, 2019 by Clinton N. Slone alone and granted July 7, 2020, also assigned to Slone Studio Inc. The original 2013 bell was never itself covered by a design patent; this redesign is the first Spurcycle product with one.","fr":"TWI 725 811 B, « Bell », attribué à Clinton N. Slone, Nicholaus M. Slone et Adam R.L. Reineck de Slone Studio Inc. (la société mère de Spurcycle), revendique un levier de frappe à ressort pivotant à l'intérieur de la cavité de la cloche, se déployant vers l'extérieur pour la faire sonner — un mécanisme différent de celui de la sonnette Spurcycle d'origine, à marteau sur tige métallique, que la section « antériorité » de ce brevet cite directement. Le brevet taïwanais découle d'une demande non provisoire américaine déposée le 18 mars 2020, et a été délivré à Taïwan le 21 avril 2021 ; la demande américaine correspondante, US 2020/0327874 A1, publiée en octobre de la même année, a ensuite été abandonnée sans jamais être délivrée sous son propre numéro. Un brevet de dessin distinct, USD889 299 S1 (« Bell »), couvre la forme ornementale de la sonnette redessinée — déposé le 9 avril 2019 par Clinton N. Slone seul et délivré le 7 juillet 2020, également cédé à Slone Studio Inc. La sonnette d'origine de 2013 n'a elle-même jamais fait l'objet d'un brevet de dessin ; cette refonte est le premier produit Spurcycle à en obtenir un."}},{"num":"D204121","cat":"comp","title":{"en":"Schwinn Sting-Ray banana seat (US D204,121)","fr":"Selle banane Schwinn Sting-Ray (US D204,121)"},"assignee":"Frank P. Brilando / Arnold, Schwinn & Co.","img":"../pictures/USD204121S1.png","alt":{"en":"Fig. 1 and Fig. 2 of US D204,121: a side view of the elongated banana seat mounted on a bicycle frame (shown in broken lines) and a top plan view of its tapered, ribbed profile","fr":"Fig. 1 et Fig. 2 du brevet US D204 121 : une vue de côté de la selle banane allongée montée sur un cadre de vélo (représenté en traits pointillés) et une vue de dessus de son profil effilé et nervuré"},"teaser":{"en":"A design patent on the elongated 'banana' seat shape defining the Sting-Ray, filed January 1965 and granted March 1966 to Schwinn chief engineer Frank P. Brilando. Schwinn licensed Troxel…","fr":"Un brevet de dessin sur la forme de selle allongée « banane » définissant le Sting-Ray, déposé en janvier 1965 et délivré en mars 1966 à l'ingénieur en chef de Schwinn, Frank P. Brilando. Schwinn a…"},"full":{"en":"A design patent on the elongated 'banana' seat shape defining the Sting-Ray, filed January 1965 and granted March 1966 to Schwinn chief engineer Frank P. Brilando. Schwinn licensed Troxel Manufacturing to build seats under it in 1967, then sued Goodyear Tire & Rubber over a similar seat sold through Troxel's rival Fisher Cycle. The Ninth Circuit invalidated the patent in 1970 (Schwinn Bicycle Co. v. Goodyear Tire & Rubber Co., 444 F.2d 295): the design had already been publicly advertised in a June 1963 Schwinn ad, more than a year before the 1965 filing, which is fatal prior art against Schwinn's own patent under the on-sale bar.","fr":"Un brevet de dessin sur la forme de selle allongée « banane » définissant le Sting-Ray, déposé en janvier 1965 et délivré en mars 1966 à l'ingénieur en chef de Schwinn, Frank P. Brilando. Schwinn a licencié Troxel Manufacturing pour fabriquer des selles sous ce brevet en 1967, puis a poursuivi Goodyear Tire & Rubber au sujet d'une selle similaire vendue via le rival de Troxel, Fisher Cycle. La Cour d'appel du neuvième circuit a invalidé le brevet en 1970 (Schwinn Bicycle Co. v. Goodyear Tire & Rubber Co., 444 F.2d 295) : le design avait déjà été publiquement annoncé dans une publicité Schwinn de juin 1963, plus d'un an avant le dépôt de 1965, ce qui constitue une antériorité fatale contre le propre brevet de Schwinn en vertu de la règle de la vente antérieure (« on-sale bar »)."}},{"num":"4580835","cat":"comp","title":{"en":"Hite-Rite — Quick adjusting saddle locator (US 4,580,835)","fr":"Hite-Rite — Quick adjusting saddle locator (US 4,580,835)"},"assignee":"Joshua J. Angell & Joseph T. Breeze","img":"../pictures/US4580835A.png","alt":{"en":"Fig. 1 (bike-side context), Fig. 5 and Fig. 6 of US 4,580,835: the torsion spring (30) coiled around the seat post between the collar (39) and the seat-tube clamp (32), and a cross-section of that clamp (35/30/15/12/16) bolted to the frame","fr":"Fig. 1 (contexte sur le vélo), Fig. 5 et Fig. 6 du brevet US 4 580 835 : le ressort de torsion (30) enroulé autour de la tige de selle entre le collier (39) et la bride de tube de selle (32), et une coupe de cette bride (35/30/15/12/16) boulonnée au cadre"},"teaser":{"en":"Filed and granted under the plain title ‘Quick adjusting saddle locator,’ with Josh Angell named first and Joe Breeze — builder of the first purpose-built mountain bike — second. Not a dropper post in…","fr":"Déposé et délivré sous le titre simple « Quick adjusting saddle locator », avec Josh Angell nommé en premier et Joe Breeze — constructeur du premier VTT conçu comme tel — en second. Pas une tige…"},"full":{"en":"Filed and granted under the plain title ‘Quick adjusting saddle locator,’ with Josh Angell named first and Joe Breeze — builder of the first purpose-built mountain bike — second. Not a dropper post in the modern sense: it is an external spring bridging the seat collar and a clamp on the post, working with an ordinary quick-release. Crack the QR lever and the spring pushes the saddle back to a preset upper stop; sit down, close the lever, and it holds at a preset lower stop. The patent claims a torsion spring specifically, because a torsion spring expands in a plane — keeping the saddle square to the frame during the move and staying out of the gap between clamp and frame, which is what preserves full drop. The stated goal was a device that retrofits to any bike without modifying the frame, in deliberate contrast to the in-tube sprung and hydraulic posts it cites as prior art. Filed in Canada in parallel as CA 1,265,548.","fr":"Déposé et délivré sous le titre simple « Quick adjusting saddle locator », avec Josh Angell nommé en premier et Joe Breeze — constructeur du premier VTT conçu comme tel — en second. Pas une tige télescopique au sens moderne : il s'agit d'un ressort externe reliant le collier de selle et une bride sur la tige, fonctionnant avec un serrage rapide ordinaire. Ouvrez le levier du serrage rapide et le ressort repousse la selle vers une butée haute préréglée ; asseyez-vous, refermez le levier, et elle se maintient à une butée basse préréglée. Le brevet revendique spécifiquement un ressort de torsion, car un ressort de torsion se déploie dans un plan — gardant la selle bien alignée avec le cadre pendant le mouvement et restant hors de l'espace entre la bride et le cadre, ce qui préserve le débattement complet. L'objectif affiché était un dispositif s'adaptant à n'importe quel vélo sans modifier le cadre, en contraste délibéré avec les tiges à ressort interne et hydrauliques citées comme antériorité. Déposé en parallèle au Canada sous le numéro CA 1,265,548."}},{"num":"5489139","cat":"comp","title":{"en":"Thudbuster's parallel-link seatpost (US 5,489,139)","fr":"Tige de selle à parallélogramme du Thudbuster (US 5 489 139)"},"assignee":"Ryan J. McFarland, later manufactured by Cane Creek as the Thudbuster","img":"../pictures/US5489139A.png","alt":{"en":"Fig. 1 of US 5,489,139: the two parallel link arms (16) connecting the lower seatpost clamp (1/2) to the upper saddle-rail mount (70), holding the linkage's geometry so the saddle end travels down and back in an arc rather than straight down","fr":"Fig. 1 du brevet US 5 489 139 : les deux bras de liaison parallèles (16) reliant le collier inférieur de la tige de selle (1/2) au support supérieur des rails de selle (70), maintenant la géométrie de la timonerie de sorte que l'extrémité côté selle se déplace vers le bas et l'arrière selon un arc plutôt qu'en ligne droite"},"teaser":{"en":"US 5,489,139, \"Parallel link seatpost suspension,\" filed April 27, 1995 (six weeks before the GATT cutoff) and granted February 6, 1996 to Ryan J. McFarland of Custer, South Dakota — the patent's own…","fr":"US 5 489 139, « Parallel link seatpost suspension », déposé le 27 avril 1995 (six semaines avant la date butoir du GATT) et délivré le 6 février 1996 à Ryan J. McFarland, de Custer (Dakota du Sud) —…"},"full":{"en":"US 5,489,139, \"Parallel link seatpost suspension,\" filed April 27, 1995 (six weeks before the GATT cutoff) and granted February 6, 1996 to Ryan J. McFarland of Custer, South Dakota — the patent's own front page lists no separate assignee, so McFarland held it personally, hand-building early units before selling the design to Cane Creek, which still manufactures it as the Thudbuster. Two parallel link arms connect the seatpost clamp to the saddle mount above; as the linkage compresses, the geometry moves the saddle rearward and downward together, holding saddle angle constant and minimizing the change in seat-to-pedal distance that a simple telescoping post produces. The application's own prior-art citations name several competing suspension seatposts already on the market in 1994 — Softride's Contour post among them, elsewhere in this atlas as its own frame-beam entry. Pre-GATT filing: the term ran 17 years from grant, to 2013.","fr":"US 5 489 139, « Parallel link seatpost suspension », déposé le 27 avril 1995 (six semaines avant la date butoir du GATT) et délivré le 6 février 1996 à Ryan J. McFarland, de Custer (Dakota du Sud) — la première page du brevet ne mentionne aucun cessionnaire distinct, McFarland le détenait donc personnellement, fabriquant à la main les premières unités avant de vendre la conception à Cane Creek, qui la fabrique toujours sous le nom Thudbuster. Deux bras de liaison parallèles relient le collier de la tige de selle au support de selle au-dessus ; lorsque la timonerie se comprime, la géométrie déplace la selle vers l'arrière et vers le bas simultanément, maintenant l'angle de la selle constant et minimisant le changement de distance selle-pédale qu'une tige télescopique simple produit. Les propres citations d'antériorité de la demande nomment plusieurs tiges de selle suspendues concurrentes déjà sur le marché en 1994 — dont le Contour de Softride, présent ailleurs dans cet atlas sous sa propre fiche de poutre de cadre. Dépôt antérieur au GATT : la durée courait 17 ans à compter de la délivrance, jusqu'en 2013."}},{"num":"7422224","cat":"comp","title":{"en":"Gravity Dropper (first modern dropper) — US 7,422,224","fr":"Gravity Dropper (première tige télescopique moderne) — US 7,422,224"},"assignee":"Wayne Sicz & Arlen Wisseman / Kimir Seatpost","img":"../pictures/WO2007117884A2.png","alt":{"en":"Kimir Seatpost adjustable bicycle seat post assembly patent drawing, showing the telescoping post and lever-actuated locking mechanism","fr":"Dessin de brevet de l'ensemble de tige de selle ajustable Kimir Seatpost, montrant la tige télescopique et le mécanisme de verrouillage actionné par levier"},"teaser":{"en":"After RockShox hung up on his pitch, Sicz bought a CNC machine and brought the Descender and Gravity Dropper Classic to Interbike 2000–03 — years before the patent itself: 'Adjustable bicycle seat…","fr":"Après que RockShox lui a raccroché au nez, Sicz a acheté une machine CNC et a présenté le Descender et le Gravity Dropper Classic à l'Interbike 2000-03 — des années avant le brevet lui-même : «…"},"full":{"en":"After RockShox hung up on his pitch, Sicz bought a CNC machine and brought the Descender and Gravity Dropper Classic to Interbike 2000–03 — years before the patent itself: 'Adjustable bicycle seat post assembly,' filed through Kimir Seatpost (Sicz and co-inventor Arlen Wisseman) as PCT application WO 2007/117884 in March 2007, entering the US as granted patent US 7,422,224 in September 2008.","fr":"Après que RockShox lui a raccroché au nez, Sicz a acheté une machine CNC et a présenté le Descender et le Gravity Dropper Classic à l'Interbike 2000-03 — des années avant le brevet lui-même : « Adjustable bicycle seat post assembly », déposé via Kimir Seatpost (Sicz et le co-inventeur Arlen Wisseman) comme demande PCT WO 2007/117884 en mars 2007, entrant aux États-Unis comme brevet délivré US 7,422,224 en septembre 2008."}},{"num":"7673936","cat":"comp","title":{"en":"Kind Shock dropper-post patents (5 filings)","fr":"Brevets de tiges télescopiques Kind Shock (5 dépôts)"},"assignee":"Jung-Yu Hsu / Kind Shock Hi-Tech Co., Ltd.","img":"../pictures/US7673936B2.png","alt":{"en":"Fig. 1 of US 7,673,936: a full cross-section of the dropper post, with the remote lever (90) and cam (70) at the saddle clamp actuating a valve stem that runs down through the inner and outer tubes (20/10) to the lockout mechanism (40/50) near the post's base (60)","fr":"Fig. 1 du brevet US 7 673 936 : une coup
