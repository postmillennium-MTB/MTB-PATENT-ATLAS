# Keeps p/ (one link-preview page per Atlas card) in step with index.html.
#
# The per-card Share button copies .../MTB-PATENT-ATLAS/p/<ref>/ instead of
# .../atlas/#p=<ref>, because link-preview bots ignore everything after "#".
# Each page under p/ carries its card's own title, description and drawing in
# its preview tags and forwards the reader into the Atlas on that card. The
# pages are generated by tools/build_card_pages.js from index.html, never
# edited by hand.
#
# Runs after a change to index.html (or the generator) reaches main, and on
# demand from the Actions tab, then opens a pull request with whatever pages
# changed. Merge it like the thumbnails PR. Until it is merged, a new card's
# link still opens the card (404.html forwards an unknown p/<ref>/ to the
# Atlas); only its preview is the generic one. p/ itself is excluded from the
# trigger so the merged PR does not start another run.
#
# Adds no runtime dependency to index.html; deleting this file only means
# the pages must be rebuilt by hand (node tools/build_card_pages.js).

name: Update card link pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/build_card_pages.js"
      - "pictures/**"
      - "!pictures/thumbs/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build card pages
        run: node tools/build_card_pages.js

      - name: Open a pull request with the changed pages
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: p/**
          branch: card-pages/auto
          commit-message: "Update card link pages"
          title: "Update card link pages"
          body: |
            Generated by `tools/build_card_pages.js` from `index.html`: one
            small page per card under `p/`, carrying that card's title,
            description and first drawing for link previews. Nothing here
            changes `index.html` or any drawing. Safe to merge; until it is
            merged, a new card's share link still opens the card, with the
            generic preview.
