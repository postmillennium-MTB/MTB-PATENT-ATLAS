# Fetch patent drawings without leaving the GitHub web UI.
#
# Actions tab -> "Fetch patent figure" -> "Run workflow" -> type one or more
# patent numbers -> Run. It opens a pull request containing candidate crops for
# each patent plus a report of the PDF's own front-page text. Nothing reaches
# main until that PR is reviewed and merged.
#
# Why a workflow and not a local script: GitHub's runners can reach
# patents.google.com and the USPTO print endpoint. Some networks -- including
# the sandbox some Claude Code sessions run in -- are blocked from both by an
# egress policy, so the fetch has to happen somewhere with open egress.
#
# This adds no runtime dependency to index.html. It never runs on push, only
# when a person clicks Run, and deleting this file removes the feature cleanly.

name: Fetch patent figure

on:
  workflow_dispatch:
    inputs:
      numbers:
        description: "Patent number(s), space-separated. e.g. US12570369B1 D1140680 4733881"
        required: true
        type: string
      pdf_url:
        description: "Optional. Exact PDF link (from the Google Patents page) if the automatic lookup fails. One patent number only."
        required: false
        default: ""
        type: string
      candidates:
        description: "Candidate drawing sheets per patent"
        required: false
        default: "4"
        type: string
      keep_header:
        description: "Keep the 'U.S. Patent / Sheet n of m' header band"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet Pillow

      - name: Self-test the tool before using it
        run: python3 tools/test_fetch_patent_figure.py

      - name: Fetch and crop
        id: fetch
        run: |
          ARGS=(${{ inputs.numbers }} --out figures-out --candidates "${{ inputs.candidates }}")
          if [ -n "${{ inputs.pdf_url }}" ]; then ARGS+=(--url "${{ inputs.pdf_url }}"); fi
          if [ "${{ inputs.keep_header }}" = "true" ]; then ARGS+=(--keep-header); fi
          python3 tools/fetch_patent_figure.py "${ARGS[@]}"

      - name: Fail if no candidates were produced
        run: |
          shopt -s nullglob
          files=(figures-out/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No candidate images in figures-out/. The fetch step" \
                 "reported success but produced nothing to open a PR with."
            exit 1
          fi
          echo "${#files[@]} candidate image(s) ready."
          # A gitignored figures-out/ makes create-pull-request open an empty PR
          # while every step still reports success. Catch that here rather than
          # letting a green run mean nothing happened.
          if git check-ignore -q figures-out; then
            echo "::error::figures-out/ is gitignored, so the PR would be empty." \
                 "Remove it from .gitignore."
            exit 1
          fi

      # Candidates are uploaded before the PR is attempted, because the upload
      # needs no special permission and the PR does. If a repo has "Allow
      # GitHub Actions to create and approve pull requests" switched off, the
      # PR step fails -- but the work is already downloadable from the run's
      # Artifacts section, so a run is never wasted.
      - name: Upload candidates as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: patent-figure-candidates
          path: figures-out/
          if-no-files-found: error
          retention-days: 30

      - name: Open a pull request with the candidates
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: figures-out/**
          branch: patent-figures/${{ github.run_id }}
          commit-message: "Candidate patent figures: ${{ inputs.numbers }}"
          title: "Candidate patent figures: ${{ inputs.numbers }}"
          body: |
            Automated candidate crops for: `${{ inputs.numbers }}`

            These are **candidates**, not finished entries. To use one:

            1. Look at the images in `figures-out/` and pick the figure that
               actually shows the mechanism. The first drawing sheet is often
               not the best one.
            2. Rename it to `US<number><kind>.png` and move it into `pictures/`.
            3. Open the matching `*.report.txt`. It contains the PDF's own front
               page — title, inventor, assignee, filing and grant dates. Check
               the atlas entry against it, and set `conf` from what that page
               actually confirms.
            4. Add `img` and bilingual `imgAlt` to the entry in `index.html`.
               The alt text has to describe the figure you chose, with its real
               reference numerals, so it has to be written by someone looking at
               the image.
            5. Delete the unused candidates and `figures-out/` before merging.

            Nothing here has been added to `pictures/` or `index.html`.

      - name: Report how to get the candidates
        run: |
          BRANCH="patent-figures/${{ github.run_id }}"
          if [ "${{ steps.cpr.outcome }}" = "success" ] && [ -n "${{ steps.cpr.outputs.pull-request-url }}" ]; then
            echo "::notice::Pull request opened: ${{ steps.cpr.outputs.pull-request-url }}"
            exit 0
          fi
          echo "::warning::Could not open the pull request automatically."
          echo "The candidates are NOT lost. Two ways to get them:"
          echo "  * Artifacts section of this run: patent-figure-candidates"
          echo "  * Branch \$BRANCH, if it was pushed -- open a PR at:"
          echo "    https://github.com/${{ github.repository }}/compare/\$BRANCH?expand=1"
          echo ""
          echo "The usual cause is the repository setting that blocks Actions"
          echo "from opening pull requests. To make this automatic:"
          echo "  Settings -> Actions -> General -> Workflow permissions ->"
          echo "  tick 'Allow GitHub Actions to create and approve pull requests'"
