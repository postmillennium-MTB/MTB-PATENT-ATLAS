# Keeps pictures/thumbs/ in step with pictures/ without leaving the GitHub web UI.
#
# Card thumbnails (grid / plate / tinted views in index.html) are small WebP
# copies of each entry's FIRST drawing, made by tools/make_thumbs.py. When a
# drawing is uploaded to pictures/ through the web UI nothing makes its
# thumbnail, so this workflow does: it runs the tool and opens a pull request
# with whatever is new or out of date. Merge it like any other PR.
#
# Until that PR is merged the page still works -- index.html falls back to the
# full-size drawing when a thumbnail is missing (slower, never broken) -- so
# this is housekeeping, not a gate.
#
# Runs on a push to main that touches pictures/ or index.html (a new entry can
# point at an image that already exists, so index.html counts), and on demand
# from the Actions tab. The thumbnails folder itself is excluded from the
# trigger so the merged PR does not start another run.
#
# Like the other workflows here this adds no runtime dependency to index.html;
# deleting this file only means thumbnails must be regenerated by hand
# (python3 tools/make_thumbs.py).

name: Make thumbnails

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Remake every thumbnail, not just missing or outdated ones"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "pictures/**"
      - "index.html"
      - "!pictures/thumbs/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Make thumbnails
        run: |
          ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python3 tools/make_thumbs.py "${ARGS[@]}"

      - name: Open a pull request with the new thumbnails
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: pictures/thumbs/**
          branch: thumbnails/auto
          commit-message: "Update card thumbnails"
          title: "Update card thumbnails"
          body: |
            Generated by `tools/make_thumbs.py` from the first drawing of each
            entry. Nothing here changes `index.html` or any full-size drawing.
            Safe to merge; until it is merged the page falls back to the
            full-size image for any card whose thumbnail is missing.
